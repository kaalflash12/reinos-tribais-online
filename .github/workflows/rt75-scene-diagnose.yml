name: RT75 Scene Diagnose
on:
  push:
    paths: ['rt75-scene-diagnose-trigger.txt']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Inspecionar DOM e pseudo-elementos da cena
        run: |
          cat >/tmp/diag.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True);p=b.new_page(viewport={'width':390,'height':844})
            p.goto('http://127.0.0.1:8765/index.html?diag=1',wait_until='domcontentloaded');p.wait_for_timeout(900)
            x=p.locator('[data-play-offline]').first
            if x.count():x.click();p.wait_for_timeout(600)
            f=p.locator('#start-form')
            if f.count() and f.is_visible():
              f.locator('[name=playerName]').fill('Diag');f.locator('[name=villageName]').fill('Diag')
              f.locator('button[type=submit],button:not([type])').last.click();p.wait_for_timeout(1200)
            data=p.evaluate('''() => {
              const scene=document.querySelector('.village-scene'); if(!scene)return null;
              const all=[scene,...scene.querySelectorAll('*')];
              const rows=[];
              for(const el of all){
                const before=getComputedStyle(el,'::before').content,after=getComputedStyle(el,'::after').content;
                const direct=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).filter(Boolean).join(' ');
                const txt=(el.textContent||'').trim();
                if(/RT7[0-9]/i.test(direct)||/RT7[0-9]/i.test(before)||/RT7[0-9]/i.test(after)||(/RT7[0-9]/i.test(txt)&&el.children.length===0)){
                  rows.push({tag:el.tagName,id:el.id,cls:el.className,direct,txt:txt.slice(0,160),before,after});
                }
              }
              return {rows,html:scene.outerHTML.slice(0,5000)};
            }''')
            print(json.dumps(data,indent=2,ensure_ascii=False));b.close()
          PY
          python /tmp/diag.py
