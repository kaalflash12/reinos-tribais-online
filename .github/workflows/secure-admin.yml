name: Secure public admin access

on:
  push:
    paths:
      - '.github/workflows/secure-admin.yml'

permissions:
  contents: write

jobs:
  secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove admin UI from player client
        shell: python
        run: |
          from pathlib import Path
          for name in ['index.html','JOGAR_REINOS_TRIBAIS.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              text=text.replace('            <button class="ghost" data-entry-admin>PAINEL DE ADMINISTRAÇÃO</button>\n','')
              text=text.replace("    if (event.target.closest('[data-entry-admin]')) { window.open('ADMIN_REINOS_TRIBAIS.html','_blank'); return; }\n",'')
              text=text.replace("if (await isAdminOnlyAccount()) { renderAuthScreen('Esta é uma conta administrativa. Abra ADMIN_REINOS_TRIBAIS.html para usar o painel.', 'error'); return; }","if (await isAdminOnlyAccount()) { renderAuthScreen('Esta conta é reservada à administração e não pode entrar no cliente de jogador.', 'error'); return; }")
              p.write_text(text,encoding='utf-8')
          for name in ['ADMIN_REINOS_TRIBAIS.html','PAINEL_ADMIN_RT58.html','ABRIR_ADMIN.cmd']:
              p=Path(name)
              if p.exists():
                  p.unlink()
      - name: Assert public build contains no admin panel or personal admin address
        shell: bash
        run: |
          ! grep -R -n -E 'data-entry-admin|ADMIN_REINOS_TRIBAIS\.html|PAINEL_ADMIN_RT58|kaalflash@hotmail\.com' -- index.html JOGAR_REINOS_TRIBAIS.html . 2>/dev/null || exit 1
      - name: Commit secured public build
        shell: bash
        run: |
          git config user.name 'Reinos Tribais Security'
          git config user.email 'security@reinos-tribais.local'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Segregar painel administrativo do cliente público'
            git push origin main
          fi
