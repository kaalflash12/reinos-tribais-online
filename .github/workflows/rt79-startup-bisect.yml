name: RT79.1 Startup Bisect
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  bisect:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Run startup bisector
        shell: pwsh
        run: python tools/rt79_startup_bisect.py
      - name: Upload bisect proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT79_STARTUP_BISECT
          path: ${{ runner.temp }}\RT79_STARTUP_BISECT\*
          if-no-files-found: warn
