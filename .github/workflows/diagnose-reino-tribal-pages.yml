name: Diagnose Reino Tribal Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - PUBLIC_DEPLOY_STATUS.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: reino-tribal-pages-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Pages API and public endpoint
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api_code=$(curl -L -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          public_code=$(curl -L -sS -o /tmp/public.html -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            "https://kaalflash12.github.io/reinos-tribais-online/?diag=$GITHUB_SHA" || true)
          echo "api_code=$api_code" >> "$GITHUB_OUTPUT"
          echo "public_code=$public_code" >> "$GITHUB_OUTPUT"
          echo "Pages API HTTP=$api_code"
          cat /tmp/pages.json || true
          echo
          echo "Public HTTP=$public_code"
          grep -o '<title>[^<]*</title>' /tmp/public.html | head -1 || true
      - name: Persist diagnosis
        if: always()
        shell: bash
        env:
          API_CODE: ${{ steps.inspect.outputs.api_code }}
          PUBLIC_CODE: ${{ steps.inspect.outputs.public_code }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B public-diagnosis origin/main
          python - <<'PY'
          import json,os,datetime
          def read(path):
              try:return open(path,encoding='utf-8').read()
              except:return ''
          api_raw=read('/tmp/pages.json')
          try: api=json.loads(api_raw) if api_raw else None
          except: api={'raw':api_raw[:2000]}
          html=read('/tmp/public.html')
          public_code=int(os.environ.get('PUBLIC_CODE') or 0)
          data={
            'product':'Reino Tribal',
            'public_version':'1.0.1',
            'status':'online' if public_code==200 and '<title>Reino Tribal</title>' in html else 'failed',
            'http_status':public_code,
            'url':'https://kaalflash12.github.io/reinos-tribais-online/',
            'diagnosed_commit':os.environ['GITHUB_SHA'],
            'pages_api_http':int(os.environ.get('API_CODE') or 0),
            'pages':api,
            'title_ok':'<title>Reino Tribal</title>' in html,
            'version_loader_ok':'reino-tribal-branding.js?v=1.0.1' in html,
            'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('PUBLIC_DEPLOY_STATUS.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_DEPLOY_STATUS.json
          git commit -m 'Reino Tribal: diagnóstico público do Pages [skip ci]' || exit 0
          git push origin HEAD:main
