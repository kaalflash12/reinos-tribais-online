name: Diagnose Reino Tribal Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - PUBLIC_DEPLOY_STATUS.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: reino-tribal-pages-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Pages API and public endpoints
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          BASE="https://kaalflash12.github.io/reinos-tribais-online"
          API_BASE="https://reino-tribal-api.mestrederpg35.deno.net"
          api_code=$(curl -L -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          public_code=$(curl -L -sS -o /tmp/public.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/?diag=$GITHUB_SHA" || true)
          release_code=$(curl -L -sS -o /tmp/release.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/PRODUCT_RELEASE.json?diag=$GITHUB_SHA" || true)
          loader_code=$(curl -L -sS -o /tmp/loader.js -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/rt79-village-ui.js?diag=$GITHUB_SHA" || true)
          auth_code=$(curl -L -sS -o /tmp/auth.js -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/rt85-auth-bridge.js?diag=$GITHUB_SHA" || true)
          config_code=$(curl -L -sS -o /tmp/config.js -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/reino-tribal-config.js?diag=$GITHUB_SHA" || true)
          cors_code=$(curl -sS -D /tmp/cors.headers -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            -X OPTIONS \
            -H 'Origin: https://kaalflash12.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            "$API_BASE/api/reino" || true)
          echo "api_code=$api_code" >> "$GITHUB_OUTPUT"
          echo "public_code=$public_code" >> "$GITHUB_OUTPUT"
          echo "release_code=$release_code" >> "$GITHUB_OUTPUT"
          echo "loader_code=$loader_code" >> "$GITHUB_OUTPUT"
          echo "auth_code=$auth_code" >> "$GITHUB_OUTPUT"
          echo "config_code=$config_code" >> "$GITHUB_OUTPUT"
          echo "cors_code=$cors_code" >> "$GITHUB_OUTPUT"
          echo "Pages API HTTP=$api_code Public=$public_code Release=$release_code Loader=$loader_code Auth=$auth_code Config=$config_code CORS=$cors_code"
          grep -o '<title>[^<]*</title>' /tmp/public.html | head -1 || true
          cat /tmp/release.json || true
          cat /tmp/cors.headers || true
      - name: Persist diagnosis
        if: always()
        shell: bash
        env:
          API_CODE: ${{ steps.inspect.outputs.api_code }}
          PUBLIC_CODE: ${{ steps.inspect.outputs.public_code }}
          RELEASE_CODE: ${{ steps.inspect.outputs.release_code }}
          LOADER_CODE: ${{ steps.inspect.outputs.loader_code }}
          AUTH_CODE: ${{ steps.inspect.outputs.auth_code }}
          CONFIG_CODE: ${{ steps.inspect.outputs.config_code }}
          CORS_CODE: ${{ steps.inspect.outputs.cors_code }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B public-diagnosis origin/main
          python - <<'PY'
          import json,os,datetime
          def read(path):
              try:return open(path,encoding='utf-8',errors='replace').read()
              except:return ''
          def code(name):
              try:return int(os.environ.get(name) or 0)
              except:return 0
          def load_json(path):
              try:return json.loads(read(path))
              except:return None
          api_raw=read('/tmp/pages.json')
          try: api=json.loads(api_raw) if api_raw else None
          except: api={'raw':api_raw[:2000]}
          html=read('/tmp/public.html')
          release=load_json('/tmp/release.json')
          expected=load_json('PRODUCT_RELEASE.json') or {}
          expected_version=str(expected.get('public_version') or '')
          loader=read('/tmp/loader.js')
          auth=read('/tmp/auth.js')
          config=read('/tmp/config.js')
          cors=read('/tmp/cors.headers').lower()
          api_base='https://reino-tribal-api.mestrederpg35.deno.net'
          checks={
            'root_http_200':code('PUBLIC_CODE')==200,
            'title_reino_tribal':'<title>Reino Tribal</title>' in html,
            'release_http_200':code('RELEASE_CODE')==200,
            'release_matches_repository':isinstance(release,dict) and release.get('product_name')=='Reino Tribal' and str(release.get('public_version') or '')==expected_version and bool(expected_version),
            'loader_http_200':code('LOADER_CODE')==200 and len(loader)>100,
            'auth_http_200':code('AUTH_CODE')==200,
            'auth_bridge_present':'__RT85_AUTH_BRIDGE__' in auth or 'RT85Auth' in auth,
            'config_http_200':code('CONFIG_CODE')==200,
            'config_api_base_correct':api_base in config,
            'cors_http_204':code('CORS_CODE')==204,
            'cors_allows_pages':'access-control-allow-origin: https://kaalflash12.github.io' in cors,
          }
          data={
            'product':'Reino Tribal',
            'public_version':expected_version,
            'backend_api':api_base,
            'status':'online' if all(checks.values()) else 'failed',
            'http_status':code('PUBLIC_CODE'),
            'url':'https://kaalflash12.github.io/reinos-tribais-online/',
            'diagnosed_commit':os.environ['GITHUB_SHA'],
            'pages_api_http':code('API_CODE'),
            'pages':api,
            'checks':checks,
            'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('PUBLIC_DEPLOY_STATUS.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_DEPLOY_STATUS.json
          git commit -m 'Reino Tribal: prova pública dinâmica + Turso CORS [skip ci]' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
