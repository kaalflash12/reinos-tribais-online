name: RT78 Waves Farm Support
on:
  push:
    paths:
      - 'rt78-wave-farm-support-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RT78 strategy UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('rt76-master-plan.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<label>Tipo<select name="kind"><option value="attack">Ataque</option><option value="fake">Fake</option><option value="farm">Saque</option></select></label><label>Chegada desejada<input type="datetime-local" name="arrival" required></label>', '<label>Tipo<select name="kind"><option value="attack">Ataque</option><option value="fake">Fake</option><option value="farm">Saque</option><option value="support">Apoio</option></select></label><label>Chegada desejada<input type="datetime-local" name="arrival" required></label><label>Quantidade da onda<input type="number" name="count" min="1" max="20" value="1"></label><label>Intervalo (ms)<input type="number" name="gap" min="0" max="600000" value="1000"></label>')
          s=s.replace("function farm(){const cfg=state.data?.settings?.farm||{},tpl=cfg.template||{spear:25};", "function farm(){const cfg=state.data?.settings?.farm||{},defaults={A:{spear:25},B:{axe:40,light:10},C:{light:40,spy:1}},templates={...defaults,...(cfg.templates||{})},active=cfg.activeTemplate||'A',tpl=templates[active]||defaults.A;")
          s=s.replace('<h3>Assistente de Farm — servidor</h3><form id="rt78-farm-form" class="rt78-form"><label>Origem<select name="source">${villageOptions()}</select></label>', '<h3>Assistente de Farm A/B/C — servidor</h3><form id="rt78-farm-form" class="rt78-form"><label>Origem<select name="source">${villageOptions()}</select></label><label>Modelo<select name="model"><option value="A" ${active===\'A\'?\'selected\':\'\'}>A</option><option value="B" ${active===\'B\'?\'selected\':\'\'}>B</option><option value="C" ${active===\'C\'?\'selected\':\'\'}>C</option></select></label>')
          war="if(f.id==='rt78-war-form'){const arrival=String(fd.get('arrival')||''),isoArrival=arrival?new Date(arrival).toISOString():null,troops=readTroops(fd,'war'),kind=String(fd.get('kind')||'attack'),count=Math.max(1,num(fd.get('count'))||1),gap=num(fd.get('gap'));act(()=>kind==='support'?rpc('rt78_schedule_support',{p_world_id:cloud().worldId,p_source_village_id:fd.get('source'),p_target_village_id:fd.get('target'),p_troops:troops,p_arrives_at:isoArrival}):count>1?rpc('rt78_schedule_wave',{p_world_id:cloud().worldId,p_source_village_id:fd.get('source'),p_target_village_id:fd.get('target'),p_troops:troops,p_kind:kind,p_first_arrives_at:isoArrival,p_count:count,p_gap_ms:gap}):rpc('rt78_schedule_attack',{p_world_id:cloud().worldId,p_source_village_id:fd.get('source'),p_target_village_id:fd.get('target'),p_troops:troops,p_kind:kind,p_arrives_at:isoArrival,p_catapult_target:'random',p_catapult_target2:''}));return}"
          s=re.sub(r"if\(f\.id==='rt78-war-form'\)\{.*?return\}(?=if\(f\.id==='rt78-farm-form'\))",war,s,count=1)
          farm="if(f.id==='rt78-farm-form'){const troops=readTroops(fd,'farm'),model=String(fd.get('model')||'A'),oldFarm=state.data?.settings?.farm||{},templates={A:{spear:25},B:{axe:40,light:10},C:{light:40,spy:1},...(oldFarm.templates||{})};templates[model]=troops;const cfg={...(state.data?.settings||{}),farm:{...oldFarm,templates,activeTemplate:model,limit:num(fd.get('limit')),maxDistance:Number(fd.get('distance')||25),maxWall:num(fd.get('wall'))}};act(async()=>{await rpc('rt78_strategy_save',{p_world_id:cloud().worldId,p_config:cfg});return rpc('rt78_farm_batch',{p_world_id:cloud().worldId,p_source_village_id:fd.get('source'),p_template:troops,p_limit:num(fd.get('limit'))||5,p_max_distance:Number(fd.get('distance')||25),p_max_wall:num(fd.get('wall'))||8})});return}"
          s=re.sub(r"if\(f\.id==='rt78-farm-form'\)\{.*?return\}(?=if\(f\.id==='rt78-route-form'\))",farm,s,count=1)
          marker="document.addEventListener('change',e=>{const m=e.target.closest('#rt78-farm-form select[name=\\\"model\\\"]');if(m&&state.data){state.data.settings||={};state.data.settings.farm||={};state.data.settings.farm.activeTemplate=m.value;render()}},true);"
          if marker not in s:
              s=s.replace("const observer=new MutationObserver", marker+"const observer=new MutationObserver")
          for required in ['rt78_schedule_wave','rt78_schedule_support','Assistente de Farm A/B/C','Quantidade da onda']:
              if required not in s: raise SystemExit('patch ausente: '+required)
          p.write_text(s,encoding='utf-8')
      - run: node --check rt76-master-plan.js
      - name: Commit
        run: |
          git config user.name 'RT78 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add rt76-master-plan.js
          git diff --cached --quiet || git commit -m 'RT78: waves, scheduled support and farm ABC'
          git push
