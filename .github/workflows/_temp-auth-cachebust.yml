name: Temp auth cache bust
on:
  push:
    branches: ["fix/auth-regression-v103"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-regression-v103
      - name: Force auth loader refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','JOGAR_REINOS_TRIBAIS.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              old="rt79-village-ui.js?v=79.1"
              new="rt79-village-ui.js?v=79.2"
              if old not in s and new not in s:
                  raise SystemExit(f'loader marker not found in {name}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit patched HTML
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          git commit -m 'Hotfix auth: force public loader refresh'
          git push origin HEAD:fix/auth-regression-v103
