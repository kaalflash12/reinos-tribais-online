name: RT79.1 Fix Launcher Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt79-fix-launcher-gate
      - name: Patch launcher assertion to in-game phase
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rt79_chrome_fast_regression.py')
          s=p.read_text(encoding='utf-8')
          old="rec('RT79 suite',js(d,'return !!window.__RT79_STRATEGY_SUITE__'));rec('launcher',js(d,\"return !!document.querySelector('[data-rt79-open]')\"))"
          new="rec('RT79 suite',js(d,'return !!window.__RT79_STRATEGY_SUITE__'))"
          if old not in s: raise SystemExit('old splash launcher assertion not found')
          s=s.replace(old,new,1)
          old2="WebDriverWait(d,12).until(lambda x:js(x,'return !!window.RT76?.state?.()?.activeVillageId'));rec('game started',True)"
          new2="WebDriverWait(d,12).until(lambda x:js(x,'return !!window.RT76?.state?.()?.activeVillageId'));rec('game started',True)\n WebDriverWait(d,8).until(lambda x:js(x,\"return !!document.querySelector('[data-rt79-open]')\"));rec('launcher in game',True)"
          if old2 not in s: raise SystemExit('game-start assertion not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/rt79_chrome_fast_regression.py
          grep -F "rec('launcher in game',True)" tools/rt79_chrome_fast_regression.py
          if grep -F "rec('launcher'," tools/rt79_chrome_fast_regression.py; then exit 1; fi
      - name: Commit corrected regression gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rt79_chrome_fast_regression.py
          if ! git diff --cached --quiet; then
            git commit -m 'RT79.1: validate strategy launcher after game start'
            git push origin HEAD:rt79-fix-launcher-gate
          fi
