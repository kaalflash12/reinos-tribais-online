name: RT Deno Redeploy FIX14

on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_REDEPLOY_DENO_CORS_FIX14.ps1'
      - '.github/workflows/rt-deno-redeploy-fix13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-redeploy-fix14:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Parse FIX14 executor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\REINO_TRIBAL_REDEPLOY_DENO_CORS_FIX14.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'FIX14 nao passou no parser PowerShell'}
          Write-Host 'FIX14_PARSE_PASS'

      - name: Verify robust transport and isolated scope
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=[IO.File]::ReadAllText((Resolve-Path '.\REINO_TRIBAL_REDEPLOY_DENO_CORS_FIX14.ps1'))
          foreach($needle in @(
            "[string]`$BackendCommit = '25c61fdacf715399c7b1db5aabced5efc7db2485'",
            'curl.exe',
            '--http1.1',
            '--tlsv1.2',
            '--connect-timeout',
            'Deno HTTPS tentativa',
            'https://console.deno.com/auth/interactive',
            'https://console.deno.com/auth/exchange',
            "'deploy','--org',`$DenoOrg,'--app',`$DenoApp,'--prod','--non-interactive'",
            '-Method Options',
            'StatusCode -ne 204'
          )){if(-not $t.Contains($needle)){throw "Contrato FIX14 ausente: $needle"}}
          foreach($forbidden in @(
            '[Net.HttpWebRequest]::Create',
            '.GetResponse()',
            'api.turso.tech',
            'Obter-TursoPlatformTokenBrowser',
            "'pr','merge'",
            'deploy-reino-tribal-pages.yml',
            'RT_ADMIN_PASSWORD',
            'RT_ADMIN_RECOVERY_KEY',
            "action='admin_recover'"
          )){if($t.Contains($forbidden)){throw "FIX14 contem etapa/transporte proibido: $forbidden"}}
          if(-not (Get-Command curl.exe -ErrorAction SilentlyContinue)){throw 'curl.exe ausente no runner Windows'}
          Write-Host 'FIX14_SCOPE_AND_TRANSPORT_PASS'

      - name: Validate exact pinned backend on Deno 2.9.5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $deno=(Get-Command deno).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_REDEPLOY_DENO_CORS_FIX14.ps1 -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "FIX14 ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX14_PINNED_BACKEND_DENO_CHECK_PASS'
