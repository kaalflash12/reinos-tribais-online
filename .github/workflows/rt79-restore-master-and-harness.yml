name: RT79.1 Restore Master And Harness
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt79-real-revalidation
          fetch-depth: 1
      - name: Restore last true RT76 master plan before RT78 replacement
        run: |
          git fetch --depth=1 origin 915cf53e00ebab3278abe49733500bb450be597d
          git show FETCH_HEAD:rt76-master-plan.js > rt76-master-plan.js
          grep -F "window.__RT76_MASTER_PLAN__=true" rt76-master-plan.js
          grep -F "A.master={" rt76-master-plan.js
          grep -F "planner:Planner" rt76-master-plan.js
          grep -F "tribeProjects:TribeProjects" rt76-master-plan.js
          node --check rt76-master-plan.js
      - name: Remove research contamination from visual-tier audit and load lazy images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rt76_full_regression_current.py')
          s=p.read_text(encoding='utf-8')
          old="""def capture_view(page,prefix,view):
    clicked=False"""
          new="""def capture_view(page,prefix,view):
    clicked=False"""
          if old not in s: raise SystemExit('capture_view anchor not found')
          # Force lazy/offscreen images to enter viewport before diagnostics.
          old2="""    page.wait_for_timeout(180)
    d=diag(page)"""
          new2="""    page.wait_for_timeout(180)
    page.evaluate('''async()=>{const imgs=[...document.images];for(const img of imgs){try{img.loading='eager';img.scrollIntoView({block:'center'});if(!img.complete)await new Promise(r=>{const done=()=>r();img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});setTimeout(done,900)})}catch(e){}}window.scrollTo(0,0)}''')
    page.wait_for_timeout(120)
    d=diag(page)"""
          if old2 not in s: raise SystemExit('diagnostic anchor not found')
          s=s.replace(old2,new2,1)
          old3="""def set_all_buildings_for_tier(page,tier):
    return page.evaluate('''(payload)=>{
      const v=getActiveVillage(), keys=payload.keys, tier=payload.tier, chosen={};"""
          new3="""def set_all_buildings_for_tier(page,tier):
    return page.evaluate('''(payload)=>{
      const v=getActiveVillage(), keys=payload.keys, tier=payload.tier, chosen={};
      v.unitResearch={};v.unitResearchQueue=[];
      if(state?.player?.research){state.player.research.completed=[];state.player.research.queue=[];}"""
          if old3 not in s: raise SystemExit('tier setup anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/rt76_full_regression_current.py
          grep -F "v.unitResearch={};v.unitResearchQueue=[];" tools/rt76_full_regression_current.py
          grep -F "img.loading='eager'" tools/rt76_full_regression_current.py
      - name: Fix arrow-function arguments bug in individual button audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rt79_individual_button_revalidation.py')
          s=p.read_text(encoding='utf-8')
          old="""after=page.evaluate('''()=>{const st=JSON.stringify(RT76.state()),dom=document.querySelector('#app')?.innerHTML||document.body.innerHTML;const effects=[];if(st!==window.__rt79BeforeState)effects.push('state');if(String(window.currentView||'')!==arguments[0])effects.push('view');if(dom!==window.__rt79BeforeDom)effects.push('dom');return {effects,errors:[...(window.__rt79ButtonErrors||[])]}}''',before['view'])"""
          new="""after=page.evaluate('''(beforeView)=>{const st=JSON.stringify(RT76.state()),dom=document.querySelector('#app')?.innerHTML||document.body.innerHTML;const effects=[];if(st!==window.__rt79BeforeState)effects.push('state');if(String(window.currentView||'')!==beforeView)effects.push('view');if(dom!==window.__rt79BeforeDom)effects.push('dom');return {effects,errors:[...(window.__rt79ButtonErrors||[])]}''',before['view'])"""
          if old not in s: raise SystemExit('individual audit arrow-function anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile tools/rt79_individual_button_revalidation.py
      - name: Commit restored runtime and corrected audit harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rt76-master-plan.js tools/rt76_full_regression_current.py tools/rt79_individual_button_revalidation.py
          if ! git diff --cached --quiet; then
            git commit -m 'RT79.1: restore RT76 master contract and harden full revalidation'
            git push origin HEAD:rt79-real-revalidation
          fi
