name: RT Admin Bootstrap Canonical

on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_ADMIN_BOOTSTRAP.ps1'
      - '.github/workflows/rt-admin-bootstrap-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-admin-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Parse canonical bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\REINO_TRIBAL_ADMIN_BOOTSTRAP.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'Bootstrap canônico não passou no parser'}
          Write-Host 'ADMIN_BOOTSTRAP_CANONICAL_PARSE_PASS'

      - name: Execute canonical bootstrap ValidateOnly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_ADMIN_BOOTSTRAP.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Bootstrap canônico falhou: $LASTEXITCODE"}
          Write-Host 'ADMIN_BOOTSTRAP_CANONICAL_WINDOWS_PASS'
