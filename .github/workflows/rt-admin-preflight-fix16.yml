name: RT Admin Preflight FIX16

on:
  push:
    branches: [main]
    paths:
      - 'RT_ADMIN_PREFLIGHT_FIX16.ps1'
      - '.github/workflows/rt-admin-preflight-fix16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-fix16:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Generate FIX16
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_ADMIN_PREFLIGHT_FIX16.ps1
          if($LASTEXITCODE -ne 0){throw "FIX16 transform falhou: $LASTEXITCODE"}

      - name: Parse and verify FIX16
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Resolve-Path '.\REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'FIX16 nao passou no parser PowerShell'}
          $t=[IO.File]::ReadAllText($p)
          foreach($needle in @(
            '[switch]$PreflightOnly',
            '$preflightUrl = $preflightUri.AbsoluteUri',
            'CORS URL:',
            'FIX16_PREFLIGHT_PUBLICO_PASS',
            'REINO_TRIBAL_ADMIN_FIX16_VALIDADO',
            "[string]`$BackendCommit = 'd5d1edadd9f33b612a233c4feed0e06ec97203bc'"
          )){if(-not $t.Contains($needle)){throw "Contrato FIX16 ausente: $needle"}}
          Write-Host 'FIX16_PARSE_CONTRACT_PASS'

      - name: Execute exact public preflight on Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1 -PreflightOnly
          if($LASTEXITCODE -ne 0){throw "FIX16 PreflightOnly falhou: $LASTEXITCODE"}

      - name: Validate pinned backend with Deno 2.9.5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $deno=(Get-Command deno).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1 -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "FIX16 ValidateOnly falhou: $LASTEXITCODE"}

      - name: Publish tested FIX16 executor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1
          if(git diff --cached --quiet){ Write-Host 'FIX16 ja publicado.'; exit 0 }
          git commit -m 'fix: publicar executor admin FIX16 testado'
          for($i=1;$i -le 5;$i++){
            git fetch origin main
            git rebase origin/main
            if($LASTEXITCODE -ne 0){throw 'Rebase FIX16 falhou.'}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){exit 0}
            Start-Sleep -Seconds (2*$i)
          }
          throw 'Nao foi possivel publicar FIX16 apos 5 tentativas.'
