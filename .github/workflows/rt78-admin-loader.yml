name: RT78 Admin Loader
on:
  push:
    paths:
      - 'rt78-admin-loader-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append admin suite loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('rt76-master-plan.js')
          s=p.read_text(encoding='utf-8')
          marker='__RT78_ADMIN_LOADER__'
          if marker not in s:
              s += "\n;(()=>{if(window.__RT78_ADMIN_LOADER__)return;window.__RT78_ADMIN_LOADER__=true;const x=document.createElement('script');x.src='rt78-admin-suite.js?v=78.0';x.defer=true;document.head.appendChild(x)})();\n"
          p.write_text(s,encoding='utf-8')
      - run: node --check rt76-master-plan.js
      - name: Commit loader
        run: |
          git config user.name 'RT78 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add rt76-master-plan.js
          git diff --cached --quiet || git commit -m 'RT78: load strategic admin control center'
          git push
