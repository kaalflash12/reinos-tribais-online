name: RT86 AI Admin Controls Regression

on:
  pull_request:
    paths:
      - 'rt86-ai-director-ui.js'
      - 'rt79-village-ui.js'
      - 'backend/edge/rt86-ai-admin/**'
      - '.github/workflows/rt86-ai-admin-controls-regression.yml'
  workflow_dispatch:

jobs:
  ai-admin-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source proof
        run: |
          node --check rt86-ai-director-ui.js
          grep -q "rt86-ai-director-ui.js?v=86.2" rt79-village-ui.js
          grep -q "data-rt86-director-tick" rt86-ai-director-ui.js
          grep -q "data-rt86-config-save" rt86-ai-director-ui.js
          grep -q "data-rt86-agent-save" rt86-ai-director-ui.js
          grep -q "data-rt86-agent-tick" rt86-ai-director-ui.js
          grep -q "data-rt86-agent-reset" rt86-ai-director-ui.js
          grep -q "x-admin-token" backend/edge/rt86-ai-admin/index.ts
          grep -q "act==='agent_patch'" backend/edge/rt86-ai-admin/index.ts
          grep -q "act==='tick'" backend/edge/rt86-ai-admin/index.ts
      - name: Production endpoint security and AI state
        shell: python
        run: |
          import json,re,urllib.request,urllib.error,pathlib
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          url=re.search(r"url:\s*'([^']+supabase\.co)'",text).group(1)
          key=re.search(r"key:\s*'([^']+)'",text).group(1)
          world=re.search(r"worldId:\s*'([0-9a-f-]{36})'",text).group(1)
          # Edge administrativa deve existir mas recusar quem nao possui token ADM.
          req=urllib.request.Request(url+'/functions/v1/rt86-ai-admin',data=json.dumps({'action':'status','world_id':world}).encode(),headers={'apikey':key,'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(req,timeout=20)
              raise AssertionError('rt86-ai-admin aceitou chamada sem token')
          except urllib.error.HTTPError as e:
              assert e.code==401, e.code
              body=json.loads(e.read())
              assert 'administrativa' in body.get('error','').lower(), body
          # Estado publico precisa continuar provando um agente exclusivo por NPC.
          req=urllib.request.Request(url+'/rest/v1/rpc/rt86_ai_public_status',data=json.dumps({'p_world_id':world}).encode(),headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'})
          data=json.loads(urllib.request.urlopen(req,timeout=20).read())
          agents=data.get('agents') or []
          names=[a.get('name') for a in agents]
          assert data.get('version')==86, data
          assert data.get('principal')=='ai_director', data
          assert len(agents)==26, len(agents)
          assert len(names)==len(set(names)), names
          assert data.get('director',{}).get('enabled') is True, data
          print(json.dumps({'pass':True,'principal':data['principal'],'agents':len(agents),'active_orders':data.get('active_orders')},ensure_ascii=False))
