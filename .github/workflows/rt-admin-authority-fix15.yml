name: RT Admin Authority FIX15

on:
  push:
    branches: [main]
    paths:
      - 'RT_ADMIN_AUTHORITY_FIX15.ps1'
      - '.github/workflows/rt-admin-authority-fix15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-admin-fix15:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Apply FIX15 transform
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_ADMIN_AUTHORITY_FIX15.ps1
          if($LASTEXITCODE -ne 0){throw "FIX15 transform falhou: $LASTEXITCODE"}

      - name: Verify FIX15 contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=[IO.File]::ReadAllText((Resolve-Path '.\api\reino.js'))
          foreach($needle in @(
            'const passwordMatches = verifyPassword(password, existing.password_hash);',
            "role='admin',disabled=0",
            'DELETE FROM rt_sessions WHERE user_id=?',
            'normalizeUsername(identifier) === ADMIN_USERNAME) await ensureAdmin();'
          )){if(-not $t.Contains($needle)){throw "FIX15 contrato ausente: $needle"}}
          if($t.Contains('if (existing) return;')){throw 'FIX15 deixou ensureAdmin antigo no backend'}
          Write-Host 'FIX15_ADMIN_AUTHORITY_CONTRACT_PASS'

      - name: Deno check real backend
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          deno check deno/main.js
          if($LASTEXITCODE -ne 0){throw "deno check falhou: $LASTEXITCODE"}
          Write-Host 'FIX15_DENO_CHECK_PASS'

      - name: Publish backend FIX15 to main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/reino.js
          if(git diff --cached --quiet) {
            Write-Host 'Backend FIX15 ja estava aplicado.'
            exit 0
          }
          git commit -m 'fix: tornar RT_ADMIN_PASSWORD autoridade da conta mestre'
          for($i=1;$i -le 5;$i++) {
            git fetch origin main
            if($LASTEXITCODE -ne 0){throw 'git fetch main falhou'}
            git rebase origin/main
            if($LASTEXITCODE -ne 0){git rebase --abort; throw 'rebase do FIX15 conflitou com main'}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){Write-Host 'FIX15_BACKEND_PUBLISHED'; exit 0}
            if($i -lt 5){Start-Sleep -Seconds (2*$i)}
          }
          throw 'FIX15 validado, mas nao foi possivel publicar apos 5 tentativas.'
