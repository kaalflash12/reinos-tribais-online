name: RT Deno Dependency FIX7

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'RT_REINO_TRIBAL_DENO_DEP_FIX7.ps1'
      - '.github/workflows/rt-deno-dep-fix7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fix7:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Fetch FIX7 without git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'RT_REINO_TRIBAL_DENO_DEP_FIX7.ps1'
          $uri="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/RT_REINO_TRIBAL_DENO_DEP_FIX7.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $p -TimeoutSec 120
          if(-not(Test-Path $p)){throw 'FIX7 nao foi baixado'}
          "FIX7_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'FIX7_RAW_FETCH_PASS'

      - name: Parse and validate FIX7
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($env:FIX7_PATH,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;exit 1}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:FIX7_PATH -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "FIX7 ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX7_WINDOWS_TRANSFORM_PASS'

      - name: Download six real backend files and run Deno 2.9.5 check
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('rt-fix7-'+[Guid]::NewGuid().ToString('N'))
          $denoHome=Join-Path $root 'deno'
          $work=Join-Path $root 'repo'
          New-Item -ItemType Directory -Force -Path $root,$denoHome,$work|Out-Null
          try {
            $zip=Join-Path $root 'deno.zip'
            $base='https://github.com/denoland/deno/releases/download/v2.9.5'
            Invoke-WebRequest -UseBasicParsing -Uri "$base/deno-x86_64-pc-windows-msvc.zip" -OutFile $zip -TimeoutSec 180
            Expand-Archive -Path $zip -DestinationPath $denoHome -Force
            $deno=Join-Path $denoHome 'deno.exe'
            if(-not(Test-Path $deno)){throw 'deno.exe ausente'}

            $token=$env:GH_TOKEN
            if([string]::IsNullOrWhiteSpace($token)){throw 'GITHUB_TOKEN ausente'}
            $headers=@{
              Authorization="Bearer $token"
              Accept='application/vnd.github+json'
              'User-Agent'='Reino-Tribal-FIX7-CI'
              'X-GitHub-Api-Version'='2022-11-28'
            }
            foreach($relative in @('deno.json','package.json','deno/main.js','api/reino.js','api/admin.js','backend/turso/schema.sql')){
              $escaped=(($relative -split '/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/'
              $uri=('https://api.github.com/repos/{0}/contents/{1}?ref={2}' -f $env:GITHUB_REPOSITORY,$escaped,'rt-turso-migration')
              $meta=Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 60
              if([string]$meta.type -ne 'file' -or -not $meta.content){throw "conteudo ausente: $relative"}
              $bytes=[Convert]::FromBase64String((([string]$meta.content)-replace '\s',''))
              $dest=Join-Path $work ($relative -replace '/','\')
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent)|Out-Null
              [IO.File]::WriteAllBytes($dest,$bytes)
            }

            Push-Location $work
            try {
              & $deno check deno/main.js
              if($LASTEXITCODE -ne 0){throw "deno check falhou: $LASTEXITCODE"}
            } finally { Pop-Location }
            Write-Host 'DENO_2_9_5_REAL_6_FILES_CHECK_PASS'
          } finally {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }
