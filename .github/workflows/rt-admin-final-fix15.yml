name: RT Admin Final FIX15

on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1'
      - '.github/workflows/rt-admin-final-fix15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-admin-final-fix15:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Parse FIX15 final executor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'FIX15 final nao passou no parser PowerShell'}
          Write-Host 'FIX15_FINAL_PARSE_PASS'

      - name: Verify isolated and deterministic contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=[IO.File]::ReadAllText((Resolve-Path '.\REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1'))
          foreach($needle in @(
            "[string]`$BackendCommit = 'd5d1edadd9f33b612a233c4feed0e06ec97203bc'",
            "'deno.json','package.json','deno/main.js','api/reino.js','api/admin.js','backend/turso/schema.sql'",
            "'deploy','env','update-value','RT_ADMIN_PASSWORD'",
            "'deploy','env','update-value','RT_ADMIN_RECOVERY_KEY'",
            "'deploy','--org',`$DenoOrg,'--app',`$DenoApp,'--prod','--non-interactive'",
            "action='login'; identifier='reinos_admin'",
            "'{\"action\":\"admin_status\"}'",
            "'{\"action\":\"dashboard\"}'",
            'https://console.deno.com/auth/interactive',
            '--http1.1',
            '--tlsv1.2',
            'CREDENCIAIS_ADMIN_REINO_TRIBAL.txt'
          )){if(-not $t.Contains($needle)){throw "Contrato FIX15 final ausente: $needle"}}
          foreach($forbidden in @(
            'HttpWebRequest',
            '.GetResponse()',
            'api.turso.tech',
            'Obter-TursoPlatformTokenBrowser',
            "'pr','merge'",
            'Merge da migracao',
            'Merge da migração',
            'deploy-reino-tribal-pages.yml'
          )){if($t.Contains($forbidden)){throw "FIX15 final contem etapa proibida: $forbidden"}}
          $iSecret=$t.IndexOf("'deploy','env','update-value','RT_ADMIN_PASSWORD'")
          $iDeploy=$t.IndexOf("'deploy','--org',`$DenoOrg,'--app',`$DenoApp,'--prod','--non-interactive'")
          $iLogin=$t.IndexOf("action='login'; identifier='reinos_admin'")
          if($iSecret -lt 0 -or $iDeploy -lt 0 -or $iLogin -lt 0 -or -not ($iSecret -lt $iDeploy -and $iDeploy -lt $iLogin)){throw 'Ordem FIX15 invalida: secret -> deploy -> login'}
          Write-Host 'FIX15_FINAL_ISOLATION_AND_ORDER_PASS'

      - name: Validate exact pinned backend with Deno 2.9.5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $deno=(Get-Command deno).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1 -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "FIX15 final ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX15_FINAL_PINNED_BACKEND_DENO_CHECK_PASS'
