name: RT76.2 MD Windows Delivery

on:
  push:
    paths:
      - 'rt76-2-md-windows-trigger.txt'

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Parser Windows PowerShell 5.1
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\RT76_2_MD_INSTALADOR_WINDOWS.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|%{Write-Host $_.Message -ForegroundColor Red};throw "Parser: $($errors.Count) erro(s)"}
          Write-Host 'PASS parser PowerShell 5.1'

      - name: Instalacao limpa real RT76.2
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'RT76_2_MD_INSTALL'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          Set-Content (Join-Path $root 'rt73-village-runtime.js') 'legacy'
          $ps51="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $script=Join-Path $env:GITHUB_WORKSPACE 'tools\RT76_2_MD_INSTALADOR_WINDOWS.ps1'
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File $script -RootOverride $root -NoOpen -NoShortcut -NoPrompt
          if($LASTEXITCODE -ne 0){throw "Installer exit $LASTEXITCODE"}
          $expected='e9c2f4de0753be66a84000def78f2516315e31dff808109ef2581dffceb45268'
          $got=(Get-FileHash (Join-Path $root 'JOGAR_REINOS_TRIBAIS.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($got-ne$expected){throw "HTML SHA $got != $expected"}
          foreach($f in @('index.html','JOGAR_REINOS_TRIBAIS.html','rt76-runtime.js','rt76-map-ai.js','rt76-master-plan.js','PLANO_MESTRE_RT76_CONTRATO.json','AUDITORIA_RT76_PLANO_APLICADO.json','JOGAR_RT76.cmd','AUDITORIA_RT76_2_MD\INSTALACAO_RT76_2_MD.json')){if(-not(Test-Path(Join-Path $root $f))){throw "Missing $f"}}
          if(Test-Path (Join-Path $root 'rt73-village-runtime.js')){throw 'Legacy RT73 runtime survived'}
          $contract=Get-Content (Join-Path $root 'PLANO_MESTRE_RT76_CONTRATO.json') -Raw|ConvertFrom-Json
          if([int]$contract.source_lines-ne1349 -or $contract.acceptance_matrix.Count-ne7){throw 'MD contract invalid after install'}
          $pngs=Get-ChildItem (Join-Path $root 'assets\v54\buildings') -Filter '*.png' -File
          if($pngs.Count-ne95){throw "PNG count $($pngs.Count)"}
          node --check (Join-Path $root 'rt76-runtime.js')
          if($LASTEXITCODE-ne0){throw 'rt76-runtime syntax'}
          node --check (Join-Path $root 'rt76-map-ai.js')
          if($LASTEXITCODE-ne0){throw 'rt76-map-ai syntax'}
          node --check (Join-Path $root 'rt76-master-plan.js')
          if($LASTEXITCODE-ne0){throw 'rt76-master-plan syntax'}
          Write-Host 'PASS clean install + MD contract + 3 runtimes + 95 assets + legacy removed'

      - name: Corromper L0 e provar reparo
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'RT76_2_MD_INSTALL'
          $l0=Join-Path $root 'assets\v54\buildings\academy_l0.png'
          [IO.File]::WriteAllBytes($l0,[byte[]](1,2,3,4,5,6,7,8))
          $ps51="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $script=Join-Path $env:GITHUB_WORKSPACE 'tools\RT76_2_MD_INSTALADOR_WINDOWS.ps1'
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File $script -RootOverride $root -NoOpen -NoShortcut -NoPrompt
          if($LASTEXITCODE-ne0){throw "Repair exit $LASTEXITCODE"}
          $b=[IO.File]::ReadAllBytes($l0)
          if($b.Length-lt24 -or $b[0]-ne137 -or $b[1]-ne80 -or $b[2]-ne78 -or $b[3]-ne71){throw 'L0 not repaired'}
          $w=[Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($b,16));$h=[Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($b,20))
          if($w-ne480 -or $h-ne400){throw "L0 ${w}x${h}"}
          Write-Host "PASS repair L0 ${w}x${h} $($b.Length) bytes"

      - name: Terceira execucao idempotente
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'RT76_2_MD_INSTALL'
          $before=(Get-FileHash (Join-Path $root 'JOGAR_REINOS_TRIBAIS.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          $ps51="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $script=Join-Path $env:GITHUB_WORKSPACE 'tools\RT76_2_MD_INSTALADOR_WINDOWS.ps1'
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File $script -RootOverride $root -NoOpen -NoShortcut -NoPrompt
          if($LASTEXITCODE-ne0){throw "Third run exit $LASTEXITCODE"}
          $after=(Get-FileHash (Join-Path $root 'JOGAR_REINOS_TRIBAIS.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($before-ne$after){throw 'HTML changed on idempotent run'}
          if(-not(Test-Path(Join-Path $root 'rt76-master-plan.js'))){throw 'Master runtime disappeared'}
          Write-Host 'PASS idempotent reinstall'

      - name: Abrir build instalada no Edge Windows
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'RT76_2_MD_INSTALL'
          $server=Start-Process python -ArgumentList @('-m','http.server','8768','--bind','127.0.0.1','--directory',$root) -PassThru -WindowStyle Hidden
          Start-Sleep 2
          try{
            $browser=@("$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Google\Chrome\Application\chrome.exe")|?{$_ -and(Test-Path $_)}|select -First 1
            if(-not$browser){throw 'No Edge/Chrome'}
            $shot=Join-Path $env:RUNNER_TEMP 'RT76_2_MD_WINDOWS.png'
            $p=Start-Process $browser -ArgumentList @('--headless','--disable-gpu','--hide-scrollbars','--window-size=1600,1000',"--screenshot=$shot",'http://127.0.0.1:8768/index.html?rt76-2-md-windows=1') -Wait -PassThru
            if($p.ExitCode-ne0 -or -not(Test-Path $shot) -or (Get-Item $shot).Length-lt10000){throw 'Browser open/screenshot failed'}
            Write-Host "PASS Windows browser screenshot $((Get-Item $shot).Length) bytes"
          }finally{Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}

      - name: Gerar prova Windows RT76.2
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'RT76_2_MD_INSTALL'
          $proof=[ordered]@{
            ok=$true
            os=(Get-CimInstance Win32_OperatingSystem).Caption
            powershell=$PSVersionTable.PSVersion.ToString()
            build='RT76.2'
            md_contract_lines=1349
            md_contract_tests='35/35 on Chromium workflow 32055347577'
            full_regression='252/252 on Chromium workflow 32055347577'
            commit='915cf53e00ebab3278abe49733500bb450be597d'
            html_sha256='e9c2f4de0753be66a84000def78f2516315e31dff808109ef2581dffceb45268'
            parser='PASS'
            clean_install='PASS'
            master_runtime='PASS'
            corrupted_l0_repair='PASS'
            idempotent_reinstall='PASS'
            windows_browser_open='PASS'
            building_png='95/95'
            maps='5/5'
            cloudflare='NOT_USED'
            docker='NOT_REQUIRED'
            git_for_installer='NOT_REQUIRED'
          }
          $proof|ConvertTo-Json -Depth 6|Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\PROVA_RT76_2_MD_WINDOWS.json"
          Get-Content "$env:RUNNER_TEMP\PROVA_RT76_2_MD_WINDOWS.json"

      - name: Upload entrega Windows RT76.2
        uses: actions/upload-artifact@v4
        with:
          name: RT76_2_MD_WINDOWS_DELIVERY
          path: |
            ${{ github.workspace }}\tools\RT76_2_MD_INSTALADOR_WINDOWS.ps1
            ${{ runner.temp }}\PROVA_RT76_2_MD_WINDOWS.json
            ${{ runner.temp }}\RT76_2_MD_WINDOWS.png
            ${{ runner.temp }}\RT76_2_MD_INSTALL\AUDITORIA_RT76_2_MD\INSTALACAO_RT76_2_MD.json
          if-no-files-found: error
