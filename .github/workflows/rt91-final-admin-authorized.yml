name: RT91 Final Admin Authorized
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rt91-final-admin-authorized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-admin:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RT_DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      RT_DENO_TOKEN: ${{ secrets.DENO_TOKEN }}
      RT_DENO_ACCESS_TOKEN: ${{ secrets.DENO_ACCESS_TOKEN }}
      RT_DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
    steps:
      - name: Probe Deno public autodeploy marker
        shell: pwsh
        run: |
          $url='https://reino-tribal-api.mestrederpg35.deno.net/health'
          $marker='rt92-oidc-autodeploy-probe-20260826'
          $body=''
          try { $body=(curl.exe --fail --silent --show-error --location --max-time 20 $url | Out-String).Trim() } catch {}
          Write-Host "DENO_HEALTH=$body"
          if($body.Contains($marker)){
            Write-Host 'RT92_DENO_GIT_AUTODEPLOY_PASS'
          } else {
            Write-Host 'RT92_DENO_GIT_AUTODEPLOY_NOT_YET_VISIBLE'
          }

      - name: Select configured Deno secret without exposing it
        shell: pwsh
        run: |
          $token = @(
            $env:RT_DENO_DEPLOY_TOKEN,
            $env:RT_DENO_TOKEN,
            $env:RT_DENO_ACCESS_TOKEN,
            $env:RT_DENO_AUTH_TOKEN
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'RT91_NO_DENO_SECRET_CONFIGURED'
          }
          "DENO_DEPLOY_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PASS: Deno secret configurado no repositório (valor não exibido).'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Validate Deno token and exact production app
        shell: pwsh
        run: |
          $who = deno deploy whoami --json --non-interactive 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'RT91_DENO_SECRET_INVALID_OR_EXPIRED' }
          Write-Host 'PASS: Deno token aceito.'
          $app = deno deploy apps get --org mestrederpg35 --app reino-tribal-api --json --non-interactive 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'RT91_DENO_SECRET_CANNOT_ACCESS_REINO_TRIBAL_APP' }
          Write-Host 'PASS: token acessa o app exato reino-tribal-api.'

      - name: Execute RT91 and final RT90 public admin proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script = Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1'
          curl.exe --fail --silent --show-error --location --retry 4 --retry-all-errors --output $script https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/main/REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Falha baixando fechamento RT90/RT91.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "RT91/RT90 final falhou: $LASTEXITCODE" }
          $proofDir = Join-Path (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ReinoTribal') 'PROVA_ADMIN_PUBLICA_RT90'
          $proofFile = Join-Path $proofDir 'PROVA_RT90_ADMIN_PUBLICO.json'
          if (-not (Test-Path $proofFile)) { throw 'Prova final RT90 ausente.' }
          $proof = Get-Content $proofFile -Raw | ConvertFrom-Json
          if (-not $proof.pass -or $proof.validate_only) { throw 'Prova final não autenticou administrador real.' }
          Write-Host 'REINO_TRIBAL_ADMIN_PUBLICO_RT90_PASS'
          Write-Host 'ANTI_DOWNGRADE_NO_SOURCE_DEPLOY_PASS'

      - name: Stage proof without credentials
        if: success()
        shell: pwsh
        run: |
          $source = Join-Path (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ReinoTribal') 'PROVA_ADMIN_PUBLICA_RT90'
          $dest = Join-Path $env:RUNNER_TEMP 'RT91_FINAL_ADMIN_PUBLIC_PROOF'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $source 'PROVA_RT90_ADMIN_PUBLICO.json') $dest -Force
          Copy-Item (Join-Path $source 'RT90_ADMIN_DASHBOARD_PUBLICO.png') $dest -Force
          Write-Host 'PASS: apenas JSON e screenshot foram preparados; credenciais não serão publicadas.'

      - name: Upload final public admin proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RT91_FINAL_ADMIN_PUBLIC_PROOF
          path: ${{ runner.temp }}/RT91_FINAL_ADMIN_PUBLIC_PROOF
          if-no-files-found: error
