name: RT Bootstrap PID Fix

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - '.github/workflows/rt-bootstrap-pid-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pid-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-turso-migration
      - name: Patch reserved PID collision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1')
          s=p.read_text(encoding='utf-8')
          old="function Stop-Tree([int]$Pid) {\n  try { & \"$env:SystemRoot\\System32\\taskkill.exe\" /PID $Pid /T /F *> $null } catch {}\n}"
          new="function Stop-Tree([int]$ProcessId) {\n  try { & \"$env:SystemRoot\\System32\\taskkill.exe\" /PID $ProcessId /T /F *> $null } catch {}\n}"
          if old not in s:
              if '$Pid' in s or '$PID' in s:
                  raise SystemExit('Encontrada referência PID inesperada; patch abortado')
              print('PID_ALREADY_CLEAN')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('PID_PATCHED')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RT Deno/Turso: corrigir variável reservada PID [pid-fixed]'
          git push origin HEAD:rt-turso-migration

  runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-turso-migration
      - name: Wait briefly for patch job commit
        shell: powershell
        run: Start-Sleep -Seconds 15
      - name: Refresh branch and smoke-test Stop-Tree
        shell: powershell
        run: |
          git fetch origin rt-turso-migration
          git checkout -B rt-turso-migration origin/rt-turso-migration
          $file='IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
          $text=Get-Content $file -Raw
          if($text -match '\$Pid\b'){ throw 'Variável reservada $Pid ainda existe.' }
          if(-not $text.Contains('function Stop-Tree([int]$ProcessId)')){ throw 'Stop-Tree não usa ProcessId.' }
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if($errors.Count){ $errors|ForEach-Object{Write-Error $_.Message}; exit 1 }
          $fn=$ast.Find({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Stop-Tree'},$true)
          if(-not $fn){ throw 'Função Stop-Tree não encontrada.' }
          Invoke-Expression $fn.Extent.Text
          Stop-Tree -ProcessId 2147483000
          Write-Host 'STOP_TREE_RUNTIME_PASS'
