name: RT Low Resource FIX6

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'RT_REINO_TRIBAL_LOW_RESOURCE_FIX6.ps1'
      - '.github/workflows/rt-low-resource-fix6.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RT_REINO_TRIBAL_LOW_RESOURCE_FIX6.ps1'
      - '.github/workflows/rt-low-resource-fix6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-low-resource:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Fetch FIX6 without git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'RT_REINO_TRIBAL_LOW_RESOURCE_FIX6.ps1'
          $uri="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/RT_REINO_TRIBAL_LOW_RESOURCE_FIX6.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $p -TimeoutSec 120
          if(-not(Test-Path $p)){throw 'FIX6 nao foi baixado'}
          "FIX6_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'FIX6_RAW_FETCH_PASS'

      - name: Parse and validate generated bootstrap
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($env:FIX6_PATH,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;exit 1}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:FIX6_PATH -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "FIX6 ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX6_WINDOWS_TRANSFORM_PASS'

      - name: Real Contents API download of five backend files
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $token=(gh auth token).Trim()
          if($LASTEXITCODE -ne 0 -or $token.Length -lt 20){throw 'gh auth token indisponivel'}
          $headers=@{
            Authorization="Bearer $token"
            Accept='application/vnd.github+json'
            'User-Agent'='Reino-Tribal-FIX6-CI'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $branch=[Uri]::EscapeDataString('rt-turso-migration')
          foreach($relative in @('deno.json','deno/main.js','api/reino.js','api/admin.js','backend/turso/schema.sql')){
            $escaped=(($relative -split '/')|ForEach-Object{[Uri]::EscapeDataString($_)}) -join '/'
            $uri=('https://api.github.com/repos/{0}/contents/{1}?ref={2}' -f 'kaalflash12/reinos-tribais-online',$escaped,$branch)
            $meta=Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 60
            if([string]$meta.type -ne 'file' -or -not $meta.content){throw "conteudo ausente: $relative"}
            $bytes=[Convert]::FromBase64String((([string]$meta.content)-replace '\s',''))
            if($bytes.Length -lt 1){throw "arquivo vazio: $relative"}
            Write-Host "PASS FILE: $relative ($($bytes.Length) bytes)"
          }
          Write-Host 'GITHUB_CONTENTS_5_FILES_REAL_PASS'
