name: RT90 Admin Public Proof Static
on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH10.ps1'
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1'
      - 'tools/rt91_process_helpers.ps1'
      - 'tools/rt90_admin_public_proof.mjs'
      - 'tools/rt79_edge_public_regression.py'
      - '.github/workflows/rt90-admin-public-proof-static.yml'
  pull_request:
    paths:
      - 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH10.ps1'
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1'
      - 'tools/rt91_process_helpers.ps1'
      - 'tools/rt90_admin_public_proof.mjs'
      - 'tools/rt79_edge_public_regression.py'
      - '.github/workflows/rt90-admin-public-proof-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Prove exact Deno CLI surface used by AUTH10
        shell: powershell
        run: |
          foreach($cmd in @(
            @('deploy','whoami','--help'),
            @('deploy','orgs','list','--help'),
            @('deploy','apps','get','--help'),
            @('deploy','env','list','--help'),
            @('deploy','env','update-value','--help')
          )){
            & deno @cmd | Out-Null
            if($LASTEXITCODE -ne 0){throw "Deno CLI ausente: deno $($cmd -join ' ')"}
          }
          Write-Host 'DENO_2_9_5_AUTH10_CLI_PASS'
      - name: PowerShell parsers and AUTH10 current contract
        shell: powershell
        run: |
          foreach($file in @('REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH10.ps1','REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1','tools/rt91_process_helpers.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parser falhou: $file"}
          }
          $auth=Get-Content REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH10.ps1 -Raw
          $close=Get-Content REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1 -Raw
          $helper=Get-Content tools/rt91_process_helpers.ps1 -Raw
          foreach($needle in @(
            "`$ExecutorRevision = 'SAFE-CLI-AUTH-10-FINAL'",
            "`$ExecutorContract = 'ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91'",
            'DENO_ORG_AUTO_DISCOVERY_CONTRACT',
            'DENO_CANONICAL_APP_DOMAIN_MATCH_CONTRACT',
            'WINDOWS_POWERSHELL_START_PROCESS_STDERR_CONTRACT',
            "@('deploy','whoami')",
            "@('deploy','orgs','list')",
            "@('deploy','apps','get','--org',`$candidate,'--app',`$DenoApp,'--non-interactive')",
            "@('deploy','env','update-value','RT_ADMIN_PASSWORD',`$adminPassword,'--org',`$ResolvedDenoOrg,'--app',`$DenoApp,'--non-interactive')",
            "@('deploy','env','update-value','RT_ADMIN_RECOVERY_KEY',`$recoveryKey,'--org',`$ResolvedDenoOrg,'--app',`$DenoApp,'--non-interactive')",
            'REINO_TRIBAL_ADMIN_RT91_VALIDADO'
          )){if(-not $auth.Contains($needle)){throw "AUTH10 sem contrato: $needle"}}
          if($auth.Contains("@('deploy','--org'")){throw 'AUTH10 contem source deploy antigo'}
          foreach($forbidden in @('console.deno.com/auth/interactive','console.deno.com/auth/exchange')){if($auth.Contains($forbidden)){throw "AUTH10 contem auth HTTP manual: $forbidden"}}
          foreach($needle in @(
            "`$BundleCommit='16df1e125143eeaaabf649069cb6f5954314a4e8'",
            'SAFE-CLI-AUTH-10-FINAL',
            'Emulation.setDeviceMetricsOverride',
            'sendDevToolsCommand',
            'mobile CDP device metrics 390x844',
            'REINO_TRIBAL_ADMIN_PUBLICO_RT90_PASS',
            'REINO_TRIBAL_MOBILE_PLAYER_TURSO_E2E_PASS',
            'ANTI_DOWNGRADE_NO_SOURCE_DEPLOY_PASS'
          )){if(-not $close.Contains($needle)){throw "Closer AUTH10 sem contrato: $needle"}}
          foreach($needle in @('Start-Process','RedirectStandardOutput','RedirectStandardError','Invoke-RTDenoJson','Invoke-RTDenoText')){if(-not $helper.Contains($needle)){throw "Helper nativo sem contrato: $needle"}}
          Write-Host 'RT91_AUTH10_STATIC_PASS'
      - name: Validate exact final AUTH10 package without production mutation
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1 -PackageValidateOnly
          if($LASTEXITCODE -ne 0){throw "AUTH10 package validate exit code $LASTEXITCODE"}
          Write-Host 'RT91_AUTH10_PACKAGE_VALIDATE_PASS'
      - name: Browser runner syntax and CDP contract
        shell: pwsh
        run: |
          node --check tools/rt90_admin_public_proof.mjs
          python -m py_compile tools/rt79_chrome_fast_regression.py tools/rt79_edge_public_regression.py
          $js=Get-Content tools/rt90_admin_public_proof.mjs -Raw
          $mobile=Get-Content tools/rt79_edge_public_regression.py -Raw
          foreach($needle in @('rt60_admin_token','rt60-admin-shell','admin_status','RT90_ADMIN_DASHBOARD_PUBLICO.png','zero legacy Supabase network','RT90_VALIDATE_ONLY','setEdgeService','matching EdgeDriver resolved without Selenium Manager','sendDevToolsCommand','Emulation.setDeviceMetricsOverride','mobile CDP device metrics 390x844')){if(-not $js.Contains($needle)){throw "Runner RT90 sem contrato: $needle"}}
          foreach($needle in @('mobile_gameplay_e2e','mobile_online_e2e','provision_mobile_player','execute_cdp_cmd','Emulation.setDeviceMetricsOverride','mobile online viewport 390','RT80_MOBILE_E2E_BEFORE_RELOAD.png','RT80_MOBILE_E2E_AFTER_RELOAD.png','RT80_MOBILE_ONLINE_TURSO_E2E.png')){if(-not $mobile.Contains($needle)){throw "Runner mobile sem contrato: $needle"}}
          Write-Host 'RT90_CDP_BROWSER_RUNNER_STATIC_PASS'
      - name: Run real Edge/Selenium runtime without credentials
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'RT90_VALIDATE_ONLY'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:RT90_VALIDATE_ONLY='1'
          $env:RT_FINAL_PROOF_DIR=$out
          try {
            deno run --allow-all tools/rt90_admin_public_proof.mjs
            if($LASTEXITCODE -ne 0){throw "RT90 validate-only exit code $LASTEXITCODE"}
          } finally {
            $env:RT90_VALIDATE_ONLY=''
            $env:RT_FINAL_PROOF_DIR=''
          }
          $p=Get-Content (Join-Path $out 'PROVA_RT90_ADMIN_PUBLICO.json') -Raw | ConvertFrom-Json
          if(-not $p.pass -or -not $p.validate_only){throw 'RT90 validate-only nao marcou PASS.'}
          if(-not (Test-Path (Join-Path $out 'RT90_VALIDATE_ONLY_PUBLIC_LOGIN.png'))){throw 'Screenshot validate-only ausente.'}
          Write-Host 'RT90_EDGE_SELENIUM_RUNTIME_PASS'
      - name: Run public mobile gameplay and Turso E2E
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          $env:RT79_TEST_URL='https://kaalflash12.github.io/reinos-tribais-online/'
          $env:RT79_REQUIRE_MOBILE_ONLINE='1'
          python tools/rt79_edge_public_regression.py
          if($LASTEXITCODE -ne 0){throw "RT80 mobile E2E exit code $LASTEXITCODE"}
          $proofPath=Join-Path $env:RUNNER_TEMP 'RT79_BROWSER_REGRESSION\PROVA_BROWSER_RT79.json'
          if(-not (Test-Path $proofPath)){throw 'Prova RT80 mobile ausente.'}
          $p=Get-Content $proofPath -Raw | ConvertFrom-Json
          if(-not $p.pass -or -not $p.mobile.pass -or -not $p.mobile_online.pass -or $p.mobile_online.skipped){throw 'RT80 mobile/Turso E2E nao marcou PASS.'}
          if([int]$p.mobile.viewport.w -lt 380 -or [int]$p.mobile.viewport.w -gt 400){throw "Viewport CDP offline invalido: $($p.mobile.viewport.w)"}
          if([int]$p.mobile_online.viewport.w -lt 380 -or [int]$p.mobile_online.viewport.w -gt 400){throw "Viewport CDP online invalido: $($p.mobile_online.viewport.w)"}
          foreach($name in @('RT80_MOBILE_E2E_BEFORE_RELOAD.png','RT80_MOBILE_E2E_AFTER_RELOAD.png','RT80_MOBILE_ONLINE_TURSO_E2E.png')){if(-not (Test-Path (Join-Path $env:RUNNER_TEMP "RT79_BROWSER_REGRESSION\$name"))){throw "Screenshot mobile ausente: $name"}}
          Write-Host 'RT80_FULL_MOBILE_TURSO_CDP_E2E_PASS'
      - name: Upload validate-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT90_VALIDATE_ONLY_PROOF
          path: ${{ runner.temp }}/RT90_VALIDATE_ONLY
          if-no-files-found: error
      - name: Upload mobile E2E proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT80_MOBILE_TURSO_E2E_PROOF
          path: ${{ runner.temp }}/RT79_BROWSER_REGRESSION
          if-no-files-found: warn
