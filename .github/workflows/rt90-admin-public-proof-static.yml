name: RT90 Admin Public Proof Static
on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1'
      - 'REINO_TRIBAL_CONTINUAR.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1'
      - 'tools/rt90_admin_public_proof.mjs'
      - '.github/workflows/rt90-admin-public-proof-static.yml'
  pull_request:
    paths:
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1'
      - 'REINO_TRIBAL_CONTINUAR.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1'
      - 'tools/rt90_admin_public_proof.mjs'
      - '.github/workflows/rt90-admin-public-proof-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Prove Deno CLI commands used by RT91
        shell: powershell
        run: |
          deno deploy env list --help | Out-Null
          if($LASTEXITCODE -ne 0){throw 'deno deploy env list ausente'}
          deno deploy env update-value --help | Out-Null
          if($LASTEXITCODE -ne 0){throw 'deno deploy env update-value ausente'}
          Write-Host 'DENO_2_9_5_ENV_CLI_PASS'
      - name: PowerShell parsers and current RT91 contract
        shell: powershell
        run: |
          foreach($file in @('REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1','REINO_TRIBAL_CONTINUAR.ps1','REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parser falhou: $file"}
          }
          $wrapper=Get-Content REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1 -Raw
          $launcher=Get-Content REINO_TRIBAL_CONTINUAR.ps1 -Raw
          $close=Get-Content REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1 -Raw
          foreach($needle in @(
            "`$ExecutorVersion = 'RT91'",
            "`$ExecutorRevision = 'SAFE-CLI-AUTH-4'",
            "`$ExecutorContract = 'ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91'",
            "`$BaseCommit = '133abc213cc3f269e1a5019a7c361847f8f72abe'",
            "@('deploy','env','list','--org',`$DenoOrg,'--app',`$DenoApp)",
            "@('deploy','env','update-value','RT_ADMIN_PASSWORD',`$adminPassword,'--org',`$DenoOrg,'--app',`$DenoApp)",
            'CORS_GITHUB_PAGES_EXACT_ORIGIN_CONTRACT',
            'DENO_DOCUMENTED_CLI_ONLY_CONTRACT'
          )){if(-not $wrapper.Contains($needle)){throw "RT91 CLI-AUTH-4 sem contrato: $needle"}}
          foreach($needle in @(
            "`$CanonicalVersion = 'RT91'",
            "`$CanonicalRevision = 'SAFE-CLI-AUTH-4'",
            "`$CanonicalContract = 'ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91'",
            "`$CanonicalFile = 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1'",
            'DENO_ENV_LIST_AUTH_CONTRACT',
            'DENO_DOCUMENTED_CLI_ONLY_CONTRACT',
            'ANTI_DOWNGRADE_NO_SOURCE_DEPLOY_CONTRACT'
          )){if(-not $launcher.Contains($needle)){throw "Launcher sem contrato RT91 atual: $needle"}}
          if($wrapper.Contains("'deploy','apps','get'") -or $launcher.Contains("'deploy','apps','get'")){throw 'apps get nao documentado reapareceu'}
          if($wrapper.Contains('--non-interactive') -or $launcher.Contains('--non-interactive')){throw '--non-interactive nao documentado reapareceu'}
          foreach($needle in @('ANTI_DOWNGRADE: nenhum source deploy executado = PASS','Contrato: ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91','REINO_TRIBAL_ADMIN_PUBLICO_RT90_PASS')){if(-not $close.Contains($needle)){throw "Fechamento RT90 sem anti-downgrade: $needle"}}
          if($close -match '(?im)Write-Host[^\r\n]*\$password'){throw 'RT90 nao pode imprimir a senha'}
          Write-Host 'RT91_CLI_AUTH4_STATIC_PASS'
      - name: Execute canonical RT91 validate-only
        shell: powershell
        run: |
          $deno=(Get-Command deno -ErrorAction Stop).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_CONTINUAR.ps1 -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "RT91 validate-only exit code $LASTEXITCODE"}
          Write-Host 'RT91_CANONICAL_VALIDATE_NO_DEPLOY_PASS'
      - name: Browser runner syntax
        shell: pwsh
        run: |
          node --check tools/rt90_admin_public_proof.mjs
          $js=Get-Content tools/rt90_admin_public_proof.mjs -Raw
          $ps=Get-Content REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1 -Raw
          foreach($needle in @('rt60_admin_token','rt60-admin-shell','admin_status','RT90_ADMIN_DASHBOARD_PUBLICO.png','zero legacy Supabase network','RT90_VALIDATE_ONLY','setEdgeService','matching EdgeDriver resolved without Selenium Manager')){if(-not $js.Contains($needle)){throw "Runner RT90 sem contrato: $needle"}}
          foreach($needle in @('CREDENCIAIS_ADMIN_REINO_TRIBAL.txt','VALIDACAO: login','RT_FINAL_ADMIN_PASSWORD','REINO_TRIBAL_ADMIN_PUBLICO_RT90_PASS','ANTI_DOWNGRADE_NO_SOURCE_DEPLOY_PASS')){if(-not $ps.Contains($needle)){throw "PowerShell RT90 sem contrato: $needle"}}
          Write-Host 'RT90_BROWSER_RUNNER_STATIC_PASS'
      - name: Run real Edge/Selenium runtime without credentials
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'RT90_VALIDATE_ONLY'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:RT90_VALIDATE_ONLY='1'
          $env:RT_FINAL_PROOF_DIR=$out
          try {
            deno run --allow-all tools/rt90_admin_public_proof.mjs
            if($LASTEXITCODE -ne 0){throw "RT90 validate-only exit code $LASTEXITCODE"}
          } finally {
            $env:RT90_VALIDATE_ONLY=''
            $env:RT_FINAL_PROOF_DIR=''
          }
          $p=Get-Content (Join-Path $out 'PROVA_RT90_ADMIN_PUBLICO.json') -Raw | ConvertFrom-Json
          if(-not $p.pass -or -not $p.validate_only){throw 'RT90 validate-only nao marcou PASS.'}
          if(-not (Test-Path (Join-Path $out 'RT90_VALIDATE_ONLY_PUBLIC_LOGIN.png'))){throw 'Screenshot validate-only ausente.'}
          Write-Host 'RT90_EDGE_SELENIUM_RUNTIME_PASS'
      - name: Upload validate-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT90_VALIDATE_ONLY_PROOF
          path: ${{ runner.temp }}/RT90_VALIDATE_ONLY
          if-no-files-found: error
