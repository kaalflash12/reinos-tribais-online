name: RT75 Browser Audit

on:
  push:
    paths:
      - 'rt75-audit-trigger.txt'

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar navegador
        run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install chromium
      - name: Auditar assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          root=Path('assets/v54/buildings')
          keys=['main','timber','clay','iron','farm','warehouse','market','hide','barracks','stable','garage','smith','academy','statue','rally','wall','watchtower','first_church','church']
          out={}
          for k in keys:
              out[k]={}
              for lvl in range(5):
                  p=root/f'{k}_l{lvl}.png'
                  im=Image.open(p).convert('RGBA')
                  bbox=im.getchannel('A').getbbox()
                  out[k][str(lvl)]={'size':im.size,'alpha_bbox':bbox,'alpha_nonempty':bbox is not None}
          Path('rt75-audit').mkdir(exist_ok=True)
          Path('rt75-audit/assets.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Servir jogo
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/rt75-http.log 2>&1 &
          sleep 2
      - name: Browser desktop e mobile
        run: |
          cat > /tmp/audit.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          OUT=Path('rt75-audit');OUT.mkdir(exist_ok=True)
          result={'desktop':{},'mobile':{},'errors':[]}
          def run_case(pw,name,viewport):
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page(viewport=viewport)
              errors=[]
              page.on('pageerror',lambda e:errors.append('pageerror: '+str(e)))
              page.on('console',lambda m:errors.append('console.error: '+m.text) if m.type=='error' else None)
              page.goto('http://127.0.0.1:8765/index.html?rt75audit=2',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(1000)
              off=page.locator('[data-play-offline]').first
              if off.count():off.click()
              page.wait_for_timeout(700)
              form=page.locator('#start-form')
              if form.count() and form.is_visible():
                  form.locator('[name=playerName]').fill('Auditoria RT75')
                  form.locator('[name=villageName]').fill('Aldeia Auditada')
                  form.locator('button[type=submit],button:not([type])').last.click()
                  page.wait_for_timeout(1500)
              page.screenshot(path=str(OUT/f'{name}-overview.png'),full_page=True)
              data=page.evaluate('''() => {
                const q=s=>Array.from(document.querySelectorAll(s));
                const scene=document.querySelector('.village-scene');
                const imgs=q('.rt60-building-layer,.rt75-building-art');
                const all=imgs.map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el),p=el.parentElement?getComputedStyle(el.parentElement):null;return {src:el.getAttribute('src'),key:el.dataset.villageBuilding||'',tier:el.dataset.villageTier||'',className:el.className,rect:[r.x,r.y,r.width,r.height],natural:[el.naturalWidth,el.naturalHeight],complete:el.complete,display:cs.display,visibility:cs.visibility,opacity:cs.opacity,position:cs.position,zIndex:cs.zIndex,width:cs.width,height:cs.height,parentDisplay:p?.display||'',parentVisibility:p?.visibility||'',parentOpacity:p?.opacity||''}});
                const visible=all.filter(x=>x.rect[2]>2&&x.rect[3]>2&&x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity||1)>0);
                const hits=q('.rt60-village-hitbox,[data-open-building]').filter(x=>x.closest('.village-scene'));
                const keys=Object.keys(localStorage);
                return {title:document.title,scene:scene?(()=>{const r=scene.getBoundingClientRect(),cs=getComputedStyle(scene);return {rect:[r.x,r.y,r.width,r.height],display:cs.display,visibility:cs.visibility,overflow:cs.overflow}})():null,images:imgs.length,visibleImages:visible.length,hits:hits.length,allImages:all,localKeys:keys.filter(k=>k.includes('reinos_tribais'))};
              }''')
              result[name]=data
              result['errors'] += [name+': '+x for x in errors]
              if page.locator('.village-scene').count():page.locator('.village-scene').first.screenshot(path=str(OUT/f'{name}-village.png'))
              page.reload(wait_until='domcontentloaded');page.wait_for_timeout(800)
              off=page.locator('[data-play-offline]').first
              if off.count():off.click();page.wait_for_timeout(800)
              result[name]['afterReload']=page.evaluate('''() => ({keys:Object.keys(localStorage).filter(k=>k.includes('reinos_tribais')),hasGame:!!document.querySelector('.game-shell'),startForm:!!document.querySelector('#start-form')})''')
              browser.close()
          with sync_playwright() as pw:
              run_case(pw,'desktop',{'width':1920,'height':1080})
              run_case(pw,'mobile',{'width':390,'height':844})
          (OUT/'browser.json').write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if result['errors']:raise SystemExit('Browser errors: '+json.dumps(result['errors'],ensure_ascii=False))
          if result['desktop'].get('hits',0)<19:raise SystemExit('Desktop: menos de 19 hitboxes')
          if not result['desktop'].get('localKeys'):raise SystemExit('Desktop: save local não foi criado')
          if not result['desktop'].get('afterReload',{}).get('hasGame'):raise SystemExit('Desktop: save local não restaurou')
          PY
          python /tmp/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt75-browser-audit
          path: rt75-audit
          if-no-files-found: error
