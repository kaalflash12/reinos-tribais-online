name: RT75 Installer Windows Real Test

on:
  push:
    paths:
      - 'rt75-installer-windows-trigger.txt'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parser Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'installers\RT75_INSTALADOR_V3_WINDOWS.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PARSER WINDOWS POWERSHELL 5.1: PASS"

      - name: Instalação limpa com powershell.exe
        shell: cmd
        run: |
          set TESTROOT=%RUNNER_TEMP%\RT75_INSTALL_TEST
          if exist "%TESTROOT%" rmdir /s /q "%TESTROOT%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\installers\RT75_INSTALADOR_V3_WINDOWS.ps1" -RootOverride "%TESTROOT%" -NoOpen -NoShortcut -NoPrompt

      - name: Verificar instalação limpa
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'RT75_INSTALL_TEST'
          $game = Join-Path $root 'JOGAR_REINOS_TRIBAIS.html'
          $index = Join-Path $root 'index.html'
          $audit = Join-Path $root 'AUDITORIA_RT75\EXECUCAO_RT75_V3.json'
          foreach($p in @($game,$index,$audit)){ if(-not (Test-Path -LiteralPath $p)){ throw "Ausente: $p" } }
          $expected='3a1942edee3ddde4d22d1d4b4c187fb18a0c393020c263cc55e7690018a9a6da'
          if((Get-FileHash $game -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){ throw 'SHA JOGAR incorreto' }
          if((Get-FileHash $index -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){ throw 'SHA index incorreto' }
          $l0=Join-Path $root 'assets\v54\buildings\academy_l0.png'
          if((Get-Item $l0).Length -ne 824){ throw "academy_l0 deveria ter 824 bytes; recebeu $((Get-Item $l0).Length)" }
          $j=Get-Content $audit -Raw | ConvertFrom-Json
          if($j.building_png -ne '95/95' -or $j.maps -ne '4/4 + overlay'){ throw 'Relatório local incompleto' }
          Write-Host 'INSTALAÇÃO LIMPA: PASS'

      - name: Corromper L0 e testar reparo real
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'RT75_INSTALL_TEST'
          Set-Content -LiteralPath (Join-Path $root 'assets\v54\buildings\academy_l0.png') -Value 'ARQUIVO CORROMPIDO' -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\installers\RT75_INSTALADOR_V3_WINDOWS.ps1" -RootOverride $root -NoOpen -NoShortcut -NoPrompt
          if($LASTEXITCODE -ne 0){ throw "Reparo retornou exit code $LASTEXITCODE" }
          $l0=Join-Path $root 'assets\v54\buildings\academy_l0.png'
          if((Get-Item $l0).Length -ne 824){ throw 'L0 corrompido não foi restaurado corretamente' }
          Write-Host 'REPARO DE PNG CORROMPIDO: PASS'

      - name: Terceira execução idempotente
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'RT75_INSTALL_TEST'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\installers\RT75_INSTALADOR_V3_WINDOWS.ps1" -RootOverride $root -NoOpen -NoShortcut -NoPrompt
          if($LASTEXITCODE -ne 0){ throw "Execução idempotente retornou exit code $LASTEXITCODE" }
          $backups=(Get-ChildItem (Join-Path $root 'AUDITORIA_RT75') -Filter 'JOGAR.pre-v3-*.html').Count
          if($backups -lt 1){ throw 'Backup não foi criado em reinstalação' }
          Write-Host "TERCEIRA EXECUÇÃO / IDEMPOTÊNCIA: PASS; backups=$backups"

      - name: Publicar relatório do teste
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'RT75_INSTALL_TEST'
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\RT75_WINDOWS_TEST" -Force | Out-Null
          Copy-Item (Join-Path $root 'AUDITORIA_RT75\EXECUCAO_RT75_V3.json') "$env:GITHUB_WORKSPACE\RT75_WINDOWS_TEST\EXECUCAO_RT75_V3.json" -Force
          @{
            os = (Get-CimInstance Win32_OperatingSystem).Caption
            powershell = $PSVersionTable.PSVersion.ToString()
            clean_install = 'PASS'
            corrupted_l0_repair = 'PASS'
            idempotent_reinstall = 'PASS'
            academy_l0_bytes = (Get-Item (Join-Path $root 'assets\v54\buildings\academy_l0.png')).Length
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\RT75_WINDOWS_TEST\WINDOWS_TEST.json" -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: RT75_WINDOWS_INSTALLER_TEST
          path: RT75_WINDOWS_TEST
          if-no-files-found: error
