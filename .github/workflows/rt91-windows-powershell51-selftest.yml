name: RT91 Windows PowerShell 5.1 Native Selftest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/rt91_native_process.ps1'
      - 'tools/rt91_native_process_selftest.ps1'
      - '.github/workflows/rt91-windows-powershell51-selftest.yml'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  powershell51-native-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){ throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)" }
          Write-Host "PASS: Windows PowerShell $($PSVersionTable.PSVersion)"

      - name: Parse helper and selftest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          [void][scriptblock]::Create((Get-Content -Raw -LiteralPath 'tools/rt91_native_process.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw -LiteralPath 'tools/rt91_native_process_selftest.ps1'))
          Write-Host 'PASS: PowerShell parser helper+selftest'

      - name: Execute native process selftest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\tools\rt91_native_process_selftest.ps1'
