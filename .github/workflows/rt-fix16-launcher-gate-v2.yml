name: RT FIX16 Launcher Gate V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rt-fix16-launcher-gate-v2.yml'

permissions:
  contents: read

jobs:
  windows-launcher-fix16-v2:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Download exact launcher without checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:TEMP 'RT_FIX16_LAUNCHER_GATE.ps1'
          Remove-Item $p -Force -ErrorAction SilentlyContinue
          & curl.exe --fail --silent --show-error --location --http1.1 --tlsv1.2 --retry 4 --retry-all-errors --output $p 'https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/500bd7f171160aeb29ca3672f43d570866d98d1b/REINO_TRIBAL_FIX16_LAUNCHER.ps1'
          if($LASTEXITCODE -ne 0){throw 'Download do launcher pinado falhou'}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'Launcher pinado nao passou no parser'}
          $t=[IO.File]::ReadAllText($p)
          foreach($needle in @('be58d6451fb556071e9cb0479a44b6fd51052fe4','REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1','RT_ADMIN_FIX16_')){if(-not $t.Contains($needle)){throw "Launcher sem marcador: $needle"}}
          Write-Host 'FIX16_LAUNCHER_V2_DOWNLOAD_PARSE_PASS'

      - name: Execute exact launcher public preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:TEMP 'RT_FIX16_LAUNCHER_GATE.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p -PreflightOnly
          if($LASTEXITCODE -ne 0){throw "Launcher PreflightOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX16_LAUNCHER_V2_PREFLIGHT_PASS'

      - name: Execute exact launcher backend validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:TEMP 'RT_FIX16_LAUNCHER_GATE.ps1'
          $deno=(Get-Command deno).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "Launcher ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX16_LAUNCHER_V2_VALIDATE_PASS'

      - name: Assert unique temp executor and no legacy files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($old in @(
            (Join-Path $env:TEMP 'RT_ADMIN_FIX15.ps1'),
            (Join-Path $env:TEMP 'RT_ADMIN_FIX16.ps1'),
            (Join-Path $env:TEMP 'REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1'),
            (Join-Path $env:TEMP 'REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1')
          )){if(Test-Path $old){throw "Arquivo legado ainda existe: $old"}}
          $expected=Join-Path $env:TEMP 'RT_ADMIN_FIX16_be58d6451fb5.ps1'
          if(-not (Test-Path $expected)){throw "Executor unico ausente: $expected"}
          $t=[IO.File]::ReadAllText($expected)
          if(-not $t.Contains('CORS URL:') -or -not $t.Contains('REINO_TRIBAL_ADMIN_FIX16_VALIDADO')){throw 'Executor unico nao e o FIX16 correto'}
          Write-Host 'FIX16_LAUNCHER_V2_TEMP_ISOLATION_PASS'
