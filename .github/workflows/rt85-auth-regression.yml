name: RT85 Auth Regression
on:
  pull_request:
    paths:
      - 'rt85-auth-bridge.js'
      - 'index.html'
      - 'JOGAR_REINOS_TRIBAIS.html'
      - 'api/**'
      - 'backend/turso/**'
      - 'tools/rt85_auth_regression.py'
      - '.github/workflows/rt85-auth-regression.yml'
  workflow_dispatch:

jobs:
  auth:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax
        shell: pwsh
        run: |
          node --check rt85-auth-bridge.js
          node --check api/reino.js
          node --check api/admin.js
          if ((Get-Content rt85-auth-bridge.js -Raw) -notmatch '__RT_TURSO_BRIDGE__') { throw 'Ponte Turso ausente' }
          if ((Get-Content rt85-auth-bridge.js -Raw) -notmatch 'blockLegacySupabase:true') { throw 'Bloqueio do Supabase legado ausente' }
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Start local site
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WindowStyle Hidden
          Start-Sleep -Seconds 2
          (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode
      - name: Browser login and isolation proof
        env:
          RT85_URL: http://127.0.0.1:8765/
        run: python tools/rt85_auth_regression.py
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT_TURSO_AUTH_PROOF
          path: ${{ runner.temp }}/RT85_AUTH_PROOF
          if-no-files-found: error
