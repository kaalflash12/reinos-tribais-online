name: RT83 Real World Combat Regression
on:
  pull_request:
    paths:
      - 'rt83-world-combat.js'
      - 'rt79-village-ui.js'
      - 'tools/rt83_world_combat_regression.py'
      - '.github/workflows/rt83-world-combat-regression.yml'
  workflow_dispatch:

jobs:
  combat:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Validate JS
        shell: pwsh
        run: |
          node --check rt83-world-combat.js
          node --check rt79-village-ui.js
          if (-not (Select-String -LiteralPath rt79-village-ui.js -SimpleMatch "rt83-world-combat.js?v=83.0")) { throw 'RT83 loader ausente' }
      - name: Start local branch
        shell: pwsh
        run: |
          $p=Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
          $p.Id | Set-Content "$env:RUNNER_TEMP\rt83_server.pid"
          Start-Sleep -Seconds 2
          (Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing).StatusCode
      - name: Run real combat regression
        env:
          RT83_URL: http://127.0.0.1:8765/
        run: python tools/rt83_world_combat_regression.py
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT83_WORLD_COMBAT_PROOF
          path: ${{ runner.temp }}/RT83_WORLD_COMBAT_PROOF
          if-no-files-found: error
