name: RT88 TW2 Realtime

on:
  push:
    branches: [rt88-tw2-realtime]
    paths:
      - 'api/realtime.js'
      - 'deno/main.js'
      - 'rt88-realtime-client.js'
      - 'reino-tribal-config.js'
      - 'tests/rt88-realtime-smoke.js'
      - '.github/workflows/rt88-tw2-realtime.yml'
  pull_request:
    paths:
      - 'api/realtime.js'
      - 'deno/main.js'
      - 'rt88-realtime-client.js'
      - 'reino-tribal-config.js'
      - 'tests/rt88-realtime-smoke.js'
      - '.github/workflows/rt88-tw2-realtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Check realtime backend and browser client
        run: |
          deno check deno/main.js api/realtime.js tests/rt88-realtime-smoke.js rt88-realtime-client.js

      - name: Real websocket smoke
        run: |
          deno run --allow-run --allow-net --allow-env tests/rt88-realtime-smoke.js

      - name: Verify TW2-inspired contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "System/welcome" api/realtime.js
          grep -F "Authentication/session" api/realtime.js
          grep -F "World/select" api/realtime.js
          grep -F "Presence/join" api/realtime.js
          grep -F "Event/notify" api/realtime.js
          grep -F "pathname === '/ws'" deno/main.js
          grep -F "rt88-realtime-client.js?v=rt88-v1" reino-tribal-config.js
          grep -F "window.ReinoTribalRealtime" rt88-realtime-client.js
          grep -F "reino:realtime-status" rt88-realtime-client.js
          echo RT88_TW2_REALTIME_CONTRACT_PASS
