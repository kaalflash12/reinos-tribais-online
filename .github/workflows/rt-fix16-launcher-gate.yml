name: RT FIX16 Launcher Gate

on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_FIX16_LAUNCHER.ps1'
      - '.github/workflows/rt-fix16-launcher-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher-fix16:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Parse launcher
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\REINO_TRIBAL_FIX16_LAUNCHER.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'Launcher FIX16 nao passou no parser'}
          Write-Host 'FIX16_LAUNCHER_PARSE_PASS'

      - name: Execute launcher public preflight exactly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_FIX16_LAUNCHER.ps1 -PreflightOnly
          if($LASTEXITCODE -ne 0){throw "Launcher PreflightOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX16_LAUNCHER_PREFLIGHT_PASS'

      - name: Execute launcher pinned backend validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $deno=(Get-Command deno).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_FIX16_LAUNCHER.ps1 -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "Launcher ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX16_LAUNCHER_VALIDATE_PASS'

      - name: Assert legacy temp names were removed
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($old in @(
            (Join-Path $env:TEMP 'RT_ADMIN_FIX15.ps1'),
            (Join-Path $env:TEMP 'RT_ADMIN_FIX16.ps1'),
            (Join-Path $env:TEMP 'REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1'),
            (Join-Path $env:TEMP 'REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1')
          )){if(Test-Path $old){throw "Nome legado ainda existe: $old"}}
          $expected=Join-Path $env:TEMP 'RT_ADMIN_FIX16_be58d6451fb5.ps1'
          if(-not (Test-Path $expected)){throw "Executor unico esperado nao existe: $expected"}
          $t=[IO.File]::ReadAllText($expected)
          if(-not $t.Contains('REINO_TRIBAL_ADMIN_FIX16_VALIDADO')){throw 'Executor unico nao e FIX16'}
          Write-Host 'FIX16_LAUNCHER_TEMP_ISOLATION_PASS'
