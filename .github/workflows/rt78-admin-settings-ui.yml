name: RT78 Admin Settings UI
on:
  push:
    paths:
      - 'rt78-admin-settings-ui-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch strategic settings controls into ADM
        shell: python
        run: |
          from pathlib import Path
          p=Path('rt78-admin-suite.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("l=(data?.logs||[]).slice(0,120);o.innerHTML=", "l=(data?.logs||[]).slice(0,120),g=(data?.settings||[]).slice(0,250);o.innerHTML=")
          s=s.replace("<div><b>${c.players_configured||0}</b><span>Jogadores configurados</span></div>", "<div><b>${c.manager_enabled||0}/${c.players_configured||0}</b><span>Gerentes ativos</span></div>")
          settings='''<section><h3>Configurações / Gerente 2.0 por jogador</h3><div class="rt78a-table"><table><thead><tr><th>Jogador</th><th>Mundo</th><th>Gerente</th><th>Farm</th><th>Pesquisas</th><th>Ação</th></tr></thead><tbody>${g.map(x=>{const m=x.config?.manager||{},f=x.config?.farm||{};return `<tr><td>${esc(x.user_id)}</td><td>${esc(x.world_id)}</td><td>${m.enabled?'ATIVO':'Pausado'}</td><td>${esc(f.activeTemplate||'A')}</td><td>${(m.researchPriority||[]).length}</td><td><button data-rt78a-manager="${x.user_id}" data-world="${x.world_id}" data-enabled="${m.enabled?'0':'1'}">${m.enabled?'Desativar Gerente':'Ativar Gerente'}</button></td></tr>`}).join('')||'<tr><td colspan="6">Nenhuma configuração estratégica salva.</td></tr>'}</tbody></table></div></section>'''
          if 'Configurações / Gerente 2.0 por jogador' not in s:
              s=s.replace('<section><h3>Log operacional RT78</h3>',settings+'<section><h3>Log operacional RT78</h3>')
          if "data-rt78a-manager" in s and "settings_patch" not in s:
              old="const d=e.target.closest('[data-rt78a-delete]');if(d){act('route_delete',{id:d.dataset.rt78aDelete});return}},true);"
              new="const d=e.target.closest('[data-rt78a-delete]');if(d){act('route_delete',{id:d.dataset.rt78aDelete});return}const m=e.target.closest('[data-rt78a-manager]');if(m){act('settings_patch',{world_id:m.dataset.world,user_id:m.dataset.rt78aManager,patch:{manager:{enabled:m.dataset.enabled==='1'}}});return}},true);"
              s=s.replace(old,new)
          if 'Configurações / Gerente 2.0 por jogador' not in s or 'settings_patch' not in s: raise SystemExit('patch ADM incompleto')
          p.write_text(s,encoding='utf-8')
      - run: node --check rt78-admin-suite.js
      - name: Commit
        run: |
          git config user.name 'RT78 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add rt78-admin-suite.js
          git diff --cached --quiet || git commit -m 'RT78: admin controls manager settings per player'
          git push
