name: RT91 Admin Canonical Gate

on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_CONTINUAR.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1'
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1'
      - '.github/workflows/rt-admin-canonical-fix17.yml'
  pull_request:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_CONTINUAR.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH.ps1'
      - 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1'
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1'
      - '.github/workflows/rt-admin-canonical-fix17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rt91:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Prove documented Deno CLI commands exist
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          deno deploy env list --help | Out-Null
          if($LASTEXITCODE -ne 0){throw 'deno deploy env list nao existe no Deno 2.9.5'}
          deno deploy env update-value --help | Out-Null
          if($LASTEXITCODE -ne 0){throw 'deno deploy env update-value nao existe no Deno 2.9.5'}
          Write-Host 'DENO_2_9_5_DOCUMENTED_ENV_CLI_PASS'

      - name: Download only canonical RT91 files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'rt91-canonical'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($file in @('REINO_TRIBAL_CONTINUAR.ps1','REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1','REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1')){
            $out=Join-Path $root $file
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 --output $out "https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/main/$file"
            if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)){throw "Falha baixando $file"}
          }
          "RT91_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'RT91_CANONICAL_FILES_DOWNLOAD_PASS'

      - name: Parse current RT91 canonical contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('REINO_TRIBAL_CONTINUAR.ps1','REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1','REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1')){
            $path=Join-Path $env:RT91_ROOT $file
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parser falhou: $file"}
          }
          $launcher=Get-Content (Join-Path $env:RT91_ROOT 'REINO_TRIBAL_CONTINUAR.ps1') -Raw
          $wrapper=Get-Content (Join-Path $env:RT91_ROOT 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1') -Raw
          $close=Get-Content (Join-Path $env:RT91_ROOT 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1') -Raw
          foreach($needle in @(
            "`$CanonicalVersion = 'RT91'",
            "`$CanonicalRevision = 'SAFE-CLI-AUTH-4'",
            "`$CanonicalContract = 'ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91'",
            "`$CanonicalFile = 'REINO_TRIBAL_ADMIN_SAFE_RT91_CLI_AUTH4.ps1'",
            'DENO_ENV_LIST_AUTH_CONTRACT',
            'DENO_DOCUMENTED_CLI_ONLY_CONTRACT',
            'ANTI_DOWNGRADE_NO_SOURCE_DEPLOY_CONTRACT'
          )){if(-not $launcher.Contains($needle)){throw "Launcher RT91 sem contrato: $needle"}}
          foreach($needle in @(
            "`$ExecutorVersion = 'RT91'",
            "`$ExecutorRevision = 'SAFE-CLI-AUTH-4'",
            "`$ExecutorContract = 'ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91'",
            "`$BaseCommit = '133abc213cc3f269e1a5019a7c361847f8f72abe'",
            "@('deploy','env','list','--org',`$DenoOrg,'--app',`$DenoApp)",
            "@('deploy','env','update-value','RT_ADMIN_PASSWORD',`$adminPassword,'--org',`$DenoOrg,'--app',`$DenoApp)",
            'CORS_GITHUB_PAGES_EXACT_ORIGIN_CONTRACT',
            'DENO_DOCUMENTED_CLI_ONLY_CONTRACT'
          )){if(-not $wrapper.Contains($needle)){throw "Wrapper RT91 sem contrato: $needle"}}
          if($launcher.Contains("'deploy','apps','get'") -or $wrapper.Contains("'deploy','apps','get'")){throw 'apps get nao documentado reapareceu'}
          if($launcher.Contains('--non-interactive') -or $wrapper.Contains('--non-interactive')){throw '--non-interactive nao documentado reapareceu'}
          foreach($needle in @('ANTI_DOWNGRADE: nenhum source deploy executado = PASS','Contrato: ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91','REINO_TRIBAL_ADMIN_PUBLICO_RT90_PASS')){if(-not $close.Contains($needle)){throw "Fechamento RT90 sem contrato: $needle"}}
          if($close -match '(?im)Write-Host[^\r\n]*\$password'){throw 'RT90 nao pode imprimir a senha'}
          Write-Host 'RT91_CANONICAL_STATIC_PASS'

      - name: Prove canonical identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Join-Path $env:RT91_ROOT 'REINO_TRIBAL_CONTINUAR.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -IdentityOnly
          if($LASTEXITCODE -ne 0){throw "RT91 IdentityOnly falhou: $LASTEXITCODE"}
          $marker=Join-Path $env:TEMP 'REINO_TRIBAL_EXECUTOR_ATIVO.txt'
          if(-not (Test-Path $marker)){throw 'RT91 nao produziu marcador de executor ativo'}
          $m=Get-Content $marker -Raw
          foreach($needle in @('version=RT91','revision=SAFE-CLI-AUTH-4','contract=ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91','backend=https://reino-tribal-api.mestrederpg35.deno.net')){if(-not $m.Contains($needle)){throw "Marcador RT91 ausente: $needle"}}
          Write-Host 'RT91_CANONICAL_IDENTITY_PASS'

      - name: Execute public preflight through RT91 launcher
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Join-Path $env:RT91_ROOT 'REINO_TRIBAL_CONTINUAR.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -PreflightOnly
          if($LASTEXITCODE -ne 0){throw "RT91 PreflightOnly falhou: $LASTEXITCODE"}
          Write-Host 'RT91_PUBLIC_PREFLIGHT_PASS'

      - name: Validate current backend source without deploy
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Join-Path $env:RT91_ROOT 'REINO_TRIBAL_CONTINUAR.ps1'
          $deno=(Get-Command deno -ErrorAction Stop).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "RT91 ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'RT91_VALIDATE_NO_SOURCE_DEPLOY_PASS'
