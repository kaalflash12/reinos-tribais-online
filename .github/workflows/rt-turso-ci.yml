name: RT Turso migration gate

on:
  push:
    branches: [rt-turso-migration]
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/turso/**'
      - 'rt85-auth-bridge.js'
      - 'index.html'
      - 'JOGAR_REINOS_TRIBAIS.html'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/rt-turso-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependency
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check api/reino.js
          node --check api/admin.js
          node --check rt85-auth-bridge.js
      - name: Verify Turso module resolves
        run: |
          node -e "import('@tursodatabase/serverless').then(m=>{if(typeof m.connect!=='function')process.exit(2);console.log('TURSO_MODULE_PASS')})"
          node -e "Promise.all([import('./api/reino.js'),import('./api/admin.js')]).then(()=>console.log('API_IMPORT_PASS'))"
      - name: Verify bridge ordering and isolation
        shell: bash
        run: |
          set -euo pipefail
          cmp -s index.html JOGAR_REINOS_TRIBAIS.html
          grep -q 'rt85-auth-bridge.js?v=1.0.4-turso' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          bridge=s.index('rt85-auth-bridge.js?v=1.0.4-turso')
          core=s.index("'use strict';", bridge)
          if not bridge < core:
              raise SystemExit('bridge não carrega antes do core')
          b=Path('rt85-auth-bridge.js').read_text(encoding='utf-8')
          required=['__RT_TURSO_BRIDGE__','blockLegacySupabase:true','/api/reino','/api/admin']
          missing=[x for x in required if x not in b]
          if missing:
              raise SystemExit('ponte incompleta: '+','.join(missing))
          print('BRIDGE_ORDER_PASS')
          PY
      - name: Verify no Turso secret is committed
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          bad=[]
          rx=re.compile(r'TURSO_AUTH_TOKEN\s*[=:]\s*[\"\x27]([A-Za-z0-9._-]{20,})[\"\x27]')
          skip={'.git','.github/workflows/rt-turso-ci.yml'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or str(p).replace('\\','/') in skip:
                  continue
              if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.zip','.rar','.pdf'}:
                  continue
              try: text=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              if rx.search(text): bad.append(str(p))
          if bad:
              raise SystemExit('Possível token Turso commitado: '+', '.join(bad))
          print('SECRET_SCAN_PASS')
          PY
      - name: Live Turso probe when production secrets exist
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TURSO_DATABASE_URL:-}" ] || [ -z "${TURSO_AUTH_TOKEN:-}" ]; then
            echo '::warning::Turso production secrets ainda não configurados; teste ao vivo ignorado.'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { connect } from '@tursodatabase/serverless';
          const db=connect({url:process.env.TURSO_DATABASE_URL,authToken:process.env.TURSO_AUTH_TOKEN});
          const stmt=await Promise.resolve(db.prepare('SELECT 1 AS ok'));
          const row=await stmt.get();
          if(Number(row?.ok)!==1) throw new Error('Turso live SELECT failed');
          console.log('TURSO_LIVE_SELECT_PASS');
          await db.close?.();
          NODE
      - name: Existing deployment credentials presence only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          RT_ADMIN_PASSWORD: ${{ secrets.RT_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for k in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN TURSO_API_TOKEN TURSO_PLATFORM_API_TOKEN TURSO_TOKEN TURSO_ORG LIBSQL_URL LIBSQL_AUTH_TOKEN RT_ADMIN_PASSWORD; do
            if [ -n "${!k:-}" ]; then echo "$k=PRESENT"; else echo "$k=MISSING"; fi
          done
