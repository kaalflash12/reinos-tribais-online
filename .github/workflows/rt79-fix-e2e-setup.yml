name: RT79.1 Fix E2E Setup
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt79-fix-launcher-gate
      - name: Respect building maximums and population in E2E seed
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rt79_chrome_fast_regression.py')
          s=p.read_text(encoding='utf-8')
          old="for(const k of Object.keys(v.buildings||{}))v.buildings[k]=Math.max(Number(v.buildings[k]||0),['farm','warehouse'].includes(k)?20:10);"
          new="for(const k of Object.keys(v.buildings||{})){const mx=Number(window.GAME_DATA?.buildings?.[k]?.max||30);v.buildings[k]=Math.min(mx,Math.max(Number(v.buildings[k]||0),['farm','warehouse'].includes(k)?30:10));}"
          if old not in s: raise SystemExit('old E2E building seed not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/rt79_chrome_fast_regression.py
          grep -F "const mx=Number(window.GAME_DATA?.buildings?.[k]?.max||30)" tools/rt79_chrome_fast_regression.py
      - name: Commit corrected E2E seed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rt79_chrome_fast_regression.py
          if ! git diff --cached --quiet; then
            git commit -m 'RT79.1: keep E2E building seed within real limits'
            git push origin HEAD:rt79-fix-launcher-gate
          fi
