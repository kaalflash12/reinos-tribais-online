name: RT79.1 Observer Loop Hotfix
on:
  push:
    branches: [rt79-observer-hotfix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt79-observer-hotfix
      - name: Apply deterministic hotfix
        run: |
          python tools/rt79_fix_observer_loop.py
          node --check rt79-suite.js
          node --check rt79-village-ui.js
          node --check rt79-groups-addon.js
          node --check rt79-logistics-ai-addon.js
          node --check rt79-admin-suite.js
          node --check rt79-admin-logistics-addon.js
          grep -F "const VERSION='79.1';" rt79-suite.js
          grep -F 'if(nextTitle!==document.title) document.title=nextTitle;' rt79-suite.js
      - name: Commit patched runtime
        run: |
          if ! git diff --quiet -- rt79-suite.js rt79-village-ui.js rt79-groups-addon.js rt79-logistics-ai-addon.js rt79-admin-suite.js rt79-admin-logistics-addon.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rt79-suite.js rt79-village-ui.js rt79-groups-addon.js rt79-logistics-ai-addon.js rt79-admin-suite.js rt79-admin-logistics-addon.js
            git commit -m 'RT79.1: stop MutationObserver feedback loops'
            git push origin HEAD:rt79-observer-hotfix
          fi
