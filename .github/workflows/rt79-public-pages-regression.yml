name: RT80 Public/PR Edge Regression
on:
  push:
    branches: [main]
    paths-ignore:
      - 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Validate local syntax and version contract
        shell: pwsh
        run: |
          node --check rt76-master-plan.js
          node --check rt76-runtime.js
          node --check rt76-map-ai.js
          node --check rt79-suite.js
          node --check rt79-village-ui.js
          node --check rt79-logistics-ai-addon.js
          node --check rt80-visual-system.js
          node --check rt80-admin-runtime.js
          python -m py_compile tools/rt79_chrome_fast_regression.py tools/rt79_edge_public_regression.py
          $html=Get-Content index.html -Raw
          if($html -notmatch 'const VERSION = 79;' -or $html -notmatch 'const RT_BUILD = "80.5";'){throw 'Contrato RT80.5/schema 79 inválido.'}
          $mobile=Get-Content tools/rt79_edge_public_regression.py -Raw
          foreach($needle in @('mobile_gameplay_e2e','mobile_online_e2e','RT80_MOBILE_E2E_BEFORE_RELOAD.png','RT80_MOBILE_E2E_AFTER_RELOAD.png','RT80_MOBILE_ONLINE_TURSO_E2E.png','mobile online save','mobile online load')){if(-not $mobile.Contains($needle)){throw "Runner mobile incompleto: $needle"}}
      - name: Select regression target
        shell: pwsh
        run: |
          if('${{ github.event_name }}' -eq 'pull_request'){
            $p=Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
            $p.Id | Set-Content "$env:RUNNER_TEMP\rt80_edge_http_pid.txt"
            Start-Sleep -Seconds 2
            Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/index.html | Out-Null
            'RT79_TEST_URL=http://127.0.0.1:8765/' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'RT79_REQUIRE_MOBILE_ONLINE=0' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'PR: testando o merge candidato localmente; login online de produção não é exigido por CORS.'
          } else {
            $base='https://kaalflash12.github.io/reinos-tribais-online/'
            $ok=$false
            for($i=0;$i -lt 70 -and -not $ok;$i++){
              try{
                $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                $html=(Invoke-WebRequest -UseBasicParsing ($base+'index.html?rt80='+$stamp) -TimeoutSec 15).Content
                $suite=(Invoke-WebRequest -UseBasicParsing ($base+'rt79-suite.js?v=79.1&rt80='+$stamp) -TimeoutSec 15).Content
                if($html -match 'const VERSION = 79;' -and $html -match 'const RT_BUILD = "80.5";' -and $suite -match '__RT79_STRATEGY_SUITE__'){$ok=$true}
              }catch{}
              if(-not $ok){Start-Sleep -Seconds 3}
            }
            if(-not $ok){throw 'GitHub Pages ainda não publicou o build RT80.5 do main.'}
            'RT79_TEST_URL=https://kaalflash12.github.io/reinos-tribais-online/' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'RT79_REQUIRE_MOBILE_ONLINE=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Provision temporary production player for mobile login
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $api='https://reino-tribal-api.mestrederpg35.deno.net/api/reino'
          $origin='https://kaalflash12.github.io'
          $world='d5a546fb-316d-4332-ae92-1886d80b07df'
          function Api([hashtable]$Body,[string]$Bearer=''){
            $headers=@{Origin=$origin;Accept='application/json';'Content-Type'='application/json'}
            if($Bearer){$headers.Authorization="Bearer $Bearer"}
            Invoke-RestMethod -Method Post -Uri $api -Headers $headers -Body ($Body|ConvertTo-Json -Depth 12 -Compress) -TimeoutSec 60
          }
          $suffix=[Guid]::NewGuid().ToString('N').Substring(0,16)
          $email="rt80-mobile-$suffix@example.invalid"
          $username="m_$suffix"
          $password='RT80!'+[Guid]::NewGuid().ToString('N')+'x'
          Write-Host "::add-mask::$password"
          $reg=Api @{action='register';email=$email;username=$username;password=$password}
          if(-not $reg.access_token -or [string]$reg.user.role -ne 'player'){throw 'Falha criando jogador temporário mobile.'}
          $joined=Api @{action='join_world';world_id=$world;player_name=$username} ([string]$reg.access_token)
          if(-not $joined.ok -or [string]$joined.world.id -ne $world){throw 'Falha associando jogador mobile ao Mundo 1.'}
          "RT79_MOBILE_IDENTIFIER=$email" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RT79_MOBILE_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'RT80_MOBILE_PRODUCTION_PLAYER_READY'
      - name: Run Edge functional regression
        shell: pwsh
        run: python tools/rt79_edge_public_regression.py
      - name: Enforce mobile E2E proof
        if: always()
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'RT79_BROWSER_REGRESSION'
          $path=Join-Path $dir 'PROVA_BROWSER_RT79.json'
          if(-not (Test-Path $path)){throw 'PROVA_BROWSER_RT79.json ausente.'}
          $proof=Get-Content $path -Raw | ConvertFrom-Json
          if(-not $proof.pass){throw 'Regressão pública não marcou PASS.'}
          if(-not $proof.mobile.pass){throw 'E2E gameplay mobile não marcou PASS.'}
          foreach($name in @('RT80_MOBILE_E2E_BEFORE_RELOAD.png','RT80_MOBILE_E2E_AFTER_RELOAD.png')){if(-not (Test-Path (Join-Path $dir $name))){throw "Screenshot mobile ausente: $name"}}
          if('${{ github.event_name }}' -ne 'pull_request'){
            if(-not $proof.mobile_online.pass -or $proof.mobile_online.skipped){throw 'E2E online Turso mobile não marcou PASS.'}
            if(-not (Test-Path (Join-Path $dir 'RT80_MOBILE_ONLINE_TURSO_E2E.png'))){throw 'Screenshot online Turso mobile ausente.'}
          }
          Write-Host 'RT80_FULL_MOBILE_E2E_PASS'
      - name: Persist public proof to main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'RT79_BROWSER_REGRESSION\PROVA_BROWSER_RT79.json'
          if(Test-Path $src){Copy-Item $src (Join-Path $env:RUNNER_TEMP 'RT80_PUBLIC_PROOF.json') -Force}
          else{[ordered]@{pass=$false;browser='edge';error='browser proof not produced';run_id='${{ github.run_id }}';commit='${{ github.sha }}';generated_at=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:RUNNER_TEMP 'RT80_PUBLIC_PROOF.json') -Encoding UTF8}
          $proofPath=Join-Path $env:RUNNER_TEMP 'RT80_PUBLIC_PROOF.json'
          $proof=Get-Content $proofPath -Raw | ConvertFrom-Json
          $proof | Add-Member -NotePropertyName workflow_run_id -NotePropertyValue '${{ github.run_id }}' -Force
          $proof | Add-Member -NotePropertyName workflow_commit -NotePropertyValue '${{ github.sha }}' -Force
          $proof | ConvertTo-Json -Depth 20 | Set-Content $proofPath -Encoding UTF8
          git fetch origin main
          git checkout -B rt80-proof-main origin/main
          Copy-Item $proofPath 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add AUDITORIA_RT79_1_PUBLIC_BROWSER.json
          if(-not (git diff --cached --quiet)){git commit -m "RT80.5 public browser proof: $($proof.pass)";git push origin HEAD:main}
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT80_EDGE_REGRESSION_PROOF
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn
