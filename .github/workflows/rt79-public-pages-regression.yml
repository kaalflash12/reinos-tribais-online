name: RT80 Public/PR Edge Regression
on:
  push:
    branches: [main]
    paths-ignore:
      - 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Validate local syntax and version contract
        shell: pwsh
        run: |
          node --check rt76-master-plan.js
          node --check rt76-runtime.js
          node --check rt76-map-ai.js
          node --check rt79-suite.js
          node --check rt79-village-ui.js
          node --check rt79-logistics-ai-addon.js
          node --check rt80-visual-system.js
          node --check rt80-admin-runtime.js
          python -m py_compile tools/rt79_chrome_fast_regression.py tools/rt79_edge_public_regression.py tools/rt80_edge_clean_public_regression.py
          $html=Get-Content index.html -Raw
          if($html -notmatch 'const VERSION = 79;' -or $html -notmatch 'const RT_BUILD = "80.5";'){throw 'Contrato RT80.5/schema 79 inválido.'}
          $mobileCss=Get-Content rt80-mobile-cleanup.css -Raw
          if($mobileCss -notmatch 'RT80\.3 mobile navigation cleanup' -or $mobileCss -notmatch 'RT80\.3\.1 also restores the Central Estrategica launcher' -or $mobileCss -notmatch 'body\.rt80-visual-ready \.rt68-game-nav\{' -or $mobileCss -notmatch 'body\.rt80-visual-ready \.rt79-launch\{' -or $mobileCss -notmatch 'display:flex!important'){throw 'Contrato RT80.3.1 de navegação/launcher mobile inválido.'}
      - name: Select regression target
        shell: pwsh
        run: |
          if('${{ github.event_name }}' -eq 'pull_request'){
            $p=Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
            $p.Id | Set-Content "$env:RUNNER_TEMP\rt80_edge_http_pid.txt"
            Start-Sleep -Seconds 2
            Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/index.html | Out-Null
            'RT79_TEST_URL=http://127.0.0.1:8765/' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'PR: testando o merge candidato localmente.'
          } else {
            $base='https://kaalflash12.github.io/reinos-tribais-online/'
            $ok=$false
            for($i=0;$i -lt 100 -and -not $ok;$i++){
              try{
                $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                $html=(Invoke-WebRequest -UseBasicParsing ($base+'index.html?rt80='+$stamp) -TimeoutSec 15).Content
                $suite=(Invoke-WebRequest -UseBasicParsing ($base+'rt79-suite.js?v=79.1&rt80='+$stamp) -TimeoutSec 15).Content
                $mobileCss=(Invoke-WebRequest -UseBasicParsing ($base+'rt80-mobile-cleanup.css?rt80='+$stamp) -TimeoutSec 15).Content
                $ok=($html -match 'const VERSION = 79;' -and $html -match 'const RT_BUILD = "80.5";' -and $suite -match '__RT79_STRATEGY_SUITE__' -and $mobileCss -match 'RT80\.3 mobile navigation cleanup' -and $mobileCss -match 'RT80\.3\.1 also restores the Central Estrategica launcher' -and $mobileCss -match 'body\.rt80-visual-ready \.rt68-game-nav\{' -and $mobileCss -match 'body\.rt80-visual-ready \.rt79-launch\{' -and $mobileCss -match 'display:flex!important')
              }catch{$ok=$false}
              if(-not $ok){Start-Sleep -Seconds 3}
            }
            if(-not $ok){throw 'GitHub Pages ainda não publicou o CSS RT80.3.1 com navegação completa e launcher estratégico móvel.'}
            'RT79_TEST_URL=https://kaalflash12.github.io/reinos-tribais-online/' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Run Edge functional regression
        shell: pwsh
        run: python tools/rt80_edge_clean_public_regression.py
      - name: Persist public proof to main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'RT79_BROWSER_REGRESSION\PROVA_BROWSER_RT79.json'
          if(Test-Path $src){Copy-Item $src (Join-Path $env:RUNNER_TEMP 'RT80_PUBLIC_PROOF.json') -Force}
          else{[ordered]@{pass=$false;browser='edge';error='browser proof not produced';run_id='${{ github.run_id }}';commit='${{ github.sha }}';generated_at=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:RUNNER_TEMP 'RT80_PUBLIC_PROOF.json') -Encoding UTF8}
          $proofPath=Join-Path $env:RUNNER_TEMP 'RT80_PUBLIC_PROOF.json'
          $proof=Get-Content $proofPath -Raw | ConvertFrom-Json
          $proof | Add-Member -NotePropertyName workflow_run_id -NotePropertyValue '${{ github.run_id }}' -Force
          $proof | Add-Member -NotePropertyName workflow_commit -NotePropertyValue '${{ github.sha }}' -Force
          $proof | ConvertTo-Json -Depth 20 | Set-Content $proofPath -Encoding UTF8
          git fetch origin main
          git checkout -B rt80-proof-main origin/main
          Copy-Item $proofPath 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITORIA_RT79_1_PUBLIC_BROWSER.json
          if(-not (git diff --cached --quiet)){git commit -m "RT80.5 public browser proof: $($proof.pass)";git push origin HEAD:main}
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT80_EDGE_REGRESSION_PROOF
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn
