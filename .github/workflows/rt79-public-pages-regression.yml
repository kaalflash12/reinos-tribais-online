name: RT79.1 Public Pages Regression
on:
  push:
    branches: [main]
    paths-ignore:
      - 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-chrome:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Validate local syntax
        shell: pwsh
        run: |
          node --check rt76-map-ai.js
          node --check rt79-suite.js
          node --check rt79-village-ui.js
          node --check rt79-logistics-ai-addon.js
          python -m py_compile tools/rt79_chrome_fast_regression.py
      - name: Wait for GitHub Pages RT79.1
        shell: pwsh
        run: |
          $base='https://kaalflash12.github.io/reinos-tribais-online/'
          $ok=$false
          for($i=0;$i -lt 60 -and -not $ok;$i++){
            try{
              $html=(Invoke-WebRequest -UseBasicParsing ($base+'index.html?rt791='+[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -TimeoutSec 15).Content
              $suite=(Invoke-WebRequest -UseBasicParsing ($base+'rt79-suite.js?v=79.1') -TimeoutSec 15).Content
              $ai=(Invoke-WebRequest -UseBasicParsing ($base+'rt76-map-ai.js?v=79.1') -TimeoutSec 15).Content
              if($html -match 'const VERSION = 79;' -and $html -match 'const RT_BUILD = "79.1";' -and $suite -match '__RT79_STRATEGY_SUITE__' -and $ai -match '__RT79_AI_RESEARCH__'){$ok=$true}
            }catch{}
            if(-not $ok){Start-Sleep -Seconds 3}
          }
          if(-not $ok){throw 'GitHub Pages não publicou RT79.1 completo dentro do gate.'}
          'RT79_TEST_URL=https://kaalflash12.github.io/reinos-tribais-online/' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Chrome functional regression against public Pages
        shell: pwsh
        run: python tools/rt79_chrome_fast_regression.py
      - name: Persist browser proof to main
        if: always()
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'RT79_BROWSER_REGRESSION\PROVA_BROWSER_RT79.json'
          if(Test-Path $src){
            Copy-Item $src (Join-Path $env:RUNNER_TEMP 'RT79_PUBLIC_PROOF.json') -Force
          } else {
            [ordered]@{pass=$false;browser='chrome';error='browser proof not produced; inspect workflow step conclusions';run_id='${{ github.run_id }}';commit='${{ github.sha }}';generated_at=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:RUNNER_TEMP 'RT79_PUBLIC_PROOF.json') -Encoding UTF8
          }
          $proofPath=Join-Path $env:RUNNER_TEMP 'RT79_PUBLIC_PROOF.json'
          $proof=Get-Content $proofPath -Raw | ConvertFrom-Json
          $proof | Add-Member -NotePropertyName workflow_run_id -NotePropertyValue '${{ github.run_id }}' -Force
          $proof | Add-Member -NotePropertyName workflow_commit -NotePropertyValue '${{ github.sha }}' -Force
          $proof | Add-Member -NotePropertyName persisted_at -NotePropertyValue ((Get-Date).ToUniversalTime().ToString('o')) -Force
          $proof | ConvertTo-Json -Depth 20 | Set-Content $proofPath -Encoding UTF8
          git fetch origin main
          git checkout -B rt79-proof-main origin/main
          Copy-Item $proofPath 'AUDITORIA_RT79_1_PUBLIC_BROWSER.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITORIA_RT79_1_PUBLIC_BROWSER.json
          if(-not (git diff --cached --quiet)){git commit -m "RT79.1 public browser proof: $($proof.pass)";git push origin HEAD:main}
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT79_1_PUBLIC_PAGES_PROOF
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn
