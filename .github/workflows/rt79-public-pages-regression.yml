name: RT79.1 Public Pages Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-chrome:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Validate local syntax
        shell: pwsh
        run: |
          node --check rt76-map-ai.js
          node --check rt79-suite.js
          node --check rt79-village-ui.js
          node --check rt79-logistics-ai-addon.js
          python -m py_compile tools/rt79_chrome_fast_regression.py
      - name: Wait for GitHub Pages RT79.1
        shell: pwsh
        run: |
          $base='https://kaalflash12.github.io/reinos-tribais-online/'
          $ok=$false
          for($i=0;$i -lt 60 -and -not $ok;$i++){
            try{
              $html=(Invoke-WebRequest -UseBasicParsing ($base+'index.html?rt791='+[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -TimeoutSec 15).Content
              $suite=(Invoke-WebRequest -UseBasicParsing ($base+'rt79-suite.js?v=79.1') -TimeoutSec 15).Content
              $ai=(Invoke-WebRequest -UseBasicParsing ($base+'rt76-map-ai.js?v=79.1') -TimeoutSec 15).Content
              if($html -match 'const VERSION = 79;' -and $html -match 'const RT_BUILD = "79.1";' -and $suite -match '__RT79_STRATEGY_SUITE__' -and $ai -match '__RT79_AI_RESEARCH__'){$ok=$true}
            }catch{}
            if(-not $ok){Start-Sleep -Seconds 3}
          }
          if(-not $ok){throw 'GitHub Pages não publicou RT79.1 completo dentro do gate.'}
          'RT79_TEST_URL=https://kaalflash12.github.io/reinos-tribais-online/' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Chrome functional regression against public Pages
        shell: pwsh
        run: python tools/rt79_chrome_fast_regression.py
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT79_1_PUBLIC_PAGES_PROOF
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn
