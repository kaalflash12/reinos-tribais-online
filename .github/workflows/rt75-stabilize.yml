name: RT75 Stabilize

on:
  push:
    paths:
      - 'rt75-stabilize-trigger.txt'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python e Chromium
        run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install chromium
      - name: Aplicar RT75 no working tree
        run: python tools/rt75_stabilize.py
      - name: Validar JavaScript completo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/rt75-js');out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          n=0
          for s in scripts:
              if not s.strip():continue
              n+=1;(out/f'{n:03}.js').write_text(s,encoding='utf-8')
          print('scripts',n)
          PY
          for f in /tmp/rt75-js/*.js; do node --check "$f" >/dev/null; done
          cmp -s index.html JOGAR_REINOS_TRIBAIS.html
          echo 'JS + HTML PASS'
      - name: Servir working tree
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/rt75-http.log 2>&1 &
          sleep 2
      - name: Teste E2E desktop e mobile
        shell: bash
        run: |
          cat > /tmp/rt75-e2e.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,math
          OUT=Path('RT75_EVIDENCIAS');OUT.mkdir(exist_ok=True)
          R={'desktop':{},'mobile':{},'errors':[]}
          def start_local(page):
              page.goto('http://127.0.0.1:8765/index.html?rt75e2e=1',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(1000)
              off=page.locator('[data-play-offline]').first
              if off.count():off.click()
              page.wait_for_timeout(650)
              form=page.locator('#start-form')
              if form.count() and form.is_visible():
                  form.locator('[name=playerName]').fill('Auditoria RT75')
                  form.locator('[name=villageName]').fill('Aldeia RT75')
                  form.locator('button[type=submit],button:not([type])').last.click()
                  page.wait_for_timeout(1400)
          def village_metrics(page):
              return page.evaluate('''() => {
                const scene=document.querySelector('.village-scene');
                const sr=scene?.getBoundingClientRect();
                const arts=Array.from(document.querySelectorAll('.rt75-building-art'));
                const hits=Array.from(document.querySelectorAll('.village-scene .rt60-village-hitbox'));
                const rows=arts.map(el=>{
                  const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
                  const a=(el.dataset.alphaBbox||'').split(',').map(Number),t=(el.dataset.targetBbox||'').split(',').map(Number);
                  let alphaRect=null,targetRect=null,diff=null;
                  if(sr&&a.length===4&&t.length===4){
                    alphaRect=[r.x+(a[0]/480)*r.width,r.y+(a[1]/400)*r.height,r.x+(a[2]/480)*r.width,r.y+(a[3]/400)*r.height];
                    targetRect=[sr.x+(t[0]/1671)*sr.width,sr.y+(t[1]/941)*sr.height,sr.x+(t[2]/1671)*sr.width,sr.y+(t[3]/941)*sr.height];
                    diff=Math.max(...alphaRect.map((v,i)=>Math.abs(v-targetRect[i])));
                  }
                  return {key:el.dataset.villageBuilding,tier:el.dataset.villageTier,display:cs.display,visibility:cs.visibility,opacity:cs.opacity,rect:[r.x,r.y,r.width,r.height],natural:[el.naturalWidth,el.naturalHeight],complete:el.complete,alphaRect,targetRect,diff};
                });
                return {scene:sr?[sr.x,sr.y,sr.width,sr.height]:null,arts:rows,hits:hits.length,localKeys:Object.keys(localStorage).filter(k=>k.includes('reinos_tribais')),title:document.title};
              }''')
          def run_case(pw,name,viewport):
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page(viewport=viewport)
              errs=[]
              page.on('pageerror',lambda e:errs.append('pageerror: '+str(e)))
              page.on('console',lambda m:errs.append('console.error: '+m.text) if m.type=='error' else None)
              start_local(page)
              m=village_metrics(page);R[name]=m
              page.screenshot(path=str(OUT/f'{name}-overview.png'),full_page=True)
              if page.locator('.village-scene').count():page.locator('.village-scene').first.screenshot(path=str(OUT/f'{name}-village.png'))
              # Rotas de conteúdo solicitadas: não podem quebrar no modo local.
              for view in ['events','ranked']:
                  btn=page.locator(f'[data-view="{view}"]').first
                  if btn.count():
                      btn.click();page.wait_for_timeout(450)
                      page.screenshot(path=str(OUT/f'{name}-{view}.png'),full_page=True)
              # Save local deve sobreviver a reload.
              page.reload(wait_until='domcontentloaded');page.wait_for_timeout(650)
              off=page.locator('[data-play-offline]').first
              if off.count():off.click();page.wait_for_timeout(750)
              R[name]['afterReload']=page.evaluate('''() => ({hasGame:!!document.querySelector('.game-shell'),startForm:!!document.querySelector('#start-form'),keys:Object.keys(localStorage).filter(k=>k.includes('reinos_tribais'))})''')
              R['errors'] += [name+': '+x for x in errs]
              browser.close()
          with sync_playwright() as pw:
              run_case(pw,'desktop',{'width':1920,'height':1080})
              run_case(pw,'mobile',{'width':390,'height':844})
          (OUT/'e2e.json').write_text(json.dumps(R,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(R,indent=2,ensure_ascii=False))
          if R['errors']:raise SystemExit('Erros do navegador: '+json.dumps(R['errors'],ensure_ascii=False))
          for name in ['desktop','mobile']:
              x=R[name];arts=x['arts']
              if len(arts)!=11:raise SystemExit(f'{name}: esperado 11 prédios construídos visíveis, DOM={len(arts)}')
              if x['hits']!=19:raise SystemExit(f'{name}: hitboxes {x["hits"]}/19')
              for a in arts:
                  if a['display']=='none' or a['visibility']=='hidden' or float(a['opacity'] or 0)<=0:raise SystemExit(f'{name}: prédio oculto {a}')
                  if a['rect'][2]<=2 or a['rect'][3]<=2:raise SystemExit(f'{name}: prédio sem tamanho {a}')
                  if a['natural']!=[480,400] or not a['complete']:raise SystemExit(f'{name}: asset inválido {a}')
                  if a['diff'] is None or a['diff']>2.6:raise SystemExit(f'{name}: arte não encaixa no BBOX {a}')
                  if a['rect'][2]>x['scene'][2]*.35 or a['rect'][3]>x['scene'][3]*.55:raise SystemExit(f'{name}: prédio gigante {a}')
              if not x['localKeys']:raise SystemExit(f'{name}: save local não criado')
              if not x['afterReload']['hasGame'] or x['afterReload']['startForm']:raise SystemExit(f'{name}: save local não restaurou')
          PY
          python /tmp/rt75-e2e.py
      - name: Auditoria backend estática de requisitos RT74 preservados
        run: |
          grep -q 'rt74RankedPrizePanel' index.html
          grep -q 'rt74EventsExecutionPanel' index.html
          grep -q 'Monstros e drops exclusivos' index.html
          grep -q 'RT74_LOCAL_AUTOSAVE' index.html
          grep -q 'RT75_STABLE' index.html
          grep -q 'rt75-building-art' index.html
          ! grep -q 'Reinos Tribais — RT73 • aldeia ativa' index.html
      - uses: actions/upload-artifact@v4
        with:
          name: RT75_EVIDENCIAS
          path: |
            RT75_EVIDENCIAS
            AUDITORIA_RT75.json
          if-no-files-found: error
      - name: Commit somente depois dos testes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Reinos Tribais RT75'
          git config user.email 'rt75@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html AUDITORIA_RT75.json
          git commit -m 'RT75 estabiliza aldeia, save local e conteúdo operacional'
          git push origin HEAD:main
