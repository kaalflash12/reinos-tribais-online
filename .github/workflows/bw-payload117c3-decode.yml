name: BW Payload117c3 Decode
on:
  push:
    branches: [bw-v19-deploy-payload-20260901]
    paths: ['.github/workflows/bw-payload117c3-decode.yml']
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and decode payload root
        env:
          BASE: https://bw117c3-payload-ea47pzpx0-kaalflash12s-projects.vercel.app
          SHARE: https://bw117c3-payload-ea47pzpx0-kaalflash12s-projects.vercel.app/?_vercel_share=6CvbSDmonDTk1Vmtbs6cYFwdFvhafKqH
        run: |
          set -euo pipefail
          curl -fsSL -c /tmp/cj -b /tmp/cj "$SHARE" -o /tmp/auth
          curl -fsSL -L -c /tmp/cj -b /tmp/cj "$BASE/" -o /tmp/root.b64
          tr -d '\r\n' </tmp/root.b64 >/tmp/root.one
          echo "ROOT_B64_BYTES=$(wc -c </tmp/root.one)"
          python - <<'PY'
          import base64, pathlib
          s=pathlib.Path('/tmp/root.one').read_text().strip()
          print('PREFIX',repr(s[:80]))
          print('SUFFIX',repr(s[-80:]))
          try:
              b=base64.b64decode(s, validate=True)
          except Exception as e:
              print('BASE64_ERROR',repr(e))
              raise
          pathlib.Path('/tmp/root.gz').write_bytes(b)
          PY
          echo "ROOT_GZIP_BYTES=$(wc -c </tmp/root.gz)"
          sha256sum /tmp/root.gz
          file /tmp/root.gz
          gzip -l /tmp/root.gz || true
          gzip -dc /tmp/root.gz >/tmp/root.dec
          echo "ROOT_DECODED_BYTES=$(wc -c </tmp/root.dec)"
          sha256sum /tmp/root.dec
          file /tmp/root.dec
          echo '--- FIRST 3000 DECODED BYTES ---'
          head -c 3000 /tmp/root.dec || true
          echo
          echo '--- STRUCTURE ---'
          python - <<'PY'
          import json, pathlib, re
          b=pathlib.Path('/tmp/root.dec').read_bytes()
          try:
              x=json.loads(b)
              print('JSON_TYPE', type(x).__name__)
              if isinstance(x, dict):
                  print('TOP_KEYS', sorted(x.keys()))
                  for k,v in x.items():
                      if isinstance(v,(str,int,float,bool)) or v is None:
                          print('KEY',k,'=',repr(v)[:1000])
                      elif isinstance(v,(list,dict)):
                          print('KEY',k,'TYPE',type(v).__name__,'LEN',len(v))
              elif isinstance(x,list):
                  print('LIST_LEN',len(x))
          except Exception as e:
              print('NOT_JSON',repr(e))
              print('ASCII_STRINGS')
              for s in re.findall(rb'[ -~]{8,}', b)[:150]:
                  print(s[:1000].decode('ascii','replace'))
          PY
