name: RT82 Authority Readiness

on:
  pull_request:
  push:
    branches:
      - rt80-admin-overhaul

permissions:
  contents: read

jobs:
  authority-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check RT82 preview and promotion readiness
        run: python tools/rt82_authority_regression.py
      - name: Upload authority proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt82-authority-proof
          path: RT82_AUTHORITY_REGRESSION.json
          if-no-files-found: error
