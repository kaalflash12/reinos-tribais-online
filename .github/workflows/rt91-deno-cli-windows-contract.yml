name: RT91 Deno CLI Windows Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rt91-deno-cli-windows-contract.yml'
      - 'REINO_TRIBAL_ADMIN_FINAL_RT91.ps1'

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Setup Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Prove Deno 2.9.5 command surface
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          deno --version
          $checks=@(
            @('deploy','whoami','--help'),
            @('deploy','orgs','list','--help'),
            @('deploy','apps','get','--help'),
            @('deploy','apps','list','--help'),
            @('deploy','env','list','--help'),
            @('deploy','env','update-value','--help')
          )
          foreach($argv in $checks){
            $old=$ErrorActionPreference
            try{$ErrorActionPreference='Continue';& deno @argv *> $null;$code=$LASTEXITCODE}finally{$ErrorActionPreference=$old}
            if($code -ne 0){throw ('CLI contract unavailable: deno '+($argv -join ' '))}
          }
          Write-Host 'DENO_2_9_5_COMMAND_SURFACE_PASS'

      - name: Download and parse exact final executor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'rt91-final'
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          $url="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/REINO_TRIBAL_ADMIN_FINAL_RT91.ps1"
          $dst=Join-Path $root 'REINO_TRIBAL_ADMIN_FINAL_RT91.ps1'
          Invoke-WebRequest $url -OutFile $dst
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile($dst,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'final executor parser failed'}
          $text=[IO.File]::ReadAllText($dst)
          foreach($needle in @('SAFE-CLI-AUTH-FINAL-SELF-CONTAINED','ADMIN_AUTHORITY_NO_SOURCE_DEPLOY_RT91','DENO_CANONICAL_APP_DOMAIN_MATCH_CONTRACT','WINDOWS_POWERSHELL_START_PROCESS_STDERR_CONTRACT','RT91_EXACT_EXECUTOR_DISCOVERY_TEST_PASS')){
            if(-not $text.Contains($needle)){throw ('missing executor contract: '+$needle)}
          }
          Write-Host 'RT91_FINAL_EXECUTOR_PARSER_AND_CONTRACT_PASS'

      - name: Build fake Deno for positive and negative scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=@'
          using System;
          using System.IO;
          using System.Linq;
          public static class Program {
            static bool Has(string[] a,string v)=>a.Any(x=>string.Equals(x,v,StringComparison.OrdinalIgnoreCase));
            static string After(string[] a,string v){for(int i=0;i<a.Length-1;i++)if(string.Equals(a[i],v,StringComparison.OrdinalIgnoreCase))return a[i+1];return "";}
            static void Log(string[] args){var p=Environment.GetEnvironmentVariable("RT91_FAKE_LOG");if(!String.IsNullOrEmpty(p))File.AppendAllText(p,String.Join(" ",args)+Environment.NewLine);}
            public static int Main(string[] args){
              Log(args);
              Console.Error.WriteLine("Download https://jsr.io/@deno/deploy/meta.json");
              if(args.Length==1&&args[0]=="--version"){Console.WriteLine("deno 2.9.5");return 0;}
              var json=Has(args,"--json");
              var negative=String.Equals(Environment.GetEnvironmentVariable("RT91_FAKE_NEGATIVE"),"1",StringComparison.Ordinal);
              if(Has(args,"whoami")){if(json)Console.WriteLine("{\"user\":{\"name\":\"Carlos Nobre\"},\"organizations\":[{\"slug\":\"synthetic-org\"}]}");else Console.WriteLine("Carlos Nobre");return 0;}
              if(Has(args,"orgs")&&Has(args,"list")){if(json)Console.WriteLine("{\"organizations\":[{\"slug\":\"synthetic-org\"}]}");else Console.WriteLine("synthetic-org");return 0;}
              if(Has(args,"apps")&&Has(args,"get")){
                var org=After(args,"--org");
                if(negative){Console.Error.WriteLine("app not found");return 4;}
                if(org=="mestrederpg35"){Console.Error.WriteLine("The requested organization was not found");return 4;}
                if(org=="synthetic-org"){if(json)Console.WriteLine("{\"slug\":\"reino-tribal-api\",\"productionUrl\":\"https://reino-tribal-api.mestrederpg35.deno.net\"}");else Console.WriteLine("reino-tribal-api");return 0;}
                Console.Error.WriteLine("unknown org");return 4;
              }
              if(Has(args,"apps")&&Has(args,"list")){
                if(negative){if(json)Console.WriteLine("[]");return 0;}
                if(json)Console.WriteLine("[{\"slug\":\"reino-tribal-api\",\"productionUrl\":\"https://reino-tribal-api.mestrederpg35.deno.net\"}]");else Console.WriteLine("reino-tribal-api");return 0;
              }
              if(Has(args,"env")&&Has(args,"list")){if(json)Console.WriteLine("{\"variables\":[]}");else Console.WriteLine("RT_ADMIN_PASSWORD [secret]");return 0;}
              if(Has(args,"env")&&Has(args,"update-value")){Console.WriteLine("updated");return 0;}
              Console.Error.WriteLine("unsupported synthetic command: "+string.Join(" ",args));return 9;
            }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly "$env:RUNNER_TEMP\fake-deno.exe" -OutputType ConsoleApplication
          if(!(Test-Path "$env:RUNNER_TEMP\fake-deno.exe")){throw 'fake-deno.exe missing'}
          Write-Host 'FAKE_DENO_BUILD_PASS'

      - name: Execute exact final executor positive discovery selftest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script="$env:RUNNER_TEMP\rt91-final\REINO_TRIBAL_ADMIN_FINAL_RT91.ps1"
          $fake="$env:RUNNER_TEMP\fake-deno.exe"
          $log="$env:RUNNER_TEMP\positive-deno.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $env:RT91_FAKE_DENO_SELFTEST='1';$env:RT91_FAKE_LOG=$log
          Remove-Item Env:RT91_FAKE_NEGATIVE -ErrorAction SilentlyContinue
          try{$out=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -DenoExeOverride $fake -DiscoveryTestOnly 2>&1 | Out-String;$code=$LASTEXITCODE}finally{Remove-Item Env:RT91_FAKE_DENO_SELFTEST,Env:RT91_FAKE_LOG -ErrorAction SilentlyContinue}
          Write-Host $out
          if($code -ne 0){throw ('exact executor positive selftest exit='+$code)}
          foreach($needle in @('DENO_ORG_AUTO_DISCOVERY_CONTRACT: synthetic-org','DENO_CANONICAL_APP_DOMAIN_MATCH_CONTRACT','WINDOWS_POWERSHELL_START_PROCESS_STDERR_CONTRACT','DENO_UPDATE_VALUE_STDERR_SELFTEST_PASS','RT91_EXACT_EXECUTOR_DISCOVERY_TEST_PASS')){
            if(-not $out.Contains($needle)){throw ('positive marker missing: '+$needle)}
          }
          $calls=Get-Content $log -Raw
          if($calls -notmatch 'env update-value RT_SELFTEST_ONLY sentinel'){throw 'positive selftest did not exercise update-value'}
          Write-Host 'RT91_EXACT_EXECUTOR_WINDOWS_POSITIVE_PASS'

      - name: Execute exact final executor negative no-mutation selftest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script="$env:RUNNER_TEMP\rt91-final\REINO_TRIBAL_ADMIN_FINAL_RT91.ps1"
          $fake="$env:RUNNER_TEMP\fake-deno.exe"
          $log="$env:RUNNER_TEMP\negative-deno.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $env:RT91_FAKE_DENO_SELFTEST='1';$env:RT91_FAKE_NEGATIVE='1';$env:RT91_FAKE_LOG=$log
          try{
            $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
            $out=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -DenoExeOverride $fake -DiscoveryTestOnly 2>&1 | Out-String
            $code=$LASTEXITCODE;$ErrorActionPreference=$old
          }finally{Remove-Item Env:RT91_FAKE_DENO_SELFTEST,Env:RT91_FAKE_NEGATIVE,Env:RT91_FAKE_LOG -ErrorAction SilentlyContinue}
          Write-Host $out
          if($code -eq 0){throw 'negative discovery unexpectedly succeeded'}
          if($out -notmatch 'Nenhum secret foi alterado'){throw 'negative safety message missing'}
          $calls=if(Test-Path $log){Get-Content $log -Raw}else{''}
          if($calls -match 'env update-value'){throw 'negative discovery attempted mutation'}
          Write-Host 'RT91_EXACT_EXECUTOR_WINDOWS_NEGATIVE_NO_MUTATION_PASS'
