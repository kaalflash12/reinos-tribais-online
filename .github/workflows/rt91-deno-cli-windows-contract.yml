name: RT91 Deno CLI Windows Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rt91-deno-cli-windows-contract.yml'
      - 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH8.ps1'
      - 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH9.ps1'
      - 'rt91_process_helpers.ps1'

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Setup Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Prove base Deno 2.9.5 command surface and map exact flags
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          deno --version
          $required=@(
            @('deploy','--help'),
            @('deploy','env','list','--help'),
            @('deploy','env','update-value','--help'),
            @('deploy','switch','--help'),
            @('deploy','orgs','list','--help'),
            @('deploy','whoami','--help'),
            @('deploy','apps','get','--help'),
            @('deploy','apps','list','--help')
          )
          foreach($a in $required){
            $old=$ErrorActionPreference
            try{$ErrorActionPreference='Continue';& deno @a *> $null;$code=$LASTEXITCODE}finally{$ErrorActionPreference=$old}
            Write-Host ('REQUIRED_EXIT '+$code+': deno '+($a -join ' '))
            if($code -ne 0){throw ('Base CLI contract unavailable: deno '+($a -join ' '))}
          }
          $probes=@(
            @('deploy','orgs','list','--json','--help'),
            @('deploy','orgs','--json','list','--help'),
            @('deploy','--json','orgs','list','--help'),
            @('deploy','whoami','--json','--help'),
            @('deploy','--json','whoami','--help'),
            @('deploy','apps','get','--json','--help'),
            @('deploy','apps','--json','get','--help'),
            @('deploy','--json','apps','get','--help'),
            @('deploy','apps','get','--non-interactive','--help'),
            @('deploy','apps','list','--non-interactive','--help'),
            @('deploy','env','list','--json','--help'),
            @('deploy','--json','env','list','--help'),
            @('deploy','env','list','--non-interactive','--help'),
            @('deploy','env','update-value','--json','--help'),
            @('deploy','--json','env','update-value','--help'),
            @('deploy','env','update-value','--non-interactive','--help')
          )
          foreach($a in $probes){
            $old=$ErrorActionPreference
            try{$ErrorActionPreference='Continue';& deno @a *> $null;$code=$LASTEXITCODE}finally{$ErrorActionPreference=$old}
            Write-Host ('PROBE_EXIT '+$code+': deno '+($a -join ' '))
          }
          Write-Host 'DENO_2_9_5_FLAG_MAP_COMPLETE'

      - name: Download exact AUTH9 and helper from tested commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'rt91-auth9'
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
          Invoke-WebRequest "$base/REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH9.ps1" -OutFile (Join-Path $root 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH9.ps1')
          Invoke-WebRequest "$base/rt91_process_helpers.ps1" -OutFile (Join-Path $root 'rt91_process_helpers.ps1')
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $root 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH9.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'AUTH9 parser failed'}
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $root 'rt91_process_helpers.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'helper parser failed'}
          Write-Host 'AUTH9_AND_HELPER_PARSER_PASS'

      - name: Build fake Deno with real stderr and org fallback behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=@'
          using System;
          using System.Linq;
          public static class Program {
            static bool Has(string[] a,string v)=>a.Any(x=>string.Equals(x,v,StringComparison.OrdinalIgnoreCase));
            static string After(string[] a,string v){for(int i=0;i<a.Length-1;i++)if(string.Equals(a[i],v,StringComparison.OrdinalIgnoreCase))return a[i+1];return "";}
            public static int Main(string[] args){
              Console.Error.WriteLine("Download https://jsr.io/@deno/deploy/meta.json");
              if(args.Length==1&&args[0]=="--version"){Console.WriteLine("deno 2.9.5");return 0;}
              var json=Has(args,"--json");
              if(Has(args,"whoami")){if(json)Console.WriteLine("{\"user\":{\"name\":\"Carlos Nobre\"},\"organizations\":[{\"slug\":\"synthetic-org\"}]}");else Console.WriteLine("Carlos Nobre");return 0;}
              if(Has(args,"orgs")&&Has(args,"list")){if(json)Console.WriteLine("{\"organizations\":[{\"slug\":\"synthetic-org\"}]}");else Console.WriteLine("synthetic-org");return 0;}
              if(Has(args,"apps")&&Has(args,"get")){
                var org=After(args,"--org");
                if(org=="mestrederpg35"){Console.Error.WriteLine("The requested organization was not found");return 4;}
                if(org=="synthetic-org"){if(json)Console.WriteLine("{\"slug\":\"reino-tribal-api\",\"productionUrl\":\"https://reino-tribal-api.mestrederpg35.deno.net\"}");else Console.WriteLine("reino-tribal-api");return 0;}
                Console.Error.WriteLine("unknown org");return 4;
              }
              if(Has(args,"env")&&Has(args,"list")){if(json)Console.WriteLine("{\"variables\":[]}");else Console.WriteLine("RT_ADMIN_PASSWORD [secret]");return 0;}
              if(Has(args,"env")&&Has(args,"update-value")){if(json)Console.WriteLine("{\"ok\":true}");else Console.WriteLine("updated");return 0;}
              Console.Error.WriteLine("unsupported synthetic command: "+string.Join(" ",args));return 9;
            }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly "$env:RUNNER_TEMP\fake-deno.exe" -OutputType ConsoleApplication
          if(!(Test-Path "$env:RUNNER_TEMP\fake-deno.exe")){throw 'fake-deno.exe missing'}

      - name: Prove exact helper stderr isolation in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          . "$env:RUNNER_TEMP\rt91-auth9\rt91_process_helpers.ps1"
          $fake="$env:RUNNER_TEMP\fake-deno.exe"
          $ok=Invoke-RTDenoJson -DenoExe $fake -CommandArgs @('deploy','env','list')
          if(-not $ok.Ok){throw ('JSON helper failed: '+$ok.Text)}
          if($ok.Stdout -notmatch '^\{"variables"'){throw ('stdout polluted: '+$ok.Stdout)}
          if($ok.Stderr -notmatch '^Download https://jsr.io/'){throw ('stderr missing: '+$ok.Stderr)}
          $bad=Invoke-RTDenoJson -DenoExe $fake -CommandArgs @('deploy','apps','get','--org','mestrederpg35','--app','reino-tribal-api','--non-interactive')
          if($bad.Ok -or $bad.Code -ne 4){throw ('failure exit code lost: '+$bad.Code)}
          if($bad.Stderr -notmatch 'requested organization was not found'){throw ('failure stderr missing: '+$bad.Stderr)}
          Write-Host 'WINDOWS_POWERSHELL_51_EXACT_HELPER_PASS'

      - name: Execute exact AUTH9 discovery selftest with fake Deno
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:RT91_FAKE_DENO_SELFTEST='1'
          try{
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\rt91-auth9\REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH9.ps1" -DenoExeOverride "$env:RUNNER_TEMP\fake-deno.exe" -DiscoveryTestOnly
            $code=$LASTEXITCODE
          }finally{Remove-Item Env:RT91_FAKE_DENO_SELFTEST -ErrorAction SilentlyContinue}
          if($code -ne 0){throw ('AUTH9 discovery selftest exit='+$code)}
          Write-Host 'RT91_AUTH9_WINDOWS_FULL_DISCOVERY_SELFTEST_PASS'
