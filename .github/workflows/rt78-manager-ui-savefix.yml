name: RT78 Manager UI Save Fix
on:
  push:
    paths:
      - 'rt78-manager-ui-savefix-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Manager 2.0 UI and RT78 save compatibility
        shell: python
        run: |
          from pathlib import Path
          import re
          js=Path('rt76-master-plan.js')
          s=js.read_text(encoding='utf-8')
          marker='function manager(){'
          manager=r'''function manager(){const m=state.data?.settings?.manager||{},goals=m.villageGoals||{},research=m.researchPriority||[],bkeys=[['main','Edifício Principal'],['barracks','Quartel'],['stable','Estábulo'],['garage','Oficina'],['smith','Ferreiro'],['market','Mercado'],['timber','Madeira'],['clay','Argila'],['iron','Ferro'],['farm','Fazenda'],['warehouse','Armazém'],['wall','Muralha'],['academy','Academia'],['watchtower','Torre de Vigia']],ukeys=[['spear','Lanceiro'],['sword','Espadachim'],['axe','Machadeiro'],['archer','Arqueiro'],['spy','Explorador'],['light','Cavalaria leve'],['marcher','Arqueiro montado'],['heavy','Cavalaria pesada'],['ram','Aríete'],['catapult','Catapulta'],['paladin','Paladino'],['noble','Nobre']],rkeys=[['sawmill','Serraria'],['masonry','Alvenaria'],['smelting','Fundição'],['agriculture','Agricultura'],['warfare','Guerra'],['shieldwall','Muralha de Escudos'],['horsemanship','Equitação'],['trade','Comércio'],['engineering','Engenharia']];const rows=(state.data?.villages||[]).map(v=>{const g=goals[v.id]||{},bs=Object.entries(g.buildings||{}).map(([k,n])=>`${esc(k)} ${n}`).join(', ')||'—',us=Object.entries(g.units||{}).map(([k,n])=>`${esc(k)} ${n}`).join(', ')||'—';return `<tr><td><b>${esc(v.name)}</b><br><small>${v.x}|${v.y}</small></td><td>${bs}</td><td>${us}</td><td>🏗 ${(v.build_queue||[]).length} • ⚔ ${(v.recruit_queue||[]).length}</td></tr>`}).join('');return `<div class="rt78-grid2"><section class="rt78-card"><h3>Gerente de Conta 2.0 — servidor</h3><form id="rt78-manager-form" class="rt78-form"><label class="rt78-check"><input type="checkbox" name="enabled" ${m.enabled?'checked':''}> Ativar gerente automático</label><label>Aldeia<select name="village">${villageOptions()}</select></label><label>Meta de edifício<select name="building"><option value="">Não alterar</option>${bkeys.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><label>Nível alvo<input type="number" name="buildingTarget" min="0" max="30" value="0"></label><label>Meta de tropa<select name="unit"><option value="">Não alterar</option>${ukeys.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><label>Quantidade alvo<input type="number" name="unitTarget" min="0" value="0"></label><label>Prioridade de pesquisa<select name="research"><option value="">Não alterar</option>${rkeys.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><button class="rt78-btn primary">Salvar meta e executar</button></form><p class="rt78-muted">O servidor só enfileira ações válidas e respeita recursos, requisitos, população, pesquisa de unidade e limites.</p></section><section class="rt78-card"><h3>Prioridades de pesquisa</h3>${research.length?research.map((x,i)=>`<div class="rt78-vrow"><b>${i+1}. ${esc(x)}</b><span></span><span>persistente</span><span></span></div>`).join(''):'<p class="rt78-muted">Nenhuma prioridade definida.</p>'}</section></div><section class="rt78-card"><h3>Metas por aldeia</h3><div class="rt78-table-wrap"><table><thead><tr><th>Aldeia</th><th>Edifícios</th><th>Tropas</th><th>Filas</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Sem aldeias.</td></tr>'}</tbody></table></div></section>`}'''
          if marker not in s:
              s=s.replace('function intel(){',manager+'\n  function intel(){')
          s=s.replace("return({overview,war,farm,market,empire,intel,logs}[state.tab]||overview)()","return({overview,war,farm,market,empire,manager,intel,logs}[state.tab]||overview)()")
          s=s.replace("['empire','Império'],['intel','Inteligência']","['empire','Império'],['manager','Gerente 2.0'],['intel','Inteligência']")
          if "f.id==='rt78-manager-form'" not in s:
              branch="""if(f.id==='rt78-manager-form'){const cfg={...(state.data?.settings||{})},old=cfg.manager||{},v=String(fd.get('village')||''),vg={...(old.villageGoals||{})},g={...(vg[v]||{})},bs={...(g.buildings||{})},us={...(g.units||{})},rp=[...(old.researchPriority||[])],bk=String(fd.get('building')||''),uk=String(fd.get('unit')||''),rk=String(fd.get('research')||'');if(bk){const n=num(fd.get('buildingTarget'));if(n>0)bs[bk]=n;else delete bs[bk]}if(uk){const n=num(fd.get('unitTarget'));if(n>0)us[uk]=n;else delete us[uk]}if(rk&&!rp.includes(rk))rp.push(rk);g.buildings=bs;g.units=us;vg[v]=g;cfg.manager={...old,enabled:Boolean(fd.get('enabled')),villageGoals:vg,researchPriority:rp};act(async()=>{await rpc('rt78_strategy_save',{p_world_id:cloud().worldId,p_config:cfg});return rpc('rt78_world_maintenance',{p_world_id:cloud().worldId})});return}"""
              s=s.replace("if(f.id==='rt78-route-form')",branch+"if(f.id==='rt78-route-form')")
          if 'Gerente de Conta 2.0 — servidor' not in s: raise SystemExit('manager UI ausente')
          js.write_text(s,encoding='utf-8')
          for hp in ['index.html','JOGAR_REINOS_TRIBAIS.html']:
              p=Path(hp)
              if not p.exists(): continue
              h=p.read_text(encoding='utf-8')
              h=h.replace('75,76,77].includes','75,76,77,78].includes')
              h=h.replace('75,76,77,78,78].includes','75,76,77,78].includes')
              p.write_text(h,encoding='utf-8')
      - run: node --check rt76-master-plan.js
      - name: Validate markers
        run: |
          grep -q 'Gerente de Conta 2.0 — servidor' rt76-master-plan.js
          grep -q "rt78-manager-form" rt76-master-plan.js
          grep -q '75,76,77,78].includes' index.html
      - name: Commit
        run: |
          git config user.name 'RT78 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add rt76-master-plan.js index.html JOGAR_REINOS_TRIBAIS.html
          git diff --cached --quiet || git commit -m 'RT78: server account manager UI and save v78 compatibility'
          git push
