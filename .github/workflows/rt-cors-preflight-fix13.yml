name: RT CORS Preflight FIX13

on:
  push:
    branches: [main]
    paths:
      - 'deno/main.js'
      - 'api/reino.js'
      - 'api/admin.js'
      - '.github/workflows/rt-cors-preflight-fix13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Deno check
        run: deno check deno/main.js
      - name: Local OPTIONS preflight
        shell: bash
        run: |
          set -euo pipefail
          deno run --allow-net --allow-env deno/main.js >server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://kaalflash12.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            http://127.0.0.1:8000/api/reino)"
          test "$code" = 204
          tr -d '\r' < "$headers" | grep -i '^access-control-allow-origin: https://kaalflash12.github.io$'
          tr -d '\r' < "$headers" | grep -i '^access-control-allow-methods: POST, OPTIONS$'
          tr -d '\r' < "$headers" | grep -i '^access-control-allow-headers: authorization, content-type, x-admin-token$'
          echo LOCAL_CORS_PREFLIGHT_FIX13_PASS
