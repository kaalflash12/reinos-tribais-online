name: RT78 Final Online Glue
on:
  push:
    paths:
      - 'rt78-final-online-glue-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load standalone manager and accept RT78 saves
        shell: python
        run: |
          from pathlib import Path
          a=Path('rt78-admin-suite.js')
          s=a.read_text(encoding='utf-8')
          if '__RT78_MANAGER_LOADER__' not in s:
              s += "\n;(()=>{if(window.__RT78_MANAGER_LOADER__)return;window.__RT78_MANAGER_LOADER__=true;const x=document.createElement('script');x.src='rt78-manager-suite.js?v=78.0';x.defer=true;document.head.appendChild(x)})();\n"
          a.write_text(s,encoding='utf-8')
          for name in ['index.html','JOGAR_REINOS_TRIBAIS.html']:
              p=Path(name)
              h=p.read_text(encoding='utf-8')
              h=h.replace('75,76,77].includes','75,76,77,78].includes')
              h=h.replace('75,76,77,78,78].includes','75,76,77,78].includes')
              p.write_text(h,encoding='utf-8')
      - run: |
          node --check rt78-admin-suite.js
          node --check rt78-manager-suite.js
          grep -q 'rt78-manager-suite.js?v=78.0' rt78-admin-suite.js
          grep -q '75,76,77,78].includes' index.html
      - name: Commit
        run: |
          git config user.name 'RT78 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add rt78-admin-suite.js index.html JOGAR_REINOS_TRIBAIS.html
          git diff --cached --quiet || git commit -m 'RT78: load Gerente 2.0 online and accept v78 saves'
          git push
