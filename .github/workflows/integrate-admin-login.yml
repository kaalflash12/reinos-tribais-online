name: Integrate admin normal login

on:
  push:
    paths:
      - '.github/rt58-integrated-admin.patch'
      - '.github/workflows/integrate-admin-login.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integrated admin login
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'rt58-integrated-admin' index.html; then
            echo 'Admin login already integrated.'
          else
            sed -i '248i +' .github/rt58-integrated-admin.patch
            git apply --check .github/rt58-integrated-admin.patch
            git apply .github/rt58-integrated-admin.patch
          fi
          cp index.html JOGAR_REINOS_TRIBAIS.html
      - name: Validate routing and security
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'E-mail ou usuário' index.html
          grep -q "username:'reinos_admin'" index.html
          grep -q "signInUnified(identifier, password)" index.html
          grep -q 'REINOS TRIBAIS • ADMIN RT58' index.html
          grep -q "edgePath:'/functions/v1/rt-admin-v58'" index.html
          ! grep -q 'data-entry-admin' index.html
          ! grep -q 'kaalflash@hotmail.com' index.html
          cmp -s index.html JOGAR_REINOS_TRIBAIS.html
      - name: Commit integrated client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Reinos Tribais Deploy'
          git config user.email 'deploy@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Conta admin entra pelo login normal e abre painel'
            git push origin main
          fi
