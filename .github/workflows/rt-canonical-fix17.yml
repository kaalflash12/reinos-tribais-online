name: RT Canonical FIX17

on:
  push:
    branches: [main]
    paths:
      - 'RT_CANONICAL_FIX17.ps1'
      - '.github/workflows/rt-canonical-fix17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-canonical-fix17:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Apply FIX17 transform
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_CANONICAL_FIX17.ps1
          if($LASTEXITCODE -ne 0){throw "FIX17 transform falhou: $LASTEXITCODE"}

      - name: Parse and compare all canonical executors
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@('REINO_TRIBAL_FINAL_UNICO.ps1','EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1','IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1')
          $hashes=@()
          foreach($f in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List;throw "$f nao passou no parser"}
            $t=[IO.File]::ReadAllText((Resolve-Path $f))
            foreach($needle in @("[string]`$Branch = 'main'",'Deno HTTPS tentativa','$corsUrl = $corsUri.AbsoluteUri',"action='admin_recover'",'recovery_key=$recoveryKey','--do-not-use-detected-build-config')){if(-not $t.Contains($needle)){throw "$f sem contrato: $needle"}}
            foreach($bad in @('HttpWebRequest','GetResponse()')){if($t.Contains($bad)){throw "$f ainda contem $bad"}}
            $hashes+=(Get-FileHash $f -Algorithm SHA256).Hash
          }
          if(@($hashes|Select-Object -Unique).Count -ne 1){throw 'Tres executores canonicos nao sao identicos'}
          Write-Host 'FIX17_CANONICAL_PARSE_EQUAL_PASS'

      - name: Execute public CORS preflight exactly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $headers=Join-Path $env:TEMP 'rt-fix17-cors.txt'
          Remove-Item $headers -Force -ErrorAction SilentlyContinue
          & curl.exe --silent --show-error --http1.1 --tlsv1.2 --connect-timeout 20 --max-time 30 --output NUL --dump-header $headers --request OPTIONS -H 'Origin: https://kaalflash12.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization' 'https://reino-tribal-api.mestrederpg35.deno.net/api/reino'
          if($LASTEXITCODE -ne 0){throw "CORS curl falhou: $LASTEXITCODE"}
          $h=[IO.File]::ReadAllText($headers)
          if($h -notmatch '(?im)^HTTP/\S+\s+204\b'){throw "CORS nao retornou 204: $h"}
          if($h -notmatch '(?im)^access-control-allow-origin:\s*https://kaalflash12\.github\.io\s*$'){throw "allow-origin incorreto: $h"}
          Write-Host 'FIX17_CANONICAL_CORS_PASS'

      - name: Deno check backend real
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          deno check deno/main.js
          if($LASTEXITCODE -ne 0){throw "deno check falhou: $LASTEXITCODE"}
          Write-Host 'FIX17_DENO_CHECK_PASS'

      - name: Publish three canonical FIX17 executors
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REINO_TRIBAL_FINAL_UNICO.ps1 EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1
          if(git diff --cached --quiet){Write-Host 'FIX17 canonico ja publicado';exit 0}
          git commit -m 'fix: consolidar Deno curl e CORS nos executores canonicos'
          for($i=1;$i -le 5;$i++){
            git fetch origin main
            git rebase origin/main
            if($LASTEXITCODE -ne 0){throw 'Rebase FIX17 falhou'}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){exit 0}
            Start-Sleep -Seconds (2*$i)
          }
          throw 'FIX17 nao publicou apos 5 tentativas'
