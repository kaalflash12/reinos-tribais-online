name: RT76 Full Regression Current

on:
  push:
    paths:
      - 'rt76-full-regression-trigger.txt'

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Validar JavaScript embutido
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          assert h==Path('JOGAR_REINOS_TRIBAIS.html').read_text(encoding='utf-8')
          out=Path('/tmp/rt76-js');out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          n=0
          for s in scripts:
            if s.strip():
              n+=1;(out/f'{n:03}.js').write_text(s,encoding='utf-8')
          print('scripts',n)
          PY
          for f in /tmp/rt76-js/*.js; do node --check "$f"; done
      - name: Servir jogo atual
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/rt76-http.log 2>&1 &
          sleep 2
      - name: Executar regressão desktop e mobile
        run: python tools/rt76_full_regression_current.py
      - name: Upload das evidências mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT76_EVIDENCIAS_ATUAIS
          path: RT76_EVIDENCIAS_ATUAIS
          if-no-files-found: warn
