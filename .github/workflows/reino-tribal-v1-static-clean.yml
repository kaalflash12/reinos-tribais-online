name: Reino Tribal v1 Static Clean

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace legacy public branding
        shell: python
        run: |
          from pathlib import Path
          for name in ['index.html','JOGAR_REINOS_TRIBAIS.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<title>Reinos Tribais — RT80.5</title>','<title>Reino Tribal</title>')
              s=s.replace('<title>Reinos Tribais</title>','<title>Reino Tribal</title>')
              s=s.replace('Reinos Tribais','Reino Tribal')
              p.write_text(s,encoding='utf-8')
          a=Path('index.html').read_text(encoding='utf-8')
          b=Path('JOGAR_REINOS_TRIBAIS.html').read_text(encoding='utf-8')
          assert a==b
          assert '<title>Reino Tribal</title>' in a
          assert 'Reinos Tribais' not in a
          print({'html_equal':True,'legacy_brand_occurrences':0})
      - name: Persist static cleanup
        shell: bash
        run: |
          if git diff --quiet -- index.html JOGAR_REINOS_TRIBAIS.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          git commit -m 'Reino Tribal v1.0.0: nome estático sem revisão antiga'
          git push origin HEAD:${{ github.head_ref }}
