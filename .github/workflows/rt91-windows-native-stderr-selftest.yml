name: RT91 Windows PowerShell 5.1 Native Selftest

on:
  push:
    branches: [main]
    paths:
      - 'tools/rt91_process_helpers.ps1'
      - 'tools/rt91_windows_native_stderr_selftest.ps1'
      - 'tools/rt91_token_bridge_selftest.ps1'
      - 'REINO_TRIBAL_ADMIN_FINAL_RT91_AUTH10.ps1'
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1'
      - 'REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1'
      - '.github/workflows/rt91-final-admin-authorized.yml'
      - '.github/workflows/rt91-windows-native-stderr-selftest.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  powershell-51-native-stderr:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable | Format-List
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw 'Este gate exige Windows PowerShell Desktop 5.1.' }
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Versao inesperada do Windows PowerShell.' }
      - name: Install exact Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Verify exact Deno Deploy CLI surface used by AUTH10
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          . .\tools\rt91_process_helpers.ps1
          $denoExe=(Get-Command deno.exe -ErrorAction Stop).Source
          $vr=Invoke-RTDenoText -DenoExe $denoExe -CommandArgs @('--version')
          if($vr.Code -ne 0){throw ('deno --version falhou: '+$vr.Stderr)}
          $v=($vr.Stdout -split "`r?`n")[0]
          if ($v -notmatch '^deno 2\.9\.5\b') { throw "Deno inesperado: $v" }
          $checks = @(
            @{Label='whoami'; Args=@('deploy','whoami','--help'); Need=@('--json')},
            @{Label='orgs list'; Args=@('deploy','orgs','list','--help'); Need=@('--json')},
            @{Label='apps get'; Args=@('deploy','apps','get','--help'); Need=@('--json','--non-interactive')},
            @{Label='env list'; Args=@('deploy','env','list','--help'); Need=@('--json','--non-interactive')},
            @{Label='env update-value'; Args=@('deploy','env','update-value','--help'); Need=@('--json','--non-interactive')}
          )
          foreach($check in $checks){
            $r=Invoke-RTDenoText -DenoExe $denoExe -CommandArgs @($check.Args)
            $text=($r.Stdout+"`n"+$r.Stderr)
            if($r.Code -ne 0){throw ("Deno CLI surface falhou em "+$check.Label+" exit="+$r.Code+": `n"+$text)}
            foreach($needle in $check.Need){if(-not $text.Contains($needle)){throw ("Deno CLI "+$check.Label+" nao expoe "+$needle+": `n"+$text)}}
            Write-Host ('PASS: Deno 2.9.5 '+$check.Label)
          }
      - name: Run exact AUTH10 native stderr selftest
        shell: powershell
        run: .\tools\rt91_windows_native_stderr_selftest.ps1
      - name: Run AUTH10 token bridge selftest
        shell: powershell
        run: .\tools\rt91_token_bridge_selftest.ps1
      - name: Validate final AUTH10 package without production mutation
        shell: powershell
        run: .\REINO_TRIBAL_FECHAR_ADMIN_PUBLICO_AUTH10.ps1 -PackageValidateOnly
      - name: Validate canonical top-level AUTH10 close without mutation
        shell: powershell
        run: .\REINO_TRIBAL_FECHAR_ADMIN_PUBLICO.ps1 -PackageValidateOnly
