name: RT80 Source Snapshot TEMP
on:
  push:
    branches: ['rt80-admin-overhaul']
    paths:
      - '.github/workflows/rt80-source-snapshot-temp.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect text/code source and asset manifest
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/RT80_SOURCE_SNAPSHOT"
          mkdir -p "$out/source"
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "$out/source/$(dirname "$rel")"
            cp "$f" "$out/source/$rel"
          done < <(find . -type f \
            \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.sql' -o -name '*.ps1' -o -name '*.cmd' -o -name '*.bat' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name '*.txt' -o -name '*.py' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' -print0)
          find . -type f -not -path './.git/*' -printf '%P\t%s\n' | sort > "$out/ALL_FILES.tsv"
          git rev-parse HEAD > "$out/COMMIT_SHA.txt"
          git status --short > "$out/GIT_STATUS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: RT80_SOURCE_SNAPSHOT
          path: ${{ runner.temp }}/RT80_SOURCE_SNAPSHOT
          if-no-files-found: error
