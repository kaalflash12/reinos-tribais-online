name: RT77 Windows Online Gate

on:
  push:
    paths:
      - 'rt77-windows-online-trigger.txt'

permissions:
  contents: read

jobs:
  windows-online:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validar RT77 publicada diretamente do main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'RT77_ONLINE_GATE'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp|Out-Null
          $raw='https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/main'
          $files=@('index.html','JOGAR_REINOS_TRIBAIS.html','rt76-runtime.js','rt76-map-ai.js','rt76-master-plan.js','RT77_HTML_SHA256.txt')
          foreach($f in $files){Invoke-WebRequest -UseBasicParsing -Uri "$raw/$f" -OutFile (Join-Path $tmp $f)}
          $html=Get-Content (Join-Path $tmp 'index.html') -Raw
          foreach($m in @('const VERSION = 77;','const RT_BUILD = "77.0";','rt77_world_maintenance','rt77_recall_support','rt77_claim_ranked_reward','window.RT77 = window.RT76;','function renameHero','useInventoryItem','rt66-guided-admin-css')){if(-not$html.Contains($m)){throw "Missing marker $m"}}
          $sha=(Get-FileHash (Join-Path $tmp 'index.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=(Get-Content (Join-Path $tmp 'RT77_HTML_SHA256.txt') -Raw).Trim()
          if($sha-ne$expected){throw "HTML SHA $sha != $expected"}
          if((Get-FileHash (Join-Path $tmp 'JOGAR_REINOS_TRIBAIS.html') -Algorithm SHA256).Hash.ToLowerInvariant()-ne$sha){throw 'HTML divergence'}
          node --check (Join-Path $tmp 'rt76-runtime.js')
          node --check (Join-Path $tmp 'rt76-map-ai.js')
          node --check (Join-Path $tmp 'rt76-master-plan.js')
          Write-Host "PASS remote main markers + SHA + JS $sha"

      - name: Validar 95 artes e 5 mapas direto do main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'RT77_ONLINE_GATE'
          $raw='https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/main'
          $api='https://api.github.com/repos/kaalflash12/reinos-tribais-online/contents/assets/v54/buildings?ref=main'
          $headers=@{'User-Agent'='RT77-Windows-Gate';'Accept'='application/vnd.github+json'}
          $list=Invoke-RestMethod -Headers $headers -Uri $api
          $pngs=@($list|Where-Object{$_.type-eq'file' -and $_.name -match '_l[0-4]\.png$'})
          if($pngs.Count-ne95){throw "Building PNG list $($pngs.Count)/95"}
          $families=@{}
          foreach($item in $pngs){
            $m=[regex]::Match($item.name,'^(.+)_l([0-4])\.png$');$fam=$m.Groups[1].Value;$lvl=[int]$m.Groups[2].Value
            if(-not$families.ContainsKey($fam)){$families[$fam]=New-Object 'System.Collections.Generic.HashSet[int]'}
            [void]$families[$fam].Add($lvl)
            $p=Join-Path $tmp $item.name;Invoke-WebRequest -UseBasicParsing -Uri "$raw/assets/v54/buildings/$($item.name)" -OutFile $p
            $b=[IO.File]::ReadAllBytes($p);if($b.Length-lt24 -or $b[0]-ne137 -or $b[1]-ne80 -or $b[2]-ne78 -or $b[3]-ne71){throw "Invalid PNG $($item.name)"}
            $w=[Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($b,16));$h=[Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($b,20));if($w-ne480 -or $h-ne400){throw "$($item.name) ${w}x${h}"}
          }
          if($families.Keys.Count-ne19){throw "Building families $($families.Keys.Count)/19"}
          foreach($fam in $families.Keys){if($families[$fam].Count-ne5){throw "$fam stages $($families[$fam].Count)/5"}}
          foreach($name in @('village_stage1.png','village_stage2.png','village_stage3.png','village_stage4.png','interaction_overlay.png')){
            $p=Join-Path $tmp $name;Invoke-WebRequest -UseBasicParsing -Uri "$raw/assets/v54/map/$name" -OutFile $p;$b=[IO.File]::ReadAllBytes($p);if($b.Length-lt24 -or $b[0]-ne137 -or $b[1]-ne80 -or $b[2]-ne78 -or $b[3]-ne71){throw "Invalid map PNG $name"}
          }
          Write-Host 'PASS remote main 19 families x L0-L4 = 95/95; map 5/5'

      - name: Confirmar GitHub Pages RT77 e abrir no Edge Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://kaalflash12.github.io/reinos-tribais-online/'
          $ok=$false
          for($i=1;$i-le20;$i++){
            try{$r=Invoke-WebRequest -UseBasicParsing -Uri ($url+'?rt77-gate='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -Headers @{'Cache-Control'='no-cache'};if($r.StatusCode-eq200 -and $r.Content.Contains('const VERSION = 77;') -and $r.Content.Contains('const RT_BUILD = "77.0";')){$ok=$true;break}}catch{}
            Start-Sleep -Seconds 3
          }
          if(-not$ok){throw 'GitHub Pages ainda não está servindo RT77.0'}
          $browser=@("$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Google\Chrome\Application\chrome.exe")|?{$_ -and(Test-Path $_)}|select -First 1
          if(-not$browser){throw 'No Edge/Chrome'}
          $shot=Join-Path $env:RUNNER_TEMP 'RT77_WINDOWS_ONLINE.png'
          $p=Start-Process $browser -ArgumentList @('--headless','--disable-gpu','--hide-scrollbars','--window-size=1600,1000',"--screenshot=$shot",($url+'?rt77-windows-online=1')) -Wait -PassThru
          if($p.ExitCode-ne0 -or -not(Test-Path $shot) -or (Get-Item $shot).Length-lt10000){throw 'Windows browser online screenshot failed'}
          Write-Host "PASS GitHub Pages RT77 + Windows browser $((Get-Item $shot).Length) bytes"

      - name: Gerar prova RT77 Windows online
        if: success()
        shell: powershell
        run: |
          $tmp=Join-Path $env:RUNNER_TEMP 'RT77_ONLINE_GATE'
          $sha=(Get-Content (Join-Path $tmp 'RT77_HTML_SHA256.txt') -Raw).Trim()
          $proof=[ordered]@{ok=$true;build='RT77.0';tested_source='GitHub main + GitHub Pages';os=(Get-CimInstance Win32_OperatingSystem).Caption;powershell=$PSVersionTable.PSVersion.ToString();html_sha256=$sha;remote_main_markers='PASS';remote_main_js='PASS';building_png='95/95';building_families='19/19 x L0-L4';map_png='5/5';github_pages_rt77='PASS';windows_browser_open='PASS';database_rollback_tests=@('market PASS','support send-arrive-recall-return PASS','ranked play PASS','ranked reward claim PASS','inventory consume PASS','merchant purchase PASS','boss shared HP PASS');docker='NOT_REQUIRED';cloudflare='NOT_REQUIRED_FOR_GATE'}
          $proof|ConvertTo-Json -Depth 6|Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\PROVA_RT77_WINDOWS_ONLINE.json"
          Get-Content "$env:RUNNER_TEMP\PROVA_RT77_WINDOWS_ONLINE.json"

      - name: Upload prova RT77 Windows online
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RT77_WINDOWS_ONLINE_PROOF
          path: |
            ${{ runner.temp }}\PROVA_RT77_WINDOWS_ONLINE.json
            ${{ runner.temp }}\RT77_WINDOWS_ONLINE.png
          if-no-files-found: error