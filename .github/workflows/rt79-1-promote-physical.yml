name: RT79.1 Promote Physical HTML
on:
  push:
    branches: [rt79-1-full-review]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt79-1-full-review
      - name: Promote and validate physical RT79.1 HTML
        run: |
          python tools/promote_rt79_1.py
          grep -F 'const VERSION = 79;' index.html
          grep -F 'const RT_BUILD = "79.1";' index.html
          grep -F 'rt79-suite.js?v=79.1' index.html
          cmp index.html JOGAR_REINOS_TRIBAIS.html
      - name: Commit physical promotion when needed
        run: |
          if ! git diff --quiet -- index.html JOGAR_REINOS_TRIBAIS.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html JOGAR_REINOS_TRIBAIS.html
            git commit -m 'RT79.1: promote physical game HTML'
            git push origin HEAD:rt79-1-full-review
          fi
