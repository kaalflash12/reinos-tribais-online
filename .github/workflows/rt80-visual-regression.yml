name: RT80 Visual Regression
on:
  pull_request:
    paths:
      - 'rt79-village-ui.js'
      - 'rt80-visual-system.css'
      - 'rt80-visual-polish.css'
      - 'rt80-compat.css'
      - 'rt80-visual-system.js'
      - 'tools/rt80_visual_regression.py'
      - 'tools/rt80_assets_views_admin_audit.py'
      - '.github/workflows/rt80-visual-regression.yml'
  workflow_dispatch:

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Static syntax
        shell: pwsh
        run: |
          node --check rt79-village-ui.js
          node --check rt80-visual-system.js
          python -m py_compile tools/rt80_visual_regression.py tools/rt80_assets_views_admin_audit.py
      - name: Start local site
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
          $p.Id | Set-Content "$env:RUNNER_TEMP\rt80_server.pid"
          Start-Sleep -Seconds 2
          Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing | Select-Object StatusCode
      - name: Run Edge core visual regression
        id: core_visual
        continue-on-error: true
        env:
          RT80_URL: http://127.0.0.1:8765/
        run: python tools/rt80_visual_regression.py
      - name: Run Edge full pages assets and admin audit
        id: full_visual
        if: always()
        continue-on-error: true
        env:
          RT80_URL: http://127.0.0.1:8765/
        run: python tools/rt80_assets_views_admin_audit.py
      - name: Upload core visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT80_VISUAL_PROOF
          path: ${{ runner.temp }}/RT80_VISUAL_PROOF
          if-no-files-found: error
      - name: Upload full visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT80_FULL_VISUAL_PROOF
          path: ${{ runner.temp }}/RT80_FULL_VISUAL_PROOF
          if-no-files-found: warn
      - name: Fail if either visual gate failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.core_visual.outcome }}' -ne 'success') { throw 'RT80 core visual regression failed.' }
          if ('${{ steps.full_visual.outcome }}' -ne 'success') { throw 'RT80 full pages/assets/admin audit failed.' }
