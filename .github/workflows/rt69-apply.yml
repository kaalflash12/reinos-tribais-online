name: RT69 Full Fix Apply

on:
  push:
    paths:
      - 'rt69-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RT69 clean production fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[Path('index.html'),Path('JOGAR_REINOS_TRIBAIS.html')]
          repls=[
            ('<title>Reinos Tribais — RT67 Administração Guiada</title>','<title>Reinos Tribais — RT69 Completo</title>'),
            ('<meta name="rt62-audit" content="RT62-total-acceptance-functions-buttons-assets-database-content">','<meta name="rt62-audit" content="RT69-full-acceptance-functions-buttons-assets-database-content">'),
            ('/* RT68 — navegação do JOGO reconstruída. O admin continua com sua navegação própria. */','/* RT69 — navegação unificada preservada; aldeia e ativos corrigidos. */'),
            ('  const VERSION = 62;','  const VERSION = 69;'),
            ('  const RT_BUILD = "60.1";','  const RT_BUILD = "69.0";\n  const RT69_FULLFIX = true;'),
            ('`assets/v49/buildings/${key}_l1.webp`','`assets/v54/buildings/${key}_l1.png`'),
            ("  const START_ART = 'assets/v24/village_scene.png';","  const START_ART = 'assets/v54/map/village_stage1.png';"),
            ("  const RT60_VILLAGE_LAYER_ROOT = 'assets/rt60/village_layers';","  const RT60_VILLAGE_LAYER_ROOT = 'assets/v54/buildings';"),
            ('RT64 • ONLINE • ADMIN COMPLETO + RECOVERY OTP + 19 MENUS','RT69 • ONLINE • ADMIN COMPLETO + RECOVERY + 19 MENUS'),
            ('Backend: São Paulo • Realtime + combate RT62 + sincronização','Backend: São Paulo • Realtime + combate RT69 + sincronização'),
            ('REINOS TRIBAIS • CENTRAL OPERACIONAL RT67 GUIADA','REINOS TRIBAIS • CENTRAL OPERACIONAL RT69 GUIADA'),
            ('interface guiada RT67','interface guiada RT69'),
            ('RT62 • ALDEIA POR CAMADAS FIXAS • ONLINE','RT69 • ALDEIA INTEGRADA • ONLINE'),
            ('Reinos Tribais — RT68 • navegação do jogo reconstruída • aldeia por camadas • mapa vivo • multiplayer','Reinos Tribais — RT69 • aldeia corrigida • sistemas auditados • mapa vivo • multiplayer'),
            ('Central de Sistemas RT62','Central de Sistemas RT69'),
            ('Suspenso pelo painel administrativo RT62','Suspenso pelo painel administrativo RT69'),
          ]
          map_old='''          <img class="rt54-map-layer" src="${(v.buildings.wall||0)>0?'assets/rt61/map/village_walled.png':'assets/rt61/map/village_empty.png'}" alt="Terreno da aldeia ${((v.buildings.wall||0)>0?'com muralha':'sem muralha')}, estágio ${villageVisual.stage}" aria-hidden="true">'''
          map_new='''          <img class="rt54-map-layer" src="assets/v54/map/village_stage${villageVisual.stage}.png" alt="Terreno da aldeia, estágio ${villageVisual.stage}" aria-hidden="true">'''
          repls.append((map_old,map_new))
          for p in files:
            t=p.read_text(encoding='utf-8')
            if 'const VERSION = 69;' not in t:
              for a,b in repls:
                if a not in t: raise SystemExit(f'{p}: trecho esperado ausente: {a[:90]!r}')
                t=t.replace(a,b)
              p.write_text(t,encoding='utf-8')
          a=files[0].read_text(encoding='utf-8'); b=files[1].read_text(encoding='utf-8')
          assert a==b, 'HTMLs divergentes'
          for x in ['RT69_FULLFIX','const VERSION = 69','const RT_BUILD = "69.0"','assets/v54/buildings','assets/v54/map/village_stage']:
            assert x in a, f'marcador ausente: {x}'
          for bad in ['assets/rt60/','assets/rt61/']:
            assert bad not in a, f'referencia quebrada ainda presente: {bad}'
          print('RT69 production validation PASS')
          PY
      - name: Commit RT69
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Reinos Tribais RT69'
          git config user.email 'rt69@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          if git diff --cached --quiet; then
            echo 'RT69 already applied.'
            exit 0
          fi
          git commit -m 'RT69 correção integral de aldeia e ativos'
          git push origin HEAD:main
