name: RT Turso Hostname FIX8

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'RT_REINO_TRIBAL_TURSO_HOSTNAME_FIX8.ps1'
      - '.github/workflows/rt-turso-hostname-fix8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-fix8:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse, patch and regression-test Turso hostname fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FINAL_UNICO.ps1'
          & .\RT_REINO_TRIBAL_TURSO_HOSTNAME_FIX8.ps1 -OutFile $out -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw "FIX8 falhou: $LASTEXITCODE" }

          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Final FIX8 nao passa no parser.' }

          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Get-TursoHostnameFromInstances'
          }, $true)
          if (-not $fn) { throw 'Helper Get-TursoHostnameFromInstances ausente.' }
          Invoke-Expression $fn.Extent.Text

          $fixture1 = [pscustomobject]@{
            instances = @(
              [pscustomobject]@{ type='replica'; hostname='replica.example.turso.io' },
              [pscustomobject]@{ type='primary'; hostname='reino-tribal-prod-enigmatic-aquarius-u3.turso.io' }
            )
          }
          $h1 = Get-TursoHostnameFromInstances $fixture1
          if ($h1 -ne 'reino-tribal-prod-enigmatic-aquarius-u3.turso.io') { throw "Fixture primary falhou: $h1" }

          $fixture2 = [pscustomobject]@{
            data = [pscustomobject]@{
              instances = @([pscustomobject]@{ type='primary'; hostname='nested-primary.turso.io' })
            }
          }
          $h2 = Get-TursoHostnameFromInstances $fixture2
          if ($h2 -ne 'nested-primary.turso.io') { throw "Fixture data.instances falhou: $h2" }

          $fixture3 = [pscustomobject]@{ instance = [pscustomobject]@{ type='primary'; hostname='single-primary.turso.io' } }
          $h3 = Get-TursoHostnameFromInstances $fixture3
          if ($h3 -ne 'single-primary.turso.io') { throw "Fixture instance falhou: $h3" }

          $raw = Get-Content $out -Raw
          if ($raw -notmatch '/instances') { throw 'Final nao consulta endpoint /instances.' }
          if ($raw -notmatch 'package\.json') { throw 'FIX8 removeu regressao dos 6 arquivos.' }
          if ($raw -notmatch 'auth/interactive') { throw 'FIX8 removeu auth Deno.' }
          Write-Host 'TURSO_HOSTNAME_FIX8_REGRESSION_PASS'

          Copy-Item $out (Join-Path $env:RUNNER_TEMP 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1') -Force
          Copy-Item $out (Join-Path $env:RUNNER_TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1') -Force

      - name: Publish tested canonical executors to main
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main

          Copy-Item (Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FINAL_UNICO.ps1') .\REINO_TRIBAL_FINAL_UNICO.ps1 -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1') .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1') .\IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1 -Force

          $h1 = (Get-FileHash .\REINO_TRIBAL_FINAL_UNICO.ps1 -Algorithm SHA256).Hash
          $h2 = (Get-FileHash .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -Algorithm SHA256).Hash
          $h3 = (Get-FileHash .\IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1 -Algorithm SHA256).Hash
          if ($h1 -ne $h2 -or $h1 -ne $h3) { throw 'Os tres executores nao sao identicos.' }

          git add REINO_TRIBAL_FINAL_UNICO.ps1 EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1
          if (git diff --cached --quiet) {
            Write-Host 'Main ja contem exatamente o FIX8.'
            exit 0
          }
          git commit -m 'fix: resolver hostname Turso via database instances'
          git push origin main
