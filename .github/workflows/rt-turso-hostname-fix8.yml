name: RT Turso Hostname FIX8

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'RT_REINO_TRIBAL_TURSO_HOSTNAME_FIX8.ps1'
      - '.github/workflows/rt-turso-hostname-fix8.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RT_REINO_TRIBAL_TURSO_HOSTNAME_FIX8.ps1'
      - '.github/workflows/rt-turso-hostname-fix8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-fix8:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate, parse and regression-test Turso hostname fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FINAL_UNICO.ps1'
          & .\RT_REINO_TRIBAL_TURSO_HOSTNAME_FIX8.ps1 -OutFile $out -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw "FIX8 ValidateOnly falhou: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'Executor FIX8 nao foi gerado.' }

          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Final FIX8 nao passa no parser.' }

          $raw = [IO.File]::ReadAllText($out)
          foreach($required in @('/instances','Get-TursoHostnameFromInstances','package.json','auth/interactive','DENO_DEPLOY_TOKEN')) {
            if ($raw.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Contrato obrigatorio ausente: $required"
            }
          }

          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Get-TursoHostnameFromInstances'
          }, $true)
          if (-not $fn) { throw 'Helper Get-TursoHostnameFromInstances ausente.' }
          Invoke-Expression $fn.Extent.Text

          $primary = 'reino-tribal-prod-enigmatic-aquarius-u3.turso.io'
          $fixtures = @(
            [pscustomobject]@{ instances = @(
              [pscustomobject]@{ type='replica'; hostname='replica.example.turso.io' },
              [pscustomobject]@{ type='primary'; hostname=$primary }
            ) },
            [pscustomobject]@{ data = [pscustomobject]@{ instances = @(
              [pscustomobject]@{ type='primary'; hostname=$primary }
            ) } },
            [pscustomobject]@{ instance = [pscustomobject]@{ type='primary'; hostname=$primary } },
            @([pscustomobject]@{ type='primary'; hostname=$primary })
          )
          foreach($fixture in $fixtures) {
            $got = Get-TursoHostnameFromInstances $fixture
            if ($got -ne $primary) { throw "Normalizacao de instances falhou. Obtido: [$got]" }
          }
          $withoutHost = [pscustomobject]@{ instances = @([pscustomobject]@{ type='primary' }) }
          if ((Get-TursoHostnameFromInstances $withoutHost) -ne '') { throw 'Helper fabricou hostname inexistente.' }

          $start = $raw.IndexOf('  function Get-TursoHostnameFromInstances {',[StringComparison]::Ordinal)
          $endMarker = "  `$dbUrl = 'libsql://' + (`$hostname -replace '^https?://','' -replace '^libsql://','')"
          $end = $raw.IndexOf($endMarker,$start,[StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -lt 0) { throw 'Bloco final de resolucao de hostname nao encontrado.' }
          $end += $endMarker.Length
          $block = $raw.Substring($start,$end-$start)

          $script:called = @()
          function Get-TursoDatabaseField { param($Database,[string]$Field) return '' }
          function Convert-ToTursoDatabase { param($Raw) return [pscustomobject]@{ Name='reino-tribal-prod' } }
          function Turso-Request {
            param([string]$Method,[string]$Path,[string]$Token)
            $script:called += $Path
            if ($Path -like '*/instances') {
              return [pscustomobject]@{ instances = @(
                [pscustomobject]@{ type='replica'; hostname='replica.example.turso.io' },
                [pscustomobject]@{ type='primary'; hostname=$primary }
              ) }
            }
            return [pscustomobject]@{ database = [pscustomobject]@{ name='reino-tribal-prod' } }
          }
          function Ok { param([string]$Texto) Write-Host "PASS: $Texto" }
          function Falhar { param([string]$Texto) throw $Texto }

          $db = [pscustomobject]@{ Name='reino-tribal-prod' }
          $orgSlug = 'enigmatic-aquarius-u3'
          $TursoDatabase = 'reino-tribal-prod'
          $platformToken = 'ci-placeholder'
          $hostname = ''
          $dbUrl = ''
          Invoke-Expression $block

          if ($hostname -ne $primary) { throw "Fluxo 409/existente sem hostname nao resolveu primary: [$hostname]" }
          if ($dbUrl -ne "libsql://$primary") { throw "dbUrl incorreta: [$dbUrl]" }
          $detailPath = "/v1/organizations/$orgSlug/databases/$TursoDatabase"
          $instancesPath = "$detailPath/instances"
          if ($script:called -notcontains $detailPath) { throw 'GET detalhe do database nao foi executado.' }
          if ($script:called -notcontains $instancesPath) { throw 'Fallback GET /instances nao foi executado.' }

          Write-Host 'TURSO_409_EXISTING_DB_NO_HOSTNAME_TO_PRIMARY_INSTANCE_PASS'
          Write-Host 'TURSO_HOSTNAME_FIX8_REGRESSION_PASS'

          Copy-Item $out (Join-Path $env:RUNNER_TEMP 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1') -Force
          Copy-Item $out (Join-Path $env:RUNNER_TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1') -Force

      - name: Publish tested canonical executors to main
        if: github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main

          Copy-Item (Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FINAL_UNICO.ps1') .\REINO_TRIBAL_FINAL_UNICO.ps1 -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1') .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1') .\IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1 -Force

          $h1 = (Get-FileHash .\REINO_TRIBAL_FINAL_UNICO.ps1 -Algorithm SHA256).Hash
          $h2 = (Get-FileHash .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -Algorithm SHA256).Hash
          $h3 = (Get-FileHash .\IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1 -Algorithm SHA256).Hash
          if ($h1 -ne $h2 -or $h1 -ne $h3) { throw 'Os tres executores nao sao identicos.' }

          git add REINO_TRIBAL_FINAL_UNICO.ps1 EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1
          if (git diff --cached --quiet) {
            Write-Host 'Main ja contem exatamente o FIX8.'
            exit 0
          }
          git commit -m 'fix: resolver hostname Turso via database instances'
          git push origin main
