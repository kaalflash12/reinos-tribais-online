name: RT Turso Deno Isolation

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'deno.json'
      - 'deno/**'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deno.json'
      - 'deno/**'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Validate Deno runtime
        run: |
          deno check deno/main.js
          grep -q '"entrypoint": "./deno/main.js"' deno.json
          grep -q "runtime: 'deno-deploy'" deno/main.js
          grep -q "database: 'turso'" deno/main.js
          echo DENO_RUNTIME_PASS
      - name: Enforce infrastructure isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[Path('deno.json'),Path('deno/main.js')]
          forbidden=['vercel','bw-v151','bacathegas','bacaworld','supabase','cloudflare','mongodb','neon']
          bad=[]
          for p in files:
              s=p.read_text(encoding='utf-8').lower()
              for word in forbidden:
                  if word in s:
                      bad.append(f'{p}:{word}')
          if bad:
              raise SystemExit('Infraestrutura cruzada proibida: '+', '.join(bad))
          if Path('vercel.json').exists():
              raise SystemExit('vercel.json é proibido no Reino Tribal')
          for p in [
              Path('CONFIGURAR_TURSO_REINO_TRIBAL.ps1'),
              Path('CONFIGURAR_TURSO_REINO_TRIBAL_AUTO.ps1'),
              Path('RECUPERAR_REINO_TRIBAL_SEM_REINSTALAR.ps1'),
              Path('RECUPERAR_REINO_TRIBAL_SEM_TRAVAR.ps1'),
          ]:
              if p.exists():
                  raise SystemExit(f'Bootstrap antigo proibido ainda existe: {p}')
          print('REINO_TRIBAL_DENO_ISOLATION_PASS')
          PY
