name: RT Turso Deno Isolation

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - 'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1'
      - 'RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - 'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1'
      - 'RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Validate Deno runtime
        run: |
          deno check deno/main.js
          grep -q '"entrypoint": "./deno/main.js"' deno.json
          grep -q "runtime: 'deno-deploy'" deno/main.js
          grep -q "database: 'turso'" deno/main.js
          echo DENO_RUNTIME_PASS
      - name: Enforce infrastructure isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[Path('deno.json'),Path('deno/main.js'),Path('api/reino.js'),Path('api/admin.js')]
          forbidden=['ver'+'cel','bw-v151','bacathegas','bacaworld','supabase.co','cloudflare','mongodb','neon']
          bad=[]
          for p in files:
              s=p.read_text(encoding='utf-8').lower()
              for word in forbidden:
                  if word in s: bad.append(f'{p}:{word}')
          if bad: raise SystemExit('Infraestrutura cruzada proibida: '+', '.join(bad))
          if Path('ver'+'cel.json').exists(): raise SystemExit('config de hospedagem anterior ainda existe')
          print('REINO_TRIBAL_DENO_ISOLATION_PASS')
          PY

  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all current Windows entrypoints
        shell: powershell
        run: |
          foreach($file in @(
            'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1',
            'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1',
            'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1',
            'RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error($file+': '+$_.Message)};exit 1}
            Write-Host "POWERSHELL_PARSE_PASS $file"
          }
      - name: Prove canonical names delegate to personal free launcher
        shell: powershell
        run: |
          foreach($file in @('IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1','EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1')){
            $s=[IO.File]::ReadAllText((Resolve-Path $file))
            if(-not $s.Contains('RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1')){throw "$file nao delega ao Turso pessoal gratuito"}
            foreach($forbidden in @('codeload.github.com','Baixando branch isolada do Reino Tribal',"Read-Host 'Turso Platform API Token'",'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1')){
              if($s.Contains($forbidden)){throw "$file ainda aponta para fluxo antigo: $forbidden"}
            }
          }
          Write-Host 'CANONICAL_TURSO_PERSONAL_DELEGATION_PASS'
      - name: Validate canonical executor end-to-end transform
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Canonical ValidateOnly falhou: $LASTEXITCODE"}
          $out=Join-Path $env:TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
          if(-not(Test-Path $out)){throw 'Bootstrap final não foi gerado'}
          $t=[IO.File]::ReadAllText($out)
          foreach($forbidden in @(
            'codeload.github.com',
            'Baixando branch isolada do Reino Tribal',
            "Read-Host 'Turso Platform API Token'",
            "Read-Host 'Cole somente o slug da organizacao Deno",
            'Nenhuma organização Turso independente foi encontrada nessa conta.',
            '$managed = @($orgs',
            'Organizações Turso independentes:',
            "Read-Host 'Escolha o número da organização para o Reino Tribal'",
            "'production','development'"
          )){
            if($t.Contains($forbidden)){throw "Bootstrap canonico contém fluxo antigo/manual/pago: $forbidden"}
          }
          foreach($needle in @(
            "'repo','clone',`$Repositorio,`$repoDir",
            "'--branch',`$Branch,'--depth','1','--single-branch'",
            'Obter-TursoPlatformTokenBrowser',
            'AcceptTcpClientAsync',
            'Start-Process $authUrl',
            "Turso-Request -Method GET -Path '/v1/current-user'",
            "([string]`$_.type) -eq 'personal'",
            'Organizacao pessoal Turso selecionada automaticamente:',
            "'deploy','orgs','list','--json'",
            "'deploy','apps','get','--org',`$denoOrg,'--app',`$DenoApp,'--json'",
            "'deploy','create','.'",
            "'deploy','env','load','--replace',`$envFile,'--org',`$denoOrg,'--app',`$DenoApp",
            "'deploy','env','update-contexts',`$name,'--org',`$denoOrg,'--app',`$DenoApp",
            "'deploy','--org',`$denoOrg,'--app',`$DenoApp,'--prod'",
            '$appMeta.productionUrl',
            "Set-GitHubVariable `$gh 'DENO_DEPLOY_ORG' `$denoOrg"
          )){
            if(-not $t.Contains($needle)){throw "Contrato canonico final ausente: $needle"}
          }
          Write-Host 'CANONICAL_TURSO_PERSONAL_END_TO_END_PASS'
      - name: Validate unique anti-stale launcher
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Unique launcher ValidateOnly falhou: $LASTEXITCODE"}
          $out=Join-Path $env:TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
          if(-not(Test-Path $out)){throw 'Unique launcher não gerou bootstrap final'}
          $t=[IO.File]::ReadAllText($out)
          foreach($needle in @(
            "'deploy','orgs','list','--json'",
            'https://console.deno.com',
            "'deploy','apps','get','--org',`$candidate,'--app',`$DenoApp,'--json'",
            "'deploy','apps','get','--org',`$denoOrg,'--app',`$DenoApp,'--json'",
            "'deploy','create','.'",
            "'--org',`$denoOrg",
            "'deploy','env','load','--replace',`$envFile,'--org',`$denoOrg,'--app',`$DenoApp",
            "'deploy','env','update-contexts',`$name,'--org',`$denoOrg,'--app',`$DenoApp",
            "'deploy','--org',`$denoOrg,'--app',`$DenoApp,'--prod'",
            '$appMeta.productionUrl',
            'Organizacao Deno selecionada automaticamente:'
          )){
            if(-not $t.Contains($needle)){throw "Contrato Deno automático ausente: $needle"}
          }
          foreach($forbidden in @(
            'codeload.github.com',
            'Baixando branch isolada do Reino Tribal',
            "Read-Host 'Turso Platform API Token'",
            "Read-Host 'Cole somente o slug da organizacao Deno",
            "'production','development'",
            '[regex]::Matches($deploy.Text'
          )){
            if($t.Contains($forbidden)){throw "Unique bootstrap contém fluxo antigo/manual/frágil: $forbidden"}
          }
          Write-Host 'UNIQUE_ANTISTALE_AUTO_ORG_PRODUCTION_URL_PASS'
      - name: Validate Turso personal free launcher
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Turso personal ValidateOnly falhou: $LASTEXITCODE"}
          $out=Join-Path $env:TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
          if(-not(Test-Path $out)){throw 'Turso personal launcher não gerou bootstrap final'}
          $t=[IO.File]::ReadAllText($out)
          foreach($needle in @(
            "Turso-Request -Method GET -Path '/v1/current-user'",
            "([string]`$_.type) -eq 'personal'",
            'Organizacao pessoal Turso selecionada automaticamente:',
            "'deploy','orgs','list','--json'",
            '$appMeta.productionUrl'
          )){
            if(-not $t.Contains($needle)){throw "Contrato Turso pessoal ausente: $needle"}
          }
          foreach($forbidden in @(
            'Nenhuma organização Turso independente foi encontrada nessa conta.',
            '$managed = @($orgs',
            'Organizações Turso independentes:',
            "Read-Host 'Escolha o número da organização para o Reino Tribal'",
            "Read-Host 'Turso Platform API Token'"
          )){
            if($t.Contains($forbidden)){throw "Fluxo Turso pago/manual ainda existe: $forbidden"}
          }
          Write-Host 'TURSO_PERSONAL_FREE_WINDOWS_PASS'
