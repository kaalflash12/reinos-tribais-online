name: RT Turso Deno Isolation

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - 'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1'
      - 'RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - 'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1'
      - 'RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Validate Deno runtime
        run: |
          deno check deno/main.js
          grep -q '"entrypoint": "./deno/main.js"' deno.json
          grep -q "runtime: 'deno-deploy'" deno/main.js
          grep -q "database: 'turso'" deno/main.js
          echo DENO_RUNTIME_PASS
      - name: Enforce infrastructure isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[Path('deno.json'),Path('deno/main.js'),Path('api/reino.js'),Path('api/admin.js')]
          forbidden=['ver'+'cel','bw-v151','bacathegas','bacaworld','supabase.co','cloudflare','mongodb','neon']
          bad=[]
          for p in files:
              s=p.read_text(encoding='utf-8').lower()
              for word in forbidden:
                  if word in s: bad.append(f'{p}:{word}')
          if bad: raise SystemExit('Infraestrutura cruzada proibida: '+', '.join(bad))
          if Path('ver'+'cel.json').exists(): raise SystemExit('config de hospedagem anterior ainda existe')
          print('REINO_TRIBAL_DENO_ISOLATION_PASS')
          PY

  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all current Windows entrypoints
        shell: powershell
        run: |
          foreach($file in @(
            'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1',
            'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1',
            'RT_REINO_TRIBAL_GHCLONE_TURSO_BROWSER_20260824.ps1',
            'RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error($file+': '+$_.Message)};exit 1}
            Write-Host "POWERSHELL_PARSE_PASS $file"
          }
      - name: Prove canonical names delegate to v2-v1 launcher
        shell: powershell
        run: |
          foreach($file in @('IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1','EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1')){
            $s=[IO.File]::ReadAllText((Resolve-Path $file))
            if(-not $s.Contains('d26bdec674705a61d00dec3704e7bbe7f0e5b7ff/RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1')){throw "$file nao esta pinado no Turso v2/v1"}
          }
          Write-Host 'CANONICAL_TURSO_V2_V1_PIN_PASS'
      - name: Validate canonical executor end-to-end transform
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Canonical ValidateOnly falhou: $LASTEXITCODE"}
          $out=Join-Path $env:TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
          if(-not(Test-Path $out)){throw 'Bootstrap final não foi gerado'}
          $t=[IO.File]::ReadAllText($out)
          foreach($forbidden in @('codeload.github.com','Baixando branch isolada do Reino Tribal',"Read-Host 'Turso Platform API Token'",'Nenhuma organização Turso independente foi encontrada nessa conta.','$managed = @($orgs')){
            if($t.Contains($forbidden)){throw "Bootstrap canonico contém fluxo antigo/manual: $forbidden"}
          }
          $start=$t.IndexOf('  $orgs = @()',[StringComparison]::Ordinal)
          if($start -lt 0){throw 'Inicio do bloco Turso v2/v1 nao encontrado'}
          $end=$t.IndexOf('  $dbList = Turso-Request -Method GET -Path "/v1/organizations/$orgSlug/databases" -Token $platformToken',$start,[StringComparison]::Ordinal)
          if($end -le $start){throw 'Fim do bloco Turso v2/v1 nao encontrado'}
          $turso=$t.Substring($start,$end-$start)
          if($turso -match '\[0\]'){throw 'Bloco Turso v2/v1 ainda contém indexação [0]'}
          foreach($needle in @(
            "Turso-Request -Method GET -Path '/v2/organizations'",
            "Turso-Request -Method GET -Path '/v1/organizations'",
            "PSObject.Properties['organizations']",
            "Turso-Request -Method GET -Path '/v1/current-user'",
            'Organizacao Turso gratuita selecionada automaticamente:',
            "`$dedicatedGroupName = 'reino-tribal-prod'",
            "'deploy','orgs','list','--json'",
            '$appMeta.productionUrl'
          )){
            if(-not $t.Contains($needle)){throw "Contrato canonico final ausente: $needle"}
          }
          Write-Host 'CANONICAL_TURSO_V2_V1_NO_INDEX_PASS'
      - name: Validate Turso v2-v1 launcher directly
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_REINO_TRIBAL_TURSO_PESSOAL_20260824.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Turso v2/v1 ValidateOnly falhou: $LASTEXITCODE"}
          $out=Join-Path $env:TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
          if(-not(Test-Path $out)){throw 'Turso launcher não gerou bootstrap final'}
          $t=[IO.File]::ReadAllText($out)
          $start=$t.IndexOf('  $orgs = @()',[StringComparison]::Ordinal)
          if($start -lt 0){throw 'Inicio do bloco Turso v2/v1 nao encontrado'}
          $end=$t.IndexOf('  $dbList = Turso-Request -Method GET -Path "/v1/organizations/$orgSlug/databases" -Token $platformToken',$start,[StringComparison]::Ordinal)
          if($end -le $start){throw 'Fim do bloco Turso v2/v1 nao encontrado'}
          $turso=$t.Substring($start,$end-$start)
          if($turso -match '\[0\]'){throw 'Bloco Turso v2/v1 ainda contém indexação [0]'}
          Write-Host 'TURSO_V2_V1_NO_EMPTY_INDEX_WINDOWS_PASS'
