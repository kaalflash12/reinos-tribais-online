name: RT Turso Deno Isolation

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Validate Deno runtime
        run: |
          deno check deno/main.js
          grep -q '"entrypoint": "./deno/main.js"' deno.json
          grep -q "runtime: 'deno-deploy'" deno/main.js
          grep -q "database: 'turso'" deno/main.js
          echo DENO_RUNTIME_PASS
      - name: Enforce infrastructure isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[
              Path('deno.json'),Path('deno/main.js'),Path('api/reino.js'),Path('api/admin.js'),
              Path('IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1')
          ]
          forbidden=['ver'+'cel','bw-v151','bacathegas','bacaworld','supabase.co','cloudflare','mongodb','neon']
          bad=[]
          for p in files:
              s=p.read_text(encoding='utf-8').lower()
              for word in forbidden:
                  if word in s:
                      bad.append(f'{p}:{word}')
          if bad:
              raise SystemExit('Infraestrutura cruzada proibida: '+', '.join(bad))
          legacy='ver'+'cel.json'
          if Path(legacy).exists():
              raise SystemExit('arquivo de hospedagem anterior é proibido no Reino Tribal')
          for p in [
              Path('CONFIGURAR_TURSO_REINO_TRIBAL.ps1'),
              Path('CONFIGURAR_TURSO_REINO_TRIBAL_AUTO.ps1'),
              Path('RECUPERAR_REINO_TRIBAL_SEM_REINSTALAR.ps1'),
              Path('RECUPERAR_REINO_TRIBAL_SEM_TRAVAR.ps1'),
          ]:
              if p.exists():
                  raise SystemExit(f'Bootstrap antigo proibido ainda existe: {p}')
          print('REINO_TRIBAL_DENO_ISOLATION_PASS')
          PY

  powershell:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse final Windows files
        shell: powershell
        run: |
          foreach($file in @('IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1','EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1')){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){
              $errors|ForEach-Object{Write-Error($file+': '+$_.Message+' @ '+$_.Extent.StartLineNumber+':'+$_.Extent.StartColumnNumber)}
              exit 1
            }
            Write-Host "POWERSHELL_PARSE_PASS $file"
          }
      - name: Validate bootstrap contract
        shell: powershell
        run: |
          $s=Get-Content 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1' -Raw
          foreach($needle in @(
            "DenoVersion = '2.9.5'",
            'deno-x86_64-pc-windows-msvc.zip.sha256sum',
            'TURSO_PLATFORM_API_TOKEN',
            'api.turso.tech',
            "DenoApp = 'reino-tribal-api'",
            "TursoDatabase = 'reino-tribal-prod'",
            "@('deploy','env','load'",
            '@(''deploy'',''--app'',$DenoApp,''--prod'')',
            'Health + registro + mundo + save/load + ADM passaram.',
            'variable'',''set'',$Nome',
            'pr'',''merge',
            'function Stop-Tree([int]$ProcessId)',
            'UTF8Encoding($false)',
            'WriteAllLines($envFile'
          )){
            if(-not $s.Contains($needle)){throw "Contrato ausente: $needle"}
          }
          if($s -match '\$Pid\b'){throw 'Variável automática PID reapareceu.'}
          $bad=('ver'+'cel|bw-v151|bacathegas|bacaworld|cloudflare|mongodb|neon|winget(?:\.exe)?\s+install|wsl\.exe\s')
          if($s -match $bad){throw 'Bootstrap contém infraestrutura ou instalador proibido.'}
          Write-Host 'POWERSHELL_DENO_TURSO_CONTRACT_PASS'
      - name: Run exact launcher transform in ValidateOnly
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){throw "Launcher ValidateOnly falhou: $LASTEXITCODE"}
