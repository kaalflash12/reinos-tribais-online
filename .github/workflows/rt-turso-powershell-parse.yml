name: RT Turso Deno Isolation

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'REINO_TRIBAL_FINAL_UNICO.ps1'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - 'RT_REINO_TRIBAL_DENO_CONFIG_FIX10.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deno.json'
      - 'deno/**'
      - 'api/**'
      - 'REINO_TRIBAL_FINAL_UNICO.ps1'
      - 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1'
      - 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1'
      - 'RT_REINO_TRIBAL_DENO_CONFIG_FIX10.ps1'
      - '.github/workflows/rt-turso-powershell-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Validate Deno runtime FIX10
        shell: bash
        run: |
          set -euo pipefail
          deno check deno/main.js
          grep -q "runtime: 'deno-deploy'" deno/main.js
          grep -q "database: 'turso'" deno/main.js
          grep -q -- '--do-not-use-detected-build-config' REINO_TRIBAL_FINAL_UNICO.ps1
          grep -q -- '--runtime-mode' REINO_TRIBAL_FINAL_UNICO.ps1
          grep -q -- '--entrypoint' REINO_TRIBAL_FINAL_UNICO.ps1
          grep -q 'deno/main.js' REINO_TRIBAL_FINAL_UNICO.ps1
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('deno.json').read_text(encoding='utf-8-sig'))
          if 'deploy' in cfg:
              raise SystemExit('deno.json contém bloco deploy incompatível com FIX10')
          print('DENO_RUNTIME_FIX10_PASS')
          PY
      - name: Enforce infrastructure isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[Path('deno.json'),Path('deno/main.js'),Path('api/reino.js'),Path('api/admin.js')]
          forbidden=['ver'+'cel','bw-v151','bacathegas','bacaworld','supabase.co','cloudflare','mongodb','neon']
          bad=[]
          for p in files:
              s=p.read_text(encoding='utf-8-sig').lower()
              for word in forbidden:
                  if word in s: bad.append(f'{p}:{word}')
          if bad: raise SystemExit('Infraestrutura cruzada proibida: '+', '.join(bad))
          if Path('ver'+'cel.json').exists(): raise SystemExit('config de hospedagem anterior ainda existe')
          print('REINO_TRIBAL_DENO_ISOLATION_PASS')
          PY

  powershell:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse canonical Windows entrypoints
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @(
            'REINO_TRIBAL_FINAL_UNICO.ps1',
            'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1',
            'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1',
            'RT_REINO_TRIBAL_DENO_CONFIG_FIX10.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error($file+': '+$_.Message)};throw "Parser falhou: $file"}
            Write-Host "POWERSHELL_PARSE_PASS $file"
          }
      - name: Prove canonical executors are identical FIX10
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@('REINO_TRIBAL_FINAL_UNICO.ps1','IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1','EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1')
          $hashes=@($files | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash } | Select-Object -Unique)
          if($hashes.Count -ne 1){throw 'Executores canonicos divergem.'}
          $s=[IO.File]::ReadAllText((Resolve-Path $files[0]))
          foreach($needle in @(
            "PSObject.Properties.Remove('deploy')",
            '--do-not-use-detected-build-config',
            '--runtime-mode',
            '--entrypoint',
            'deno/main.js',
            "Deno-PostJsonRaw -Url 'https://console.deno.com/auth/interactive'",
            '$env:DENO_DEPLOY_TOKEN = $denoToken',
            'function Get-TursoHostnameFromInstances',
            "'package.json'"
          )){
            if(-not $s.Contains($needle)){throw "Contrato FIX10 ausente: $needle"}
          }
          Write-Host "CANONICAL_FIX10_IDENTICAL_PASS $($hashes[0])"
      - name: Generate FIX10 executor in ValidateOnly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'FIX10-VALIDATED.ps1'
          & .\RT_REINO_TRIBAL_DENO_CONFIG_FIX10.ps1 -OutFile $out -ValidateOnly
          if(-not $? -or -not(Test-Path $out)){throw 'FIX10 ValidateOnly não gerou executor.'}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw 'Executor gerado pelo FIX10 não passa no parser.'}
          $canonical=(Get-FileHash .\REINO_TRIBAL_FINAL_UNICO.ps1 -Algorithm SHA256).Hash
          $generated=(Get-FileHash $out -Algorithm SHA256).Hash
          if($canonical -ne $generated){throw "Executor canonico diverge do FIX10 gerado: $canonical != $generated"}
          Write-Host 'CANONICAL_FIX10_VALIDATEONLY_PASS'
