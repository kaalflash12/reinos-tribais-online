name: Deploy Reino Tribal Online

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reino-tribal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Turso release before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f JOGAR_REINOS_TRIBAIS.html
          test -f reino-tribal-config.js
          test -f rt85-auth-bridge.js
          grep -q '<title>Reino Tribal</title>' index.html
          grep -q 'reino-tribal-config.js?v=1.0.4-turso' index.html
          grep -q 'rt85-auth-bridge.js?v=1.0.4-turso' index.html
          grep -q '__RT_TURSO_BRIDGE__' rt85-auth-bridge.js
          grep -q 'blockLegacySupabase:true' rt85-auth-bridge.js
          cmp -s index.html JOGAR_REINOS_TRIBAIS.html

      - name: Build production API configuration
        shell: bash
        env:
          API_BASE: ${{ vars.REINO_TRIBAL_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ]; then
            echo '::error::Repository variable REINO_TRIBAL_API_BASE is missing.'
            exit 41
          fi
          python - <<'PY'
          import json, os
          api=os.environ['API_BASE'].strip().rstrip('/')
          if not api.startswith('https://'):
              raise SystemExit('REINO_TRIBAL_API_BASE precisa ser HTTPS')
          with open('reino-tribal-config.js','w',encoding='utf-8') as f:
              f.write("'use strict';\n")
              f.write('window.REINO_TRIBAL_API_BASE = '+json.dumps(api)+';\n')
              f.write("window.REINO_TRIBAL_BACKEND = Object.freeze({provider:'turso',apiBase:window.REINO_TRIBAL_API_BASE,version:'1.0.4-turso'});\n")
          print('API_CONFIG_PASS')
          PY

      - name: Force Pages to GitHub Actions mode
        id: enable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}'

      - uses: actions/configure-pages@v5
        id: configure

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public HTTP endpoint
        id: verify
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL:-https://kaalflash12.github.io/reinos-tribais-online/}"
          echo "Checking $URL"
          ok=0
          final_code=000
          for i in $(seq 1 36); do
            final_code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$URL?health=turso-$GITHUB_SHA" || true)
            echo "attempt=$i http=$final_code"
            if [ "$final_code" = "200" ] \
              && grep -q '<title>Reino Tribal</title>' /tmp/page.html \
              && grep -q 'reino-tribal-config.js?v=1.0.4-turso' /tmp/page.html \
              && grep -q 'rt85-auth-bridge.js?v=1.0.4-turso' /tmp/page.html; then
              ok=1
              break
            fi
            sleep 5
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "http=$final_code" >> "$GITHUB_OUTPUT"
          test "$ok" = 1
          echo "PUBLIC_HTTP_PASS url=$URL sha=$GITHUB_SHA"

      - name: Write deployment diagnosis
        if: always()
        shell: bash
        env:
          ENABLE_OUTCOME: ${{ steps.enable.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PAGE_URL: ${{ steps.verify.outputs.url }}
          HTTP_CODE: ${{ steps.verify.outputs.http }}
        run: |
          python - <<'PY'
          import json,os,datetime
          raw=os.environ.get('HTTP_CODE','') or '0'
          try: code=int(raw)
          except: code=0
          data={
            'product':'Reino Tribal',
            'backend':'Turso',
            'release':'1.0.4-turso',
            'status':'online' if os.environ.get('VERIFY_OUTCOME')=='success' and code==200 else 'failed',
            'http_status':code,
            'url':os.environ.get('PAGE_URL') or 'https://kaalflash12.github.io/reinos-tribais-online/',
            'deployed_commit':os.environ['GITHUB_SHA'],
            'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('PUBLIC_DEPLOY_STATUS.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REINO_TRIBAL_TURSO_PUBLIC_PROOF
          path: PUBLIC_DEPLOY_STATUS.json
          if-no-files-found: error
