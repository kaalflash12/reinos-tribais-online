name: Package Reino Tribal v1.0.1 Final

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-reino-tribal-v1-0-1.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f3a0a732dec510b990fc9e0e7e8f1ae2dc769824
          fetch-depth: 1

      - name: Validate final source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Get-Content PRODUCT_RELEASE.json -Raw|ConvertFrom-Json
          if($release.product_name -ne 'Reino Tribal'){throw 'Nome publico incorreto.'}
          if($release.public_version -ne '1.0.1'){throw 'Versao publica incorreta.'}
          $html=Get-Content index.html -Raw
          $mirror=Get-Content JOGAR_REINOS_TRIBAIS.html -Raw
          if($html -ne $mirror){throw 'HTMLs principais divergem.'}
          if($html -notmatch '<title>Reino Tribal</title>'){throw 'Titulo publico incorreto.'}
          $loader=Get-Content rt79-village-ui.js -Raw
          if($loader -notmatch 'reino-tribal-branding\.js\?v=1\.0\.1'){throw 'Cache-bust do branding incorreto.'}
          $required=@(
            'reino-tribal-branding.js',
            'rt85-auth-bridge.js',
            'rt86-ai-director-ui.js',
            'backend/reino-tribal-v1.0.0-auth-profile-autosync.sql',
            'backend/reino-tribal-public-version-1.0.1.sql',
            'backend/reino-tribal-schema-manifest-scope-1.0.1.sql',
            'backend/PRODUCTION_DB_MANIFEST.json',
            'backend/check-production-drift.sql',
            'backend/export-production-schema-audit.sql',
            'CHANGELOG.md'
          )
          foreach($f in $required){if(-not(Test-Path -LiteralPath $f)){throw "Arquivo obrigatorio ausente: $f"}}
          $manifest=Get-Content backend/PRODUCTION_DB_MANIFEST.json -Raw|ConvertFrom-Json
          if($manifest.public_version -ne '1.0.1'){throw 'Manifesto de producao com versao errada.'}
          if($manifest.schema_manifest.overall_hash -ne '2c0f787176959f08bf4cb6cbfab409de'){throw 'Hash de schema incorreto.'}
          $assets=(Get-ChildItem assets -Recurse -File).Count
          if($assets -lt 1200){throw "Assets insuficientes: $assets"}
          node --check reino-tribal-branding.js
          node --check rt85-auth-bridge.js
          node --check rt86-ai-director-ui.js
          Write-Host "[PASS] source v1.0.1 | assets=$assets"

      - name: Build ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'reino-tribal-v1-0-1'
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          robocopy . $stage /E /XD .git .github | Out-Null
          if($LASTEXITCODE -ge 8){throw "robocopy falhou: $LASTEXITCODE"}
          $commit=(git rev-parse HEAD).Trim()
          $assets=(Get-ChildItem (Join-Path $stage 'assets') -Recurse -File).Count
          $files=(Get-ChildItem $stage -Recurse -File).Count
          [ordered]@{
            product='Reino Tribal';version='1.0.1';source_commit=$commit;
            schema_manifest_hash='2c0f787176959f08bf4cb6cbfab409de';
            generated_at=(Get-Date).ToUniversalTime().ToString('o');files=$files;assets=$assets
          }|ConvertTo-Json|Set-Content (Join-Path $stage 'REINO_TRIBAL_BUILD_INFO.json') -Encoding UTF8
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath Reino_Tribal_v1.0.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash Reino_Tribal_v1.0.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash|Set-Content Reino_Tribal_v1.0.1_SHA256.txt -Encoding ASCII
          "SOURCE_COMMIT=$commit`nSCHEMA_HASH=2c0f787176959f08bf4cb6cbfab409de`nZIP_SHA256=$hash`nFILES=$files`nASSETS=$assets"|Set-Content Reino_Tribal_v1.0.1_BUILD.txt -Encoding ASCII

      - name: Generate installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $hash=(Get-Content Reino_Tribal_v1.0.1_SHA256.txt -Raw).Trim()
          $script=@'
          [CmdletBinding()]
          param()
          $ErrorActionPreference='Stop'
          $Product='Reino Tribal'
          $Version='1.0.1'
          $ZipName='Reino_Tribal_v1.0.1.zip'
          $ExpectedHash='__HASH__'
          $InstallRoot=Join-Path $env:LOCALAPPDATA 'ReinoTribal\v1.0.1'
          function Fail([string]$Text){throw "Reino Tribal: $Text"}
          Write-Host '============================================================'
          Write-Host ' REINO TRIBAL v1.0.1 - INSTALADOR E VALIDADOR'
          Write-Host '============================================================'
          $here=Split-Path -Parent $MyInvocation.MyCommand.Path
          $candidates=@((Join-Path $here $ZipName),(Join-Path 'A:\Downloads' $ZipName),(Join-Path $env:USERPROFILE ('Downloads\'+$ZipName)))|Select-Object -Unique
          $zip=$candidates|Where-Object{Test-Path -LiteralPath $_}|Select-Object -First 1
          if(-not $zip){Fail "$ZipName nao encontrado. Deixe ZIP e PowerShell juntos ou em A:\Downloads."}
          $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $ExpectedHash){Fail "SHA-256 invalido. Esperado $ExpectedHash; recebido $actual"}
          $temp=Join-Path $env:TEMP ('REINO_TRIBAL_'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $temp|Out-Null
          try{
            Expand-Archive -LiteralPath $zip -DestinationPath $temp -Force
            foreach($f in @('index.html','PRODUCT_RELEASE.json','reino-tribal-branding.js','rt85-auth-bridge.js','rt86-ai-director-ui.js','backend\PRODUCTION_DB_MANIFEST.json','backend\reino-tribal-v1.0.0-auth-profile-autosync.sql','backend\reino-tribal-public-version-1.0.1.sql','backend\reino-tribal-schema-manifest-scope-1.0.1.sql')){if(-not(Test-Path -LiteralPath(Join-Path $temp $f))){Fail "Arquivo obrigatorio ausente: $f"}}
            $release=Get-Content (Join-Path $temp 'PRODUCT_RELEASE.json') -Raw|ConvertFrom-Json
            if($release.product_name -ne $Product -or $release.public_version -ne $Version){Fail 'Identidade/versao publica invalida.'}
            $manifest=Get-Content (Join-Path $temp 'backend\PRODUCTION_DB_MANIFEST.json') -Raw|ConvertFrom-Json
            if($manifest.schema_manifest.overall_hash -ne '2c0f787176959f08bf4cb6cbfab409de'){Fail 'Manifesto de banco invalido.'}
            $assets=(Get-ChildItem (Join-Path $temp 'assets') -Recurse -File).Count
            if($assets -lt 1200){Fail "Pacote de assets incompleto: $assets"}
            if(Test-Path -LiteralPath $InstallRoot){$backup=$InstallRoot+'_BACKUP_'+(Get-Date -Format 'yyyyMMdd_HHmmss');Move-Item $InstallRoot $backup -Force;Write-Host "[OK] Backup: $backup"}
            New-Item -ItemType Directory -Force -Path $InstallRoot|Out-Null
            Get-ChildItem -LiteralPath $temp -Force|ForEach-Object{Move-Item $_.FullName -Destination $InstallRoot -Force}
          }finally{Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue}
          $desktop=[Environment]::GetFolderPath('Desktop');$shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut((Join-Path $desktop 'Reino Tribal.lnk'));$shortcut.TargetPath=(Join-Path $InstallRoot 'index.html');$shortcut.WorkingDirectory=$InstallRoot;$shortcut.Save()
          @"
          [InternetShortcut]
          URL=https://kaalflash12.github.io/reinos-tribais-online/
          "@|Set-Content -LiteralPath (Join-Path $desktop 'Reino Tribal Online.url') -Encoding ASCII
          Write-Host '[OK] Reino Tribal v1.0.1 instalado e validado.'
          Start-Process (Join-Path $InstallRoot 'index.html')
          '@
          $script=$script.Replace('__HASH__',$hash)
          Set-Content INSTALAR_REINO_TRIBAL_v1.0.1.ps1 -Value $script -Encoding ASCII
          $errors=$null;$tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path INSTALAR_REINO_TRIBAL_v1.0.1.ps1),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw 'PowerShell final com erro de sintaxe.'}

      - name: Final integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'recheck-v101'
          Expand-Archive Reino_Tribal_v1.0.1.zip $tmp -Force
          $info=Get-Content (Join-Path $tmp 'REINO_TRIBAL_BUILD_INFO.json') -Raw|ConvertFrom-Json
          if($info.product -ne 'Reino Tribal' -or $info.version -ne '1.0.1'){throw 'Build info invalido.'}
          if($info.source_commit -ne 'f3a0a732dec510b990fc9e0e7e8f1ae2dc769824'){throw "Commit empacotado incorreto: $($info.source_commit)"}
          $hash=(Get-FileHash Reino_Tribal_v1.0.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $ps=Get-Content INSTALAR_REINO_TRIBAL_v1.0.1.ps1 -Raw
          if($ps -notmatch [regex]::Escape($hash)){throw 'Instalador nao contem hash real do ZIP.'}
          Write-Host "[PASS] Reino Tribal v1.0.1 | commit=$($info.source_commit) | files=$($info.files) | assets=$($info.assets)"

      - uses: actions/upload-artifact@v4
        with:
          name: REINO_TRIBAL_v1.0.1_FINAL
          retention-days: 90
          path: |
            Reino_Tribal_v1.0.1.zip
            INSTALAR_REINO_TRIBAL_v1.0.1.ps1
            Reino_Tribal_v1.0.1_SHA256.txt
            Reino_Tribal_v1.0.1_BUILD.txt
