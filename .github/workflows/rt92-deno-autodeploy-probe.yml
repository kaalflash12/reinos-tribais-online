name: RT92 Deno Git Autodeploy Probe

on:
  push:
    branches: [main]
    paths:
      - 'deno/main.js'

permissions:
  contents: read

jobs:
  prove-autodeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Poll public Deno health for exact main marker
        shell: bash
        run: |
          set -euo pipefail
          url='https://reino-tribal-api.mestrederpg35.deno.net/health'
          marker='rt92-oidc-autodeploy-probe-20260826'
          for i in $(seq 1 24); do
            body="$(curl --fail --silent --show-error --location --max-time 20 "$url" || true)"
            printf '%s\n' "$body"
            if printf '%s' "$body" | grep -Fq "$marker"; then
              echo 'RT92_DENO_GIT_AUTODEPLOY_PASS'
              exit 0
            fi
            sleep 15
          done
          echo 'RT92_DENO_GIT_AUTODEPLOY_NOT_PROVEN'
          exit 1
