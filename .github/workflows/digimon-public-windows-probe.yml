name: DIGIMON Gate17-18 Auto Persistence Final

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  gate17-18:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Download exact precompiled RPK payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6aa0-820e-9e16-4882a3e98a90/raw?se=2026-08-30T23%3A10%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d425480d-913d-5e29-9364-a68e62f873ae&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A49%3A42Z&ske=2026-08-31T18%3A49%3A42Z&sks=b&skv=2026-02-06&sig=WtyZzqFLuaX4rcEvpv917/JaqmqaEk1rECRsHBqYG3U%3D'
          $payload=Join-Path $env:RUNNER_TEMP 'private-runtime.zip'
          Invoke-WebRequest -UseBasicParsing $url -OutFile $payload
          $un=Join-Path $env:RUNNER_TEMP 'private-runtime';Expand-Archive $payload $un -Force
          $rpk=Join-Path $un 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          if(-not(Test-Path $rpk)){throw 'Final RPK missing'}
          $sha=(Get-FileHash $rpk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha-ne '3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw "Unexpected RPK SHA $sha"}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $final=Join-Path $env:RUNNER_TEMP 'final-project';New-Item -ItemType Directory -Force $final|Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($rpk,$final)
          if(-not(Test-Path (Join-Path $final 'module.xml'))){throw 'module.xml missing'}
          if(-not(Test-Path (Join-Path $final 'DigiTerionMon\scripts\bootstrap.lua'))){throw 'bootstrap missing'}
          $final|Set-Content (Join-Path $env:RUNNER_TEMP 'final-project.txt')
          $rpk|Set-Content (Join-Path $env:RUNNER_TEMP 'final-rpk.txt')
          @("FINAL_RPK_SHA256=$sha",'SOURCE_TRANSPORT=SIGNED_PRIVATE_ARTIFACT')|Set-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Install Firecast 8.13 and RDK 3.7b
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fc=Join-Path $env:RUNNER_TEMP 'firecast.exe'
          Invoke-WebRequest -UseBasicParsing 'https://firecast.app/downloads/firecast8_13_win64.exe' -OutFile $fc
          $p=Start-Process $fc -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne 0){throw "Firecast install failed $($p.ExitCode)"}
          $ri=Join-Path $env:RUNNER_TEMP 'rdk-installer.exe'
          Invoke-WebRequest -UseBasicParsing 'https://firecast.app/downloads/RDK3.7.b.exe' -OutFile $ri
          $p=Start-Process $ri -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne 0){throw "RDK install failed $($p.ExitCode)"}
          $rdk=Join-Path $env:LOCALAPPDATA 'FirecastSDK3\rdk.exe'
          $tester=Join-Path $env:LOCALAPPDATA 'FirecastSDK3\RRPGFichas.exe'
          if(-not(Test-Path $rdk)){throw 'RDK missing'}
          if(-not(Test-Path $tester)){throw 'RRPGFichas missing'}
          $rdk|Set-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt')
          $tester|Set-Content (Join-Path $env:RUNNER_TEMP 'tester.txt')

      - name: Build and install Gate17 autorun harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $final=(Get-Content (Join-Path $env:RUNNER_TEMP 'final-project.txt') -Raw).Trim()
          $proj=Join-Path $env:RUNNER_TEMP 'gate17-project';$plug=Join-Path $proj 'DigiTerionMon'
          New-Item -ItemType Directory -Force $plug|Out-Null
          Copy-Item (Join-Path $final 'DigiTerionMon\data') (Join-Path $plug 'data') -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $plug 'scripts')|Out-Null
          Copy-Item (Join-Path $final 'DigiTerionMon\scripts\bootstrap.lua') (Join-Path $plug 'scripts\bootstrap.lua') -Force
          @'
          <?xml version="1.0" encoding="UTF-8"?>
          <module sdkVersion="3.7"><id>DigiTerionMon.EraDaDualidade</id><version>1.0.1</version><info lang="pt-BR"><name>DIGIMON — ERA DA DUALIDADE — GATE17 AUTORUN</name><description>Persistent NDB reopen proof</description><author>CI</author></info></module>
          '@|Set-Content (Join-Path $proj 'module.xml') -Encoding UTF8
          @'
          require("vhd.lua")
          VHD.addSearchPath("/DigiTerionMon")
          VHD.addSearchPath("/DigiTerionMon/scripts")
          require("ndb.lua")
          local Bootstrap=require("scripts/bootstrap.lua")

          local function ensureRoot(db,name)
            if db[name]==nil then NDB.createChildNode(db,name) end
          end
          local function kids(n)
            if n==nil then return {} end
            return NDB.getChildNodes(n) or {}
          end
          local function fail(msg)
            showMessage("GATE17_FAIL|"..tostring(msg))
          end
          local function run()
            local db=NDB.load("gate17_358.ndb")
            NDB.onReady(db,function()
              local phase=tostring(db.gate17Phase or "")
              if phase~="PHASE1_DONE" then
                ensureRoot(db,"estruturaMesa");ensureRoot(db,"documentosCanonicos");ensureRoot(db,"trackers")
                local ensured,res=Bootstrap.ensure(db)
                if not ensured then fail("BOOTSTRAP|"..tostring(res));return end
                local audit,status=Bootstrap.runtimeAudit(db)
                if not audit then fail("AUDIT1|"..tostring(status));return end
                local tf=Bootstrap.getTracker(db,"FRAGMENTOS")
                local tn=Bootstrap.getTracker(db,"NPCS_ATIVOS")
                local to=Bootstrap.getTracker(db,"ESTADO_DAS_ORGANIZACOES")
                local fr=kids(tf and tf.registros)[1];local nr=kids(tn and tn.registros)[1];local orr=kids(to and to.registros)[1]
                if fr==nil or nr==nil or orr==nil then fail("SEED_MISSING");return end
                local fk=tostring(fr.recordKey or "");local nk=tostring(nr.recordKey or "");local oky=tostring(orr.recordKey or "")
                if fk=="" or nk=="" or oky=="" then fail("KEY_MISSING");return end
                local trackerToken=tostring(tf.persistenceToken or "")
                NDB.beginUpdate(db)
                local a,e=Bootstrap.setFragmentState(db,fk,{descoberto=true,obtido=true,portador="G17-PORTADOR",localAtual="G17-LOCAL",observacoes="G17-FRAGMENTO"})
                if a==nil then NDB.endUpdate(db);fail("FRAGMENT|"..tostring(e));return end
                local b,e2=Bootstrap.setMissionState(db,"G17-MISSION",{nome="Gate17",objetivo="Persistir",estado="ativa",capitulo="G17",cena="F1",recompensa="PROVA",observacoes="G17-MISSAO"})
                if b==nil then NDB.endUpdate(db);fail("MISSION|"..tostring(e2));return end
                local c,e3=Bootstrap.setFactState(db,"G17-FACT",{fato="Persistencia confirmavel",fonte="Gate17",descobertoEm="F1",publico=true,observacoes="G17-FATO"})
                if c==nil then NDB.endUpdate(db);fail("FACT|"..tostring(e3));return end
                local d,e4=Bootstrap.setNPCState(db,nk,{ativo=true,["local"]="G17-LOCAL",estado="G17-ESTADO",relacao="G17-RELACAO",ultimaCena="F1",observacoes="G17-NPC"})
                if d==nil then NDB.endUpdate(db);fail("NPC|"..tostring(e4));return end
                local e,e5=Bootstrap.setRouteState(db,"G17-ROUTE",{origem="A",destino="B",estado="aberta",requisitos="G17",descoberto=true,observacoes="G17-ROTA"})
                if e==nil then NDB.endUpdate(db);fail("ROUTE|"..tostring(e5));return end
                local f,e6=Bootstrap.setOrganizationState(db,oky,{descoberta=true,reputacao=17,hostilidade=3,contatos="G17",objetivos="G17",recursos="G17",missoesLiberadas="G17",fatosConhecidos="G17-ORG"})
                if f==nil then NDB.endUpdate(db);fail("ORG|"..tostring(e6));return end
                db.gate17Phase="PHASE1_DONE";db.gate17Sentinel="DIGITERION_GATE17_358"
                db.gate17FragmentKey=fk;db.gate17NPCKey=nk;db.gate17OrgKey=oky;db.gate17TrackerToken=trackerToken;db.gate17Bootstrap=Bootstrap.VERSION
                db.gate17Status1=tostring(status)
                NDB.endUpdate(db)
                showMessage("GATE17_PHASE1_PASS|"..tostring(status))
              else
                local audit,status=Bootstrap.runtimeAudit(db)
                if not audit then fail("AUDIT2|"..tostring(status));return end
                local fk=tostring(db.gate17FragmentKey or "");local nk=tostring(db.gate17NPCKey or "");local oky=tostring(db.gate17OrgKey or "")
                local fr=Bootstrap.getPersistentState(db,"FRAGMENTOS",fk)
                local mi=Bootstrap.getPersistentState(db,"MISSOES","G17-MISSION")
                local fa=Bootstrap.getPersistentState(db,"FATOS","G17-FACT")
                local np=Bootstrap.getPersistentState(db,"NPCS",nk)
                local ro=Bootstrap.getPersistentState(db,"ROTAS","G17-ROUTE")
                local og=Bootstrap.getPersistentState(db,"ORGANIZACOES",oky)
                local tf=Bootstrap.getTracker(db,"FRAGMENTOS")
                local checks={
                  tostring(db.gate17Sentinel or "")=="DIGITERION_GATE17_358",
                  tostring(db.gate17Bootstrap or "")==Bootstrap.VERSION,
                  tostring(db.bootstrapVersion or "")==Bootstrap.VERSION,
                  fr~=nil and fr.descoberto==true and fr.obtido==true and tostring(fr.portador or "")=="G17-PORTADOR" and tostring(fr.observacoes or "")=="G17-FRAGMENTO",
                  mi~=nil and tostring(mi.estado or "")=="ativa" and tostring(mi.observacoes or "")=="G17-MISSAO",
                  fa~=nil and fa.publico==true and tostring(fa.observacoes or "")=="G17-FATO",
                  np~=nil and np.ativo==true and tostring(np["local"] or "")=="G17-LOCAL" and tostring(np.observacoes or "")=="G17-NPC",
                  ro~=nil and ro.descoberto==true and tostring(ro.estado or "")=="aberta" and tostring(ro.observacoes or "")=="G17-ROTA",
                  og~=nil and og.descoberta==true and tonumber(og.reputacao or 0)==17 and tonumber(og.hostilidade or 0)==3 and tostring(og.fatosConhecidos or "")=="G17-ORG",
                  tf~=nil and tostring(tf.persistenceToken or "")==tostring(db.gate17TrackerToken or "")
                }
                for i,v in ipairs(checks) do if not v then fail("CHECK_"..tostring(i).."|"..tostring(status));return end end
                showMessage("GATE17_PHASE2_PASS|"..tostring(status))
              end
            end,function() showMessage("GATE17_NDB_OPEN_FAIL") end)
          end
          run()
          '@|Set-Content (Join-Path $proj 'init.lua') -Encoding UTF8
          $rdk=(Get-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt') -Raw).Trim()
          Push-Location $proj
          try{
            & $rdk -p;if($LASTEXITCODE-ne 0){throw 'Gate17 rdk -p failed'}
            & $rdk -c;if($LASTEXITCODE-ne 0){throw 'Gate17 rdk -c failed'}
            & $rdk -i;if($LASTEXITCODE-ne 0){throw 'Gate17 rdk -i failed'}
          }finally{Pop-Location}
          $proj|Set-Content (Join-Path $env:RUNNER_TEMP 'gate17-project.txt')
          'GATE17_HARNESS=INSTALLED'|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Gate17 phase1 create mutate and close gracefully
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes
          $tester=(Get-Content (Join-Path $env:RUNNER_TEMP 'tester.txt') -Raw).Trim()
          $tp=Start-Process $tester -PassThru
          $root=[Windows.Automation.AutomationElement]::RootElement;$marker=''
          for($i=0;$i-lt 300;$i++){
            Start-Sleep 1
            if($tp.HasExited){throw 'RRPGFichas exited before phase1 marker'}
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($el in $all){try{$n=[string]$el.Current.Name;if($n-match 'GATE17_(PHASE1_PASS|FAIL|NDB_OPEN_FAIL)'){$marker=$n;break}}catch{}}
            if($marker-ne ''){break}
          }
          $marker|Set-Content (Join-Path $env:RUNNER_TEMP 'gate17-phase1-marker.txt')
          if($marker-notmatch '^GATE17_PHASE1_PASS'){throw "Phase1 failed/timed out: $marker"}
          $ws=New-Object -ComObject WScript.Shell;[void]$ws.AppActivate($tp.Id);$ws.SendKeys('{ENTER}');Start-Sleep 3
          $tp.Refresh();if(-not $tp.HasExited){[void]$tp.CloseMainWindow()}
          if(-not $tp.WaitForExit(30000)){throw 'RRPGFichas did not close gracefully after phase1'}
          Start-Sleep 5
          "GATE17_PHASE1_MARKER=$marker"|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')
          'GATE17_PHASE1_GRACEFUL_CLOSE=1'|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Gate17 phase2 fresh process reopen and verify persistence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes
          $tester=(Get-Content (Join-Path $env:RUNNER_TEMP 'tester.txt') -Raw).Trim()
          $tp=Start-Process $tester -PassThru
          $root=[Windows.Automation.AutomationElement]::RootElement;$marker=''
          for($i=0;$i-lt 300;$i++){
            Start-Sleep 1
            if($tp.HasExited){throw 'RRPGFichas exited before phase2 marker'}
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($el in $all){try{$n=[string]$el.Current.Name;if($n-match 'GATE17_(PHASE2_PASS|FAIL|NDB_OPEN_FAIL)'){$marker=$n;break}}catch{}}
            if($marker-ne ''){break}
          }
          $marker|Set-Content (Join-Path $env:RUNNER_TEMP 'gate17-phase2-marker.txt')
          if($marker-notmatch '^GATE17_PHASE2_PASS'){throw "Phase2 failed/timed out: $marker"}
          $ws=New-Object -ComObject WScript.Shell;[void]$ws.AppActivate($tp.Id);$ws.SendKeys('{ENTER}');Start-Sleep 2
          $tp.Refresh();if(-not $tp.HasExited){[void]$tp.CloseMainWindow()}
          if(-not $tp.WaitForExit(30000)){throw 'RRPGFichas did not close gracefully after phase2'}
          "GATE17_PHASE2_MARKER=$marker"|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')
          'GATE17=PASS'|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Gate18 restore final plugin and clean runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes
          $final=(Get-Content (Join-Path $env:RUNNER_TEMP 'final-project.txt') -Raw).Trim();$rdk=(Get-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt') -Raw).Trim();$tester=(Get-Content (Join-Path $env:RUNNER_TEMP 'tester.txt') -Raw).Trim()
          Push-Location $final
          try{
            & $rdk -p;if($LASTEXITCODE-ne 0){throw 'Final rdk -p failed'}
            & $rdk -c;if($LASTEXITCODE-ne 0){throw 'Final rdk -c failed'}
            & $rdk -i;if($LASTEXITCODE-ne 0){throw 'Final rdk -i failed'}
          }finally{Pop-Location}
          $tp=Start-Process $tester -PassThru;Start-Sleep 8
          Push-Location $final;try{& $rdk -i;if($LASTEXITCODE-ne 0){throw 'Final live rdk -i failed'}}finally{Pop-Location};Start-Sleep 8
          $root=[Windows.Automation.AutomationElement]::RootElement
          $errCond=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Error')
          $err=$root.FindFirst([Windows.Automation.TreeScope]::Descendants,$errCond)
          if($err){throw 'Error window after restoring final plugin'}
          $tp.Refresh();if($tp.HasExited){throw 'RRPGFichas exited after restoring final plugin'}
          [void]$tp.CloseMainWindow();if(-not $tp.WaitForExit(30000)){throw 'Final RRPGFichas did not close gracefully'}
          @('GATE18_FINAL_ERROR=0','GATE18=PASS','OVERALL_18_OF_18=PASS')|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Collect evidence
        if: always()
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'gate17-18-evidence';New-Item -ItemType Directory -Force $out|Out-Null
          foreach($f in @('evidence.txt','gate17-phase1-marker.txt','gate17-phase2-marker.txt')){$p=Join-Path $env:RUNNER_TEMP $f;if(Test-Path $p){Copy-Item $p $out -Force}}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digimon-gate17-18-autorun-evidence
          path: ${{ runner.temp }}/gate17-18-evidence
