name: DIGIMON Direct Plugin Folder Probe

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install Firecast from Store
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe';if(-not(Test-Path $firecast)){throw 'Firecast missing'}
          $firecast|Set-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt')

      - name: Download exact RPK and make init probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-18f8-820e-bdf8-914c893ffe22/raw?se=2026-08-31T03%3A09%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=635502ab-9971-5a0d-881c-e5595ae894a2&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T12%3A00%3A59Z&ske=2026-08-31T12%3A00%3A59Z&sks=b&skv=2026-02-06&sig=um2wtwK9mhIll6Ev04yylp5NS3B3aLMDjTV55h9mmfQ%3D'
          $payload=Join-Path $env:RUNNER_TEMP 'runtime.zip';Invoke-WebRequest -UseBasicParsing $url -OutFile $payload
          $sha=(Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant();if($sha-ne '11772513bec42381a2f42b1583d0daed205627c9d328af0c6503d5e8c994af8a'){throw "payload sha $sha"}
          $d=Join-Path $env:RUNNER_TEMP 'runtime';Expand-Archive $payload $d -Force;$final=Join-Path $d 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          $rpksha=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant();if($rpksha-ne '2fc71a67cc988da637fce0d5d488a61ef807a00c675a32eb5c26334560704056'){throw "rpk sha $rpksha"}
          $probe=Join-Path $env:RUNNER_TEMP 'DigiTerionMon.EraDaDualidade.rpk'
          $env:FINAL_RPK=$final;$env:PROBE_RPK=$probe
          @'
          import zipfile,os
          src=os.environ['FINAL_RPK'];out=os.environ['PROBE_RPK']
          init='require("vhd.lua")\nVHD.addSearchPath("/DigiTerionMon")\nVHD.addSearchPath("/DigiTerionMon/scripts")\nshowMessage("GATE17_DIRECT_PLUGIN_INIT_OK")\n'
          with zipfile.ZipFile(src,'r') as zin,zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename=='init.lua': data=init.encode('utf-8')
                  zout.writestr(info,data)
          '@|Set-Content (Join-Path $env:RUNNER_TEMP 'make.py') -Encoding UTF8
          py (Join-Path $env:RUNNER_TEMP 'make.py')
          $probe|Set-Content (Join-Path $env:RUNNER_TEMP 'probe.txt')

      - name: Copy RPK to Plugins and prove init loads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes
          $firecast=(Get-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt') -Raw).Trim();$probe=(Get-Content (Join-Path $env:RUNNER_TEMP 'probe.txt') -Raw).Trim()
          Get-Process Firecast -ErrorAction SilentlyContinue|Stop-Process -Force
          $plugdir=Join-Path $env:APPDATA 'Firecast\Plugins';New-Item -ItemType Directory -Force $plugdir|Out-Null
          $dst=Join-Path $plugdir 'DigiTerionMon.EraDaDualidade.rpk';Copy-Item $probe $dst -Force
          "INSTALLED_RPK_SHA=$((Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant())"
          Start-Process $firecast;Start-Sleep 8
          $root=[Windows.Automation.AutomationElement]::RootElement;$marker='';$err=''
          for($i=0;$i-lt 60;$i++){
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){try{$n=[string]$e.Current.Name;if($n-match 'GATE17_DIRECT_PLUGIN_INIT_OK'){$marker=$n};if($n-eq 'Error'){$err='Error'}}catch{}}
            if($marker-or$err){break};Start-Sleep 1
          }
          "MARKER=$marker";"ERROR_WINDOW=$err"
          if($err){throw 'Plugin produced Error window'}
          if($marker-notmatch 'GATE17_DIRECT_PLUGIN_INIT_OK'){throw 'Direct plugin folder init marker not observed'}
          Write-Host 'DIRECT_PLUGIN_FOLDER_PASS=1'
