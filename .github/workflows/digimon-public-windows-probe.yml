name: DIGIMON Firecast Plugin UI Map

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  map:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install and launch Firecast Store
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          if(-not(Test-Path $firecast)){throw 'Firecast missing'}
          Start-Process $firecast
          Start-Sleep 12

      - name: Dump UI tree registry and Firecast paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing;Add-Type -AssemblyName System.Windows.Forms
          $out=Join-Path $env:RUNNER_TEMP 'firecast-map';New-Item -ItemType Directory -Force $out|Out-Null
          $root=[Windows.Automation.AutomationElement]::RootElement
          $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
          $lines=New-Object System.Collections.Generic.List[string]
          foreach($e in $all){try{$n=[string]$e.Current.Name;$ct=[string]$e.Current.ControlType.ProgrammaticName;$aid=[string]$e.Current.AutomationId;$r=$e.Current.BoundingRectangle;if($n-ne ''-or$aid-ne ''){$lines.Add("NAME=$n | TYPE=$ct | AID=$aid | RECT=$($r.X),$($r.Y),$($r.Width),$($r.Height)")}}catch{}}
          $lines|Set-Content (Join-Path $out 'ui.txt') -Encoding UTF8
          $b=[Windows.Forms.Screen]::PrimaryScreen.Bounds;$bmp=New-Object Drawing.Bitmap $b.Width,$b.Height;$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[Drawing.Point]::Empty,$b.Size);$bmp.Save((Join-Path $out 'screen.png'),[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()
          cmd /c 'assoc .rpk' 2>&1 | Set-Content (Join-Path $out 'assoc-rpk.txt')
          cmd /c 'ftype Firecast.Plugin' 2>&1 | Set-Content (Join-Path $out 'ftype.txt')
          Get-ChildItem $env:LOCALAPPDATA -Directory -Force -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Firecast|RRPG'} | Select-Object FullName | Format-Table -HideTableHeaders | Out-String | Set-Content (Join-Path $out 'local-dirs.txt')
          Get-ChildItem $env:APPDATA -Directory -Force -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Firecast|RRPG'} | Select-Object FullName | Format-Table -HideTableHeaders | Out-String | Set-Content (Join-Path $out 'roaming-dirs.txt')
          foreach($base in @((Join-Path $env:LOCALAPPDATA 'Firecast'),(Join-Path $env:APPDATA 'Firecast'))){if(Test-Path $base){Get-ChildItem $base -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 300 | Add-Content (Join-Path $out 'tree.txt')}}
          Get-Process Firecast -ErrorAction SilentlyContinue | Select-Object Id,MainWindowTitle,MainWindowHandle,Path | Format-List | Out-String | Set-Content (Join-Path $out 'process.txt')
          Get-Content (Join-Path $out 'ui.txt') | Select-String -Pattern 'plugin|plug-in|instalar|install|ferrament|tool|config|opç|menu' -CaseSensitive:$false | ForEach-Object {Write-Host $_}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digimon-firecast-plugin-ui-map
          path: ${{ runner.temp }}/firecast-map
