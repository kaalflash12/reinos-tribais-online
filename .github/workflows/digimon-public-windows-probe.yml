name: DIGIMON Firecast RPK Command Recovery

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install Firecast Store
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          if(-not(Test-Path $firecast)){throw 'Firecast missing'}
          $firecast|Set-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt')

      - name: Recover command strings around RPK handlers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $firecast=(Get-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt') -Raw).Trim()
          $env:FIRECAST_EXE=$firecast
          $py=@'
          import os,re
          p=os.environ['FIRECAST_EXE']; b=open(p,'rb').read()
          needles=[
            b'HandleInstallRPK',b'HandleInstallRPKFromRDKCommand',b'FCreationCommandLine',
            b'ProcessCommandLine',b'FParamStr',b'_rrpg_plugins_installPluginPackage',
            b'OnReceiveRequestRPKInstall',b'StartRPKInstallNowWithUserConsent'
          ]
          def printable_ascii(chunk):
              vals=[]
              for m in re.finditer(rb'[ -~]{3,220}',chunk):
                  s=m.group().decode('latin1','ignore').strip()
                  if s: vals.append((m.start(),s))
              return vals
          def printable_utf16(chunk):
              vals=[]
              for m in re.finditer(rb'(?:[ -~]\x00){3,220}',chunk):
                  try:s=m.group().decode('utf-16le').strip()
                  except:continue
                  if s: vals.append((m.start(),s))
              return vals
          print('=== TARGET NEIGHBORHOODS ===')
          for needle in needles:
              start=0
              while True:
                  i=b.find(needle,start)
                  if i<0: break
                  lo=max(0,i-120000); hi=min(len(b),i+120000); chunk=b[lo:hi]
                  print('\n###',needle.decode(),'OFFSET',i,'RANGE',lo,hi)
                  arr=[]
                  for off,s in printable_ascii(chunk): arr.append((off,s,'A'))
                  for off,s in printable_utf16(chunk): arr.append((off,s,'U'))
                  arr.sort()
                  keys=('rpk','install','plugin','command','rdk','param','package','external','sdk3','request','consent','file','open','sheet')
                  for off,s,k in arr:
                      sl=s.lower()
                      if any(x in sl for x in keys) or len(s)<=42:
                          print(f'{k}@{lo+off}: {s[:300]}')
                  start=i+1
          print('\n=== GLOBAL CANDIDATE TOKENS ===')
          allstrings=[]
          for off,s in printable_ascii(b): allstrings.append((off,s,'A'))
          for off,s in printable_utf16(b): allstrings.append((off,s,'U'))
          allstrings.sort()
          pats=('installrpk','rpk-install','rpk_install','rpk install','rpkfile','rpk-file','installplugin','plugininstall','plugin-install','install-plugin','rdkcommand','fromrdk','--rpk','-rpk','/rpk','--plugin','-plugin','/plugin','--install','-install','/install')
          for off,s,k in allstrings:
              sl=s.lower()
              if any(x in sl for x in pats): print(f'{k}@{off}: {s[:500]}')
          '@
          $p=Join-Path $env:RUNNER_TEMP 'recover.py';$py|Set-Content $p -Encoding UTF8
          py $p | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'rpk-command-recovery.txt')

      - name: Probe built-in help variants
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $firecast=(Get-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt') -Raw).Trim()
          $out=Join-Path $env:RUNNER_TEMP 'firecast-help-probes.txt'
          foreach($arg in @('--help','-h','/?','/help','help','--version','-v')){
            "=== ARG $arg ==="|Add-Content $out
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=$firecast;$psi.Arguments=$arg;$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$psi.CreateNoWindow=$true
            $p=New-Object System.Diagnostics.Process;$p.StartInfo=$psi
            try{[void]$p.Start();if(-not$p.WaitForExit(4000)){$p.Kill()};$p.StandardOutput.ReadToEnd()|Add-Content $out;$p.StandardError.ReadToEnd()|Add-Content $out}catch{$_|Out-String|Add-Content $out}
          }
          Get-Content $out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digimon-firecast-rpk-command-recovery
          path: |
            ${{ runner.temp }}/rpk-command-recovery.txt
            ${{ runner.temp }}/firecast-help-probes.txt
