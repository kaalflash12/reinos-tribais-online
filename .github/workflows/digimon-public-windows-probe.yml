name: DIGIMON Gate 17-18 Temporary Runner

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  gate17:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download exact temporary private bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          py -m pip install --disable-pip-version-check --quiet gdown
          $z=Join-Path $env:GITHUB_WORKSPACE 'gate17-bundle.zip'
          py -m gdown 'https://drive.google.com/uc?id=1LWaYGuvoVLQ-TP3Yj0nqVprosbmYe_1b' -O $z
          $sha=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha-ne '42094ab528b6f2139b0f2b09ef6741fb3a5640b5ba0f45041270c9e1f3d70bdb'){throw "Unexpected bundle SHA $sha"}
          Expand-Archive $z (Join-Path $env:GITHUB_WORKSPACE 'gate17-bundle') -Force
      - name: Execute Gate 17 and Gate 18
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'gate17-bundle\run_gate17.ps1')
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digimon-gate17-18-final-evidence
          path: ${{ github.workspace }}/gate17-bundle/gate17-output
