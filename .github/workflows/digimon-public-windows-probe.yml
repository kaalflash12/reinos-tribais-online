name: DIGIMON Gate 17-18 Autorun Final

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download exact private runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'payload.zip'
          Invoke-WebRequest -UseBasicParsing 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6620-820e-aa1b-fa63e9c637f3/raw?se=2026-08-30T23%3A20%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=81d5b86f-209d-5b05-b76b-c57deb1cd480&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T11%3A35%3A08Z&ske=2026-08-31T11%3A35%3A08Z&sks=b&skv=2026-02-06&sig=lIETsTmAq/pDAxhlKrv97%2B5TJRfSyvzVcnz6Sv63eow%3D' -OutFile $zip
          $dst=Join-Path $env:RUNNER_TEMP 'payload'
          Expand-Archive $zip $dst -Force
          $srcZip=Join-Path $dst 'final-source.zip'
          $rpk=Join-Path $dst 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          if(-not(Test-Path $srcZip)){throw 'final-source.zip missing'}
          if(-not(Test-Path $rpk)){throw 'final RPK missing'}
          $srcSha=(Get-FileHash $srcZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $rpkSha=(Get-FileHash $rpk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($srcSha-ne '0dde069bbe7a53e88d027f31d4ebfc4d25fee7f1f51b91fdd8e66199d2f65624'){throw "Unexpected source SHA $srcSha"}
          if($rpkSha-ne '2fc71a67cc988da637fce0d5d488a61ef807a00c675a32eb5c26334560704056'){throw "Unexpected RPK SHA $rpkSha"}
          @("SOURCE_SHA256=$srcSha","FINAL_RPK_SHA256=$rpkSha")|Set-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Install Firecast 8.13 and RDK 3.7b
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fc=Join-Path $env:RUNNER_TEMP 'firecast.exe'
          Invoke-WebRequest -UseBasicParsing 'https://firecast.app/downloads/firecast8_13_win64.exe' -OutFile $fc
          $p=Start-Process $fc -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne 0){throw "Firecast install failed $($p.ExitCode)"}
          $ri=Join-Path $env:RUNNER_TEMP 'rdk-installer.exe'
          Invoke-WebRequest -UseBasicParsing 'https://firecast.app/downloads/RDK3.7.b.exe' -OutFile $ri
          $p=Start-Process $ri -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne 0){throw "RDK install failed $($p.ExitCode)"}
          $rdk=Join-Path $env:LOCALAPPDATA 'FirecastSDK3\rdk.exe'
          $tester=Join-Path $env:LOCALAPPDATA 'FirecastSDK3\RRPGFichas.exe'
          if(-not(Test-Path $rdk)){throw 'RDK missing'}
          if(-not(Test-Path $tester)){throw 'RRPGFichas missing'}
          $rdk|Set-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt')
          $tester|Set-Content (Join-Path $env:RUNNER_TEMP 'tester.txt')
          @('FIRECAST_INSTALL_EXIT=0','RDK_INSTALL_EXIT=0')|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Revalidate exact final build and install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $payload=Join-Path $env:RUNNER_TEMP 'payload'
          $src=Join-Path $env:RUNNER_TEMP 'source'
          Expand-Archive (Join-Path $payload 'final-source.zip') $src -Force
          $proj=Join-Path $src 'PROJETO_SDK3'
          $rdk=(Get-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt') -Raw).Trim()
          Push-Location $proj
          try{
            & $rdk -p; if($LASTEXITCODE-ne 0){throw 'rdk -p failed'}
            & $rdk -c; if($LASTEXITCODE-ne 0){throw 'rdk -c failed'}
            $rpks=@(Get-ChildItem $proj -Recurse -Filter '*.rpk' -File)
            if($rpks.Count-ne 1){throw "Expected 1 RPK, got $($rpks.Count)"}
            $sha=(Get-FileHash $rpks[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha-ne '2fc71a67cc988da637fce0d5d488a61ef807a00c675a32eb5c26334560704056'){throw "Recompiled RPK SHA mismatch $sha"}
            & $rdk -i; if($LASTEXITCODE-ne 0){throw 'rdk -i failed'}
          }finally{Pop-Location}
          $proj|Set-Content (Join-Path $env:RUNNER_TEMP 'final-project.txt')
          @('GATE14=PASS','GATE15=PASS')|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Build autorun Gate 17 harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $final=(Get-Content (Join-Path $env:RUNNER_TEMP 'final-project.txt') -Raw).Trim()
          $g17=Join-Path $env:RUNNER_TEMP 'gate17-project'
          Copy-Item $final $g17 -Recurse -Force
          @'
          require("vhd.lua")
          VHD.addSearchPath("/DigiTerionMon")
          VHD.addSearchPath("/DigiTerionMon/scripts")
          require("ndb.lua")
          local Bootstrap=require("scripts/bootstrap.lua")

          local DB_NAME="gate17_358.ndb"
          local SENTINEL="DIGITERION_GATE17_AUTORUN_V2"
          local MISSION_ID="G17-MISSION-PERSIST"
          local FACT_ID="G17-FACT-PERSIST"
          local ROUTE_ID="G17-ROUTE-PERSIST"

          local function childNodes(node)
            if node==nil then return {} end
            return NDB.getChildNodes(node) or {}
          end

          local function firstRecord(tracker)
            if tracker==nil or tracker.registros==nil then return nil end
            local list=childNodes(tracker.registros)
            return list[1]
          end

          local function fail(code,detail)
            showMessage("GATE17_FAIL|"..tostring(code).."|"..tostring(detail or ""))
          end

          local db=NDB.load(DB_NAME)
          NDB.onReady(db,function()
            local phase=tostring(db.gate17Sentinel or "")
            if phase=="" then
              local ensured,res=Bootstrap.ensure(db)
              if not ensured then fail("ENSURE",res); return end
              local audit,status=Bootstrap.runtimeAudit(db)
              if not audit then fail("AUDIT1",status); return end
              local frTracker=Bootstrap.getTracker(db,"FRAGMENTOS")
              local npcTracker=Bootstrap.getTracker(db,"NPCS_ATIVOS")
              local orgTracker=Bootstrap.getTracker(db,"ESTADO_DAS_ORGANIZACOES")
              local fr=firstRecord(frTracker); local npc=firstRecord(npcTracker); local org=firstRecord(orgTracker)
              if fr==nil or npc==nil or org==nil then fail("SEED","fragment/npc/org missing"); return end
              local frKey=tostring(fr.recordKey or fr.canonicalPath or "")
              local npcKey=tostring(npc.recordKey or npc.canonicalId or "")
              local orgKey=tostring(org.recordKey or org.canonicalPath or "")
              if frKey=="" or npcKey=="" or orgKey=="" then fail("KEYS","empty canonical key"); return end
              local okBegin=pcall(function() NDB.beginUpdate(db) end)
              local f1,e1=Bootstrap.setFragmentState(db,frKey,{descoberto=true,obtido=true,portador="GATE17_PORTADOR",localAtual="GATE17_LOCAL",observacoes="GATE17_FRAGMENT_OK"})
              local m1,e2=Bootstrap.setMissionState(db,MISSION_ID,{nome="Missão Gate 17",objetivo="Persistir",estado="ativa",capitulo="G17",cena="F1",recompensa="OK",observacoes="GATE17_MISSION_OK"})
              local fa1,e3=Bootstrap.setFactState(db,FACT_ID,{fato="Fato persistente Gate17",fonte="autorun",descobertoEm="F1",publico=true,observacoes="GATE17_FACT_OK"})
              local n1,e4=Bootstrap.setNPCState(db,npcKey,{ativo=true,["local"]="GATE17_NPC_LOCAL",estado="ferido",relacao="aliado",ultimaCena="F1",observacoes="GATE17_NPC_OK"})
              local r1,e5=Bootstrap.setRouteState(db,ROUTE_ID,{origem="G17-A",destino="G17-B",estado="aberta",requisitos="nenhum",descoberto=true,observacoes="GATE17_ROUTE_OK"})
              local o1,e6=Bootstrap.setOrganizationState(db,orgKey,{descoberta=true,reputacao=17,hostilidade=3,contatos="GATE17_CONTATO",objetivos="GATE17_OBJ",recursos="GATE17_REC",missoesLiberadas="G17",fatosConhecidos="GATE17_ORG_OK"})
              if okBegin then pcall(function() NDB.endUpdate(db) end) end
              if not f1 or not m1 or not fa1 or not n1 or not r1 or not o1 then fail("WRITE",table.concat({tostring(e1),tostring(e2),tostring(e3),tostring(e4),tostring(e5),tostring(e6)},"|")); return end
              NDB.beginUpdate(db)
              db.gate17Sentinel=SENTINEL; db.gate17PhaseOne="PASS"; db.gate17Bootstrap=Bootstrap.VERSION
              db.gate17FragmentKey=frKey; db.gate17NPCKey=npcKey; db.gate17OrgKey=orgKey
              db.gate17TrackerToken=tostring(frTracker.persistenceToken or ""); db.gate17Audit1=tostring(status)
              NDB.endUpdate(db)
              if tostring(db.gate17TrackerToken or "")=="" then fail("TOKEN1","empty tracker token"); return end
              showMessage("GATE17_PHASE1_PASS|"..tostring(status)); return
            end
            if phase~=SENTINEL then fail("SENTINEL",phase); return end
            if tostring(db.gate17PhaseOne or "")~="PASS" then fail("PHASE1_FLAG",db.gate17PhaseOne); return end
            if tostring(db.gate17Bootstrap or "")~=Bootstrap.VERSION then fail("BOOTSTRAP_STORED",db.gate17Bootstrap); return end
            local audit,status=Bootstrap.runtimeAudit(db)
            if not audit then fail("AUDIT2",status); return end
            if tostring(db.bootstrapVersion or "")~=Bootstrap.VERSION then fail("BOOTSTRAP_REOPEN",db.bootstrapVersion); return end
            local frKey=tostring(db.gate17FragmentKey or ""); local npcKey=tostring(db.gate17NPCKey or ""); local orgKey=tostring(db.gate17OrgKey or "")
            local fr=Bootstrap.getPersistentState(db,"FRAGMENTOS",frKey)
            local mi=Bootstrap.getPersistentState(db,"MISSOES",MISSION_ID)
            local fa=Bootstrap.getPersistentState(db,"FATOS",FACT_ID)
            local np=Bootstrap.getPersistentState(db,"NPCS",npcKey)
            local ro=Bootstrap.getPersistentState(db,"ROTAS",ROUTE_ID)
            local og=Bootstrap.getPersistentState(db,"ORGANIZACOES",orgKey)
            local tr=Bootstrap.getTracker(db,"FRAGMENTOS")
            local checks={
              fr~=nil and fr.descoberto==true and fr.obtido==true and tostring(fr.portador or "")=="GATE17_PORTADOR" and tostring(fr.observacoes or "")=="GATE17_FRAGMENT_OK",
              mi~=nil and tostring(mi.estado or "")=="ativa" and tostring(mi.observacoes or "")=="GATE17_MISSION_OK",
              fa~=nil and fa.publico==true and tostring(fa.observacoes or "")=="GATE17_FACT_OK",
              np~=nil and np.ativo==true and tostring(np["local"] or "")=="GATE17_NPC_LOCAL" and tostring(np.estado or "")=="ferido" and tostring(np.observacoes or "")=="GATE17_NPC_OK",
              ro~=nil and ro.descoberto==true and tostring(ro.estado or "")=="aberta" and tostring(ro.observacoes or "")=="GATE17_ROUTE_OK",
              og~=nil and og.descoberta==true and tonumber(og.reputacao or -1)==17 and tonumber(og.hostilidade or -1)==3 and tostring(og.fatosConhecidos or "")=="GATE17_ORG_OK",
              tr~=nil and tostring(tr.persistenceToken or "")~="" and tostring(tr.persistenceToken or "")==tostring(db.gate17TrackerToken or "")
            }
            for i,v in ipairs(checks) do if not v then fail("CHECK"..tostring(i),status); return end end
            showMessage("GATE17_PHASE2_PASS|"..tostring(status))
          end,function() showMessage("GATE17_NDB_OPEN_FAIL") end)
          '@ | Set-Content (Join-Path $g17 'init.lua') -Encoding UTF8
          $rdk=(Get-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt') -Raw).Trim()
          Push-Location $g17
          try{
            & $rdk -p; if($LASTEXITCODE-ne 0){throw 'Gate17 rdk -p failed'}
            & $rdk -c; if($LASTEXITCODE-ne 0){throw 'Gate17 rdk -c failed'}
            & $rdk -i; if($LASTEXITCODE-ne 0){throw 'Gate17 rdk -i failed'}
          }finally{Pop-Location}
          $g17|Set-Content (Join-Path $env:RUNNER_TEMP 'gate17-project.txt')
          'GATE17_HARNESS=INSTALLED'|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Gate 17 phase 1 create and mutate persistent NDB
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $tester=(Get-Content (Join-Path $env:RUNNER_TEMP 'tester.txt') -Raw).Trim()
          $tp=Start-Process $tester -PassThru
          $root=[Windows.Automation.AutomationElement]::RootElement
          $marker=''
          for($i=0;$i-lt 360;$i++){
            if($tp.HasExited){throw 'RRPGFichas exited before phase1 marker'}
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){try{$n=[string]$e.Current.Name;if($n-match 'GATE17_(PHASE1_PASS|FAIL|NDB_OPEN_FAIL)'){$marker=$n;break}}catch{}}
            if($marker-ne ''){break}
            Start-Sleep -Milliseconds 500
          }
          $marker|Set-Content (Join-Path $env:RUNNER_TEMP 'gate17-phase1-marker.txt')
          if($marker-notmatch '^GATE17_PHASE1_PASS'){throw "Gate17 phase1 failed: $marker"}
          $ws=New-Object -ComObject WScript.Shell;[void]$ws.AppActivate($tp.Id);$ws.SendKeys('{ENTER}');Start-Sleep 2
          if(-not $tp.CloseMainWindow()){throw 'Gate17 phase1 could not request graceful close'}
          if(-not $tp.WaitForExit(30000)){throw 'Gate17 phase1 did not close gracefully'}
          "GATE17_PHASE1_MARKER=$marker"|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')
          'GATE17_PHASE1=PASS'|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Gate 17 phase 2 fresh process verifies persisted state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $tester=(Get-Content (Join-Path $env:RUNNER_TEMP 'tester.txt') -Raw).Trim()
          $tp=Start-Process $tester -PassThru
          $root=[Windows.Automation.AutomationElement]::RootElement
          $marker=''
          for($i=0;$i-lt 360;$i++){
            if($tp.HasExited){throw 'RRPGFichas exited before phase2 marker'}
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){try{$n=[string]$e.Current.Name;if($n-match 'GATE17_(PHASE2_PASS|FAIL|NDB_OPEN_FAIL)'){$marker=$n;break}}catch{}}
            if($marker-ne ''){break}
            Start-Sleep -Milliseconds 500
          }
          $marker|Set-Content (Join-Path $env:RUNNER_TEMP 'gate17-phase2-marker.txt')
          if($marker-notmatch '^GATE17_PHASE2_PASS'){throw "Gate17 phase2 failed: $marker"}
          $ws=New-Object -ComObject WScript.Shell;[void]$ws.AppActivate($tp.Id);$ws.SendKeys('{ENTER}');Start-Sleep 2
          if(-not $tp.CloseMainWindow()){throw 'Gate17 phase2 could not request graceful close'}
          if(-not $tp.WaitForExit(30000)){throw 'Gate17 phase2 did not close gracefully'}
          "GATE17_PHASE2_MARKER=$marker"|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')
          'GATE17=PASS'|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Gate 18 restore exact final plugin and final smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $rdk=(Get-Content (Join-Path $env:RUNNER_TEMP 'rdk.txt') -Raw).Trim()
          $proj=(Get-Content (Join-Path $env:RUNNER_TEMP 'final-project.txt') -Raw).Trim()
          Push-Location $proj
          try{& $rdk -i;if($LASTEXITCODE-ne 0){throw 'Final restore install failed'}}finally{Pop-Location}
          $tester=(Get-Content (Join-Path $env:RUNNER_TEMP 'tester.txt') -Raw).Trim()
          $tp=Start-Process $tester -PassThru
          Start-Sleep 12
          if($tp.HasExited){throw 'RRPGFichas exited during final smoke'}
          $root=[Windows.Automation.AutomationElement]::RootElement
          $errCond=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Error')
          if($root.FindFirst([Windows.Automation.TreeScope]::Descendants,$errCond)){throw 'Error after final plugin restore'}
          if(-not $tp.CloseMainWindow()){throw 'Final RRPGFichas graceful close failed'}
          if(-not $tp.WaitForExit(30000)){throw 'Final RRPGFichas did not close'}
          @('GATE18_FINAL_ERROR=0','GATE18=PASS','OVERALL_18_OF_18=PASS')|Add-Content (Join-Path $env:RUNNER_TEMP 'evidence.txt')

      - name: Collect non-source evidence
        if: always()
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'digimon-g17-g18-evidence'
          New-Item -ItemType Directory -Force $out|Out-Null
          foreach($f in @('evidence.txt','gate17-phase1-marker.txt','gate17-phase2-marker.txt')){
            $p=Join-Path $env:RUNNER_TEMP $f
            if(Test-Path $p){Copy-Item $p $out -Force}
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digimon-gate17-gate18-evidence-only
          path: ${{ runner.temp }}/digimon-g17-g18-evidence
