name: DIGIMON Firecast Tester Mode Probe

on:
  push:
    branches: [digimon-ci-public-probe-20260830]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install Firecast Store
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe';if(-not(Test-Path $firecast)){throw 'Firecast missing'}
          $firecast|Set-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt')

      - name: Scan executable and resources for tester switches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $firecast=(Get-Content (Join-Path $env:RUNNER_TEMP 'firecast.txt') -Raw).Trim()
          $py=@'
          import os,re,zipfile
          exe=os.environ['FIRECAST_EXE']
          data=open(exe,'rb').read()
          def ascii_strings(b,minlen=4):
              return (m.group().decode('latin1','ignore') for m in re.finditer(rb'[ -~]{%d,}'%minlen,b))
          def utf16_strings(b,minlen=4):
              pat=rb'(?:[ -~]\x00){%d,}'%minlen
              return (m.group().decode('utf-16le','ignore') for m in re.finditer(pat,b))
          terms=('rrpgfichas','sheettemplate','rpk','plugin','ficha','sheet','tester','teste','commandline','paramstr','--','/test','-test','sdk3')
          seen=set();hits=[]
          for s in list(ascii_strings(data))+list(utf16_strings(data)):
              sl=s.lower()
              if any(t in sl for t in terms):
                  s=s.strip()
                  if s and s not in seen:
                      seen.add(s);hits.append(s)
          print('=== FIRECAST EXE MATCHES ===')
          for s in hits[:1200]: print(s[:500])
          res=os.path.join(os.path.dirname(exe),'resource.zip')
          print('=== RESOURCE ZIP ===')
          if zipfile.is_zipfile(res):
              with zipfile.ZipFile(res) as z:
                  print('entries',len(z.namelist()))
                  for n in z.namelist():
                      nl=n.lower()
                      if any(t in nl for t in ('plugin','ficha','sheet','sdk','rrpg')): print('NAME',n)
                  for n in z.namelist():
                      if n.lower().endswith(('.lua','.txt','.xml','.json')):
                          try: s=z.read(n).decode('utf-8','ignore')
                          except: continue
                          if any(t in s.lower() for t in ('paramstr','commandline','rrpgfichas','sheettemplate','installplugin')):
                              print('FILE',n)
                              for line in s.splitlines():
                                  if any(t in line.lower() for t in ('paramstr','commandline','rrpgfichas','sheettemplate','installplugin')):
                                      print(line[:700])
          '@
          $env:FIRECAST_EXE=$firecast;$p=Join-Path $env:RUNNER_TEMP 'scan.py';$py|Set-Content $p -Encoding UTF8;py $p
