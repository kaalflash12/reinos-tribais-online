name: RT76 Apply Master Plan

on:
  push:
    paths:
      - 'rt76-apply-trigger.txt'

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar RT76 no HTML real
        run: python tools/apply_rt76_plan.py
      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check rt76-runtime.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          assert h==Path('JOGAR_REINOS_TRIBAIS.html').read_text(encoding='utf-8')
          out=Path('/tmp/rt76-js');out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          for i,s in enumerate([x for x in scripts if x.strip()],1):(out/f'{i:03}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/rt76-js/*.js; do node --check "$f"; done
      - name: Preparar Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Servir build candidata
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/rt76-http.log 2>&1 &
          sleep 2
      - name: Regressão integral desktop e mobile
        shell: bash
        run: |
          sed -i "s/'RT75' in base\['title'\]/'RT76' in base['title']/" tools/rt76_full_regression_current.py
          python tools/rt76_full_regression_current.py
      - name: Publicar somente após PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaalflash12"
          git config user.email "mestrederpg35@gmail.com"
          git add JOGAR_REINOS_TRIBAIS.html index.html rt76-runtime.js AUDITORIA_RT76_PLANO_APLICADO.json
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "RT76.1 aplicar Central de Guerra Smart Farm Mercado 2.0 Gerente 2.0"
          git push origin main
      - name: Evidências mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT76_PLANO_EVIDENCIAS
          path: |
            RT76_EVIDENCIAS_ATUAIS
            AUDITORIA_RT76_PLANO_APLICADO.json
          if-no-files-found: warn
