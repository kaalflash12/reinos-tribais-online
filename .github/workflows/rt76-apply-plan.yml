name: RT76 Apply Master Plan

on:
  push:
    paths:
      - 'rt76-apply-trigger.txt'

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar RT76 no HTML real
        run: python tools/apply_rt76_plan.py
      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check rt76-runtime.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          assert h==Path('JOGAR_REINOS_TRIBAIS.html').read_text(encoding='utf-8')
          out=Path('/tmp/rt76-js');out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          for i,s in enumerate([x for x in scripts if x.strip()],1):(out/f'{i:03}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/rt76-js/*.js; do node --check "$f"; done
      - name: Preparar Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Servir build candidata
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/rt76-http.log 2>&1 &
          sleep 2
      - name: Ajustar auditoria para a regra visual real RT76
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rt76_full_regression_current.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("check(f'{prefix}.title_rt75','RT75' in base['title'],base['title'])","check(f'{prefix}.title_rt76','RT76' in base['title'],base['title'])")
          s=s.replace("const broken=[...document.images].filter(i=>vis(i)&&(!i.complete||i.naturalWidth===0))","const broken=[...document.images].filter(i=>vis(i)&&i.complete&&i.naturalWidth===0)")
          old="""    page.wait_for_timeout(180)\n    d=diag(page)"""
          new="""    page.wait_for_timeout(180)\n    try:\n        page.wait_for_function(\"\"\"() => [...document.images].filter(i=>{const r=i.getBoundingClientRect(),s=getComputedStyle(i);return s.display!=='none'&&s.visibility!=='hidden'&&r.width>1&&r.height>1&&r.bottom>=0&&r.top<=innerHeight}).every(i=>i.complete&&i.naturalWidth>0)\"\"\",timeout=5000)\n    except Exception:\n        pass\n    d=diag(page)"""
          if old not in s: raise SystemExit('capture_view anchor not found')
          s=s.replace(old,new,1)
          a=s.index('def set_all_buildings_for_tier(page,tier):')
          b=s.index('\ndef audit_village(page,prefix):',a)
          func='''def set_all_buildings_for_tier(page,tier):\n    return page.evaluate(\'\'\'(payload)=>{\n      const v=getActiveVillage(), keys=payload.keys, tier=payload.tier, chosen={};\n      state.player.research.completed=[]; state.player.research.queue=[];\n      v.unitResearch={}; v.unitResearchQueue=[]; v.buildQueue=[]; v.points=0;\n      for(const k of keys) v.buildings[k]=1;\n      for(const k of keys){\n        const max=D.buildings[k].max||30; let found=0;\n        if(max<=3){ found=Math.min(max,tier); v.buildings[k]=found; chosen[k]=found; continue; }\n        for(let lvl=1;lvl<=max;lvl++){\n          v.buildings[k]=lvl;\n          if(getBuildingVisual(v,k).tier===tier){found=lvl;break;}\n        }\n        if(!found) found=max;\n        v.buildings[k]=found; chosen[k]=found;\n      }\n      const levelScore=Object.values(v.buildings).reduce((a,b)=>a+(Number(b)||0),0)*42;\n      const target=[0,2600,8500,18500][tier-1];\n      v.points=Math.max(0,target-levelScore);\n      currentView='overview'; renderAll();\n      return {levels:chosen,points:v.points,levelScore,stage:getVillageVisualStage(v).stage};\n    }\'\'\',{'keys':BUILDINGS,'tier':tier})\n'''
          s=s[:a]+func+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regressão integral desktop e mobile
        run: python tools/rt76_full_regression_current.py
      - name: Testar especificamente Central de Guerra Smart Farm Mercado e Gerente
        run: python tools/rt76_feature_e2e.py
      - name: Publicar somente após TODOS os PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaalflash12"
          git config user.email "mestrederpg35@gmail.com"
          git add JOGAR_REINOS_TRIBAIS.html index.html rt76-runtime.js AUDITORIA_RT76_PLANO_APLICADO.json
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "RT76.1 integrar plano mestre e validar funções novas"
          git push origin main
      - name: Evidências mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT76_PLANO_EVIDENCIAS
          path: |
            RT76_EVIDENCIAS_ATUAIS
            RT76_FEATURE_E2E
            AUDITORIA_RT76_PLANO_APLICADO.json
          if-no-files-found: warn
