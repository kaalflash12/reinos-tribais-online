name: RT79.1 Legacy Startup Hotfix
on:
  push:
    branches: [main]
    paths:
      - 'RT79_LEGACY_STARTUP_HOTFIX_TRIGGER.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply legacy startup-loop hotfix
        run: |
          python tools/rt79_fix_legacy_startup_loops.py
          node --check rt76-master-plan.js
          node --check rt76-runtime.js
          node --check rt76-map-ai.js
          grep -F "if(legacyTitle!==document.title) document.title=legacyTitle;" rt76-master-plan.js
          grep -F "__RT78_ADMIN_LOADER_DISABLED_BY_RT79__" rt76-master-plan.js
          grep -F "const observer=new MutationObserver(scheduleEnsure)" rt76-master-plan.js
          grep -F "const scheduleInject=" rt76-runtime.js
          grep -F "const scheduleInject=" rt76-map-ai.js
      - name: Commit stabilized legacy runtime
        run: |
          if ! git diff --quiet -- rt76-master-plan.js rt76-runtime.js rt76-map-ai.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rt76-master-plan.js rt76-runtime.js rt76-map-ai.js
            git commit -m 'RT79.1: stabilize legacy startup observers'
            git push origin HEAD:main
          fi
