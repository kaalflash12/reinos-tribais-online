name: RT72 Consolidar Tudo

on:
  push:
    paths:
      - rt72-trigger.txt

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar RT72
        run: python tools/rt72_consolidate.py
      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/rt72-js');out.mkdir(exist_ok=True)
          n=0
          for s in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              if not s.strip(): continue
              n+=1
              (out/f'{n:03}.js').write_text(s,encoding='utf-8')
          print(n)
          PY
          for f in /tmp/rt72-js/*.js; do node --check "$f" >/dev/null; done
      - name: Commit RT72
        shell: bash
        run: |
          git config user.name 'Reinos Tribais RT72'
          git config user.email 'rt72@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html AUDITORIA_RT72_CONSOLIDADA.json
          git commit -m 'RT72 consolida aldeia admin menus assets e versao'
          git push origin HEAD:main
