name: RT79 Browser Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Syntax checks
        shell: pwsh
        run: |
          node --check rt79-suite.js
          node --check rt79-admin-suite.js
          node --check rt78-manager-suite.js
          python -m py_compile tools/rt79_browser_regression.py
      - name: Run Edge Chromium regression against public RT79
        shell: pwsh
        run: python tools/rt79_browser_regression.py
      - name: Upload RT79 browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT79_BROWSER_REGRESSION
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn
