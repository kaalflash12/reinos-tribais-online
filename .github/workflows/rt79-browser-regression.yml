name: RT80 Functional Browser Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Syntax and build checks
        shell: pwsh
        run: |
          node --check rt79-suite.js
          node --check rt79-admin-suite.js
          node --check rt79-groups-addon.js
          node --check rt79-logistics-ai-addon.js
          node --check rt79-village-ui.js
          node --check rt79-admin-logistics-addon.js
          node --check rt78-manager-suite.js
          node --check rt76-map-ai.js
          node --check rt80-visual-system.js
          node --check rt80-admin-runtime.js
          python -m py_compile tools/rt79_chrome_fast_regression.py
          $html = Get-Content index.html -Raw
          if ($html -notmatch 'const VERSION = 79;') { throw 'Schema de save esperado = 79.' }
          if ($html -notmatch 'const RT_BUILD = "80.5";') { throw 'Build físico esperado = RT80.5.' }
          if ($html -notmatch 'rt79-suite\.js\?v=79\.1') { throw 'Núcleo estratégico RT79 não está carregado no build RT80.5.' }
          if ($html -notmatch '77,78,79\]\.includes\(Number\(parsed\.version\)\)') { throw 'Loader não aceita o schema 79 atual.' }
      - name: Start local game server
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
          $p.Id | Set-Content "$env:RUNNER_TEMP\rt80_http_pid.txt"
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/index.html | Out-Null
      - name: Run Windows Chrome functional regression
        shell: pwsh
        env:
          RT79_TEST_URL: http://127.0.0.1:8765/
        run: python tools/rt79_chrome_fast_regression.py
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT80_FUNCTIONAL_BROWSER_REGRESSION
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn

  rt95-reset-and-prove:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Execute reversible Turso admin reset and public proof
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:RUNNER_TEMP 'rt95_turso_admin_reset_proof.ps1'
          curl.exe --fail --silent --show-error --location --retry 4 --retry-all-errors --output $script https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/main/tools/rt95_turso_admin_reset_proof.ps1
          if($LASTEXITCODE -ne 0){throw 'RT95_SCRIPT_DOWNLOAD_FAILED'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if($LASTEXITCODE -ne 0){throw "RT95_SCRIPT_FAILED_$LASTEXITCODE"}
      - name: Upload final proof without plaintext credentials
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RT95_FINAL_ADMIN_PROOF
          path: ${{ runner.temp }}\RT95_FINAL_ADMIN_PROOF
          if-no-files-found: error
