name: RT79 Browser Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Syntax checks
        shell: pwsh
        run: |
          node --check rt79-suite.js
          node --check rt79-admin-suite.js
          node --check rt79-groups-addon.js
          node --check rt79-logistics-ai-addon.js
          node --check rt79-village-ui.js
          node --check rt79-admin-logistics-addon.js
          node --check rt78-manager-suite.js
          python -m py_compile tools/rt79_chrome_fast_regression.py tools/promote_rt79_1.py
      - name: Start game server on runner network
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Sort-Object InterfaceMetric | Select-Object -First 1 -ExpandProperty IPAddress)
          if (-not $ip) { throw 'Nenhum IPv4 do runner encontrado.' }
          "RT79_TEST_URL=http://$ip`:8765/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $p = Start-Process python -ArgumentList '-m','http.server','8765','--bind','0.0.0.0' -PassThru -WindowStyle Hidden
          $p.Id | Set-Content "$env:RUNNER_TEMP\rt79_http_pid.txt"
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing "http://$ip`:8765/index.html" | Out-Null
          Write-Host "Browser test URL: http://$ip`:8765/"
      - name: Run Windows Chrome functional regression
        shell: pwsh
        run: python tools/rt79_chrome_fast_regression.py
      - name: Promote RT79.1 physical HTML on review branch
        if: github.event_name == 'pull_request' && github.head_ref == 'rt79-1-full-review'
        shell: pwsh
        run: |
          python tools/promote_rt79_1.py
          $changes = git status --porcelain -- index.html JOGAR_REINOS_TRIBAIS.html
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html JOGAR_REINOS_TRIBAIS.html
            git commit -m "RT79.1: promote physical game HTML after Chrome gate"
            git push origin "HEAD:${{ github.head_ref }}"
          } else {
            Write-Host "RT79.1 physical HTML already promoted."
          }
      - name: Upload RT79 browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT79_BROWSER_REGRESSION
          path: ${{ runner.temp }}\RT79_BROWSER_REGRESSION\*
          if-no-files-found: warn
