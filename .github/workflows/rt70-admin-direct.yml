name: RT70 Admin Direct
on:
  push:
    paths: ['rt70-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch RT70 admin renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          css='''<style id="rt70-admin-direct-css">.rt64-modal{padding:14px!important;overflow:hidden!important}.rt64-modal>section{width:min(1320px,calc(100vw - 28px))!important;height:min(92vh,900px)!important;max-height:92vh!important;overflow:hidden!important;display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;padding:0!important;background:#0f150f!important}.rt64-modal>section>header{position:relative!important;top:auto!important;margin:0!important;padding:14px 16px!important;background:linear-gradient(180deg,#171e16,#10150f)!important;border-bottom:1px solid #65512a!important;z-index:20!important}.rt64-modal>section>header button{appearance:none!important;background:#4e3918!important;color:#f3d781!important;border:1px solid #8b6a2d!important;border-radius:8px!important;padding:8px 13px!important}.rt70-modal-body{min-height:0!important;overflow:auto!important;padding:14px 16px 18px!important;scrollbar-gutter:stable}.rt70-modal-body .rt66-section-tabs{top:-14px!important}.rt70-admin-status{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:9px 11px;border:1px solid #4d4428;border-radius:9px;background:#10170f;color:#b7ac8e;font-size:12px}.rt70-admin-status b{color:#ecc667}.rt70-build-badge{display:inline-flex;border:1px solid #7d6330;background:#241d0f;color:#f2cc66;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}@media(max-width:760px){.rt64-modal{padding:5px!important}.rt64-modal>section{width:calc(100vw - 10px)!important;height:calc(100vh - 10px)!important;max-height:calc(100vh - 10px)!important}.rt70-modal-body{padding:10px!important}}</style>'''
          js='''const RT70_ADMIN_DIRECT=true;function rt70FinalizeModal(id){const modal=document.getElementById(id);if(!modal)return;const body=modal.querySelector('.rt70-modal-body')||modal;body.querySelectorAll('textarea.jsonarea').forEach(ta=>{try{rt66EnhanceJsonArea(ta)}catch(e){console.error('RT70 enhancer',ta.name,e)}});try{rt66EnhancePlayerTabs()}catch(e){}try{rt66EnhanceVillageTabs()}catch(e){}try{rt66EnhanceTechnicalCodes()}catch(e){}try{rt66HumanizeEnums()}catch(e){}const form=body.querySelector('form');if(form&&!form.querySelector('.rt70-admin-status'))form.insertAdjacentHTML('afterbegin','<div class="rt70-admin-status"><span>●</span><b>RT70 GUIADA</b> campos técnicos gerados automaticamente; JSON bruto fica somente em Avançado.</div>')}function rt70StampAdmin(){const intro=document.querySelector('.rt67-page-intro');if(intro&&!intro.querySelector('.rt70-build-badge'))intro.insertAdjacentHTML('beforeend','<span class="rt70-build-badge">RT70 • interface direta</span>')}const RT70_OBSERVER=new MutationObserver(()=>queueMicrotask(rt70StampAdmin));RT70_OBSERVER.observe(document.documentElement,{childList:true,subtree:true});window.addEventListener('DOMContentLoaded',rt70StampAdmin);setTimeout(rt70StampAdmin,0);'''
          pat=re.compile(r"function rt64Modal\(id,title,sub,body\)\{rt64CloseModal\(id\);document\.body\.insertAdjacentHTML\('beforeend',`<div class=\"rt64-modal\" id=\"\$\{id\}\"><section><header><div><h2>\$\{title\}</h2><small>\$\{sub\|\|''\}</small></div><button type=\"button\" data-rt64-close=\"\$\{id\}\">Fechar</button></header>\$\{body\}</section></div>`\)\}")
          repl="function rt64Modal(id,title,sub,body){rt64CloseModal(id);document.body.insertAdjacentHTML('beforeend',`<div class=\"rt64-modal\" id=\"${id}\"><section><header><div><h2>${title}</h2><small>${sub||''}</small></div><button type=\"button\" data-rt64-close=\"${id}\">Fechar</button></header><div class=\"rt70-modal-body\">${body}</div></section></div>`);rt70FinalizeModal(id)}"
          for p in [Path('index.html'),Path('JOGAR_REINOS_TRIBAIS.html')]:
            t=p.read_text(encoding='utf-8')
            if 'RT70_ADMIN_DIRECT' not in t:
              t=t.replace('</head>',css+'</head>',1)
              t,n=pat.subn(repl,t,count=1)
              assert n==1, f'{p}: rt64Modal não encontrado'
              a='  function rt64PlayerEditor(worldId,userId){'
              assert a in t
              t=t.replace(a,js+'\n'+a,1)
              t=t.replace('<title>Reinos Tribais — RT69 Completo</title>','<title>Reinos Tribais — RT70 Admin Direto</title>')
              t=t.replace('REINOS TRIBAIS • CENTRAL OPERACIONAL RT69 GUIADA','REINOS TRIBAIS • CENTRAL OPERACIONAL RT70 DIRETA')
              t=t.replace('RT69 • ONLINE • ADMIN COMPLETO + RECOVERY + 19 MENUS','RT70 • ONLINE • ADMIN DIRETO + RECOVERY + 19 MENUS')
              t=t.replace("<option value=\"active\" ${p.control?.status==='active'?'selected':''}>active</option><option value=\"suspended\" ${p.control?.status==='suspended'?'selected':''}>suspended</option><option value=\"banned\" ${p.control?.status==='banned'?'selected':''}>banned</option>","<option value=\"active\" ${p.control?.status==='active'?'selected':''}>Ativo</option><option value=\"suspended\" ${p.control?.status==='suspended'?'selected':''}>Suspenso</option><option value=\"banned\" ${p.control?.status==='banned'?'selected':''}>Banido</option>")
              p.write_text(t,encoding='utf-8')
          a=Path('index.html').read_text(encoding='utf-8');b=Path('JOGAR_REINOS_TRIBAIS.html').read_text(encoding='utf-8')
          assert a==b
          for m in ['RT70_ADMIN_DIRECT','rt70FinalizeModal','rt70-modal-body','rt67RewardFormHtml','RT70 GUIADA']: assert m in a,m
          print('RT70 validation PASS')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Reinos Tribais RT70'
          git config user.email 'rt70@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RT70 admin direto sem JSON obrigatório'
          git push origin HEAD:main
