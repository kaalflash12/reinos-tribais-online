name: RT71 Village Fit

on:
  push:
    paths:
      - 'rt71-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch village renderer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[Path('index.html'),Path('JOGAR_REINOS_TRIBAIS.html')]
          old_css='.game-shell .rt60-building-layer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:fill!important;pointer-events:none!important;z-index:20!important;filter:drop-shadow(0 2px 2px rgba(5,7,4,.18))}'
          new_css='.game-shell .rt60-building-layer{position:absolute!important;inset:auto!important;object-fit:contain!important;object-position:center bottom!important;pointer-events:none!important;filter:drop-shadow(0 3px 3px rgba(5,7,4,.34));transform:none!important;max-width:none!important;max-height:none!important}\n.game-shell .village-scene{overflow:hidden!important;isolation:isolate!important}\n.game-shell .rt54-map-layer{z-index:1!important}\n.game-shell .rt54-interaction-layer{z-index:4!important;pointer-events:none!important}\n.game-shell .rt24-scene-atmosphere{z-index:6!important;pointer-events:none!important}\n.game-shell .rt60-village-hitbox{z-index:600!important}\n.game-shell .rt60-building-layer[data-village-building="main"]{filter:drop-shadow(0 4px 4px rgba(5,7,4,.38))}\n.game-shell .rt60-building-layer[data-village-building="wall"]{filter:drop-shadow(0 2px 2px rgba(5,7,4,.24))}'
          old_js='const villageLayers=layerEntries.filter(x=>x.visual.tier>0).map(({k,visual})=>`<img class="rt60-building-layer rt60-layer-${k}" src="${RT60_VILLAGE_LAYER_ROOT}/${k}_l${visual.tier}.png" alt="" aria-hidden="true">`).join(\'\');'
          new_js='''const villageLayers=layerEntries.filter(x=>x.visual.tier>0).map(({k,visual})=>{\n      const tier=String(visual.tier||1),box=RT60_VILLAGE_BBOX[k]?.[tier]||RT60_VILLAGE_BBOX[k]?.['1']||RT60_VILLAGE_BBOX[k]?.['0'];\n      const [x1,y1,x2,y2]=box;\n      const left=x1/RT60_VILLAGE_SCENE_SIZE.width*100, top=y1/RT60_VILLAGE_SCENE_SIZE.height*100;\n      const width=(x2-x1)/RT60_VILLAGE_SCENE_SIZE.width*100, height=(y2-y1)/RT60_VILLAGE_SCENE_SIZE.height*100;\n      const depth=20+Math.round(y2/RT60_VILLAGE_SCENE_SIZE.height*300);\n      return `<img class="rt60-building-layer rt60-layer-${k}" data-village-building="${k}" data-village-tier="${tier}" src="${RT60_VILLAGE_LAYER_ROOT}/${k}_l${visual.tier}.png" alt="${escapeHtml(D.buildings[k]?.name||k)}" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%;z-index:${depth}!important" draggable="false">`;\n    }).join('');'''
          for p in files:
              t=p.read_text(encoding='utf-8')
              if 'RT71_VILLAGE_SLOT_RENDERER' in t:
                  continue
              if old_css not in t:
                  raise SystemExit(f'{p}: CSS antigo não encontrado')
              if old_js not in t:
                  raise SystemExit(f'{p}: renderer antigo não encontrado')
              t=t.replace('<title>Reinos Tribais — RT70 Admin Direto</title>','<title>Reinos Tribais — RT71 Aldeia Corrigida</title>')
              t=t.replace(old_css,new_css,1)
              t=t.replace(old_js,new_js,1)
              marker="  const RT60_VILLAGE_LAYER_ROOT = 'assets/v54/buildings';"
              t=t.replace(marker,marker+"\n  const RT71_VILLAGE_SLOT_RENDERER = true;",1)
              t=t.replace('RT70 • interface direta','RT71 • aldeia corrigida')
              t=t.replace('RT70 GUIADA','RT71 GUIADA')
              p.write_text(t,encoding='utf-8')
          a=files[0].read_text(encoding='utf-8'); b=files[1].read_text(encoding='utf-8')
          assert a==b, 'HTMLs divergentes'
          assert 'RT71_VILLAGE_SLOT_RENDERER' in a
          assert '.game-shell .rt60-building-layer{position:absolute!important;inset:auto!important;object-fit:contain!important' in a
          assert '.game-shell .rt60-building-layer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:fill!important' not in a
          assert 'RT60_VILLAGE_BBOX[k]?.[tier]' in a
          print('RT71 village renderer PASS')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Reinos Tribais RT71'
          git config user.email 'rt71@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          if git diff --cached --quiet; then
            echo 'RT71 already applied.'
            exit 0
          fi
          git commit -m 'RT71 corrigir escala e posição dos prédios da aldeia'
          git push origin HEAD:main
