name: RT80 Admin Idempotence Patch
on:
  push:
    branches: ['rt80-admin-overhaul']
    paths:
      - 'tools/apply_rt80_admin_idempotence.py'
      - '.github/workflows/rt80-admin-idempotence.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt80-admin-overhaul
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply idempotent admin intro patch
        run: python tools/apply_rt80_admin_idempotence.py
      - name: Validate mirror and patch
        shell: bash
        run: |
          grep -q "if(el.innerHTML!==html)el.innerHTML=html;" index.html
          diff -q index.html JOGAR_REINOS_TRIBAIS.html
      - name: Commit patched HTML
        shell: bash
        run: |
          if git diff --quiet -- index.html JOGAR_REINOS_TRIBAIS.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          git commit -m 'RT80.5: stop legacy admin page-intro mutation loop'
          git push origin HEAD:rt80-admin-overhaul
