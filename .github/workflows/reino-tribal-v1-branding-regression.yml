name: Reino Tribal v1 Branding Regression

on:
  pull_request:
    branches: [main]

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static contract
        run: |
          node --check reino-tribal-branding.js
          node --check rt102-admin-recovery.js
          node --check rt85-auth-bridge.js
          grep -q "reino-tribal-branding.js?v=1.0.3" rt79-village-ui.js
          grep -q "rt102-admin-recovery.js?v=1.0.3" rt79-village-ui.js
          grep -q "rt85-auth-bridge.js?v=85.1" rt79-village-ui.js
          grep -q '"product_name": "Reino Tribal"' PRODUCT_RELEASE.json
          grep -q '"public_version": "1.0.3"' PRODUCT_RELEASE.json
          grep -q "public_version='1.0.3'" backend/reino-tribal-public-version-1.0.3.sql
          grep -q "rt102_admin_recovery_consume" backend/reino-tribal-admin-recovery-v1.0.2.sql
          grep -q "rt102_admin_recovery_consume" backend/edge/rt-admin-recovery-v102/index.ts
          ! grep -q "recoverAdmin" rt85-auth-bridge.js
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Start site
        run: |
          python -m http.server 8765 >/tmp/reino-tribal-v1-http.log 2>&1 &
          sleep 2
      - name: Browser branding and admin recovery proof
        shell: python
        run: |
          import json,re,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          o=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000']:o.add_argument(arg)
          d=webdriver.Chrome(options=o)
          out={}
          try:
              d.get('http://127.0.0.1:8765/')
              WebDriverWait(d,8).until(lambda x:x.execute_script('return !!window.__REINO_TRIBAL_BRANDING__'))
              time.sleep(.4)
              out['title']=d.title
              out['product']=d.execute_script('return window.REINO_TRIBAL')
              body=d.find_element(By.TAG_NAME,'body').get_attribute('innerText')
              out['visible_revision_tokens']=sorted(set(re.findall(r'\bRT\s*\d+(?:\.\d+)*\b',body,re.I)))
              out['has_old_brand']='Reinos Tribais' in body
              out['has_new_brand']='Reino Tribal' in body
              out['auth_bridge_loaded']=bool(d.execute_script('return !!window.__RT85_AUTH_BRIDGE__'))
              out['admin_recovery_loaded']=bool(d.execute_script('return !!window.__REINO_TRIBAL_ADMIN_RECOVERY_V102__'))
              entry=d.find_elements(By.CSS_SELECTOR,'[data-entry-online]')
              if entry: entry[0].click()
              WebDriverWait(d,5).until(lambda x: len(x.find_elements(By.ID,'rt18-login-form'))==1)
              WebDriverWait(d,5).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'[data-rt102-open]'))==1)
              out['login_form']=True
              out['login_user_field']=len(d.find_elements(By.CSS_SELECTOR,'#rt18-login-form input[name="email"]'))==1
              out['login_password_field']=len(d.find_elements(By.CSS_SELECTOR,'#rt18-login-form input[name="password"]'))==1
              out['admin_recovery_button']=True
              assert out['title']=='Reino Tribal',out
              assert out['product']=={'name':'Reino Tribal','version':'1.0.3'},out
              assert not out['visible_revision_tokens'],out
              assert not out['has_old_brand'],out
              assert out['has_new_brand'],out
              assert out['auth_bridge_loaded'],out
              assert out['admin_recovery_loaded'],out
              assert out['login_form'] and out['login_user_field'] and out['login_password_field'],out
              assert out['admin_recovery_button'],out
              out['pass']=True
          finally:
              Path('REINO_TRIBAL_V1_BRANDING_PROOF.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
              d.save_screenshot('REINO_TRIBAL_V1_BRANDING.png')
              d.quit()
          print(json.dumps(out,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REINO_TRIBAL_V1_BRANDING_PROOF
          path: |
            REINO_TRIBAL_V1_BRANDING_PROOF.json
            REINO_TRIBAL_V1_BRANDING.png
