name: RT78 Publish Branding
on:
  push:
    paths:
      - 'rt78-publish-trigger.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RT78 branding and loader version
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '<title>Reinos Tribais — RT77 Funcional</title>':'<title>Reinos Tribais — RT78 Estratégia Completa</title>',
            'const VERSION = 77;':'const VERSION = 78;',
            'const RT_BUILD = "77.0";':'const RT_BUILD = "78.0";',
            'const RT77_FULL_FUNCTIONAL_PATCH = true;':'const RT77_FULL_FUNCTIONAL_PATCH = true;\n  const RT78_STRATEGY_ENGINE = true;',
            'RT77 • ONLINE • ADMIN DIRETO + RECOVERY + 19 MENUS':'RT78 • ONLINE • ESTRATÉGIA + ADMIN + RECOVERY',
            'rt76-master-plan.js?v=77.0':'rt76-master-plan.js?v=78.0'
          }
          for a,b in reps.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
      - name: Validate RT78 markers
        run: |
          grep -q 'const VERSION = 78;' index.html
          grep -q 'const RT_BUILD = "78.0";' index.html
          grep -q 'RT78_STRATEGY_ENGINE' index.html
          grep -q 'rt76-master-plan.js?v=78.0' index.html
      - name: Commit RT78 branding
        run: |
          git config user.name 'RT78 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'RT78: publish strategy engine branding'
          git push
