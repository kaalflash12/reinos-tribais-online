name: RT93 Existing Admin Session Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rt93-existing-admin-session-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-existing-admin:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Recover already-public RT77 audit token in memory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $raw=(Invoke-WebRequest 'https://raw.githubusercontent.com/kaalflash12/reinos-tribais-online/main/.github/workflows/rt77-real-admin-screens-temp.yml' -UseBasicParsing).Content
          $m=[regex]::Match($raw,"RT77_AUDIT_TOKEN:\s*'([0-9a-f]{64})'")
          if(-not $m.Success){throw 'RT93_RT77_TOKEN_NOT_FOUND'}
          $token=$m.Groups[1].Value
          "RT93_ADMIN_TOKEN=$token" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PASS: token RT77 recuperado em memória sem exibir valor.'

      - name: Verify token against current production admin API
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:RT93_ADMIN_TOKEN";Origin='https://kaalflash12.github.io'}
          try {
            $r=Invoke-RestMethod -Method Post -Uri 'https://reino-tribal-api.mestrederpg35.deno.net/api/admin' -Headers $headers -ContentType 'application/json' -Body '{"action":"dashboard"}'
          } catch {
            $status=$_.Exception.Response.StatusCode.value__
            Write-Host "RT93_ADMIN_API_HTTP=$status"
            throw 'RT93_EXISTING_ADMIN_SESSION_INVALID'
          }
          if(-not $r.adminAccounts){throw 'RT93_DASHBOARD_SHAPE_INVALID'}
          $admin=@($r.adminAccounts | Where-Object {$_.username -eq 'reinos_admin'})
          if($admin.Count -ne 1){throw 'RT93_REINOS_ADMIN_NOT_FOUND'}
          Write-Host 'RT93_CURRENT_ADMIN_API_PASS'
          Write-Host "RT93_ADMIN_ACCOUNTS=$($r.adminAccounts.Count)"
          Write-Host "RT93_ACTIVE_ADMIN_SESSIONS=$($r.adminSessions.Count)"

      - name: Install Selenium
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet selenium

      - name: Prove current public GitHub Pages admin dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.edge.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          OUT=Path(os.environ['RUNNER_TEMP'])/'RT93_EXISTING_ADMIN_PROOF';OUT.mkdir(exist_ok=True)
          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--window-size=1600,1000');opts.add_argument('--disable-gpu');opts.add_argument('--no-first-run')
          d=webdriver.Edge(options=opts)
          result={'pass':False,'checks':[]}
          def ck(name,ok,detail=''):
            result['checks'].append({'name':name,'pass':bool(ok),'detail':detail})
            if not ok: raise RuntimeError(name+': '+detail)
          try:
            d.get('https://kaalflash12.github.io/reinos-tribais-online/?rt93-existing-admin=1')
            WebDriverWait(d,40).until(lambda x:x.execute_script('return document.readyState')=='complete')
            d.execute_script("sessionStorage.setItem('rt60_admin_token',arguments[0]);",os.environ['RT93_ADMIN_TOKEN'])
            d.refresh()
            WebDriverWait(d,40).until(lambda x:x.execute_script('return document.readyState')=='complete')
            WebDriverWait(d,40).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.rt60-admin-shell'))>0)
            shell=d.find_elements(By.CSS_SELECTOR,'.rt60-admin-shell')
            ck('public admin shell rendered',len(shell)>0)
            body=d.find_element(By.TAG_NAME,'body').text
            ck('dashboard identifies reinos_admin','reinos_admin' in body,body[:500])
            png=OUT/'RT93_ADMIN_DASHBOARD_PUBLICO.png';d.save_screenshot(str(png));ck('public screenshot captured',png.exists() and png.stat().st_size>0)
            result['pass']=True
          finally:
            (OUT/'PROVA_RT93_EXISTING_ADMIN.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
            d.quit()
          print('RT93_PUBLIC_ADMIN_DASHBOARD_PASS')
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\rt93.py"
          python "$env:RUNNER_TEMP\rt93.py"

      - name: Remove token from environment before artifact upload
        if: always()
        shell: pwsh
        run: |
          "RT93_ADMIN_TOKEN=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload proof only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RT93_EXISTING_ADMIN_PROOF
          path: ${{ runner.temp }}/RT93_EXISTING_ADMIN_PROOF
          if-no-files-found: error
