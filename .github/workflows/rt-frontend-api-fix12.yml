name: RT Frontend API FIX12

on:
  push:
    branches: [main]
    paths:
      - 'reino-tribal-config.js'
      - 'rt85-auth-bridge.js'
      - '.github/workflows/rt-frontend-api-fix12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-frontend-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate public Pages config and backend
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://kaalflash12.github.io/reinos-tribais-online'
          API='https://reino-tribal-api.mestrederpg35.deno.net'

          ok=0
          for i in $(seq 1 30); do
            cfg="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$SITE/reino-tribal-config.js?fix12=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$cfg" | grep -Fq "$API" && printf '%s' "$cfg" | grep -Fq '1.0.4-turso-fix12'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          printf '%s\n' "$cfg" | grep -F "$API"
          printf '%s\n' "$cfg" | grep -F '1.0.4-turso-fix12'
          echo FRONTEND_PUBLIC_CONFIG_FIX12_PASS

          html_file="$(mktemp)"
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$SITE/?fix12=${GITHUB_SHA}" -o "$html_file"
          python - "$html_file" <<'PY'
          import pathlib,sys
          h=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          a=h.find('reino-tribal-config.js')
          b=h.find('rt85-auth-bridge.js')
          assert a>=0, 'config script absent from public index'
          assert b>=0, 'auth bridge absent from public index'
          assert a<b, 'config must load before auth bridge'
          print('PUBLIC_SCRIPT_ORDER_PASS')
          PY

          runtime="$(curl -fsSL --retry 3 "$API/health")"
          python - <<'PY' "$runtime"
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get('ok') is True
          assert x.get('runtime')=='deno-deploy'
          print('PUBLIC_DENO_HEALTH_PASS')
          PY

          turso="$(curl -fsSL --retry 3 -H 'Content-Type: application/json' -d '{"action":"health"}' "$API/api/reino")"
          python - <<'PY' "$turso"
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get('ok') is True
          assert x.get('database')=='turso'
          print('PUBLIC_TURSO_HEALTH_PASS')
          PY

          headers="$(mktemp)"
          curl -fsS -o /dev/null -D "$headers" -X OPTIONS \
            -H 'Origin: https://kaalflash12.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            "$API/api/reino"
          tr -d '\r' < "$headers" | grep -i '^access-control-allow-origin: https://kaalflash12.github.io$'
          echo PUBLIC_CORS_PAGES_TO_DENO_PASS
