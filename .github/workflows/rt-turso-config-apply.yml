name: RT Turso config injection

on:
  push:
    branches: [rt-turso-migration]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rt-config-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-turso-migration
      - name: Inject config loader before Turso bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg='<script src="reino-tribal-config.js?v=1.0.4-turso"></script>'
          bridge='<script src="rt85-auth-bridge.js?v=1.0.4-turso"></script>'
          for name in ['index.html','JOGAR_REINOS_TRIBAIS.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if cfg not in s:
                  if bridge not in s:
                      raise SystemExit(f'{name}: ponte Turso ausente')
                  s=s.replace(bridge,cfg+'\n'+bridge,1)
                  p.write_text(s,encoding='utf-8')
          if Path('index.html').read_bytes()!=Path('JOGAR_REINOS_TRIBAIS.html').read_bytes():
              raise SystemExit('standalones divergiram')
          PY
          grep -q 'reino-tribal-config.js?v=1.0.4-turso' index.html
          grep -q 'rt85-auth-bridge.js?v=1.0.4-turso' index.html
      - name: Commit config injection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RT Turso: carregar configuração antes da autenticação [rt-config-patched] [skip ci]'
          git push origin HEAD:rt-turso-migration
