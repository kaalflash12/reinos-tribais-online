name: RT74 Execute

on:
  push:
    paths:
      - 'rt74-trigger.txt'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar RT74
        run: python tools/rt74_execute.py
      - name: Validar JavaScript embutido
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          ss=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          out=Path('/tmp/rt74-js');out.mkdir(exist_ok=True)
          n=0
          for s in ss:
              if not s.strip(): continue
              n+=1;(out/f'{n:03}.js').write_text(s,encoding='utf-8')
          print('scripts',n)
          PY
          for f in /tmp/rt74-js/*.js; do node --check "$f" >/dev/null; done
          cmp -s index.html JOGAR_REINOS_TRIBAIS.html
          grep -q 'RT74_EXECUTION_COMPLETE' index.html
          grep -q 'rt74RankedPrizePanel' index.html
          grep -q 'rt74EventsExecutionPanel' index.html
          grep -q 'RT74_LOCAL_AUTOSAVE' index.html
          echo 'RT74 JS + HTML PASS'
      - name: Commit RT74
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Reinos Tribais RT74'
          git config user.email 'rt74@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html PLANO_EXECUCAO_RT74.md AUDITORIA_EXECUCAO_RT74.json
          git commit -m 'RT74 executa ranked eventos monstros save local e polimento'
          git push origin HEAD:main
