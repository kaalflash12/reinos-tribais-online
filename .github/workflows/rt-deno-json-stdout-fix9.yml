name: RT Deno JSON Stdout FIX9

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - 'RT_REINO_TRIBAL_DENO_JSON_STDOUT_FIX9.ps1'
      - '.github/workflows/rt-deno-json-stdout-fix9.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RT_REINO_TRIBAL_DENO_JSON_STDOUT_FIX9.ps1'
      - '.github/workflows/rt-deno-json-stdout-fix9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-fix9:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stdout stderr separation and JSON parsing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FINAL_UNICO.ps1'
          & .\RT_REINO_TRIBAL_DENO_JSON_STDOUT_FIX9.ps1 -OutFile $out -ValidateOnly
          if (-not (Test-Path $out)) { throw 'Executor FIX9 nao foi gerado.' }

          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Final FIX9 nao passa no parser.' }

          foreach($name in @('Falhar','Quote-Arg','Stop-Tree','Executar-Nativo')) {
            $fn = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name },$true)
            if (-not $fn) { throw "Funcao ausente no executor: $name" }
            Invoke-Expression $fn.Extent.Text
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'deno-json-stderr-fixture.ps1'
          @'
          [Console]::Out.WriteLine('[{"id":"cbee0843-8a37-46b6-930c-42ca52c2995c","slug":"mestrederpg35","name":"Mestre de Rpg","plan":"free"}]')
          [Console]::Error.WriteLine('Download https://jsr.io/@deno/deploy/meta.json')
          exit 0
          '@ | Set-Content -Path $fixture -Encoding UTF8

          $psExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $r = Executar-Nativo -Exe $psExe -Args @('-NoProfile','-ExecutionPolicy','Bypass','-File',$fixture) -TimeoutSec 30 -Rotulo 'Fixture Deno JSON + stderr'
          if ($r.Code -ne 0) { throw "Fixture falhou: $($r.Text)" }
          if (-not $r.Stdout) { throw 'Stdout ficou vazio.' }
          if ($r.Stdout -match 'Download https://jsr.io') { throw 'Stderr contaminou Stdout.' }
          if ($r.Stderr -notmatch 'Download https://jsr.io/@deno/deploy/meta.json') { throw "Stderr nao preservado: [$($r.Stderr)]" }
          if ($r.Text -notmatch 'Download https://jsr.io/@deno/deploy/meta.json') { throw 'Text combinado deixou de preservar diagnostico.' }

          try { $orgs = @($r.Stdout | ConvertFrom-Json) } catch { throw "JSON valido de Stdout nao parseou: $($r.Stdout)" }
          if ($orgs.Count -ne 1 -or [string]$orgs[0].slug -ne 'mestrederpg35') { throw 'Fixture de organizacao Deno nao normalizou corretamente.' }

          $raw = [IO.File]::ReadAllText($out)
          foreach($required in @(
            '$orgList.Stdout | ConvertFrom-Json',
            '$retryOrgs.Stdout | ConvertFrom-Json',
            '$appInfo.Stdout | ConvertFrom-Json',
            '$prView.Stdout | ConvertFrom-Json',
            '$last.Stdout | ConvertFrom-Json',
            '$view.Stdout | ConvertFrom-Json',
            'Get-TursoHostnameFromInstances',
            'package.json',
            'auth/interactive'
          )) {
            if ($raw.IndexOf($required,[StringComparison]::Ordinal) -lt 0) { throw "Contrato FIX9 ausente: $required" }
          }

          Write-Host 'DENO_JSON_STDOUT_WITH_STDERR_NOISE_PASS'
          Write-Host 'FIX8_TURSO_REGRESSION_PRESERVED_PASS'

          Copy-Item $out (Join-Path $env:RUNNER_TEMP 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1') -Force
          Copy-Item $out (Join-Path $env:RUNNER_TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1') -Force

      - name: Publish tested canonical executors to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/rt-turso-migration'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main

          Copy-Item (Join-Path $env:RUNNER_TEMP 'REINO_TRIBAL_FINAL_UNICO.ps1') .\REINO_TRIBAL_FINAL_UNICO.ps1 -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1') .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1') .\IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1 -Force

          $h1 = (Get-FileHash .\REINO_TRIBAL_FINAL_UNICO.ps1 -Algorithm SHA256).Hash
          $h2 = (Get-FileHash .\EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 -Algorithm SHA256).Hash
          $h3 = (Get-FileHash .\IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1 -Algorithm SHA256).Hash
          if ($h1 -ne $h2 -or $h1 -ne $h3) { throw 'Os tres executores FIX9 nao sao identicos.' }

          git add REINO_TRIBAL_FINAL_UNICO.ps1 EXECUTAR_REINO_TRIBAL_DENO_TURSO_FINAL.ps1 IMPLANTAR_REINO_TRIBAL_DENO_TURSO.ps1
          if (git diff --cached --quiet) {
            Write-Host 'Main ja contem exatamente o FIX9.'
            exit 0
          }
          git commit -m 'fix: parsear JSON Deno somente do stdout'
          git push origin main
