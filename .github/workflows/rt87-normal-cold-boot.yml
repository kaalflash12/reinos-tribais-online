name: RT87 Normal Cold Boot

on:
  push:
    branches: [rt87-canonical]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'JOGAR_REINOS_TRIBAIS.html'
      - '.github/workflows/rt87-normal-cold-boot.yml'

permissions:
  contents: read

jobs:
  cold-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static boot contract
        shell: python
        run: |
          from pathlib import Path
          boot=Path('index.html').read_text(encoding='utf-8')
          app=Path('JOGAR_REINOS_TRIBAIS.html').read_text(encoding='utf-8')
          assert len(boot.encode()) < 20000, len(boot.encode())
          assert len(app.encode()) > 500000, len(app.encode())
          assert "fetch('./JOGAR_REINOS_TRIBAIS.html'" in boot
          assert 'Tentar novamente' in boot and 'Abrir cliente diretamente' in boot
          assert 'rt85-auth-bridge.js?v=85.0' in app or 'rt79-village-ui.js?v=79.1' in app
          print({'boot_bytes':len(boot.encode()),'app_bytes':len(app.encode())})
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/rt87-http.log 2>&1 &
          echo $! > /tmp/rt87-http.pid
          sleep 2
      - name: Real cold boot without fast mode
        shell: python
        run: |
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          o=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000','--disable-cache']:
              o.add_argument(arg)
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          d.execute_cdp_cmd('Network.setCacheDisabled',{'cacheDisabled':True})
          out={'url':'http://127.0.0.1:8765/','fast_mode':False}
          try:
              t=time.perf_counter(); d.get(out['url'])
              WebDriverWait(d,2).until(EC.visibility_of_element_located((By.CSS_SELECTOR,'.boot')))
              out['boot_shell_visible_ms']=round((time.perf_counter()-t)*1000)
              WebDriverWait(d,10).until(EC.visibility_of_element_located((By.CSS_SELECTOR,'.rt55-entry')))
              out['game_landing_visible_ms']=round((time.perf_counter()-t)*1000)
              online=WebDriverWait(d,3).until(EC.element_to_be_clickable((By.CSS_SELECTOR,'[data-entry-online]')))
              out['game_landing_interactive']=True
              WebDriverWait(d,5).until(lambda x: x.execute_script("return !!window.__RT85_AUTH_BRIDGE__"))
              out['rt85_bridge_loaded']=True
              online.click()
              WebDriverWait(d,5).until(EC.visibility_of_element_located((By.CSS_SELECTOR,'input[name="identifier"],input[type="email"],#rt55-online-email')))
              out['online_auth_visible']=True
              logs=d.get_log('browser')
              severe=[x for x in logs if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
              out['severe']=severe
              nav=d.execute_script("return performance.getEntriesByType('navigation')[0].toJSON()")
              out['navigation']={k:nav.get(k) for k in ['domInteractive','domContentLoadedEventEnd','loadEventEnd','responseEnd']}
              assert out['boot_shell_visible_ms'] < 1500, out
              assert out['game_landing_visible_ms'] < 8000, out
              assert out['online_auth_visible'] and out['rt85_bridge_loaded']
              out['pass']=True
          finally:
              Path('RT87_COLD_BOOT_PROOF.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
              d.save_screenshot('RT87_COLD_BOOT.png')
              d.quit()
          print(json.dumps(out,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RT87_COLD_BOOT_PROOF
          path: |
            RT87_COLD_BOOT_PROOF.json
            RT87_COLD_BOOT.png
