name: RT77 Branding Direct

on:
  push:
    paths:
      - 'rt77-branding-direct-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Corrigir marca RT77 direto pela API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request
          repo='kaalflash12/reinos-tribais-online'; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'rt77-branding-direct'}
          repls={
          '<title>Reinos Tribais — RT76 Integrado</title>':'<title>Reinos Tribais — RT77 Funcional</title>',
          'RT76 • ONLINE • ADMIN DIRETO + RECOVERY + 19 MENUS':'RT77 • ONLINE • ADMIN DIRETO + RECOVERY + 19 MENUS',
          'Realtime + combate RT76 + sincronização':'Realtime + combate RT77 + sincronização',
          '<b>RT76 GUIADA</b>':'<b>RT77 GUIADA</b>',
          'RT76 • plano integrado':'RT77 • plano funcional',
          'REINOS TRIBAIS • CENTRAL OPERACIONAL RT76':'REINOS TRIBAIS • CENTRAL OPERACIONAL RT77',
          'interface guiada RT76':'interface guiada RT77',
          'RT76 • ALDEIA INTEGRADA • ONLINE':'RT77 • ALDEIA INTEGRADA • ONLINE',
          'Reinos Tribais — RT76 • aldeia ativa':'Reinos Tribais — RT77 • aldeia ativa',
          'RT76 • aldeia ativa</span>':'RT77 • aldeia ativa</span>',
          'Central de Sistemas RT76':'Central de Sistemas RT77'}
          def req(url,method='GET',data=None):
              r=urllib.request.Request(url,data=data,method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=60) as x:return json.load(x)
          def get(path):
              o=req(api+path+'?ref=main');return o,base64.b64decode(o['content'])
          def put(path,b,sha,msg):
              payload=json.dumps({'message':msg,'content':base64.b64encode(b).decode(),'sha':sha,'branch':'main'}).encode()
              return req(api+path,'PUT',payload)
          final=None
          for path in ('index.html','JOGAR_REINOS_TRIBAIS.html'):
              o,b=get(path); s=b.decode('utf-8')
              for old,new in repls.items(): s=s.replace(old,new)
              nb=s.encode('utf-8'); put(path,nb,o['sha'],'finish RT77 visible branding'); final=nb
          a,ab=get('index.html'); b,bb=get('JOGAR_REINOS_TRIBAIS.html')
          if ab!=bb: raise SystemExit('HTML divergence after branding')
          sha=hashlib.sha256(ab).hexdigest(); o,_=get('RT77_HTML_SHA256.txt'); put('RT77_HTML_SHA256.txt',(sha+'\n').encode(),o['sha'],'update RT77 HTML checksum')
          print('RT77_HTML_SHA256='+sha)
          PY
