name: RT Admin Harden FIX17

on:
  push:
    branches: [main]
    paths:
      - 'RT_ADMIN_HARDEN_FIX17.ps1'
      - '.github/workflows/rt-admin-harden-fix17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-fix17:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Generate FIX17
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RT_ADMIN_HARDEN_FIX17.ps1
          if($LASTEXITCODE -ne 0){throw "FIX17 transform falhou: $LASTEXITCODE"}

      - name: Parse and verify FIX17 contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Resolve-Path '.\REINO_TRIBAL_ADMIN_FIX17_FINAL.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'FIX17 nao passou no parser PowerShell'}
          $t=[IO.File]::ReadAllText($p)
          foreach($needle in @(
            "`$ExecutorBuild = 'REINO_TRIBAL_ADMIN_FIX17_FINAL'",
            'EXECUTOR SHA256:',
            'PASS: executores FIX15/FIX16 legados removidos do TEMP.',
            '$preflightUrl = $preflightUri.AbsoluteUri',
            'FIX17_PREFLIGHT_PUBLICO_PASS',
            'REINO_TRIBAL_ADMIN_FIX17_VALIDADO',
            "[string]`$BackendCommit = 'd5d1edadd9f33b612a233c4feed0e06ec97203bc'"
          )){if(-not $t.Contains($needle)){throw "Contrato FIX17 ausente: $needle"}}
          Write-Host 'FIX17_PARSE_CONTRACT_PASS'

      - name: Test legacy TEMP cleanup and exact public preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $oldTemp=$env:TEMP
          $isolated=Join-Path $env:RUNNER_TEMP ('rt-fix17-temp-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $isolated|Out-Null
          foreach($name in @('RT_ADMIN_FIX15.ps1','RT_ADMIN_FIX16.ps1','RT_ADMIN_FIX16_be58d645.ps1','REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1','REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1')){
            Set-Content -LiteralPath (Join-Path $isolated $name) -Value 'LEGACY' -Encoding ASCII
          }
          $env:TEMP=$isolated
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_ADMIN_FIX17_FINAL.ps1 -PreflightOnly
            if($LASTEXITCODE -ne 0){throw "FIX17 PreflightOnly falhou: $LASTEXITCODE"}
            foreach($name in @('RT_ADMIN_FIX15.ps1','RT_ADMIN_FIX16.ps1','RT_ADMIN_FIX16_be58d645.ps1','REINO_TRIBAL_ADMIN_FIX15_FINAL.ps1','REINO_TRIBAL_ADMIN_FIX16_FINAL.ps1')){
              if(Test-Path (Join-Path $isolated $name)){throw "Executor legado nao foi removido: $name"}
            }
            Write-Host 'FIX17_TEMP_CLEANUP_AND_PUBLIC_PREFLIGHT_PASS'
          } finally {
            $env:TEMP=$oldTemp
            Remove-Item $isolated -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate pinned backend with Deno 2.9.5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $deno=(Get-Command deno).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\REINO_TRIBAL_ADMIN_FIX17_FINAL.ps1 -ValidateOnly -DenoExeOverride $deno
          if($LASTEXITCODE -ne 0){throw "FIX17 ValidateOnly falhou: $LASTEXITCODE"}
          Write-Host 'FIX17_PINNED_BACKEND_DENO_CHECK_PASS'

      - name: Publish tested FIX17 canonical executor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item .\REINO_TRIBAL_ADMIN_FIX17_FINAL.ps1 .\REINO_TRIBAL_ADMIN_FINAL.ps1 -Force
          $rawText=[IO.File]::ReadAllText((Resolve-Path '.\REINO_TRIBAL_ADMIN_FINAL.ps1')).Replace("`r`n","`n")
          $utf8=New-Object Text.UTF8Encoding($false)
          $sha256=[Security.Cryptography.SHA256]::Create()
          try { $hash=([BitConverter]::ToString($sha256.ComputeHash($utf8.GetBytes($rawText))).Replace('-','').ToLowerInvariant()) } finally { $sha256.Dispose() }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'REINO_TRIBAL_ADMIN_FINAL.sha256'),($hash + '  REINO_TRIBAL_ADMIN_FINAL.ps1' + "`n"),(New-Object Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REINO_TRIBAL_ADMIN_FIX17_FINAL.ps1 REINO_TRIBAL_ADMIN_FINAL.ps1 REINO_TRIBAL_ADMIN_FINAL.sha256
          if(git diff --cached --quiet){ Write-Host 'FIX17 canonical ja publicado.'; exit 0 }
          git commit -m 'fix: publicar executor admin canonico FIX17 validado'
          for($i=1;$i -le 5;$i++){
            git fetch origin main
            git rebase origin/main
            if($LASTEXITCODE -ne 0){throw 'Rebase FIX17 falhou.'}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){ Write-Host 'FIX17_PUBLICADO'; exit 0 }
            Start-Sleep -Seconds (2*$i)
          }
          throw 'Nao foi possivel publicar FIX17 apos 5 tentativas.'
