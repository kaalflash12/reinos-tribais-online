name: RT Turso secret probe

on:
  push:
    branches: [rt-turso-migration]
    paths:
      - '.github/workflows/rt-turso-secret-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TURSO_DATABASE_URL:-}" ]; then echo '::error::TURSO_DATABASE_URL secret is missing'; missing=1; else echo 'TURSO_DATABASE_URL_PRESENT'; fi
          if [ -z "${TURSO_AUTH_TOKEN:-}" ]; then echo '::error::TURSO_AUTH_TOKEN secret is missing'; missing=1; else echo 'TURSO_AUTH_TOKEN_PRESENT'; fi
          test "$missing" -eq 0
      - name: Install Turso driver
        run: npm install --no-audit --no-fund @tursodatabase/serverless@0.0.5
      - name: Live Turso SELECT 1
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { connect } from '@tursodatabase/serverless';
          const db=connect({url:process.env.TURSO_DATABASE_URL,authToken:process.env.TURSO_AUTH_TOKEN});
          const stmt=await Promise.resolve(db.prepare('SELECT 1 AS ok'));
          const row=await stmt.get();
          if(Number(row?.ok)!==1) throw new Error('Turso live probe failed');
          console.log('TURSO_LIVE_SELECT_PASS');
          await db.close?.();
          NODE
