name: RT Resume ADM FIX11

on:
  push:
    branches: [main]
    paths:
      - 'REINO_TRIBAL_RESUMIR_POS_DEPLOY_FIX11.ps1'
      - '.github/workflows/rt-resume-fix11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-resume-fix11:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Parse resume executor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\REINO_TRIBAL_RESUMIR_POS_DEPLOY_FIX11.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List;throw 'Resume FIX11 nao passou no parser PowerShell'}
          Write-Host 'RESUME_FIX11_POWERSHELL_PARSE_PASS'

      - name: Verify Deno 2.9.5 commands used by resume
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          deno --version
          if($LASTEXITCODE -ne 0){throw 'Deno 2.9.5 nao executou'}
          function Get-NativeHelp([string[]]$DenoArgs){
            $old=$ErrorActionPreference
            try {
              $ErrorActionPreference='Continue'
              $text=(& deno @DenoArgs 2>&1 | Out-String)
              $code=$LASTEXITCODE
            } finally {
              $ErrorActionPreference=$old
            }
            return [pscustomobject]@{Code=$code;Text=$text}
          }
          $r1=Get-NativeHelp @('deploy','env','update-value','--help')
          if($r1.Code -ne 0){throw "update-value nao existe no Deno 2.9.5`n$($r1.Text)"}
          if($r1.Text -notmatch 'update-value'){throw "Help Deno nao confirmou update-value`n$($r1.Text)"}
          $r2=Get-NativeHelp @('deploy','apps','get','--help')
          if($r2.Code -ne 0){throw "apps get nao existe`n$($r2.Text)"}
          $r3=Get-NativeHelp @('deploy','orgs','list','--help')
          if($r3.Code -ne 0){throw "orgs list nao existe`n$($r3.Text)"}
          Write-Host 'RESUME_FIX11_DENO_CLI_CONTRACT_PASS'

      - name: Verify resume scope and ordering
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=[IO.File]::ReadAllText((Resolve-Path '.\REINO_TRIBAL_RESUMIR_POS_DEPLOY_FIX11.ps1'))
          foreach($needle in @(
            "[string]`$Branch = 'main'",
            "'deploy','env','update-value','RT_ADMIN_PASSWORD'",
            "'deploy','env','update-value','RT_ADMIN_RECOVERY_KEY'",
            "action='admin_recover'",
            "action='login'; identifier='reinos_admin'",
            "action='admin_status'",
            "action='dashboard'",
            "Set-GitHubSecret `$gh 'RT_ADMIN_PASSWORD'",
            "Set-GitHubSecret `$gh 'RT_ADMIN_RECOVERY_KEY'",
            'Backend atual de seis arquivos obtido de main e validado.',
            "'deploy','--org',`$denoOrg,'--app',`$DenoApp,'--prod','--non-interactive'"
          )){if(-not $t.Contains($needle)){throw "Contrato resume ausente: $needle"}}
          foreach($forbidden in @(
            'Obter-TursoPlatformTokenBrowser',
            'api.turso.tech?port=',
            'Turso: organização isolada e banco exclusivo',
            "'pr','merge'",
            'Merge da migração',
            "'workflow','run','deploy-reino-tribal-pages.yml'"
          )){if($t.Contains($forbidden)){throw "Resume curto reintroduziu etapa proibida/repetida: $forbidden"}}
          $u1=$t.IndexOf("'deploy','env','update-value','RT_ADMIN_RECOVERY_KEY'",[StringComparison]::Ordinal)
          $rec=$t.IndexOf("action='admin_recover'",[StringComparison]::Ordinal)
          $login=$t.IndexOf("action='login'; identifier='reinos_admin'",[StringComparison]::Ordinal)
          if($u1 -lt 0 -or $rec -le $u1 -or $login -le $rec){throw 'Ordem update recovery -> admin_recover -> login esta errada'}
          Write-Host 'RESUME_FIX11_SCOPE_ORDER_PASS'

      - name: Validate real six-file backend
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($required in @('deno.json','package.json','deno\main.js','api\reino.js','api\admin.js','backend\turso\schema.sql')){
            if(-not(Test-Path $required)){throw "Arquivo real ausente: $required"}
          }
          deno check deno/main.js
          if($LASTEXITCODE -ne 0){throw "deno check falhou: $LASTEXITCODE"}
          Write-Host 'RESUME_FIX11_SIX_FILE_DENO_CHECK_PASS'

      - name: Verify current public backend health
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $backend='https://reino-tribal-api.mestrederpg35.deno.net'
          $health=Invoke-RestMethod -Uri "$backend/health" -Method Get -TimeoutSec 30
          if(-not $health.ok -or $health.runtime -ne 'deno-deploy'){throw 'Health runtime Deno publico falhou'}
          $api=Invoke-RestMethod -Uri "$backend/api/reino" -Method Post -ContentType 'application/json' -Body '{"action":"health"}' -TimeoutSec 30
          if(-not $api.ok -or $api.database -ne 'turso'){throw 'Health Turso publico falhou'}
          Write-Host 'RESUME_FIX11_PUBLIC_HEALTH_PASS'
