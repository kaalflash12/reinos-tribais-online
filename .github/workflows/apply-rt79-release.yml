name: Apply RT79 Release
on:
  push:
    paths:
      - 'rt79-release-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply RT79 patch
        run: python tools/apply_rt79_release.py
      - name: Syntax checks
        run: |
          node --check rt79-suite.js
          node --check rt79-groups-addon.js
          node --check rt79-logistics-ai-addon.js
          node --check rt79-village-ui.js
          node --check rt79-admin-suite.js
          grep -q 'const VERSION = 79;' index.html
          grep -q 'const RT_BUILD = "79.0";' index.html
          grep -q 'window.CLOUD=CLOUD;' index.html
          grep -q 'rt79-suite.js?v=79.0' index.html
          grep -q 'rt79-groups-addon.js?v=79.0' index.html
          grep -q 'rt79-logistics-ai-addon.js?v=79.0' index.html
          grep -q 'rt79-village-ui.js?v=79.0' index.html
          grep -q 'rt79-admin-suite.js?v=79.0' index.html
      - name: Commit release
        run: |
          git config user.name 'RT79 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html JOGAR_REINOS_TRIBAIS.html
          if ! git diff --cached --quiet; then
            git commit -m 'RT79: publish complete strategic release'
            git push
          fi
