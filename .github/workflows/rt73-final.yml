name: RT73 Publicar Final

on:
  push:
    paths:
      - 'rt73-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar RT73 nos dois HTMLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          files=[Path('index.html'),Path('JOGAR_REINOS_TRIBAIS.html')]
          for p in files:
              if not p.exists(): raise SystemExit(f'ausente: {p}')
          if not Path('rt73-village-runtime.js').exists(): raise SystemExit('rt73-village-runtime.js ausente')

          html=files[0].read_text(encoding='utf-8')

          html=re.sub(r'<title>Reinos Tribais — RT\d+[A-Z]?[^<]*</title>', '<title>Reinos Tribais — RT73 Final</title>', html, count=1)
          html=re.sub(r'  const VERSION = \d+;', '  const VERSION = 73;', html, count=1)
          html=re.sub(r'  const RT_BUILD = "[^"]+";', '  const RT_BUILD = "73.0";', html, count=1)
          if 'const RT73_FINAL = true;' not in html:
              html=html.replace('  const RT_BUILD = "73.0";', '  const RT_BUILD = "73.0";\n  const RT73_FINAL = true;',1)

          replacements={
              'CENTRAL OPERACIONAL RT72':'CENTRAL OPERACIONAL RT73',
              'interface guiada RT72':'interface guiada RT73',
              'RT72 • ALDEIA INTEGRADA • ONLINE':'RT73 • ALDEIA INTEGRADA • ONLINE',
              'Reinos Tribais — RT72 • aldeia integrada • sistemas consolidados • mapa vivo • multiplayer':'Reinos Tribais — RT73 • aldeia ativa • sistemas consolidados • mapa vivo • multiplayer',
              'RT72 GUIADA':'RT73 GUIADA',
              'RT72 • revisão consolidada':'RT73 • versão final'
          }
          for a,b in replacements.items(): html=html.replace(a,b)

          html=re.sub(r'\s*<script\s+src=["\']rt73-village-runtime\.js[^"\']*["\']\s*></script>\s*','\n',html)
          tag='\n<script src="rt73-village-runtime.js?v=73"></script>\n'
          if '</body>' not in html: raise SystemExit('</body> ausente')
          html=html.replace('</body>',tag+'</body>',1)

          for p in files: p.write_text(html,encoding='utf-8')

          buildings=['main','timber','clay','iron','farm','warehouse','market','hide','barracks','stable','garage','smith','academy','statue','rally','wall','watchtower','first_church','church']
          missing=[]
          for b in buildings:
              for lvl in range(5):
                  p=Path(f'assets/v54/buildings/{b}_l{lvl}.png')
                  if not p.exists(): missing.append(str(p))

          checks={
              'html_identical':files[0].read_bytes()==files[1].read_bytes(),
              'title_rt73':'<title>Reinos Tribais — RT73 Final</title>' in html,
              'version_73':'const VERSION = 73;' in html,
              'build_73':'const RT_BUILD = "73.0";' in html,
              'rt73_marker':'const RT73_FINAL = true;' in html,
              'runtime_loaded':'<script src="rt73-village-runtime.js?v=73"></script>' in html,
              'runtime_file':Path('rt73-village-runtime.js').exists(),
              '19_buildings':all(b in Path('rt73-village-runtime.js').read_text(encoding='utf-8') for b in buildings),
              '95_assets':not missing,
              'v54_direct':'assets/v54/buildings/${key}_l${tier}.png' in Path('rt73-village-runtime.js').read_text(encoding='utf-8')
          }
          report={'version':'RT73','checks':checks,'missing_assets':missing,'html_sha256':hashlib.sha256(html.encode()).hexdigest(),'runtime_sha256':hashlib.sha256(Path('rt73-village-runtime.js').read_bytes()).hexdigest()}
          Path('AUDITORIA_RT73_FINAL.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          if not all(checks.values()):
              print(json.dumps(report,ensure_ascii=False,indent=2))
              raise SystemExit('AUDITORIA RT73 FALHOU')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check rt73-village-runtime.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/rt73-js');out.mkdir(exist_ok=True)
          n=0
          for s in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              if not s.strip(): continue
              n+=1
              (out/f'{n:03}.js').write_text(s,encoding='utf-8')
          print(n)
          PY
          for f in /tmp/rt73-js/*.js; do node --check "$f" >/dev/null; done

      - name: Commit RT73
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Reinos Tribais RT73'
          git config user.email 'rt73@reinos-tribais.local'
          git add index.html JOGAR_REINOS_TRIBAIS.html rt73-village-runtime.js AUDITORIA_RT73_FINAL.json
          git commit -m 'RT73 publica aldeia restaurada e build final'
          git push origin HEAD:main
