<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3d2612">
<meta name="description" content="Reinos Tribais Online — carregamento seguro do cliente completo.">
<title>Reinos Tribais Online</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#7a552d 0,#3d2612 42%,#171008 100%);color:#f7e7be;font-family:Georgia,'Times New Roman',serif}.boot{width:min(620px,calc(100% - 36px));padding:34px 28px;border:2px solid #c89b52;border-radius:14px;background:linear-gradient(145deg,rgba(58,37,18,.97),rgba(25,16,8,.98));box-shadow:0 24px 80px #0009;text-align:center}.crest{font-size:56px;filter:drop-shadow(0 4px 8px #0008)}h1{margin:10px 0 6px;color:#ffd788;font-size:clamp(28px,7vw,48px)}p{line-height:1.5}.bar{height:12px;border:1px solid #b58b4e;border-radius:999px;overflow:hidden;background:#120d08;margin:22px 0 12px}.bar>i{display:block;height:100%;width:12%;background:linear-gradient(90deg,#8a5d28,#e7bc64,#fff0a7);animation:load 1.35s ease-in-out infinite alternate}@keyframes load{to{width:92%}}#status{min-height:24px;color:#ecd8a8}.actions{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.actions.show{display:flex}.btn{border:1px solid #d8ab5e;border-radius:7px;background:#6e451d;color:#fff2cd;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none}.btn:hover{filter:brightness(1.12)}small{display:block;margin-top:18px;color:#bfa982}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<main class="boot" role="status" aria-live="polite">
  <div class="crest">⚔️</div>
  <h1>Reinos Tribais</h1>
  <p>Preparando o reino, autenticação e sistemas online.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div id="status">Carregando cliente principal…</div>
  <div class="actions" id="actions">
    <button class="btn" id="retry" type="button">Tentar novamente</button>
    <a class="btn" href="JOGAR_REINOS_TRIBAIS.html">Abrir cliente diretamente</a>
  </div>
  <small>RT87 • bootstrap leve • GitHub + Supabase</small>
</main>
<script>
(()=>{
  const status=document.getElementById('status'),actions=document.getElementById('actions');
  let tries=0,done=false;
  const set=t=>{if(!done)status.textContent=t};
  const load=async()=>{
    tries++;actions.classList.remove('show');set(tries>1?'Reconectando ao cliente…':'Carregando cliente principal…');
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);
    try{
      const r=await fetch('./JOGAR_REINOS_TRIBAIS.html',{cache:'no-cache',signal:ctrl.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      set('Montando interface…');
      const html=await r.text();
      if(!html.includes('Reinos Tribais')||html.length<100000)throw new Error('Cliente incompleto');
      done=true;clearTimeout(timer);
      document.open();document.write(html);document.close();
    }catch(e){
      clearTimeout(timer);done=false;status.textContent='Não foi possível carregar o cliente. Use Tentar novamente.';actions.classList.add('show');
      console.error('RT87 boot',e);
    }
  };
  document.getElementById('retry').addEventListener('click',load);
  addEventListener('online',()=>{if(!done)load()});
  setTimeout(()=>set('Carregando sistemas de jogo…'),900);
  load();
})();
</script>
</body>
</html>
