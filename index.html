<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5d3a1a">
<meta name="description" content="Jogo de estratégia medieval independente, totalmente em português e jogável offline.">
<title>Reinos Tribais — V17 Layout Tribal Pro PT-BR</title>
<style>
:root {
  --ink: #2a1a0f;
  --paper: #f2e4bd;
  --paper-2: #e8d3a0;
  --wood: #6a431f;
  --wood-dark: #40250f;
  --gold: #c99a38;
  --red: #8a2f24;
  --green: #356d35;
  --blue: #315f81;
  --muted: #725e44;
  --line: #9d7a43;
  --shadow: 0 5px 18px rgba(35, 20, 8, .25);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: Georgia, 'Times New Roman', serif;
  background: #5a3818 url('assets/ui/bg-tile.jpg') repeat;
  background-attachment: fixed;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .52; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.good { color: var(--green); font-weight: 700; }
.bad { color: var(--red); font-weight: 700; }
.warn { color: #9a6100; font-weight: 700; }
.small { font-size: .86rem; }
.tiny { font-size: .75rem; }
.nowrap { white-space: nowrap; }

.start-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.start-card {
  width: min(760px, 100%);
  background: linear-gradient(135deg, rgba(255,249,224,.96), rgba(226,202,146,.98));
  border: 4px double var(--wood);
  box-shadow: var(--shadow);
  border-radius: 10px;
  padding: clamp(24px, 6vw, 54px);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.start-card::before {
  content: '⚔';
  position: absolute;
  font-size: 280px;
  opacity: .045;
  left: -30px;
  top: -75px;
  transform: rotate(-20deg);
}
.start-card h1 { margin: 0 0 8px; font-size: clamp(2.1rem, 7vw, 4rem); color: var(--wood-dark); }
.start-card .subtitle { font-size: 1.15rem; margin: 0 auto 24px; max-width: 580px; }
.start-form { display: grid; gap: 14px; max-width: 460px; margin: 24px auto 0; text-align: left; }
.start-form label { font-weight: 700; }
.start-form input { width: 100%; padding: 12px; border: 2px solid var(--line); background: #fffaf0; border-radius: 5px; }
.disclaimer { margin-top: 22px; border-top: 1px solid rgba(80,50,20,.3); padding-top: 14px; }

.game-shell { min-height: 100vh; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  color: #fff5da;
  background: linear-gradient(rgba(114,73,31,.92), rgba(75,44,17,.96)), url('assets/ui/header.png') repeat-x top center;
  border-bottom: 3px solid #271608;
  box-shadow: 0 3px 12px rgba(0,0,0,.35);
}
.topbar-inner {
  max-width: 1440px;
  margin: auto;
  min-height: 64px;
  padding: 8px 15px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.brand { font-size: 1.25rem; font-weight: 800; color: #ffd77c; white-space: nowrap; }
.village-select { min-width: 180px; max-width: 270px; padding: 7px; background: #f7e8bd; color: var(--ink); border: 1px solid #b88a45; }
.resources { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.resource-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 95px;
  padding: 6px 9px;
  background: rgba(20,10,2,.38);
  border: 1px solid rgba(255,220,150,.38);
  border-radius: 4px;
  font-variant-numeric: tabular-nums;
}
.resource-pill.full { outline: 2px solid #f0a44f; }
.server-clock { font-size: .82rem; opacity: .88; white-space: nowrap; }

.main-layout {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) 290px;
  gap: 14px;
  padding: 14px;
}
.side-nav, .right-rail, .content-panel {
  background: linear-gradient(rgba(248,237,205,.98), rgba(226,203,154,.98));
  border: 2px solid var(--wood-dark);
  box-shadow: var(--shadow);
  border-radius: 5px;
}
.side-nav { align-self: start; position: sticky; top: 80px; overflow: hidden; }
.side-nav button {
  width: 100%;
  border: 0;
  border-bottom: 1px solid #b48c50;
  background: transparent;
  color: var(--ink);
  padding: 11px 13px;
  text-align: left;
  font-weight: 700;
}
.side-nav button:hover, .side-nav button.active { background: #c69a55; color: #261407; }
.side-nav .nav-section { padding: 7px 11px; background: #4c2c10; color: #ffe6a3; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.content-panel { min-height: 680px; padding: 18px; min-width: 0; }
.right-rail { align-self: start; position: sticky; top: 80px; padding: 12px; }
.panel-title { margin: -18px -18px 18px; padding: 13px 18px; background: linear-gradient(#6b451f, #4f2f12); color: #ffe7a6; border-bottom: 2px solid #2d1808; font-size: 1.35rem; }
.section-title { border-bottom: 2px solid #9b743d; padding-bottom: 6px; margin: 20px 0 12px; }

.btn {
  border: 1px solid #3f210d;
  border-radius: 4px;
  padding: 8px 13px;
  color: #fff8e2;
  background: linear-gradient(#875321, #5c3513);
  box-shadow: inset 0 1px rgba(255,255,255,.22);
  font-weight: 700;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.primary { background: linear-gradient(#4f8738, #2f6328); }
.btn.danger { background: linear-gradient(#a84c3f, #76281e); }
.btn.secondary { color: var(--ink); background: linear-gradient(#f1dca8, #cfaa68); }
.btn.small-btn { padding: 5px 9px; font-size: .85rem; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.notice { padding: 11px 13px; border: 1px solid #b18a4f; background: #fff3c8; border-radius: 4px; margin-bottom: 12px; }
.notice.success { border-color: #6c9a57; background: #e4f2d8; }
.notice.error { border-color: #ac5c4f; background: #f8dcd4; }
.notice.info { border-color: #658ba5; background: #dcebf5; }

.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; }
.stat-card { background: rgba(255,250,232,.72); border: 1px solid #b78c4e; padding: 12px; border-radius: 4px; }
.stat-card .value { font-size: 1.35rem; font-weight: 800; color: var(--wood-dark); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.game-card { border: 1px solid #a47c43; background: rgba(255,250,230,.76); border-radius: 5px; padding: 12px; }
.game-card h3 { margin: 0 0 8px; }
.building-card, .unit-card { display: grid; grid-template-columns: 54px 1fr; gap: 10px; }
.big-icon { font-size: 2.25rem; display: grid; place-items: start center; }
.costs { display: flex; flex-wrap: wrap; gap: 8px; font-size: .9rem; margin: 6px 0; }
.cost { padding: 2px 5px; background: rgba(108,75,33,.1); border-radius: 3px; white-space: nowrap; }
.requirements { font-size: .8rem; color: #78582d; margin: 5px 0; }
.progress { height: 11px; background: #cab98f; border: 1px solid #745126; border-radius: 8px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, #51813f, #88b65b); transition: width .3s linear; }
.queue-item { border-bottom: 1px solid #b99a67; padding: 8px 0; }
.queue-item:last-child { border-bottom: 0; }

.data-table { width: 100%; border-collapse: collapse; background: rgba(255,250,232,.64); }
.data-table th, .data-table td { border: 1px solid #aa8750; padding: 8px; text-align: left; vertical-align: middle; }
.data-table th { background: #735028; color: #fff1c9; }
.data-table tr:nth-child(even) td { background: rgba(209,180,124,.2); }
.number-input { width: 90px; padding: 6px; border: 1px solid #987343; background: #fffdf5; }
.text-input, .select-input { width: 100%; padding: 8px; border: 1px solid #987343; background: #fffdf5; }

.map-wrap { overflow: auto; padding: 10px; border: 3px solid #6c4b24; background: #6f8450 url('assets/custom/map_story_bg.png') center/cover; box-shadow: inset 0 0 0 1px rgba(255,244,214,.2), inset 0 16px 30px rgba(20,8,0,.18); border-radius: 6px; }
.world-map { display: grid; grid-template-columns: repeat(15, 64px); grid-auto-rows: 64px; gap: 2px; width: max-content; }
.world-map-large { grid-template-columns: repeat(21, 52px); grid-auto-rows: 52px; }
.map-tile-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.34; }
.map-cell {
  border: 1px solid rgba(50,40,20,.28);
  position: relative;
  background: rgba(255,248,228,.05);
  overflow: hidden;
  text-align: center;
  min-width: 0;
}
.map-cell.empty { background: rgba(255,255,255,.03); }
.map-cell::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 40%); pointer-events: none; }
.map-cell.village { font-weight: 800; backdrop-filter: blur(.6px); }
.map-cell.player { background: rgba(223,196,86,.18); }
.map-cell.barbarian { background: rgba(149,144,132,.18); }
.map-cell.enemy { background: rgba(176,92,78,.18); }
.map-cell.tribe { background: rgba(90,126,168,.20); }
.map-cell.active { outline: 2px solid #fff3a0; outline-offset: -3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
.map-cell:hover { transform: scale(1.05); z-index: 2; box-shadow: 0 6px 14px rgba(0,0,0,.22); }
.quest .report-art { max-height: 110px; margin: 0 0 8px; }
.map-icon { font-size: 1.55rem; line-height: 1.1; }
.map-marker { font-size: 1.35rem; line-height: 1; margin-top: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.25); }
.map-coord { position: absolute; right: 2px; bottom: 2px; font-size: .56rem; background: rgba(24,14,7,.62); color: #f7e7c6; padding: 1px 3px; border-radius: 3px; }
.map-points { position: absolute; left: 2px; top: 2px; font-size: .56rem; background: rgba(255,247,221,.82); color: #251507; padding: 1px 3px; border-radius: 3px; }
.map-legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 9px 0; font-size: .86rem; }
.legend-dot { display: inline-block; width: 12px; height: 12px; border: 1px solid #333; vertical-align: -1px; margin-right: 4px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(20,10,3,.72); z-index: 50; display: grid; place-items: center; padding: 18px; }
.modal { width: min(780px, 100%); max-height: 90vh; overflow: auto; background: #f1e2b8; border: 4px double #4a2a11; box-shadow: 0 20px 60px rgba(0,0,0,.55); padding: 18px; border-radius: 6px; }
.modal h2 { margin-top: 0; }

.toast-stack { position: fixed; z-index: 100; right: 14px; bottom: 14px; display: grid; gap: 8px; max-width: 360px; }
.toast { padding: 11px 14px; color: #fff; background: #3e2b17; border: 1px solid #d3ab65; box-shadow: var(--shadow); border-radius: 4px; animation: toast-in .25s ease-out; }
.toast.success { background: #315d2d; }
.toast.error { background: #7b2c25; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

.quest { padding: 9px; border: 1px solid #b6955e; background: rgba(255,248,220,.7); margin-bottom: 8px; border-radius: 4px; }
.quest.done { opacity: .65; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 999px; background: #6c451f; color: #fff1c7; font-size: .73rem; }
.report-unread { font-weight: 800; }
.report-icon { font-size: 1.2rem; }
.footer-note { text-align: center; color: #f3dfaa; padding: 8px 14px 20px; font-size: .78rem; }

@media (max-width: 1100px) {
  .main-layout { grid-template-columns: 190px minmax(0, 1fr); }
  .right-rail { grid-column: 1 / -1; position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .resources { margin-left: 0; }
}
@media (max-width: 760px) {
  .topbar { position: static; }
  .main-layout { display: block; padding: 7px; }
  .side-nav { position: static; display: grid; grid-template-columns: repeat(2, 1fr); margin-bottom: 8px; }
  .side-nav .nav-section { grid-column: 1 / -1; }
  .content-panel { padding: 12px; min-height: 0; }
  .panel-title { margin: -12px -12px 14px; }
  .right-rail { display: block; margin-top: 8px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .resource-pill { min-width: 82px; }
  .world-map, .world-map-large { grid-template-columns: repeat(11, 48px); grid-auto-rows: 48px; }
  .map-cell { padding: 2px; }
  .map-icon { font-size: 1.3rem; }
  .data-table { font-size: .82rem; }
}


.start-card, .side-nav, .right-rail, .content-panel {
  background-image: linear-gradient(rgba(248,237,205,.96), rgba(226,203,154,.97)), url('assets/ui/content.jpg');
  background-size: cover;
}
.start-card { background-position: center center; }
.big-icon { width: 64px; min-height: 64px; display: grid; place-items: start center; }
.art-thumb, .unit-pill-art, .table-unit-art, .modal-art {
  display:block;
  object-fit: contain;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,.24));
}
.art-thumb { width: 54px; height: 54px; }
.unit-pill-art { width: 44px; height: 44px; }
.table-unit { display:flex; align-items:center; gap:8px; }
.table-unit-art { width: 28px; height: 28px; }
.modal-hero {
  display:grid;
  grid-template-columns: minmax(140px, 180px) 1fr;
  gap: 14px;
  align-items: start;
  margin-bottom: 12px;
}
.modal-art {
  width: 100%;
  max-height: 180px;
  background: rgba(255,255,255,.55);
  border: 2px solid #7f5c2d;
  border-radius: 6px;
  padding: 6px;
}
.hero-banner {
  display:grid;
  grid-template-columns: minmax(250px, 340px) 1fr;
  gap: 14px;
  margin-bottom: 14px;
  background: rgba(255,250,230,.78);
  border: 1px solid #a47c43;
  border-radius: 5px;
  padding: 12px;
}
.hero-banner img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 6px;
  border: 2px solid #7f5c2d;
}
.summary-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; }
.summary-chip {
  display:flex; gap: 10px; align-items:flex-start;
  background: rgba(108,75,33,.08); border: 1px solid #b78c4e; border-radius: 5px; padding: 10px;
}
.summary-chip > span { font-size: 1.35rem; line-height: 1.2; }
.unit-pill {
  display:flex; gap: 10px; align-items:center;
  border: 1px solid #b78c4e; border-radius: 5px; padding: 8px; background: rgba(255,250,232,.72);
}
.unit-pill .value { font-size: 1.15rem; font-weight: 800; color: var(--wood-dark); }
.report-art { width:100%; max-height:180px; object-fit:cover; border:2px solid #7f5c2d; border-radius:6px; margin: 10px 0; }
.map-wrap { background: #6f8450 url('assets/custom/map_story_bg.png') center/cover; }
.quick-fill-note { margin-top: 10px; }
@media (max-width: 1080px) {
  .main-layout { grid-template-columns: 1fr; }
  .side-nav, .right-rail { position: static; }
}
@media (max-width: 720px) {
  .hero-banner, .modal-hero { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
}


.start-screen {
  min-height: 100vh;
  padding: 0;
  display: grid;
  grid-template-columns: minmax(340px, 520px) 1fr;
  background: linear-gradient(90deg, rgba(18,10,4,.78), rgba(18,10,4,.54) 42%, rgba(18,10,4,.14) 68%), url('assets/custom/start_screen_v2.png') center/cover no-repeat;

/* ===== V4 PREMIUM / MAPA / TRIBO ===== */
:root { --panel-dark:#19150f; --panel-mid:#2a2116; --gold2:#d2a849; --gold3:#f1d37c; --edge:#6d542c; }
body { background-color:#242016; background-image: linear-gradient(rgba(20,18,13,.2),rgba(20,18,13,.2)), url('assets/ui/bg-tile.jpg'); }
.topbar { background: linear-gradient(#1b1811,#100e0a); border-bottom:1px solid #71582f; }
.topbar-inner { max-width:1600px; min-height:58px; }
.brand { font-size:1.4rem; letter-spacing:.06em; color:var(--gold3); text-transform:uppercase; }
.main-layout { max-width:1600px; grid-template-columns:205px minmax(0,1fr) 270px; gap:10px; padding:10px; }
.side-nav,.right-rail,.content-panel { border:1px solid #6d542c; border-radius:3px; box-shadow:0 4px 18px rgba(0,0,0,.35); }

.side-nav .nav-section { background:#0f0d09; color:#d9b65d; border-bottom:1px solid #68532e; }

.side-nav button:hover,.side-nav button.active { background:linear-gradient(90deg,#5f4824,#2b2317); color:#ffe499; padding-left:16px; }
.content-panel,.right-rail { background-image:linear-gradient(rgba(247,236,205,.97),rgba(222,201,153,.97)),url('assets/ui/content.jpg'); }
.panel-title { background:linear-gradient(#272017,#16120d); color:#f2d77f; border-bottom:1px solid #806534; }
.resource-pill { background:#17140e; border:1px solid #66522f; color:#ecd9a7; border-radius:3px; }
button.resource-pill { appearance:none; }
.premium-pill { color:#ffe28b; border-color:#9a7b31; }
.map-toolbar { display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; background:#251e14; padding:8px; border:1px solid #6b532d; border-radius:3px; }
.map-tools-left,.map-tools-right { display:flex; gap:4px; align-items:center; }
.map-search { display:flex; gap:5px; max-width:220px; }
.map-search .text-input { background:#f4e8c7; padding:6px; }
.map-layout { display:grid; grid-template-columns:minmax(0,1fr) 210px; gap:10px; }

  function getMerchantOffer(node) {
    const order = ['resource_chest','spyglass','production_banner','war_banner','construction_scroll','recruitment_scroll','loyalty_seal'];
    const itemId = order[(node.level + node.x + node.y) % order.length];
    const base = { resource_chest: 110, spyglass: 90, production_banner: 150, war_banner: 160, construction_scroll: 180, recruitment_scroll: 170, loyalty_seal: 200 };
    return { itemId, price: base[itemId] + node.level * 5 };
  }

  function generateWorldNodes(villages, mapRadius, rng) {
    const occupied = new Set(Object.values(villages).map(v => `${v.x}|${v.y}`));
    const nodes = [];
    let nodeId = 1;
    const pickSpot = () => {
      for (let tries = 0; tries < 4000; tries += 1) {
        const x = randomInt(500 - mapRadius, 500 + mapRadius, rng);
        const y = randomInt(500 - mapRadius, 500 + mapRadius, rng);
        const key = `${x}|${y}`;
        if (occupied.has(key)) continue;
        occupied.add(key);
        return { x, y };
      }
      return null;
    };
    Object.entries(WORLD_NODE_COUNTS).forEach(([type, count]) => {
      const finalCount = Math.max(2, Math.floor(count * (mapRadius / 20)));
      for (let i = 0; i < finalCount; i += 1) {
        const spot = pickSpot();
        if (!spot) break;
        const dist = Math.hypot(spot.x - 500, spot.y - 500);
        const level = clamp(1 + Math.floor(dist / 4) + randomInt(0, 2, rng), 1, 9);
        nodes.push({ id: `node_${nodeId++}`, type, x: spot.x, y: spot.y, level, owner: null, available: true, respawnAt: 0, lastHarvestAt: 0, offer: type === 'merchant' ? getMerchantOffer({ ...spot, level }) : null });
      }
    });
    return nodes;
  }

  function createAiBuildings(level, rng) {
    const b = {};
    Object.keys(D.buildings).forEach(key => { b[key] = 0; });
    b.main = clamp(level, 1, 20);
    b.timber = clamp(level + randomInt(-2, 2, rng), 1, 20);
    b.clay = clamp(level + randomInt(-2, 2, rng), 1, 20);
    b.iron = clamp(level + randomInt(-3, 1, rng), 1, 20);
    b.farm = clamp(level + 1, 1, 20);
    b.warehouse = clamp(level, 1, 20);
    b.rally = 1;
    b.barracks = clamp(level - 2, 0, 15);
    b.smith = clamp(level - 4, 0, 12);
    b.stable = clamp(level - 7, 0, 10);
    b.garage = clamp(level - 10, 0, 5);
    b.market = clamp(level - 5, 0, 10);
    b.wall = clamp(level - randomInt(2, 5, rng), 0, 15);

  function createAiUnits(level, isBarbarian, rng) {
    const u = {};
    Object.keys(D.units).forEach(key => { u[key] = 0; });
    const base = level * level * (isBarbarian ? 1.6 : 2.4);
    u.spear = randomInt(Math.floor(base * .5), Math.floor(base * 1.1), rng);
    u.sword = randomInt(Math.floor(base * .25), Math.floor(base * .7), rng);
    u.axe = randomInt(0, Math.floor(base * .7), rng);

  function productionPerHour(village, resource) {
    const buildingKey = resource === 'wood' ? 'timber' : resource;
    const level = village.buildings[buildingKey] || 0;
    if (level <= 0) return 0;
    let mult = 1;
    if (resource === 'wood' && hasResearch('sawmill')) mult += .10;
    if (resource === 'clay' && hasResearch('masonry')) mult += .10;
    if (resource === 'iron' && hasResearch('smelting')) mult += .10;
    if (village.owner === 'player') {
      mult *= premiumProductionMultiplier() * premiumResourceMultiplier(resource) * (1 + getTribeTechLevel('economy') * 0.03) * (1 + flagEffect(village,'production'));
      const nodeRate = nodePassiveBonus(resource);
      return (35 * Math.pow(1.168, level - 1) + nodeRate) * state.settings.worldSpeed * mult;
    }
    return 35 * Math.pow(1.168, level - 1) * state.settings.worldSpeed * mult;
  }

  function storageCapacity(village) {
    const level = village.buildings.warehouse || 0;
    return Math.floor(1000 * Math.pow(1.229, Math.max(0, level - 1)));
  }

  function farmCapacity(village) {
    const level = village.buildings.farm || 0;
    let cap = Math.floor(240 * Math.pow(1.172, Math.max(0, level - 1)));
    if (hasResearch('agriculture')) cap = Math.floor(cap * 1.15);
    cap = Math.floor(cap * (1 + flagEffect(village,'population')));
    return cap;
  }

  function hiddenCapacity(village) {
    const level = village.buildings.hide || 0;
    return Math.floor(level <= 0 ? 0 : 150 * Math.pow(1.45, level - 1));
  }

  function usedPopulation(village, includeQueues = true) {
    let total = 0;
    Object.entries(village.buildings).forEach(([key, level]) => {
      const def = D.buildings[key];
      if (def) total += (def.pop || 0) * level;
    });
    Object.entries(village.units).forEach(([key, qty]) => {
      const def = D.units[key];
      if (def) total += def.pop * qty;
    });
    if (includeQueues) {
      village.buildQueue.forEach(item => { total += D.buildings[item.building].pop || 0; });
      village.recruitQueue.forEach(item => { total += D.units[item.unit].pop * item.quantity; });
    }
    return Math.floor(total);
  }

  function updateResources(village, timestamp = now()) {
    const last = village.resources.lastUpdate || timestamp;
    const elapsedHours = Math.max(0, timestamp - last) / 3600000;
    if (elapsedHours <= 0) return;
    const cap = storageCapacity(village);
    RESOURCE_KEYS.forEach(resource => {
      let rate;
      if (village.owner === 'player') {
        rate = productionPerHour(village, resource);
      } else {
        const level = village.buildings[resource === 'wood' ? 'timber' : resource] || 1;
        rate = 25 * Math.pow(1.12, level - 1) * state.settings.worldSpeed;
      }
      village.resources[resource] = Math.min(cap, (village.resources[resource] || 0) + rate * elapsedHours);
    });
    village.resources.lastUpdate = timestamp;
  }

  function buildingCost(buildingKey, targetLevel) {
    const def = D.buildings[buildingKey];
    const exponent = Math.max(0, targetLevel - 1);
    return def.base.map(value => Math.ceil(value * Math.pow(def.factor, exponent)));
  }

  function buildingDuration(village, buildingKey, targetLevel) {
    const def = D.buildings[buildingKey];
    const hqBonus = 1 + (village.buildings.main || 0) * .055;
    return Math.max(3000, def.time * 1000 * Math.pow(1.18, Math.max(0, targetLevel - 1)) / (state.settings.worldSpeed * hqBonus));
  }

  function unitDuration(village, unitKey, quantity) {
    const def = D.units[unitKey];
    const placeLevel = village.buildings[def.place] || 1;
    const speedBonus = 1 + placeLevel * .06;
    const flagBonus = 1 + flagEffect(village,'recruitment');
    return Math.max(1000, def.time * 1000 * quantity / (state.settings.worldSpeed * speedBonus * flagBonus));
  }

  function requirementsMet(village, requirements = {}) {
    return Object.entries(requirements).every(([key, level]) => (village.buildings[key] || 0) >= level);
  }

  function requirementsText(requirements = {}) {
    const entries = Object.entries(requirements);
    if (!entries.length) return 'Sem requisitos adicionais';
    return entries.map(([key, level]) => `${D.buildings[key]?.name || key} ${level}`).join(', ');
  }

  function canAfford(village, costs) {
    return RESOURCE_KEYS.every((resource, index) => village.resources[resource] >= costs[index]);
  }

  function payCosts(village, costs) {
    RESOURCE_KEYS.forEach((resource, index) => { village.resources[resource] -= costs[index]; });
    village.resources.lastUpdate = now();
  }

  function refundCosts(village, costs, factor = .9) {
    const cap = storageCapacity(village);
    RESOURCE_KEYS.forEach((resource, index) => {
      village.resources[resource] = Math.min(cap, village.resources[resource] + costs[index] * factor);
    });
  }

  function villagePoints(village) {
    let points = 0;
    Object.entries(village.buildings).forEach(([key, level]) => {
      const weight = ['main', 'academy', 'smith'].includes(key) ? 12 : ['timber', 'clay', 'iron'].includes(key) ? 7 : 9;
      points += Math.floor(weight * Math.pow(level, 1.38));

    return Math.max(26, Math.floor(points));
  }

  function recalcAllPoints(targetState = state) {

  function queueBuilding(buildingKey) {
    const village = getActiveVillage();
    updateResources(village);
    const def = D.buildings[buildingKey];
    if (!def) return;
    const currentLevel = village.buildings[buildingKey] || 0;
    const queuedLevels = village.buildQueue.filter(item => item.building === buildingKey).length;
    const targetLevel = currentLevel + queuedLevels + 1;
    if (targetLevel > def.max) return toast('Este edifício já atingiu o nível máximo.', 'error');
    if (!requirementsMet(village, def.req)) return toast(`Requisitos: ${requirementsText(def.req)}`, 'error');
    if (village.buildQueue.length >= getBuildQueueLimit()) return toast(`A fila de construção está cheia (${getBuildQueueLimit()} espaços).`, 'error');
    const costs = buildingCost(buildingKey, targetLevel);
    if (!canAfford(village, costs)) return toast('Recursos insuficientes.', 'error');
    if (usedPopulation(village) + (def.pop || 0) > farmCapacity(village)) return toast('A Fazenda não comporta mais população.', 'error');
    payCosts(village, costs);
    const startAt = village.buildQueue.length ? village.buildQueue[village.buildQueue.length - 1].finishAt : now();
    const duration = buildingDuration(village, buildingKey, targetLevel);
    village.buildQueue.push({ building: buildingKey, targetLevel, costs, startAt, finishAt: startAt + duration });
    dirty = true;
    toast(`${def.name} nível ${targetLevel} entrou na fila.`, 'success');
    renderAll();
  }

  function cancelBuilding(index) {

    const item = village.buildQueue[index];

    village.buildQueue.splice(index, 1);
    recalculateQueueTimes(village.buildQueue, (queueItem) => buildingDuration(village, queueItem.building, queueItem.targetLevel));

    toast('Construção cancelada; 90% dos recursos foram devolvidos.', 'success');
    renderAll();
  }

  function recalculateQueueTimes(queue, durationFn) {
    let cursor = now();
    queue.forEach(item => {
      const duration = durationFn(item);
      item.startAt = cursor;
      item.finishAt = cursor + duration;
      cursor = item.finishAt;
    });
  }

  function queueRecruit(unitKey, quantity) {
    const v = getActiveVillage(); const def = D.units[unitKey]; const qty = Math.floor(Number(quantity));
    if (!def || !Number.isFinite(qty) || qty <= 0) return toast('Quantidade inválida.', 'error');
    if (def.movable === false || unitKey === 'militia') return toast('A Milícia é convocada pela Fazenda, não recrutada.', 'error');
    if (RESEARCHABLE_UNITS.includes(unitKey) && getUnitResearchLevel(v,unitKey) <= 0) return toast('Pesquise esta unidade no Ferreiro primeiro.', 'error');
    if (!requirementsMet(v, def.req)) return toast(`Requisitos: ${requirementsText(def.req)}`, 'error');

    updateResources(v); const costs = def.cost.map(value => value * qty);

    if (unitKey === 'noble') { const need = nobleCoinRequirement(qty); if ((state.player.academyCoins||0) < need) return toast(`Você precisa de ${need} moeda(s) cunhada(s) no reino.`, 'error'); state.player.academyCoins -= need; }
    payCosts(v, costs);
    const startAt = v.recruitQueue.length ? v.recruitQueue[v.recruitQueue.length - 1].finishAt : now();
    const finishAt = startAt + unitDuration(v, unitKey, qty);
    v.recruitQueue.push({ unit: unitKey, quantity: qty, costs, startAt, finishAt }); dirty = true; toast(`${qty} ${def.name}${qty > 1 ? 's' : ''} na fila.`, 'success'); renderAll();
  }

  function cancelRecruit(index) {

  function processQueues(timestamp) {

      updateResources(village, timestamp);
      while (village.buildQueue.length && village.buildQueue[0].finishAt <= timestamp) {

        addReport({ category: 'Construção', title: `${D.buildings[item.building].name} concluído`, icon: '🏗️', body: `${village.name}: ${D.buildings[item.building].name} alcançou o nível ${item.targetLevel}.` });
        changed = true;
      }
      while (village.recruitQueue.length && village.recruitQueue[0].finishAt <= timestamp) {

  function distanceBetween(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function travelDuration(source, target, troops) {
    const speeds = Object.entries(troops).filter(([, qty]) => qty > 0).map(([key]) => D.units[key].speed);
    const slowest = Math.max(...speeds, 1);
    const hasMounted = Object.entries(troops).some(([key, qty]) => qty > 0 && D.units[key].type === 'cav');
    const heroBoost = (source?.owner === 'player' && troops.paladin > 0) ? (1 - Math.min(.22, heroStatTotal('speed') * 0.04)) : 1;
    const researchBoost = (source?.owner === 'player' && hasMounted && hasResearch('horsemanship')) ? .88 : 1;
    return Math.max(4000, distanceBetween(source, target) * slowest * 1000 / (state.settings.unitSpeed * state.settings.worldSpeed) * heroBoost * researchBoost);
  }

  function sendAttack(targetId, troops) {
    const source = getActiveVillage();
    const target = state.villages[targetId];
    if (!target || target.owner === 'player') return toast('Escolha uma aldeia que não seja sua.', 'error');
    const selected = {};
    let total = 0;
    Object.keys(D.units).forEach(key => {
      const def=D.units[key]; const qty = def.movable===false ? 0 : clamp(Math.floor(Number(troops[key]) || 0), 0, source.units[key] || 0);
      selected[key] = qty;
      total += qty;
    });
    if (total <= 0) return toast('Selecione pelo menos uma unidade.', 'error');
    Object.entries(selected).forEach(([key, qty]) => { source.units[key] -= qty; });
    const duration = travelDuration(source, target, selected);
    state.commands.push({
      id: state.nextCommandId++,
      kind: 'attack',
      phase: 'outbound',
      sourceId: source.id,
      targetId: target.id,

    });
    state.player.flags.firstAttack = true;
    modalHtml = '';
    dirty = true;

  }

  function processCommands(timestamp) {
    let changed = false; const completed = [];
    state.commands.forEach(command => {
      if (command.arriveAt > timestamp) return;
      if (command.kind === 'trade') { resolveTrade(command); completed.push(command.id); changed = true; return; }
      if (command.kind === 'hero_story') { resolveHeroStory(command); completed.push(command.id); changed = true; return; }
      if (command.kind === 'scavenge') { resolveScavenge(command); completed.push(command.id); changed = true; return; }
      if (command.kind === 'support') { resolveSupport(command); completed.push(command.id); changed = true; return; }
      if (command.kind === 'support_return') { resolveReturn(command); completed.push(command.id); changed = true; return; }
      if (command.phase === 'outbound') { resolveAttack(command); completed.push(command.id); changed = true; }
      else if (command.phase === 'return') { resolveReturn(command); completed.push(command.id); changed = true; }
    });
    if (completed.length) state.commands = state.commands.filter(command => !completed.includes(command.id));
    return changed;
  }

  function resolveAttack(command) {
    const source = state.villages[command.sourceId]; const target = state.villages[command.targetId];
    if (!source || !target) return;
    updateResources(target);
    const attackers = deepClone(command.troops); const defenders = deepClone(target.units);
    const attackerIsPlayer = source.owner === 'player'; const defenderIsPlayer = target.owner === 'player';
    const totalNonSpy = sum(Object.entries(attackers).filter(([key]) => key !== 'spy').map(([, qty]) => qty));
    if (totalNonSpy === 0 && attackers.spy > 0 && attackerIsPlayer) { resolveScout(command, source, target, attackers, defenders); return; }
    const category = dominantAttackCategory(attackers);
    const rawAttack = Object.entries(attackers).reduce((acc, [key, qty]) => acc + D.units[key].attack * qty * researchStrengthMultiplier(source,key), 0);
    const rawDefense = Object.entries(defenders).reduce((acc, [key, qty]) => { const unit = D.units[key]; const defense = category === 'cav' ? unit.defCav : category === 'archer' ? unit.defArcher : unit.def; return acc + defense * qty * researchStrengthMultiplier(target,key); }, 0);
    const wallBefore = target.buildings.wall || 0; const wallMultiplier = Math.pow(1.045, wallBefore); let luck = randomInt(-25, 25); if(attackerIsPlayer){ const pull=Math.round(flagEffect(source,'luck')*100); if(luck>0)luck=Math.max(0,luck-pull); else if(luck<0)luck=Math.min(0,luck+pull); }
    const attackerPoints = source.owner === 'player' ? state.player.points : source.points; const defenderPoints = target.owner === 'player' ? state.player.points : target.points;
    const morale = clamp(Math.pow(Math.max(defenderPoints, 1) / Math.max(attackerPoints, 1), .22), .35, 1);
    const diffAttackBonus = attackerIsPlayer ? (hasResearch('warfare') ? 1.08 : 1) * premiumWarMultiplier() * tribeWarMultiplier() * (1+flagEffect(source,'attack')) : getDifficultyProfile(state.settings.difficulty).aiBonus;
    const faithBonus = defenderIsPlayer && state.settings.church && ((target.buildings.church||0)>0 || (target.buildings.first_church||0)>0) ? 1.20 : 1;
    const diffDefenseBonus = defenderIsPlayer ? (hasResearch('shieldwall') ? 1.10 : 1) * tribeWarMultiplier() * (1+flagEffect(target,'defense')) * faithBonus : getDifficultyProfile(state.settings.difficulty).aiBonus;
    const heroAttack = attackerIsPlayer && attackers.paladin > 0 ? heroBonusMultiplier('attack') : 1; const heroDefense = defenderIsPlayer && defenders.paladin > 0 ? heroBonusMultiplier('defense') : 1;
    const attackPower = Math.max(1, rawAttack * (1 + luck / 100) * morale * diffAttackBonus * heroAttack);
    const defensePower = Math.max(1, (rawDefense * wallMultiplier + 20 * target.points) * diffDefenseBonus * heroDefense);
    const attackerWon = attackPower >= defensePower;
    const attackerLossRate = attackerWon ? clamp(Math.pow(defensePower / attackPower, 1.45), .02, .95) : 1; const defenderLossRate = attackerWon ? 1 : clamp(Math.pow(attackPower / defensePower, 1.45), .02, .95);
    const attackerSurvivors = applyLosses(attackers, attackerLossRate); const defenderSurvivors = applyLosses(defenders, defenderLossRate); target.units = defenderSurvivors;
    let wallDamage = 0; let buildingDamage = ''; const siegeBonus = attackerIsPlayer && hasResearch('engineering') ? 1.25 : 1;
    if (attackerWon && attackerSurvivors.ram > 0 && wallBefore > 0) { wallDamage = clamp(1 + Math.floor(attackerSurvivors.ram / (25 / siegeBonus)), 1, wallBefore); target.buildings.wall = Math.max(0, wallBefore - wallDamage); }
    if (attackerWon && attackerSurvivors.catapult > 0) {
      const candidates = Object.keys(D.buildings).filter(key => !['wall', 'rally'].includes(key) && (target.buildings[key] || 0) > 1);
      if (candidates.length) { const key = candidates[randomInt(0, candidates.length - 1)]; const damage = clamp(1 + Math.floor(attackerSurvivors.catapult / (80 / siegeBonus)), 1, target.buildings[key] - 1); target.buildings[key] -= damage; buildingDamage = `${D.buildings[key].name} perdeu ${damage} nível(is).`; }
    }
    const loot = attackerWon ? calculateLoot(target, attackerSurvivors, attackerIsPlayer ? heroBonusMultiplier('loot') * (1+flagEffect(source,'loot')) : 1) : { wood: 0, clay: 0, iron: 0 };
    let conquestText = '';
    if (attackerWon && attackerSurvivors.noble > 0) {
      const loyaltyLoss = randomInt(20, 35) * attackerSurvivors.noble; target.loyalty -= loyaltyLoss; conquestText = `A lealdade caiu ${loyaltyLoss} pontos, restando ${Math.max(0, target.loyalty)}.`;
      if (target.loyalty <= 0) { target.owner = source.owner; target.ownerName = source.owner === 'player' ? state.player.name : source.ownerName; target.tribe = source.owner === 'player' ? state.player.tribe : source.tribe; target.loyalty = 25; attackerSurvivors.noble = Math.max(0, attackerSurvivors.noble - 1); conquestText += ` ${target.name} mudou de mãos.`; if (attackerIsPlayer) state.player.flags.conquest = true; }
    }
    const survivorsCount = sum(Object.values(attackerSurvivors));
    if (survivorsCount > 0) state.commands.push({ id: state.nextCommandId++, kind: 'return', phase: 'return', sourceId: target.id, targetId: source.id, troops: attackerSurvivors, loot, startAt: now(), arriveAt: now() + command.travelDuration, travelDuration: command.travelDuration });
    if (attackerIsPlayer && attackerWon) state.player.flags.firstWin = true;
    if (attackerIsPlayer) state.player.flags.firstAttack = true;
    if (attackerIsPlayer && attackers.paladin > 0) gainHeroXp(Math.max(20, Math.round(target.points / 14)));
    if (attackerIsPlayer && attackerWon && Math.random() < 0.12) { const drops=['resource_chest','spyglass','loyalty_seal']; const drop=drops[randomInt(0,drops.length-1)]; addInventory(drop,1); addReport({category:'Itens',title:`Item encontrado: ${INVENTORY_ITEMS[drop].name}`,icon:INVENTORY_ITEMS[drop].icon,body:'As tropas retornaram com um item adicional encontrado após a batalha.'}); }
    const lossesA = lossesText(attackers, attackerSurvivors); const lossesD = lossesText(defenders, defenderSurvivors); const lootText = RESOURCE_KEYS.map(k => `${RESOURCE_ICONS[k]} ${nfmt(loot[k])}`).join(' • ');
    if (attackerIsPlayer) addReport({ category: 'Ataques', title: `${attackerWon ? 'Vitória' : 'Derrota'} em ${target.name}`, icon: attackerWon ? '✅' : '❌', body: [`Origem: ${source.name} (${source.x}|${source.y})`, `Alvo: ${target.name} (${target.x}|${target.y})`, `Resultado: ${attackerWon ? 'suas tropas venceram' : 'suas tropas foram derrotadas'}.`, `Sorte: ${luck >= 0 ? '+' : ''}${luck}% • Moral: ${Math.round(morale * 100)}%`, `Perdas do atacante: ${lossesA}`, `Perdas do defensor: ${lossesD}`, `Saque: ${lootText}`, wallDamage ? `Muralha perdeu ${wallDamage} nível(is).` : '', buildingDamage, conquestText].filter(Boolean).join('\n') });
    if (defenderIsPlayer) addReport({ category: 'Defesa', title: `${attackerWon ? 'Sua aldeia sofreu invasão' : 'Defesa bem-sucedida'} em ${target.name}`, icon: attackerWon ? '🔥' : '🛡️', body: [`Inimigo: ${source.ownerName} (${source.x}|${source.y})`, `Aldeia atacada: ${target.name} (${target.x}|${target.y})`, `Resultado: ${attackerWon ? 'o inimigo venceu a batalha' : 'suas tropas defenderam a aldeia'}.`, `Perdas do atacante: ${lossesA}`, `Perdas do defensor: ${lossesD}`, `Recursos saqueados: ${lootText}`, wallDamage ? `Muralha perdeu ${wallDamage} nível(is).` : '', buildingDamage, conquestText].filter(Boolean).join('\n') });
  }

  function resolveScout(command, source, target, attackers, defenders) {
    const defendingSpies = defenders.spy || 0;
    const sent = attackers.spy || 0;
    const lost = clamp(Math.floor(defendingSpies * (0.35 + Math.random() * .45)), 0, sent);
    const survived = sent - lost;
    const survivors = { ...attackers, spy: survived };
    if (survived > 0) {
      state.commands.push({
        id: state.nextCommandId++, kind: 'return', phase: 'return', sourceId: target.id, targetId: source.id,
        troops: survivors, loot: { wood: 0, clay: 0, iron: 0 }, startAt: now(), arriveAt: now() + command.travelDuration,
        travelDuration: command.travelDuration
      });
    }
    const unitIntel = survived > defendingSpies / 2
      ? Object.entries(target.units).filter(([, qty]) => qty > 0).map(([key, qty]) => `${D.units[key].name}: ${nfmt(qty)}`).join(', ') || 'Nenhuma tropa'
      : 'Informação insuficiente';
    const buildingIntel = survived > defendingSpies
      ? Object.entries(target.buildings).filter(([, level]) => level > 0).map(([key, level]) => `${D.buildings[key].name}: ${level}`).join(', ')
      : 'Informação insuficiente';
    addReport({
      category: 'Espionagem', title: `Espionagem em ${target.name}`, icon: survived > 0 ? '🕵️' : '❌',
      body: survived > 0
        ? `Exploradores enviados: ${sent}\nPerdas: ${lost}\nRecursos: ${RESOURCE_KEYS.map(k => `${RESOURCE_NAMES[k]} ${nfmt(target.resources[k])}`).join(', ')}\nTropas: ${unitIntel}\nEdifícios: ${buildingIntel}`
        : `Todos os ${sent} exploradores foram perdidos e nenhuma informação foi obtida.`
    });
  }

  function resolveReturn(command) {
    const destination = state.villages[command.targetId]; if (!destination) return;
    Object.entries(command.troops).forEach(([key, qty]) => { destination.units[key] = (destination.units[key] || 0) + qty; });
    updateResources(destination); const cap = storageCapacity(destination); RESOURCE_KEYS.forEach(key => { destination.resources[key] = Math.min(cap, destination.resources[key] + (command.loot[key] || 0)); });
    if(destination.owner==='player') addReport({ category: 'Movimentos', title: `Tropas retornaram a ${destination.name}`, icon: '↩️', body: `As tropas retornaram com ${RESOURCE_KEYS.map(k => `${RESOURCE_ICONS[k]} ${nfmt(command.loot[k] || 0)}`).join(' • ')}.` });
  }
  function resolveTrade(command) {
    const target = state.villages[command.targetId]; if (!target || target.owner !== 'player') return;
    updateResources(target); const cap = storageCapacity(target); RESOURCE_KEYS.forEach(key => { target.resources[key] = Math.min(cap, target.resources[key] + (command.loot[key] || 0)); });
    addReport({ category: 'Mercado', title: `Remessa entregue em ${target.name}`, icon: '📦', body: `Chegaram ${RESOURCE_KEYS.map(k => `${RESOURCE_ICONS[k]} ${nfmt(command.loot[k] || 0)}`).join(' • ')}.` });
  }

  function dominantAttackCategory(troops) {
    const totals = { foot: 0, cav: 0, archer: 0 };
    Object.entries(troops).forEach(([key, qty]) => {
      const type = D.units[key].type;
      if (type === 'siege') totals.foot += D.units[key].attack * qty;
      else if (totals[type] !== undefined) totals[type] += D.units[key].attack * qty;
    });
    return Object.entries(totals).sort((a, b) => b[1] - a[1])[0][0];
  }

  function applyLosses(units, lossRate) {
    const survivors = {};
    Object.entries(units).forEach(([key, qty]) => {
      survivors[key] = Math.max(0, qty - Math.min(qty, Math.round(qty * lossRate)));
    });
    return survivors;
  }

  function lossesText(before, after) {
    const losses = Object.entries(before).map(([key, qty]) => [key, qty - (after[key] || 0)]).filter(([, qty]) => qty > 0);
    return losses.length ? losses.map(([key, qty]) => `${D.units[key].name} ${nfmt(qty)}`).join(', ') : 'nenhuma';
  }

  function calculateLoot(target, survivors, bonus = 1) {
    const capacity = Object.entries(survivors).reduce((acc, [key, qty]) => acc + D.units[key].loot * qty, 0) * bonus;
    const protectedTotal = hiddenCapacity(target); const available = {}; RESOURCE_KEYS.forEach(key => { available[key] = Math.max(0, target.resources[key] - protectedTotal / 3); });
    const totalAvailable = sum(Object.values(available)); const take = Math.min(capacity, totalAvailable); const loot = { wood: 0, clay: 0, iron: 0 };
    if (take > 0 && totalAvailable > 0) RESOURCE_KEYS.forEach(key => { loot[key] = Math.floor(take * available[key] / totalAvailable); target.resources[key] = Math.max(0, target.resources[key] - loot[key]); });
    return loot;
  }

  function addReport(report) {
    addReportTo(state, report);
    dirty = true;

  function addReportTo(targetState, report) {

      id: targetState.nextReportId++,

  function checkQuests() {
    let changed = false;
    D.quests.forEach(quest => {
      if (state.player.completedQuests.includes(quest.id)) return;
      const complete = quest.flag ? Boolean(state.player.flags[quest.flag]) : quest.check?.(state);
      if (complete) {
        state.player.completedQuests.push(quest.id);
        addReport({ category: 'Missões', title: `Missão concluída: ${quest.title}`, icon: '⭐', body: `${quest.text}\nA recompensa está disponível no painel de missões.` });

      }

  function claimQuest(questId) {
    if (!state.player.completedQuests.includes(questId) || state.player.claimedQuests.includes(questId)) return;
    const quest = D.quests.find(q => q.id === questId);
    if (!quest) return;
    const village = getActiveVillage();
    updateResources(village);
    const cap = storageCapacity(village);
    RESOURCE_KEYS.forEach((key, index) => { village.resources[key] = Math.min(cap, village.resources[key] + quest.reward[index]); });
    state.player.claimedQuests.push(questId);

    renderAll();
  }

  function tick() {
    if (!state) return;
    const timestamp = now();
    let changed = false;
    Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => updateResources(v, timestamp));
    changed = processQueues(timestamp) || changed;
    changed = processResearchQueue(timestamp) || changed;
    changed = processUnitResearch(timestamp) || changed;
    changed = processCommands(timestamp) || changed;
    changed = processAI(timestamp) || changed;
    changed = processWorldEvents(timestamp) || changed;
    changed = processWorldNodes(timestamp) || changed;
    changed = processAccountManager(timestamp) || changed;
    changed = processMarketOffers(timestamp) || changed;
    state.performance ||= { lastPointsAt: 0, ticks: 0 };
    state.performance.ticks += 1;
    if (changed || timestamp - state.performance.lastPointsAt > 5000) { recalcAllPoints(); state.performance.lastPointsAt = timestamp; }
    changed = checkQuests() || changed;
    state.lastTick = timestamp;
    if (changed) { dirty = true; renderAll(); } else { updateLiveDom(); }

  function getReportArt(report) {
    const probe = `${report?.category || ''} ${report?.title || ''}`.toLowerCase();
    if (probe.includes('espi')) return REPORT_ART.spy;
    if (probe.includes('derrota') || probe.includes('perd') || probe.includes('falhou')) return REPORT_ART.defeat;
    if (probe.includes('relíquia') || probe.includes('herói') || probe.includes('paladino') || probe.includes('missão')) return HERO_STORY_ART;
    if (probe.includes('conquist') || probe.includes('venceu') || probe.includes('vitór') || probe.includes('saque')) return REPORT_ART.victory;
    return REPORT_ART.village;
  }

  function fillAttackForm(mode) {
    const form = $('#attack-form');
    if (!form) return;
    const set = (key, value) => {
      const input = form.querySelector(`[name="attack_${key}"]`);
      if (!input) return;
      const max = Number(input.max) || 0;
      input.value = String(Math.max(0, Math.min(max, Math.floor(value))));
    };
    Object.keys(D.units).forEach(key => set(key, 0));
    if (mode === 'all') {
      Object.keys(D.units).forEach(key => {
        const input = form.querySelector(`[name="attack_${key}"]`);
        set(key, Number(input?.max) || 0);
      });
      return;
    }
    if (mode === 'spy') {
      const maxSpy = Number(form.querySelector('[name="attack_spy"]')?.max) || 0;
      set('spy', Math.min(3, maxSpy));
      return;
    }
    if (mode === 'farm') {
      const plan = { spy: 1, light: 25, marcher: 18, axe: 50, spear: 50, sword: 20, archer: 20, ram: 1 };
      Object.entries(plan).forEach(([key, qty]) => set(key, qty));
    }
  }

  function renderBuildingCard(v, key, def) {
    const level = v.buildings[key] || 0;
    const queued = v.buildQueue.filter(i => i.building === key).length;
    const target = level + queued + 1;
    const maxed = target > def.max;
    const costs = maxed ? [0, 0, 0] : buildingCost(key, target);
    const reqMet = requirementsMet(v, def.req);
    const afford = canAfford(v, costs);
    const popOk = usedPopulation(v) + (def.pop || 0) <= farmCapacity(v);
    const canDemo=(v.buildings.main||0)>=15 && key!=='main' && level>0 && !v.buildQueue.some(q=>q.building===key);
    return `<article class="game-card building-card rt13-building-card">
      <div class="big-icon">${renderImage(getBuildingArt(key), def.name) || def.icon}</div>
      <div class="rt13-card-body">
        <div class="rt13-card-head"><h3>${def.name}</h3><span class="badge">Nível ${level}${queued ? ` +${queued}` : ''}</span></div>
        <p class="small">${def.desc}</p>
        <div class="costs">${RESOURCE_KEYS.map((r, i) => `<span class="cost ${v.resources[r] < costs[i] ? 'bad' : ''}">${RESOURCE_ICONS[r]} ${nfmt(costs[i])}</span>`).join('')}<span class="cost">👥 ${def.pop || 0}</span></div>

      </div>
    </article>`;
  }

  function ensureMarketOffers() {
    state.marketOffers ||= [];
    if (state.marketOffers.length < 8) {
      const seed = randomSeeded(918273 + state.marketOffers.length * 31);
      while (state.marketOffers.length < 10) {
        const give = RESOURCE_KEYS[randomInt(0,2,seed)]; let get = RESOURCE_KEYS[randomInt(0,2,seed)]; if(get===give)get=RESOURCE_KEYS[(RESOURCE_KEYS.indexOf(give)+1)%3];
        const giveAmount=randomInt(500,3500,seed), ratio=randomInt(85,120,seed)/100, getAmount=Math.round(giveAmount*ratio/100)*100;
        state.marketOffers.push({id:`m_${Date.now()}_${state.marketOffers.length}`,owner:AI_NAMES[state.marketOffers.length%AI_NAMES.length],give,get,giveAmount,getAmount,player:false,createdAt:now()});
      }
    }
    return state.marketOffers;
  }
  function createMarketOffer(formData) {
    const v=getActiveVillage(), give=String(formData.get('give')||'wood'), get=String(formData.get('get')||'clay'), giveAmount=Math.floor(Number(formData.get('giveAmount'))||0), getAmount=Math.floor(Number(formData.get('getAmount'))||0);
    if(give===get||!RESOURCE_KEYS.includes(give)||!RESOURCE_KEYS.includes(get))return toast('Escolha recursos diferentes.','error'); if(giveAmount<100||getAmount<100)return toast('Oferta mínima: 100 recursos.','error'); updateResources(v); if(v.resources[give]<giveAmount)return toast('Recursos insuficientes para criar a oferta.','error');
    v.resources[give]-=giveAmount; ensureMarketOffers(); state.marketOffers.push({id:`p_${state.nextCommandId++}`,owner:state.player.name,give,get,giveAmount,getAmount,player:true,villageId:v.id,createdAt:now(),autoAcceptAt:now()+randomInt(15000,45000)}); dirty=true; toast('Oferta publicada no Mercado.','success'); renderAll();
  }
  function acceptMarketOffer(offerId) {
    const v=getActiveVillage(), offers=ensureMarketOffers(), offer=offers.find(o=>o.id===offerId); if(!offer||offer.player)return; updateResources(v); if(v.resources[offer.get]<offer.getAmount)return toast('Você não tem recursos suficientes para aceitar.','error'); v.resources[offer.get]-=offer.getAmount; v.resources[offer.give]=Math.min(storageCapacity(v),v.resources[offer.give]+offer.giveAmount); state.marketOffers=offers.filter(o=>o.id!==offerId); dirty=true; addReport({category:'Comércio',title:'Oferta de mercado aceita',icon:'⚖️',body:`Você recebeu ${RESOURCE_ICONS[offer.give]} ${nfmt(offer.giveAmount)} e entregou ${RESOURCE_ICONS[offer.get]} ${nfmt(offer.getAmount)}.`}); renderAll();

  function cancelMarketOffer(offerId) {

  }
  function processMarketOffers(timestamp) {

    state.marketOffers.filter(o=>o.player&&o.autoAcceptAt&&o.autoAcceptAt<=timestamp).forEach(o=>{const v=state.villages[o.villageId]; if(v){updateResources(v,timestamp);v.resources[o.get]=Math.min(storageCapacity(v),v.resources[o.get]+o.getAmount); addReport({category:'Comércio',title:'Sua oferta foi aceita',icon:'⚖️',body:`${o.owner}: sua oferta no mercado foi aceita. Você recebeu ${RESOURCE_ICONS[o.get]} ${nfmt(o.getAmount)}.`});} done.push(o.id);changed=true;}); if(done.length)state.marketOffers=state.marketOffers.filter(o=>!done.includes(o.id)); return changed;

  function sendMessage(formData) {

  function executeMarket(formData) {
    const v = getActiveVillage(); updateResources(v);
    const from = formData.get('from'); const to = formData.get('to'); const amount = Math.floor(Number(formData.get('amount')) || 0);
    if (!RESOURCE_KEYS.includes(from) || !RESOURCE_KEYS.includes(to) || from === to) return toast('Escolha dois recursos diferentes.', 'error');
    if (amount < 100 || amount % 100 !== 0) return toast('Use uma quantidade múltipla de 100.', 'error');
    if (v.resources[from] < amount) return toast('Recurso insuficiente para a troca.', 'error');
    const rate = premiumState().tradeLicense ? .98 : hasResearch('trade') ? .95 : .90;
    v.resources[from] -= amount; v.resources[to] = Math.min(storageCapacity(v), v.resources[to] + Math.floor(amount * rate)); dirty = true; toast('Troca concluída.', 'success'); renderAll();
  }
  function sendResources(formData) {
    const source = getActiveVillage(); const target = state.villages[formData.get('targetId')];
    if (!target || target.owner !== 'player' || target.id === source.id) return toast('Escolha uma aldeia própria válida.', 'error');
    updateResources(source);
    const payload = { wood: Math.floor(Number(formData.get('wood')) || 0), clay: Math.floor(Number(formData.get('clay')) || 0), iron: Math.floor(Number(formData.get('iron')) || 0) };
    const total = sum(Object.values(payload)); const capacity = Math.floor(Math.max(1, (source.buildings.market || 0) * 2) * (hasResearch('trade') ? 900 : 650) * (premiumState().tradeLicense ? 1.35 : 1) * (1 + getTribeTechLevel('logistics') * .05));
    if (total <= 0) return toast('Informe pelo menos um recurso para enviar.', 'error');
    if (total > capacity) return toast(`Essa remessa ultrapassa a capacidade de ${nfmt(capacity)} recursos.`, 'error');
    for (const key of RESOURCE_KEYS) if (payload[key] > source.resources[key]) return toast('Recursos insuficientes para a remessa.', 'error');
    RESOURCE_KEYS.forEach(key => source.resources[key] -= payload[key]);
    const duration = Math.max(5000, distanceBetween(source, target) * 900 / Math.max(1, state.settings.worldSpeed));
    state.commands.push({ id: state.nextCommandId++, kind: 'trade', phase: 'outbound', sourceId: source.id, targetId: target.id, troops: {}, loot: payload, startAt: now(), arriveAt: now() + duration, travelDuration: duration });
    state.player.flags.firstShipment = true; dirty = true; toast('Remessa enviada.', 'success'); renderAll();
  }

  function renderHelp() {
    return `
      <h1 class="panel-title">Ajuda e regras</h1>
      <div class="game-card">
        <h2>Objetivo</h2><p>Desenvolva aldeias, mantenha a produção, monte exércitos, saque vizinhos e conquiste novos territórios com Nobres.</p>
        <h2>Recursos</h2><p>Madeira, Argila e Ferro são produzidos em tempo real. Bosque, Poço de Argila e Mina de Ferro aumentam a produção; o Armazém limita a quantidade guardada.</p>
        <h2>Construção</h2><p>Melhorias entram em uma fila. O Edifício Principal reduz o tempo necessário. A Fazenda determina a população máxima.</p>
        <h2>Exército</h2><p>Quartel, Estábulo, Oficina, Estátua e Academia recrutam categorias diferentes. Cada unidade possui ataque, defesas específicas, velocidade e capacidade de saque.</p>
        <h2>Combate</h2><p>A tropa mais lenta define o tempo de marcha. Sorte varia de −25% a +25%. Moral reduz a força de governantes muito maiores contra alvos pequenos. A Muralha fortalece a defesa.</p>
        <h2>Espionagem</h2><p>Envie apenas Exploradores. Sobreviventes podem revelar recursos, tropas e edifícios; exploradores defensores dificultam a missão.</p>
        <h2>Saque</h2><p>Sobreviventes carregam recursos conforme a capacidade de transporte. O Esconderijo protege uma parte de cada recurso.</p>
        <h2>Conquista</h2><p>Um Nobre sobrevivente reduz de 20 a 35 pontos de lealdade. Quando a lealdade chega a zero, a aldeia passa para seu domínio.</p>
        <h2>Ferreiro e pesquisa</h2><p>O Ferreiro possui pesquisas por unidade. O mundo pode usar pesquisa simples, sistema de 3 níveis com limite de 15 níveis ou sistema de 10 níveis. As pesquisas são por aldeia.</p><h2>Praça de Reunião</h2><p>Centraliza apoio, coleta, simulador, Milícia e Assistente de Saque.</p><h2>Academia</h2><p>Cunhe moedas e forme Nobres para reduzir lealdade e conquistar aldeias.</p><h2>Bandeiras</h2><p>Bandeiras fornecem bônus de produção, recrutamento, ataque, defesa, sorte, população, moedas ou saque e podem ser combinadas em níveis maiores.</p><h2>Herói</h2><p>Ao recrutar o Paladino, o herói Sir Aldren ganha experiência em batalhas e pode receber talentos permanentes.</p><h2>Arsenal do Paladino</h2><p>Agora existe uma tela própria de Arsenal, com comparação de itens, conjuntos, raridade e origem de cada equipamento.</p><h2>Modo História do Paladino</h2><p>Na aba Herói, envie Sir Aldren em expedições narrativas para encontrar armas, relíquias e equipamentos exclusivos do Paladino.</p><h2>Premium</h2><p>Inclui Conta Premium, Gerente de Conta, Assistente de Saque, bônus de +20% de recursos, Troca Premium e os itens locais da edição. Os PP são apenas moeda simulada; não há pagamento real.</p><h2>Mapa</h2><p>O mapa possui minimapa, coordenadas, continentes, filtros, marcações por cor, favoritos, planejador de ataque, aldeias, bosques, pedreiras, minas, entrepostos, ruínas, covis, acampamentos bandidos, torres, fortins, portos, caravanas, comerciantes, altares e santuários. Clique em qualquer alvo para abrir ações contextuais.</p><h2>Tribo funcional</h2><p>Doações alimentam os cofres; tecnologias da tribo melhoram produção, comércio e guerra. A tribo também permite recrutar governantes, firmar pactos e completar objetivos coletivos.</p><h2>Mercado avançado</h2><p>Além da troca local, agora você pode enviar remessas de recursos para outras aldeias próprias.</p><h2>IA e eventos</h2><p>Inimigos recrutam, melhoram aldeias e podem lançar ataques contra você. Eventos periódicos alteram recursos, tropas e pesquisa.</p><h2>Salvamento</h2><p>O jogo salva automaticamente no navegador. Use Configurações para exportar um arquivo de segurança antes de limpar dados do navegador.</p>
      </div>`;
  }

ecomeçar</button></div><h2 class="section-title">Informações</h2><div class="notice">Versão ${VERSION}. Sistema de pesquisa: ${state.settings.researchSystem}. Mundo ${state.world.radius*2+1}×${state.world.radius*2+1}. Edição local/offline independente.</div>`;

  function renderRightRail() {
    const v = getActiveVillage(); const pending = D.quests.filter(q => !state.player.claimedQuests.includes(q.id)); const hero = state.player.hero; const currentStory = state.commands.find(c => c.kind === 'hero_story'); const frontier = frontierSummary(); const incomingAttacks=state.commands.filter(c=>c.kind==='attack'&&c.phase==='outbound'&&c.targetId===v.id);

w="premium">Abrir loja</button></section><section><h3>🧭 Fronteira</h3><div class="small">Pontos controlados: <b>${countControlledNodes()}</b></div><div class="small">Ruínas: <b>${frontierSummary().ruins}</b> • Mercadores: <b>${frontierSummary().merchants}</b></div><button class="btn secondary small-btn" data-view="map">Abrir mapa</button></section><section><h3>📚 Pesquisa</h3><div class="small">Concluídas: <b>${state.player.research.completed.length}</b></div><div class="small">Na fila: <b>${state.player.research.queue.length}</b></div></section><section><h3>📊 Produção por hora</h3>${RESOURCE_KEYS.map(k => `<div class="queue-item">${RESOURCE_ICONS[k]} ${RESOURCE_NAMES[k]}: <b>${nfmt(productionPerHour(v, k))}</b></div>`).join('')}</section><section><h3>🏰 Aldeia</h3><div class="small">Pontos: <b>${nfmt(v.points)}</b></div><div class="small">Lealdade: <b>${v.loyalty}</b></div><div class="small">Coordenadas: <b>${v.x}|${v.y}</b></div></section></aside>`;
  }


  function updateLiveDom() {
    if (!state) return;
    const v = getActiveVillage();
    if (!v) return;
    updateResources(v);
    const cap = storageCapacity(v);
    $$('.js-resource').forEach(el => { el.textContent = nfmt(v.resources[el.dataset.resource]); });
    const pop = $('.js-pop'); if (pop) pop.textContent = nfmt(usedPopulation(v));
    const farm = $('.js-farm'); if (farm) farm.textContent = nfmt(farmCapacity(v));
    const clock = $('.js-clock'); if (clock) clock.textContent = new Date().toLocaleTimeString('pt-BR');
    $$('.js-countdown').forEach(el => { el.textContent = formatDuration(Number(el.dataset.time) - now()); });
    $$('.resource-pill').forEach((el, index) => {
      if (index < 3) el.classList.toggle('full', v.resources[RESOURCE_KEYS[index]] >= cap);
    });
  }

  function toast(message, type = '') {
    const stack = $('#toast-stack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }

  function exportSave() {
    saveState(true);
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `reinos-tribais-salvamento-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importSave(file) {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || parsed.version !== VERSION || !parsed.villages || !parsed.player) throw new Error('Arquivo incompatível');
      migrateState(parsed);
      state = parsed;
      dirty = true;
      saveState(true);
      currentView = 'overview';
      modalHtml = '';
      renderAll();
      toast('Salvamento importado.', 'success');
    } catch (error) {
      toast('Arquivo de salvamento inválido ou incompatível.', 'error');
    }
  }

  function resetGame() {
    if (!confirm('Apagar definitivamente este mundo e todo o progresso?')) return;
    localStorage.removeItem(SAVE_KEY);
    state = null;
    modalHtml = '';
    currentView = 'overview';
    renderStart();
  }

  document.addEventListener('click', event => {
    const viewButton = event.target.closest('[data-view]');
    if (viewButton) {
      currentView = viewButton.dataset.view;
      modalHtml = '';
      renderAll();
      return;
    }
    const buildButton = event.target.closest('[data-build]');
    if (buildButton) return queueBuilding(buildButton.dataset.build);
    const recruitButton = event.target.closest('[data-recruit]');
    if (recruitButton) return queueRecruit(recruitButton.dataset.recruit, $(`#qty-${recruitButton.dataset.recruit}`)?.value);
    const cancelBuild = event.target.closest('[data-cancel-build]');
    if (cancelBuild) return cancelBuilding(Number(cancelBuild.dataset.cancelBuild));
    const cancelRecruitBtn = event.target.closest('[data-cancel-recruit]');
    if (cancelRecruitBtn) return cancelRecruit(Number(cancelRecruitBtn.dataset.cancelRecruit));
    const target = event.target.closest('[data-target]');
    if (target) return openVillageModal(target.dataset.target);
    const nodeTarget = event.target.closest('[data-node]');
    if (nodeTarget) return openWorldNodeModal(nodeTarget.dataset.node);
    const fillAttack = event.target.closest('[data-fill-attack]');
    if (fillAttack) return fillAttackForm(fillAttack.dataset.fillAttack);
    if (event.target.closest('[data-close-modal]')) { modalHtml = ''; return renderAll(); }
    const setVillage = event.target.closest('[data-set-village]');
    if (setVillage) {
      state.activeVillageId = setVillage.dataset.setVillage;
      modalHtml = '';
      currentView = 'overview';
      dirty = true;
      return renderAll();
    }
    const openReportBtn = event.target.closest('[data-open-report]');
    if (openReportBtn) return openReport(Number(openReportBtn.dataset.openReport));
    const acceptOfferBtn = event.target.closest('[data-accept-offer]'); if(acceptOfferBtn) return acceptMarketOffer(acceptOfferBtn.dataset.acceptOffer);
    const cancelOfferBtn = event.target.closest('[data-cancel-offer]'); if(cancelOfferBtn) return cancelMarketOffer(cancelOfferBtn.dataset.cancelOffer);
    const archiveReportBtn = event.target.closest('[data-archive-report]'); if(archiveReportBtn){const r=state.reports.find(x=>x.id===Number(archiveReportBtn.dataset.archiveReport)); if(r)r.archived=!r.archived; dirty=true; return renderAll();}
    const publicReportBtn = event.target.closest('[data-public-report]'); if(publicReportBtn){const r=state.reports.find(x=>x.id===Number(publicReportBtn.dataset.publicReport)); if(r)r.public=!r.public; dirty=true; return renderAll();}
    const deleteReportBtn = event.target.closest('[data-delete-report]');
    if (deleteReportBtn) {
      state.reports = state.reports.filter(r => r.id !== Number(deleteReportBtn.dataset.deleteReport));
      dirty = true; return renderAll();
    }
    if (event.target.closest('[data-mark-all-read]')) {
      state.reports.forEach(r => { r.unread = false; }); dirty = true; return renderAll();
    }
    if (event.target.closest('[data-delete-read]')) {
      state.reports = state.reports.filter(r => r.unread); dirty = true; return renderAll();
    }
    const claim = event.target.closest('[data-claim-quest]');
    if (claim) return claimQuest(claim.dataset.claimQuest);
    const researchBtn = event.target.closest('[data-research]');
    if (researchBtn) return queueResearch(researchBtn.dataset.research);
    const unitResearchBtn = event.target.closest('[data-unit-research]');
    if (unitResearchBtn) return queueUnitResearch(unitResearchBtn.dataset.unitResearch);
    const premiumServiceBtn = event.target.closest('[data-premium-service]');
    if (premiumServiceBtn) return activatePremiumService(premiumServiceBtn.dataset.premiumService);

    if (unlockScBtn) return unlockScavenge(unlockScBtn.dataset.unlockScavenge);
    const recallBtn = event.target.closest('[data-recall-support]');
    if (recallBtn) { const [sid,tid]=recallBtn.dataset.recallSupport.split(':'); return recallSupport(sid,tid); }
    const farmBtn = event.target.closest('[data-farm-template]');
    if (farmBtn) return farmAssistantAttack(farmBtn.dataset.farmTemplate);
    const reportFilterBtn = event.target.closest('[data-report-filter]');
    if (reportFilterBtn) { state.ui.reportFilter=reportFilterBtn.dataset.reportFilter; dirty=true; return renderAll(); }
    if (event.target.closest('[data-tribe-enemy]')) { const t=ensureTribeData(); const choices=TRIBE_NAMES.filter(n=>n!==state.player.tribe&&!t.diplomacy.enemies.includes(n)); if(!choices.length)return toast('Nenhuma nova tribo para marcar.','error'); t.diplomacy.enemies.push(choices[0]); dirty=true; toast(`${choices[0]} marcada como inimiga.`,'success'); return renderAll(); }
    const heroUp = event.target.closest('[data-hero-upgrade]');

    if (equipStoryItem) return equipHeroItem(equipStoryItem.dataset.equipHeroItem);
    const unequipSlotBtn = event.target.closest('[data-unequip-slot]');
    if (unequipSlotBtn) return unequipHeroSlot(unequipSlotBtn.dataset.unequipSlot);
    const buyPremium = event.target.closest('[data-buy-premium]');
    if (buyPremium) return shopBuy(buyPremium.dataset.buyPremium);
    const nodeAction = event.target.closest('[data-node-action]');
    if (nodeAction) { const [nodeId, mode] = nodeAction.dataset.nodeAction.split(':'); return grantWorldNodeReward(state.world.nodes.find(n => n.id === nodeId), mode || 'main'); }
    const nodeFavBtn = event.target.closest('[data-node-favorite]');
    if (nodeFavBtn) return toggleNodeFavorite(nodeFavBtn.dataset.nodeFavorite);
    const useItemBtn = event.target.closest('[data-use-item]');
    if (useItemBtn) return useInventoryItem(useItemBtn.dataset.useItem);
    if (event.target.closest('[data-claim-daily]')) return claimPremiumDaily();
    const mapZoomBtn = event.target.closest('[data-map-zoom]');
    if (mapZoomBtn) return mapZoom(Number(mapZoomBtn.dataset.mapZoom));
    const mapPanBtn = event.target.closest('[data-map-pan]');
    if (mapPanBtn) { const [dx,dy]=mapPanBtn.dataset.mapPan.split(',').map(Number); return mapPan(dx,dy); }
    if (event.target.closest('[data-map-home]')) return mapHome();
    const mapFilterBtn=event.target.closest('[data-map-filter]'); if(mapFilterBtn)return toggleMapFilter(mapFilterBtn.dataset.mapFilter);
    const mapMarkBtn=event.target.closest('[data-map-mark]'); if(mapMarkBtn)return cycleMapMark(mapMarkBtn.dataset.mapMark);
    const planTargetBtn=event.target.closest('[data-plan-target]'); if(planTargetBtn){const [vid,type]=planTargetBtn.dataset.planTarget.split(':'); modalHtml=''; addAttackPlan(vid,type); return;}
    const openSupportBtn=event.target.closest('[data-open-support-target]'); if(openSupportBtn){state.ui.supportTargetId=openSupportBtn.dataset.openSupportTarget; currentView='rally'; modalHtml=''; dirty=true; return renderAll();}
    const planRemoveBtn=event.target.closest('[data-plan-remove]'); if(planRemoveBtn)return removeAttackPlan(planRemoveBtn.dataset.planRemove);
    const planExecuteBtn=event.target.closest('[data-plan-execute]'); if(planExecuteBtn)return executeAttackPlan(planExecuteBtn.dataset.planExecute);
    const quickToggleBtn=event.target.closest('[data-toggle-quick]'); if(quickToggleBtn)return toggleQuickbar(quickToggleBtn.dataset.toggleQuick);
    const demolishBtn=event.target.closest('[data-demolish]'); if(demolishBtn)return demolishBuilding(demolishBtn.dataset.demolish);
    const tribeTech = event.target.closest('[data-tribe-tech]');
    if (tribeTech) return upgradeTribeTech(tribeTech.dataset.tribeTech);
    if (event.target.closest('[data-tribe-invite]')) return inviteTribeMember();
    if (event.target.closest('[data-tribe-pact]')) return negotiatePact();
    const tribeObjective = event.target.closest('[data-tribe-objective]');
    if (tribeObjective) return claimTribeObjective(tribeObjective.dataset.tribeObjective);
    const join = event.target.closest('[data-join-tribe]');
    if (join) {
      state.player.tribe = join.dataset.joinTribe;
      state.player.tribeData = null; ensureTribeData();
      Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => { v.tribe = state.player.tribe; });
      dirty = true; toast(`Você entrou em ${state.player.tribe}.`, 'success'); return renderAll();
    }
    if (event.target.closest('[data-leave-tribe]')) {
      state.player.tribe = null; state.player.tribeData = null;
      Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => { v.tribe = null; });
      dirty = true; return renderAll();
    }
    if (event.target.closest('[data-export-save]')) return exportSave();
    if (event.target.closest('[data-reset-game]')) return resetGame();
  });

  document.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    if (form.id === 'start-form') {
      const data = new FormData(form);
      const playerName = String(data.get('playerName') || '').trim().slice(0, 24);
      const villageName = String(data.get('villageName') || '').trim().slice(0, 32);
      if (!playerName || !villageName) return;
      state = createInitialState(playerName, villageName, { difficulty: String(data.get('difficulty') || 'normal'), mapRadius: Number(data.get('mapRadius') || 20) });
      state.settings.researchSystem = String(data.get('researchSystem') || 'three');
      dirty = true;
      saveState(true);
      renderAll();
      return;
    }
    if (form.id === 'attack-form') {
      const data = new FormData(form);
      const troops = {};
      Object.keys(D.units).forEach(key => { troops[key] = Number(data.get(`attack_${key}`) || 0); });
      return sendAttack(form.dataset.targetId, troops);
    }
    if (form.id === 'market-form') return executeMarket(new FormData(form));
    if (form.id === 'market-offer-form') return createMarketOffer(new FormData(form));
    if (form.id === 'message-form') return sendMessage(new FormData(form));
    if (form.id === 'premium-exchange-form') return runPremiumExchange(new FormData(form));
    if (form.id === 'mint-coin-form') return mintCoin(new FormData(form).get('quantity'));
    if (form.id === 'mass-mint-form') return massMintCoins(new FormData(form));
    if (form.id === 'rename-village-form') return renameVillage(new FormData(form));
    if (form.id === 'support-form') return sendSupport(new FormData(form));
    if (form.classList.contains('scavenge-form')) return startScavenge(new FormData(form));
    if (form.id === 'simulator-form') return runSimulator(new FormData(form));
    if (form.id === 'manager-form') { const data=new FormData(form),cfg=premiumState().managerConfig; cfg.enabled=data.get('enabled')==='on'; Object.keys(cfg.buildingTargets).forEach(k=>cfg.buildingTargets[k]=Math.max(0,Number(data.get(`bt_${k}`))||0)); Object.keys(cfg.unitTargets).forEach(k=>cfg.unitTargets[k]=Math.max(0,Number(data.get(`ut_${k}`))||0)); dirty=true; toast('Configuração do Gerente salva.','success'); return renderAll(); }
    if (form.id === 'market-send-form') return sendResources(new FormData(form));
    if (form.id === 'map-goto-form') return mapGoto(new FormData(form));
    if (form.id === 'tribe-donate-form') return donateToTribe(new FormData(form));
    if (form.id === 'create-tribe-form') {
      const data = new FormData(form);
      const name = String(data.get('tribeName') || '').trim().slice(0, 32);
      const tag = String(data.get('tag') || '').trim().slice(0, 6).toUpperCase();
      if (!name || !tag) return toast('Preencha o nome e a sigla.', 'error');
      state.player.tribe = `${name} [${tag}]`; state.player.tribeData = null; ensureTribeData();
      Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => { v.tribe = state.player.tribe; });
      dirty = true; toast('Tribo fundada.', 'success'); return renderAll();
    }
    if (form.id === 'tribe-forum-form' || form.id === 'tribe-mail-form') { const data=new FormData(form),msg=String(data.get('message')||'').trim(); if(!msg)return; const t=ensureTribeData(); if(form.id==='tribe-forum-form')t.forum.push({author:state.player.name,text:msg.slice(0,400),date:now()}); else t.wall.unshift({author:state.player.name,text:msg.slice(0,220)}); dirty=true; toast('Mensagem publicada.','success'); return renderAll(); }
    if (form.id === 'settings-form') {
      const data = new FormData(form);
      state.settings.worldSpeed = Number(data.get('worldSpeed')) || 8;
      state.settings.unitSpeed = Number(data.get('unitSpeed')) || 3;
      state.settings.researchSystem = String(data.get('researchSystem') || 'three');
      state.settings.archers = data.get('archers') === 'on'; state.settings.militia = data.get('militia') === 'on'; state.settings.church = data.get('church') === 'on'; state.settings.watchtower = data.get('watchtower') === 'on'; state.settings.flags = data.get('flags') === 'on'; state.settings.scavenging = data.get('scavenging') === 'on';
      dirty = true; saveState(true); toast('Configurações salvas.', 'success'); return renderAll();
    }
  });

  document.addEventListener('change', event => {
    if (event.target.id === 'active-village') {
      state.activeVillageId = event.target.value;
      dirty = true;
      currentView = 'overview';
      renderAll();
    }
    if (event.target.id === 'import-save' && event.target.files?.[0]) importSave(event.target.files[0]);
  });

  document.addEventListener('keydown', event => { if(!state||currentView!=='map'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return; const step=event.shiftKey?5:2; if(event.key==='ArrowUp'){event.preventDefault();mapPan(0,-step);} if(event.key==='ArrowDown'){event.preventDefault();mapPan(0,step);} if(event.key==='ArrowLeft'){event.preventDefault();mapPan(-step,0);} if(event.key==='ArrowRight'){event.preventDefault();mapPan(step,0);} });

  window.addEventListener('beforeunload', () => saveState(true));

  state = loadState();
  if (state) {
    Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => updateResources(v));
    processQueues(now());
    processResearchQueue(now());
    processCommands(now());
    recalcAllPoints();
    checkQuests();
    renderAll();
  } else {
    renderStart();
  }
  setInterval(tick, 1000);
})();

</script>
</body>
</html>
