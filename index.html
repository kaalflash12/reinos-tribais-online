<style>

  --ink: #2a1a0f;

}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {

button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .52; }
.hidden { display: none !important; }
.muted { color: var(--muted); }

.warn { color: #9a6100; font-weight: 700; }
.small { font-size: .86rem; }
.tiny { font-size: .75rem; }
.nowrap { white-space: nowrap; }

.start-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.start-card {
  width: min(760px, 100%);
  background: linear-gradient(135deg, rgba(255,249,224,.96), rgba(226,202,146,.98));

.game-shell { min-height: 100vh; }

.main-layout {

.content-panel { min-height: 680px; padding: 18px; min-width: 0; }
.right-rail { align-self: start; position: sticky; top: 80px; padding: 12px; }
.panel-title { margin: -18px -18px 18px; padding: 13px 18px; background: linear-gradient(#6b451f, #4f2f12); color: #ffe7a6; border-bottom: 2px solid #2d1808; font-size: 1.35rem; }
.section-title { border-bottom: 2px solid #9b743d; padding-bottom: 6px; margin: 20px 0 12px; }

.btn {

  border-radius: 4px;
  padding: 8px 13px;
  color: #fff8e2;
  background: linear-gradient(#875321, #5c3513);

}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.primary { background: linear-gradient(#4f8738, #2f6328); }

.btn.secondary { color: var(--ink); background: linear-gradient(#f1dca8, #cfaa68); }
.btn.small-btn { padding: 5px 9px; font-size: .85rem; }

.notice.success { border-color: #6c9a57; background: #e4f2d8; }
.notice.error { border-color: #ac5c4f; background: #f8dcd4; }

.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; }
.stat-card { background: rgba(255,250,232,.72); border: 1px solid #b78c4e; padding: 12px; border-radius: 4px; }
.stat-card .value { font-size: 1.35rem; font-weight: 800; color: var(--wood-dark); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.game-card { border: 1px solid #a47c43; background: rgba(255,250,230,.76); border-radius: 5px; padding: 12px; }
.game-card h3 { margin: 0 0 8px; }
.building-card, .unit-card { display: grid; grid-template-columns: 54px 1fr; gap: 10px; }
.big-icon { font-size: 2.25rem; display: grid; place-items: start center; }
.costs { display: flex; flex-wrap: wrap; gap: 8px; font-size: .9rem; margin: 6px 0; }
.cost { padding: 2px 5px; background: rgba(108,75,33,.1); border-radius: 3px; white-space: nowrap; }
.requirements { font-size: .8rem; color: #78582d; margin: 5px 0; }
.progress { height: 11px; background: #cab98f; border: 1px solid #745126; border-radius: 8px; overflow: hidden; }

.queue-item { border-bottom: 1px solid #b99a67; padding: 8px 0; }

.data-table { width: 100%; border-collapse: collapse; background: rgba(255,250,232,.64); }
.data-table th, .data-table td { border: 1px solid #aa8750; padding: 8px; text-align: left; vertical-align: middle; }
.data-table th { background: #735028; color: #fff1c9; }

.number-input { width: 90px; padding: 6px; border: 1px solid #987343; background: #fffdf5; }
.text-input, .select-input { width: 100%; padding: 8px; border: 1px solid #987343; background: #fffdf5; }

.map-wrap { overflow: auto; padding: 10px; border: 3px solid #6c4b24; background: #6f8450 url('assets/custom/map_story_bg.png') center/cover; box-shadow: inset 0 0 0 1px rgba(255,244,214,.2), inset 0 16px 30px rgba(20,8,0,.18); border-radius: 6px; }
.world-map { display: grid; grid-template-columns: repeat(15, 64px); grid-auto-rows: 64px; gap: 2px; width: max-content; }
.world-map-large { grid-template-columns: repeat(21, 52px); grid-auto-rows: 52px; }
.map-tile-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.34; }
.map-cell {
  border: 1px solid rgba(50,40,20,.28);
  position: relative;
  background: rgba(255,248,228,.05);
  overflow: hidden;
  text-align: center;
  min-width: 0;
}
.map-cell.empty { background: rgba(255,255,255,.03); }
.map-cell::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 40%); pointer-events: none; }
.map-cell.village { font-weight: 800; backdrop-filter: blur(.6px); }
.map-cell.player { background: rgba(223,196,86,.18); }
.map-cell.barbarian { background: rgba(149,144,132,.18); }
.map-cell.enemy { background: rgba(176,92,78,.18); }
.map-cell.tribe { background: rgba(90,126,168,.20); }
.map-cell.active { outline: 2px solid #fff3a0; outline-offset: -3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
.map-cell:hover { transform: scale(1.05); z-index: 2; box-shadow: 0 6px 14px rgba(0,0,0,.22); }
.quest .report-art { max-height: 110px; margin: 0 0 8px; }
.map-icon { font-size: 1.55rem; line-height: 1.1; }
.map-marker { font-size: 1.35rem; line-height: 1; margin-top: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.25); }

.map-points { position: absolute; left: 2px; top: 2px; font-size: .56rem; background: rgba(255,247,221,.82); color: #251507; padding: 1px 3px; border-radius: 3px; }
.map-legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 9px 0; font-size: .86rem; }
.legend-dot { display: inline-block; width: 12px; height: 12px; border: 1px solid #333; vertical-align: -1px; margin-right: 4px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(20,10,3,.72); z-index: 50; display: grid; place-items: center; padding: 18px; }
.modal { width: min(780px, 100%); max-height: 90vh; overflow: auto; background: #f1e2b8; border: 4px double #4a2a11; box-shadow: 0 20px 60px rgba(0,0,0,.55); padding: 18px; border-radius: 6px; }
.modal h2 { margin-top: 0; }

.toast-stack { position: fixed; z-index: 100; right: 14px; bottom: 14px; display: grid; gap: 8px; max-width: 360px; }
.toast { padding: 11px 14px; color: #fff; background: #3e2b17; border: 1px solid #d3ab65; box-shadow: var(--shadow); border-radius: 4px; animation: toast-in .25s ease-out; }
.toast.success { background: #315d2d; }
.toast.error { background: #7b2c25; }

.quest { padding: 9px; border: 1px solid #b6955e; background: rgba(255,248,220,.7); margin-bottom: 8px; border-radius: 4px; }
.quest.done { opacity: .65; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 999px; background: #6c451f; color: #fff1c7; font-size: .73rem; }
.report-unread { font-weight: 800; }
.report-icon { font-size: 1.2rem; }
.footer-note { text-align: center; color: #f3dfaa; padding: 8px 14px 20px; font-size: .78rem; }

@media (max-width: 1100px) {

  .resources { margin-left: 0; }
}
@media (max-width: 760px) {
  .topbar { position: static; }
  .main-layout { display: block; padding: 7px; }
  .side-nav { position: static; display: grid; grid-template-columns: repeat(2, 1fr); margin-bottom: 8px; }
  .side-nav .nav-section { grid-column: 1 / -1; }
  .content-panel { padding: 12px; min-height: 0; }
  .panel-title { margin: -12px -12px 14px; }
  .right-rail { display: block; margin-top: 8px; }

  .resource-pill { min-width: 82px; }

}

    } catch (error) {

  function normalizeSession(session) {
    if (!session) return null;
    if (!session.expires_at && session.expires_in) session.expires_at = Math.floor(Date.now() / 1000) + Number(session.expires_in);
    return session;
  }

  function storeCloudSession(session) {
    CLOUD.session = normalizeSession(session);
    CLOUD.user = CLOUD.session?.user || null;
    if (CLOUD.session) localStorage.setItem(CLOUD.sessionKey, JSON.stringify(CLOUD.session));
    else localStorage.removeItem(CLOUD.sessionKey);
  }

  async function refreshCloudSession(refreshToken) {
    const session = await cloudRequest('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', auth: false, body: { refresh_token: refreshToken }
    });
    storeCloudSession(session);
    return Boolean(CLOUD.user?.id);
  }

  async function restoreCloudSession() {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CLOUD.sessionKey) || 'null'); } catch {}
    if (!cached?.access_token || !cached?.user?.id) return false;
    cached = normalizeSession(cached);
    const expiresAt = Number(cached.expires_at || 0);
    if (expiresAt > Math.floor(Date.now() / 1000) + 90) {
      storeCloudSession(cached);
      return true;
    }
    if (!cached.refresh_token) return false;
    try { return await refreshCloudSession(cached.refresh_token); }
    catch {
      storeCloudSession(null);
      return false;
    }
  }

  async function signInCloud(email, password) {
    const session = await cloudRequest('/auth/v1/token?grant_type=password', {
      method: 'POST', auth: false, body: { email, password }

    return session;
  }

  async function signUpCloud(email, password) {
    const result = await cloudRequest('/auth/v1/signup', {

  }

  async function upsertPlayerSummary() {
    if (!CLOUD.ready || !CLOUD.user?.id || !state) return;
    const p = state.player || {};
    const body = {
      world_id: CLOUD.worldId,
      user_id: CLOUD.user.id,
      player_name: String(p.name || CLOUD.user.email || 'Governante').slice(0, 64),
      points: Math.max(0, Math.floor(Number(p.points) || 0)),

      hero: p.hero || {},
      inventory: p.inventory || {},
      flags_inventory: p.flagsInventory || {},
      premium: p.premium || {},
      research: p.research || {},
      last_seen_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    await cloudRequest('/rest/v1/player_worlds?on_conflict=world_id,user_id', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body
    });
  }

  async function saveCloudNow(showToast = false) {
    if (!CLOUD.ready || !CLOUD.user?.id || !state) return false;
    if (CLOUD.saving) {
      CLOUD.pending = true;
      return false;
    }
    CLOUD.saving = true;
    CLOUD.lastError = '';
    updateCloudButtons();
    try {
      const savedAt = new Date().toISOString();
      await cloudRequest('/rest/v1/game_saves?on_conflict=user_id,world_id', {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: { user_id: CLOUD.user.id, world_id: CLOUD.worldId, state: stateForSave(), updated_at: savedAt }
      });
      await upsertPlayerSummary();
      try { await syncMultiplayerVillage(); } catch (mpError) { console.error('Falha ao sincronizar aldeia multiplayer:', mpError); }
      CLOUD.lastSaveAt = Date.now();
      setLocalSavedAt(CLOUD.lastSaveAt);
      if (showToast) toast('Reino sincronizado com a nuvem.', 'success');
      return true;
    } catch (error) {
      CLOUD.lastError = error.message || String(error);
      CLOUD.ready = false;
      console.error('Falha no save em nuvem:', error);
      if (showToast) toast(`Falha ao sincronizar: ${CLOUD.lastError}`, 'error');
      return false;
    } finally {
      CLOUD.saving = false;
      updateCloudButtons();
      if (CLOUD.pending) {
        CLOUD.pending = false;
        scheduleCloudSave(2200);
      }
    }
  }

  function scheduleCloudSave(delay = 8000) {
    if (!CLOUD.ready || !state) return;
    if (CLOUD.saveTimer) clearTimeout(CLOUD.saveTimer);
    const elapsed = Date.now() - Number(CLOUD.lastSaveAt || 0);
    const wait = Math.max(1200, Math.min(delay, Math.max(1200, 8000 - elapsed)));
    CLOUD.saveTimer = setTimeout(() => { saveCloudNow(false); }, wait);
  }

async function activateLoadedState(loaded) {
  state = loaded;
  if (!state) return renderStart();
  migrateState(state);
  const timestamp = now();
  let offlineGain = { wood:0, clay:0, iron:0 };
  let maxElapsed = 0;
  Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => {
    const before = { wood:Number(v.resources.wood)||0, clay:Number(v.resources.clay)||0, iron:Number(v.resources.iron)||0 };
    const last = Number(v.resources.lastUpdate) || timestamp;
    maxElapsed = Math.max(maxElapsed, Math.max(0, timestamp-last));
    updateResources(v, timestamp);
    RESOURCE_KEYS.forEach(k => offlineGain[k] += Math.max(0,(Number(v.resources[k])||0)-before[k]));
  });
  const queueChanged = processQueues(timestamp);
  const heroTrainingChanged = processHeroTraining(timestamp);
  const researchChanged = processResearchQueue(timestamp);
  const unitResearchChanged = processUnitResearch(timestamp);
  const commandsChanged = processCommands(timestamp);
  recalcAllPoints();
  checkQuests();
  syncHeroAvailability();
  if (queueChanged || heroTrainingChanged || researchChanged || unitResearchChanged || commandsChanged || RESOURCE_KEYS.some(k => offlineGain[k] > 0.0001)) dirty = true;
  if (maxElapsed >= 60000 && RESOURCE_KEYS.some(k => offlineGain[k] >= 1)) {
    addReport({category:'Economia',title:'Produção durante sua ausência',icon:'🌾',body:`Tempo calculado: ${formatDuration(maxElapsed)}\n${RESOURCE_KEYS.map(k=>`${RESOURCE_ICONS[k]} ${RESOURCE_NAMES[k]}: +${nfmt(offlineGain[k])}`).join('\n')}\nA produção respeitou a capacidade de cada Armazém.`});
    dirty = true;
  }
  if (dirty) saveState(true);
  renderAll();
}

  async function enterCloudGame() {
    if ($('#rt18-auth-message')) setAuthMessage('Carregando seu reino da nuvem...');
    let local = loadState();
    let remote = null;
    try {
      remote = await loadCloudSave();
      CLOUD.ready = true;
      CLOUD.lastError = '';
    } catch (error) {
      CLOUD.ready = false;
      CLOUD.lastError = error.message || String(error);
      console.error('Falha ao carregar nuvem:', error);
      if (local) {
        await activateLoadedState(local);
        toast('Sem conexão com a nuvem. Jogando com o save local.', 'error');
        return;
      }
      throw error;
    }

    let chosen = null;
    let uploadLocal = false;
    const localAt = getLocalSavedAt();
    const remoteAt = remote?.updated_at ? Date.parse(remote.updated_at) : 0;
    const remoteState = remote?.state && typeof remote.state === 'object' ? remote.state : null;

    if (remoteState && (!local || remoteAt >= localAt)) {
      chosen = remoteState;
      migrateState(chosen);

  function getMerchantOffer(node) {
    const order = ['resource_chest','spyglass','production_banner','war_banner','construction_scroll','recruitment_scroll','loyalty_seal'];
    const itemId = order[(node.level + node.x + node.y) % order.length];
    const base = { resource_chest: 110, spyglass: 90, production_banner: 150, war_banner: 160, construction_scroll: 180, recruitment_scroll: 170, loyalty_seal: 200 };
    return { itemId, price: base[itemId] + node.level * 5 };
  }

  function generateWorldNodes(villages, mapRadius, rng) {
    const occupied = new Set(Object.values(villages).map(v => `${v.x}|${v.y}`));
    const nodes = [];
    let nodeId = 1;
    const pickSpot = () => {
      for (let tries = 0; tries < 4000; tries += 1) {
        const x = randomInt(500 - mapRadius, 500 + mapRadius, rng);
        const y = randomInt(500 - mapRadius, 500 + mapRadius, rng);
        const key = `${x}|${y}`;
        if (occupied.has(key)) continue;
        occupied.add(key);
        return { x, y };
      }
      return null;
    };
    Object.entries(WORLD_NODE_COUNTS).forEach(([type, count]) => {
      const finalCount = Math.max(2, Math.floor(count * (mapRadius / 20)));
      for (let i = 0; i < finalCount; i += 1) {
        const spot = pickSpot();
        if (!spot) break;
        const dist = Math.hypot(spot.x - 500, spot.y - 500);
        const level = clamp(1 + Math.floor(dist / 4) + randomInt(0, 2, rng), 1, 9);
        nodes.push({ id: `node_${nodeId++}`, type, x: spot.x, y: spot.y, level, owner: null, available: true, respawnAt: 0, lastHarvestAt: 0, offer: type === 'merchant' ? getMerchantOffer({ ...spot, level }) : null });
      }
    });
    return nodes;
  }

  function aiOffense(village) {
    return (village.units.axe || 0) * 40 + (village.units.light || 0) * 130 + (village.units.heavy || 0) * 150 + (village.units.ram || 0) * 20 + (village.units.catapult || 0) * 100 + (village.units.spear || 0) * 10 + (village.units.archer || 0) * 15;
  }
  function aiDefense(village) {
    const troops = village.units || {};

    return Math.round(base * Math.pow(1.045, village.buildings.wall || 0) + (village.points || 0) * 18);
  }
  function aiPersonality(village) {

  function aiPersonalityLabel(kind) {

  function sumValues(obj) { return Object.values(obj || {}).reduce((a,b)=>a+(Number(b)||0),0); }
  function aiTargetScore(source, target, personality) {
    if (!target || target.id === source.id || target.owner === source.owner) return -Infinity;
    const distance = distanceBetween(source, target);
    const value = Math.max(200, target.points || 0) + RESOURCE_KEYS.reduce((s,k)=>s+(target.resources?.[k]||0)/25,0);
    const defense = Math.max(300, aiDefense(target));
    const offense = Math.max(300, aiOffense(source));
    const weakness = offense / defense;
    let score = value * Math.min(2.1, weakness) / Math.max(1.4, distance);
    if (target.owner === 'barbarian') score *= personality === 'expander' ? 2.1 : 1.25;
    if (target.owner === 'player') score *= personality === 'raider' ? 1.65 : personality === 'warden' ? .72 : 1.12;
    if (personality === 'opportunist' && target.loyalty < 70) score *= 1.5;
    if (personality === 'warden' && distance > 8) score *= .55;
    return score;
  }
  function aiBuildPriority(personality) {
    if (personality === 'raider') return ['barracks','stable','smith','farm','warehouse','wall','timber','clay','iron','garage'];
    if (personality === 'warden') return ['wall','farm','warehouse','barracks','smith','timber','clay','iron','stable'];
    if (personality === 'expander') return ['farm','warehouse','market','smith','stable','garage','academy','barracks','wall','timber','clay','iron'];
    return ['timber','clay','iron','farm','warehouse','market','barracks','stable','smith','wall'];
  }
  function aiRecruitPlan(personality) {
    if (personality === 'raider') return [['axe',14],['light',8],['spy',4],['ram',2],['spear',5]];
    if (personality === 'warden') return [['spear',14],['sword',12],['archer',10],['heavy',3],['axe',4]];
    if (personality === 'expander') return [['axe',10],['light',6],['heavy',2],['ram',3],['catapult',1],['spear',6]];
    return [['axe',8],['spear',8],['archer',6],['light',5],['spy',3]];
  }
  function aiTryUpgrade(village, personality, factor) {
    const threatened = aiIncomingThreat(village) > 0;
    const order = threatened ? ['wall','farm','warehouse','barracks',...aiBuildPriority(personality)] : aiBuildPriority(personality);
    for (const key of [...new Set(order)]) {
      const def = D.buildings[key]; if (!def) continue;
      const lvl = village.buildings[key] || 0;
      if (lvl >= def.max || !requirementsMet(village, def.req)) continue;
      const costs = buildingCost(key, lvl + 1).map(x => Math.floor(x * factor));
      if (!canAfford(village, costs)) continue;
      payCosts(village, costs); village.buildings[key] = lvl + 1; return true;
    }
    return false;
  }
  function aiTryRecruit(village, personality, factor) {
    let changed = false;
    for (const [key, baseQty] of aiRecruitPlan(personality)) {
      const def = D.units[key]; if (!def || !requirementsMet(village, def.req)) continue;
      const freePop = farmCapacity(village) - usedPopulation(village, false);
      if (freePop < def.pop) continue;
      const qty = Math.max(1, Math.min(baseQty, Math.floor(freePop / Math.max(1,def.pop))));
      const costs = def.cost.map(x => Math.floor(x * qty * factor));
      if (canAfford(village, costs)) { payCosts(village, costs); village.units[key] = (village.units[key]||0) + qty; changed = true; }
    }
    if (personality === 'expander' && (village.buildings.academy||0) > 0 && (village.units.noble||0) < 1 && village.points > 3000) {
      const def=D.units.noble; const costs=def.cost.map(x=>Math.floor(x*factor));
      if (canAfford(village,costs) && usedPopulation(village,false)+def.pop<=farmCapacity(village)) { payCosts(village,costs); village.units.noble=(village.units.noble||0)+1; changed=true; }
    }
    return changed;
  }
  function launchAiAttack(source, target, ratio = .45) {
    const troops = {}; let total = 0;
    const personality = aiPersonality(source);
    Object.keys(D.units).forEach(key => {
      const available = source.units[key] || 0;
      let send = 0;
      if (['axe','light','heavy','ram','catapult','spear','archer','spy'].includes(key)) send = Math.floor(available * ratio);
      if (key === 'noble' && available > 0 && personality === 'expander' && source.points > target.points * 1.05) send = 1;
      if (key === 'paladin' || key === 'militia') send = 0;
      send = Math.min(send, available); troops[key] = send; total += send;
    });
    if (total <= 0) return false;
    Object.entries(troops).forEach(([key, qty]) => { source.units[key] -= qty; });
    const duration = travelDuration(source, target, troops);
    state.commands.push({ id: state.nextCommandId++, kind: 'attack', phase: 'outbound', sourceId: source.id, targetId: target.id, troops, loot: { wood: 0, clay: 0, iron: 0 }, startAt: now(), arriveAt: now() + duration, travelDuration: duration });
    logWorldActivity(`${source.ownerName} partiu de ${source.x}|${source.y} contra ${target.ownerName} em ${target.x}|${target.y}.`, target.owner==='player'?'⚠️':'⚔️');
    if (target.owner === 'player') addReport({ category: 'Defesa', title: `Ataque inimigo detectado: ${source.ownerName}`, icon: '⚠️', body: `${source.name} (${source.x}|${source.y}) está enviando tropas contra ${target.name}. Tempo estimado: ${formatDuration(duration)}. Perfil do inimigo: ${aiPersonalityLabel(personality)}.` });
    return true;
  }
  function aiClaimWorldNode(village) {

    const candidates=state.world.nodes.filter(n=>preferred.includes(n.type) && n.owner!=='player' && distanceBetween(village,n)<=8).sort((a,b)=>distanceBetween(village,a)-distanceBetween(village,b));
    if (!candidates.length) return false;

  function processAI(timestamp) {
    const profile = getDifficultyProfile(state.settings.difficulty);
    if (timestamp - state.ai.lastProcess < profile.raidMs) return false;
    state.ai.lastProcess = timestamp;
    state.ai.cursor ||= 0; state.ai.activity ||= [];
    let changed = false;
    const allAi = Object.values(state.villages).filter(v => v.owner !== 'player' && v.owner !== 'barbarian' && !v._onlineRemote);
    const barbarian = Object.values(state.villages).filter(v => v.owner === 'barbarian');
    const players = Object.values(state.villages).filter(v => v.owner === 'player');
    const batchSize = state.settings.difficulty === 'hard' ? 30 : state.settings.difficulty === 'easy' ? 14 : 22;
    const batch=[];
    for(let i=0;i<Math.min(batchSize,allAi.length);i++) batch.push(allAi[(state.ai.cursor+i)%Math.max(1,allAi.length)]);
    state.ai.cursor=(state.ai.cursor+batch.length)%Math.max(1,allAi.length);
    batch.forEach(v => {
      updateResources(v, timestamp);
      const personality=aiPersonality(v), factor=profile.aiBonus;
      if (aiTryUpgrade(v,personality,factor)) changed=true;
      if (aiTryRecruit(v,personality,factor)) changed=true;
      if (aiClaimWorldNode(v)) changed=true;
    });
    const attackers=batch.filter(v=>aiOffense(v)>1100).sort((a,b)=>aiOffense(b)-aiOffense(a));
    let launches=0; const launchLimit=state.settings.difficulty==='hard'?5:state.settings.difficulty==='easy'?2:3;
    attackers.forEach(source=>{
      if(launches>=launchLimit) return;
      const personality=aiPersonality(source);
      const rivals=allAi.filter(t=>t.owner!==source.owner && t.tribe!==source.tribe && distanceBetween(source,t)<12);
      let pool=[...players];
      if(personality==='expander') pool=[...barbarian,...players,...rivals];
      else if(personality==='opportunist') pool=[...players,...barbarian,...rivals];
      else if(personality==='warden') pool=[...players.filter(t=>distanceBetween(source,t)<7),...rivals.filter(t=>distanceBetween(source,t)<6)];
      else pool=[...players,...barbarian.filter(t=>distanceBetween(source,t)<7)];
      const ranked=pool.map(t=>[t,aiTargetScore(source,t,personality)]).filter(([,s])=>Number.isFinite(s)&&s>0).sort((a,b)=>b[1]-a[1]);
      if(!ranked.length) return;
      const [target,score]=ranked[0];
      const offense=aiOffense(source), defense=aiDefense(target);
      const confidence=offense/Math.max(1,defense);
      const baseChance=profile.aggression*(personality==='raider'?1.3:personality==='warden'?.55:1);
      if(confidence>.55 && Math.random()<Math.min(.82,baseChance+Math.min(.3,score/12000))) {
        const ratio=personality==='raider'?.58:personality==='expander'?.52:personality==='warden'?.32:.45;
        if(launchAiAttack(source,target,ratio)){ launches+=1; changed=true; }
      }
    });
    if (launches===0 && batch.length && Math.random()<.35) {
      const v=batch[randomInt(0,batch.length-1)]; logWorldActivity(`${v.ownerName} reorganizou suas forças em ${v.x}|${v.y}.`, '🛡️');
    }
    return changed;
  }

    const parsed = JSON.parse(raw);
    if (!parsed || ![17, 18, 19, 20, 21, 22, 23, 24, 25, 49, 50].includes(Number(parsed.version)) || !parsed.villages) return null;
    migrateState(parsed);

    return null;
  }
}

      state.version = VERSION;
      const snapshot = stateForSave();
      snapshot.version = VERSION;
      localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot));

    } catch (error) {

      console.error(error);
    }
  }

  function productionPerHour(village, resource) {
    const buildingKey = resource === 'wood' ? 'timber' : resource;
    const level = village.buildings[buildingKey] || 0;
    if (level <= 0) return 0;
    let mult = 1;
    if (resource === 'wood' && hasResearch('sawmill')) mult += .10;
    if (resource === 'clay' && hasResearch('masonry')) mult += .10;
    if (resource === 'iron' && hasResearch('smelting')) mult += .10;
    if (village.owner === 'player') {
      mult *= premiumProductionMultiplier() * premiumResourceMultiplier(resource) * (1 + getTribeTechLevel('economy') * 0.03) * (1 + flagEffect(village,'production'));
      const nodeRate = nodePassiveBonus(resource);
      return (35 * Math.pow(1.168, level - 1) + nodeRate) * state.settings.worldSpeed * mult;
    }
    return 35 * Math.pow(1.168, level - 1) * state.settings.worldSpeed * mult;
  }

  function storageCapacity(village) {
    const level = village.buildings.warehouse || 0;
    return Math.floor(1000 * Math.pow(1.229, Math.max(0, level - 1)));
  }

  function resourceStorageRoom(village, resource) {
    const current = Math.max(0, Number(village?.resources?.[resource]) || 0);
    return Math.max(0, storageCapacity(village) - current);
  }

  function addResourceCapped(village, resource, amount) {
    if (!village?.resources || !RESOURCE_KEYS.includes(resource)) return 0;
    const current = Math.max(0, Number(village.resources[resource]) || 0);
    const requested = Math.max(0, Number(amount) || 0);
    const added = Math.min(requested, Math.max(0, storageCapacity(village) - current));
    village.resources[resource] = current + added;
    return added;
  }

  function farmCapacity(village) {
    const level = village.buildings.farm || 0;
    let cap = Math.floor(240 * Math.pow(1.172, Math.max(0, level - 1)));
    if (hasResearch('agriculture')) cap = Math.floor(cap * 1.15);
    cap = Math.floor(cap * (1 + flagEffect(village,'population')));
    return cap;
  }

  function hiddenCapacity(village) {
    const level = village.buildings.hide || 0;
    return Math.floor(level <= 0 ? 0 : 150 * Math.pow(1.45, level - 1));
  }

  function usedPopulation(village, includeQueues = true) {
    let total = 0;
    Object.entries(village.buildings).forEach(([key, level]) => {
      const def = D.buildings[key];
      if (def) total += (def.pop || 0) * level;
    });
    Object.entries(village.units).forEach(([key, qty]) => {
      const def = D.units[key];
      if (def) total += def.pop * qty;
    });
    if (includeQueues) {
      village.buildQueue.forEach(item => { total += D.buildings[item.building].pop || 0; });
      village.recruitQueue.forEach(item => { total += D.units[item.unit].pop * item.quantity; });
    }
    return Math.floor(total);
  }


function updateResources(village, timestamp = now()) {
  if (!village?.resources) return false;
  const safeTimestamp = Number.isFinite(Number(timestamp)) ? Number(timestamp) : now();
  let last = Number(village.resources.lastUpdate);
  if (!Number.isFinite(last) || last <= 0) last = safeTimestamp;
  if (last > safeTimestamp) last = safeTimestamp;
  const elapsedMs = Math.max(0, safeTimestamp - last);
  if (elapsedMs <= 0) return false;
  const elapsedHours = elapsedMs / 3600000;
  const cap = storageCapacity(village);
  let changed = false;
  village.resourceStats ||= { produced: { wood:0, clay:0, iron:0 }, lastGainAt: safeTimestamp };
  village.resourceStats.produced ||= { wood:0, clay:0, iron:0 };
  RESOURCE_KEYS.forEach(resource => {
    let rate;
    if (village.owner === 'player') {
      rate = productionPerHour(village, resource);
    } else {
      const buildingKey = resource === 'wood' ? 'timber' : resource;
      const level = village.buildings[buildingKey] || 1;
      rate = 25 * Math.pow(1.12, level - 1) * state.settings.worldSpeed;
    }
    const before = Math.max(0, Number(village.resources[resource]) || 0);
    const generated = Math.max(0, rate * elapsedHours);
    const added = Math.min(generated, Math.max(0, cap - before));
    const after = before + added;
    if (added > 0.0001) {
      changed = true;
      if (village.owner === 'player') village.resourceStats.produced[resource] = (village.resourceStats.produced[resource] || 0) + added;
    }
    village.resources[resource] = after;
  });
  village.resources.lastUpdate = safeTimestamp;
  if (changed && village.owner === 'player') village.resourceStats.lastGainAt = safeTimestamp;
  return changed;
}

  function buildingCost(buildingKey, targetLevel) {
    const def = D.buildings[buildingKey];
    const exponent = Math.max(0, targetLevel - 1);
    return def.base.map(value => Math.ceil(value * Math.pow(def.factor, exponent)));
  }

  function buildingDuration(village, buildingKey, targetLevel) {
    const def = D.buildings[buildingKey];
    const hqBonus = 1 + (village.buildings.main || 0) * .055;
    return Math.max(3000, def.time * 1000 * Math.pow(1.18, Math.max(0, targetLevel - 1)) / (state.settings.worldSpeed * hqBonus));
  }

  function unitDuration(village, unitKey, quantity) {

    const placeLevel = village.buildings[def.place] || 1;
    const speedBonus = 1 + placeLevel * .06;
    const flagBonus = 1 + flagEffect(village,'recruitment');
    return Math.max(1000, def.time * 1000 * quantity / (state.settings.worldSpeed * speedBonus * flagBonus));
  }

  function requirementsMet(village, requirements = {}) {

  function requirementsText(requirements = {}) {

  function canAfford(village, costs) {

  function payCosts(village, costs) {

  function refundCosts(village, costs, factor = .9) {

  function villagePoints(village) {

  function recalcAllPoints(targetState = state) {

  function queueBuilding(buildingKey) {

    if (village.buildQueue.length >= getBuildQueueLimit()) return toast(`A fila de construção está cheia (${getBuildQueueLimit()} espaços).`, 'error');

  function cancelBuilding(index) {

  function recalculateQueueTimes(queue, durationFn) {

      item.finishAt = cursor + duration;
      cursor = item.finishAt;

  }

  function recruitPlaceQueue(village, place) { return (village.recruitQueue||[]).filter(q => (q.place||D.units[q.unit]?.place) === place).sort((a,b)=>(a.startAt||0)-(b.startAt||0)); }

  function cancelRecruit(index) {

  function processQueues(timestamp) {

  function distanceBetween(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function travelDuration(source, target, troops) {
    const speeds = Object.entries(troops).filter(([, qty]) => qty > 0).map(([key]) => D.units[key].speed);
    const slowest = Math.max(...speeds, 1);
    const hasMounted = Object.entries(troops).some(([key, qty]) => qty > 0 && (D.units[key].type === 'cav' || D.units[key].mounted===true));
    const heroBoost = (source?.owner === 'player' && troops.paladin > 0) ? (1 - Math.min(.22, heroStatTotal('speed') * 0.04)) : 1;
    const researchBoost = (source?.owner === 'player' && hasMounted && hasResearch('horsemanship')) ? .88 : 1;
    return Math.max(4000, distanceBetween(source, target) * slowest * 1000 / (state.settings.unitSpeed * state.settings.worldSpeed) * heroBoost * researchBoost);
  }

  function processCommands(timestamp) {

      if (command.kind === 'scavenge') { resolveScavenge(command); completed.push(command.id); changed = true; return; }
      if (command.kind === 'support') { resolveSupport(command); completed.push(command.id); changed = true; return; }

    }
    const survivorsCount = sum(Object.values(attackerSurvivors));
    if (survivorsCount > 0) state.commands.push({ id: state.nextCommandId++, kind: 'return', phase: 'return', sourceId: target.id, targetId: source.id, troops: attackerSurvivors, loot, startAt: now(), arriveAt: now() + command.travelDuration, travelDuration: command.travelDuration });
    if (attackerIsPlayer && attackerWon) state.player.flags.firstWin = true;
    if (attackerIsPlayer) state.player.flags.firstAttack = true;
    if (attackerIsPlayer && attackers.paladin > 0) { gainHeroXp(Math.max(20, Math.round(target.points / 14))); syncHeroAvailability(); }
    if (attackerIsPlayer && attackerWon && Math.random() < 0.12) { const drops=['resource_chest','spyglass','loyalty_seal']; const drop=drops[randomInt(0,drops.length-1)]; addInventory(drop,1); addReport({category:'Itens',title:`Item encontrado: ${INVENTORY_ITEMS[drop].name}`,icon:INVENTORY_ITEMS[drop].icon,body:'As tropas retornaram com um item adicional encontrado após a batalha.'}); }
    const lossesA = lossesText(attackers, attackerSurvivors); const lossesD = lossesText(defenders, defenderSurvivors); const lootText = RESOURCE_KEYS.map(k => `${RESOURCE_ICONS[k]} ${nfmt(loot[k])}`).join(' • ');
    if (attackerIsPlayer) addReport({ category: 'Ataques', title: `${attackerWon ? 'Vitória' : 'Derrota'} em ${target.name}`, icon: attackerWon ? '✅' : '❌', body: [`Ordem: ${isRaid?'Saque':'Ataque normal'}`, `Origem: ${source.name} (${source.x}|${source.y})`, `Alvo: ${target.name} (${target.x}|${target.y})`, `Resultado: ${attackerWon ? 'suas tropas venceram' : 'suas tropas foram derrotadas'}.`, `Sorte: ${luck >= 0 ? '+' : ''}${luck}% • Moral: ${Math.round(morale * 100)}%`, `Perdas do atacante: ${lossesA}`, `Perdas do defensor: ${lossesD}`, `Saque: ${lootText}`, wallDamage ? `Muralha perdeu ${wallDamage} nível(is).` : '', buildingDamage, conquestText].filter(Boolean).join('\n') });
    if (defenderIsPlayer) addReport({ category: 'Defesa', title: `${attackerWon ? 'Sua aldeia sofreu invasão' : 'Defesa bem-sucedida'} em ${target.name}`, icon: attackerWon ? '🔥' : '🛡️', body: [`Inimigo: ${source.ownerName} (${source.x}|${source.y})`, `Aldeia atacada: ${target.name} (${target.x}|${target.y})`, `Resultado: ${attackerWon ? 'o inimigo venceu a batalha' : 'suas tropas defenderam a aldeia'}.`, `Perdas do atacante: ${lossesA}`, `Perdas do defensor: ${lossesD}`, `Recursos saqueados: ${lootText}`, wallDamage ? `Muralha perdeu ${wallDamage} nível(is).` : '', buildingDamage, conquestText].filter(Boolean).join('\n') });
  }

  function resolveScout(command, source, target, attackers, defenders) {
    const defendingSpies = defenders.spy || 0;
    const sent = attackers.spy || 0;
    const lost = clamp(Math.floor(defendingSpies * (0.35 + Math.random() * .45)), 0, sent);
    const survived = sent - lost;
    const survivors = { ...attackers, spy: survived };
    if (survived > 0) {
      state.commands.push({
        id: state.nextCommandId++, kind: 'return', phase: 'return', sourceId: target.id, targetId: source.id,
        troops: survivors, loot: { wood: 0, clay: 0, iron: 0 }, startAt: now(), arriveAt: now() + command.travelDuration,
        travelDuration: command.travelDuration
      });
    }
    const unitIntel = survived > defendingSpies / 2
      ? Object.entries(target.units).filter(([, qty]) => qty > 0).map(([key, qty]) => `${D.units[key].name}: ${nfmt(qty)}`).join(', ') || 'Nenhuma tropa'
      : 'Informação insuficiente';
    const buildingIntel = survived > defendingSpies
      ? Object.entries(target.buildings).filter(([, level]) => level > 0).map(([key, level]) => `${D.buildings[key].name}: ${level}`).join(', ')
      : 'Informação insuficiente';
    addReport({
      category: 'Espionagem', title: `Espionagem em ${target.name}`, icon: survived > 0 ? '🕵️' : '❌',
      body: survived > 0
        ? `Exploradores enviados: ${sent}\nPerdas: ${lost}\nRecursos: ${RESOURCE_KEYS.map(k => `${RESOURCE_NAMES[k]} ${nfmt(target.resources[k])}`).join(', ')}\nTropas: ${unitIntel}\nEdifícios: ${buildingIntel}`
        : `Todos os ${sent} exploradores foram perdidos e nenhuma informação foi obtida.`
    });
  }

  function resolveReturn(command) {
    const destination = state.villages[command.targetId]; if (!destination) return;
    Object.entries(command.troops).forEach(([key, qty]) => { destination.units[key] = (destination.units[key] || 0) + qty; });
    updateResources(destination); const cap = storageCapacity(destination); RESOURCE_KEYS.forEach(key => { addResourceCapped(destination, key, command.loot[key] || 0); });
    if ((command.troops?.paladin||0)>0) syncHeroAvailability();
    if(destination.owner==='player') addReport({ category: 'Movimentos', title: `Tropas retornaram a ${destination.name}`, icon: '↩️', body: `As tropas retornaram com ${RESOURCE_KEYS.map(k => `${RESOURCE_ICONS[k]} ${nfmt(command.loot[k] || 0)}`).join(' • ')}.` });
  }
  function resolveTrade(command) {
    const target = state.villages[command.targetId]; if (!target || target.owner !== 'player') return;
    updateResources(target); const cap = storageCapacity(target); RESOURCE_KEYS.forEach(key => { addResourceCapped(target, key, command.loot[key] || 0); });
    addReport({ category: 'Mercado', title: `Remessa entregue em ${target.name}`, icon: '📦', body: `Chegaram ${RESOURCE_KEYS.map(k => `${RESOURCE_ICONS[k]} ${nfmt(command.loot[k] || 0)}`).join(' • ')}.` });
  }

  function dominantAttackCategory(troops) {
    const totals = { foot: 0, cav: 0, archer: 0 };
    Object.entries(troops).forEach(([key, qty]) => {
      const type = D.units[key].type;
      if (type === 'siege') totals.foot += D.units[key].attack * qty;
      else if (totals[type] !== undefined) totals[type] += D.units[key].attack * qty;
    });
    return Object.entries(totals).sort((a, b) => b[1] - a[1])[0][0];
  }

  function attackByCategory(troops, village) {
    const totals={foot:0,cav:0,archer:0};
    Object.entries(troops||{}).forEach(([key,qty])=>{ const u=D.units[key]; if(!u||qty<=0)return; const cat=u.type==='cav'?'cav':u.type==='archer'?'archer':'foot'; totals[cat]+=u.attack*qty*researchStrengthMultiplier(village,key); });
    return totals;
  }
  function weightedDefensePower(defenders, target, attackCats) {
    const totalAttack=Math.max(1,Object.values(attackCats).reduce((a,b)=>a+b,0));
    const defense={foot:0,cav:0,archer:0};
    Object.entries(defenders||{}).forEach(([key,qty])=>{ const u=D.units[key]; if(!u||qty<=0)return; const m=researchStrengthMultiplier(target,key); defense.foot+=u.def*qty*m; defense.cav+=u.defCav*qty*m; defense.archer+=u.defArcher*qty*m; });
    return Object.keys(defense).reduce((sum,cat)=>sum+defense[cat]*(attackCats[cat]/totalAttack),0);
  }

  function applyLosses(units, lossRate) {
    const survivors = {};
    Object.entries(units).forEach(([key, qty]) => {
      survivors[key] = Math.max(0, qty - Math.min(qty, Math.round(qty * lossRate)));
    });
    return survivors;
  }

  function lossesText(before, after) {
    const losses = Object.entries(before).map(([key, qty]) => [key, qty - (after[key] || 0)]).filter(([, qty]) => qty > 0);
    return losses.length ? losses.map(([key, qty]) => `${D.units[key].name} ${nfmt(qty)}`).join(', ') : 'nenhuma';
  }

  function calculateLoot(target, survivors, bonus = 1) {
    const capacity = Object.entries(survivors).reduce((acc, [key, qty]) => acc + D.units[key].loot * qty, 0) * bonus;
    const protectedTotal = hiddenCapacity(target); const available = {}; RESOURCE_KEYS.forEach(key => { available[key] = Math.max(0, target.resources[key] - protectedTotal / 3); });
    const totalAvailable = sum(Object.values(available)); const take = Math.min(capacity, totalAvailable); const loot = { wood: 0, clay: 0, iron: 0 };
    if (take > 0 && totalAvailable > 0) RESOURCE_KEYS.forEach(key => { loot[key] = Math.floor(take * available[key] / totalAvailable); target.resources[key] = Math.max(0, target.resources[key] - loot[key]); });
    return loot;
  }

  function addReport(report) {
    addReportTo(state, report);
    dirty = true;
  }

  function addReportTo(targetState, report) {
    targetState.reports.unshift({
      id: targetState.nextReportId++,
      date: now(), unread: true,
      category: report.category || 'Diversos',
      title: report.title || 'Relatório',

  }

  function checkQuests() {
    let changed = false;
    D.quests.forEach(quest => {
      if (state.player.completedQuests.includes(quest.id)) return;
      const complete = quest.flag ? Boolean(state.player.flags[quest.flag]) : quest.check?.(state);
      if (complete) {
        state.player.completedQuests.push(quest.id);
        addReport({ category: 'Missões', title: `Missão concluída: ${quest.title}`, icon: '⭐', body: `${quest.text}\nA recompensa está disponível no painel de missões.` });
        changed = true;
      }
    });
    return changed;
  }

  function claimQuest(questId) {
    if (!state.player.completedQuests.includes(questId) || state.player.claimedQuests.includes(questId)) return;
    const quest = D.quests.find(q => q.id === questId);
    if (!quest) return;
    const village = getActiveVillage();
    updateResources(village);
    const cap = storageCapacity(village);
    RESOURCE_KEYS.forEach((key, index) => { addResourceCapped(village, key, quest.reward[index]); });
    state.player.claimedQuests.push(questId);
    dirty = true;
    toast(`Recompensa de “${quest.title}” recebida.`, 'success');
    renderAll();
  }


function tick() {
  if (!state) return;
  const timestamp = now();
  let changed = false;
  let resourceChanged = false;
  Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => {
    resourceChanged = updateResources(v, timestamp) || resourceChanged;
  });
  changed = processQueues(timestamp) || changed;
  changed = processHeroTraining(timestamp) || changed;
  changed = processResearchQueue(timestamp) || changed;
  changed = processUnitResearch(timestamp) || changed;
  changed = processCommands(timestamp) || changed;
  changed = processAI(timestamp) || changed;
  changed = processWorldEvents(timestamp) || changed;
  changed = processWorldNodes(timestamp) || changed;
  changed = processAccountManager(timestamp) || changed;
  changed = processMarketOffers(timestamp) || changed;
  state.performance ||= { lastPointsAt: 0, ticks: 0 };
  state.performance.ticks += 1;
  if (changed || timestamp - state.performance.lastPointsAt > 5000) {
    recalcAllPoints();
    state.performance.lastPointsAt = timestamp;
  }
  changed = checkQuests() || changed;
  state.lastTick = timestamp;
  if (resourceChanged) dirty = true; // produção passiva agora entra no save local e na nuvem
  if (dirty && CLOUD.ready) scheduleSharedWorldSync(650);
  if (changed) {
    dirty = true;
    renderAll();
  } else {
    updateLiveDom();
  }
  saveTimer += 1;
  if (saveTimer >= 10) {
    saveState();
    saveTimer = 0;
  }
}

  const BUILDING_RESEARCH_LINKS = {
    timber:['sawmill'], clay:['masonry'], iron:['smelting'], farm:['agriculture'],
    barracks:['warfare'], main:['warfare'], wall:['shieldwall'], stable:['horsemanship'],
    market:['trade'], warehouse:['trade'], garage:['engineering'], academy:['engineering'],
    smith:['warfare','shieldwall','horsemanship','engineering']
  };

  /* Patamares próprios: seguem as mudanças clássicas de aparência quando existem;
     edifícios sem três artes oficiais usam marcos funcionais desta edição. */
  const BUILDING_VISUAL_LEVELS = {
    main:[1,5,15], barracks:[1,5,20], stable:[1,5,10], garage:[1,5,10], smith:[1,5,15],
    wall:[1,5,15], timber:[1,10,20], clay:[1,10,20], iron:[1,10,20], farm:[1,10,20], warehouse:[1,10,20],
    church:[1,2,3], watchtower:[1,5,15], market:[1,8,16], rally:[1,5,10], hide:[1,3,7],
    academy:[1,2,3], statue:[1,1,1], first_church:[1,1,1]
  };

  function buildingVisualTier(key, level) {
    if (!level) return 0;
    const max = Math.max(1, D.buildings[key]?.max || 1);
    /* Edifícios de máximo 1–3 não pulam diretamente para a arte final.
       Eles usam seus próprios níveis como L1–L3 e podem alcançar L4
       pelo desenvolvimento geral da aldeia/pesquisa em getBuildingVisual(). */
    if (max <= 3) return Math.max(1, Math.min(3, level));
    const marks = BUILDING_VISUAL_LEVELS[key] || [1,Math.max(2,Math.ceil(max*.25)),Math.max(3,Math.ceil(max*.55))];
    if (level >= max) return 4;
    if (level >= marks[2]) return 3;
    if (level >= marks[1]) return 2;
    return 1;
  }

  function buildingResearchTier(village, key) {
    if (!state || !village) return 0;
    const globalLinks = BUILDING_RESEARCH_LINKS[key] || [];
    const globalDone = globalLinks.filter(id => state.player.research?.completed?.includes(id)).length;
    const unitLevels = key === 'smith' || ['barracks','stable','garage'].includes(key)
      ? sum(Object.values(village.unitResearch || {})) : 0;
    const score = globalDone * 3 + Math.min(6, Math.floor(unitLevels / 2));
    return score >= 6 ? 3 : score >= 3 ? 2 : score > 0 ? 1 : 0;
  }

  function getBuildingVisual(village, key) {
    const level = village?.buildings?.[key] || 0;
    const queued = (village?.buildQueue || []).filter(item => item.building === key);
    const activeQueue = queued[0] || null;
    const visualLevel = activeQueue ? Math.max(level, activeQueue.targetLevel || level + 1) : level;
    const researchTier = level > 0 ? buildingResearchTier(village, key) : 0;
    let tier = level <= 0 ? 0 : buildingVisualTier(key, visualLevel);
    if (level > 0) {
      const max = Math.max(1, D.buildings[key]?.max || 1);
      /* Para Igreja/Academia/Estátua/Primeira Igreja e outros prédios
         com poucos níveis numéricos, a evolução visual continua pela
         evolução da aldeia; pesquisa também pode avançar a aparência. */
      if (max <= 3) tier = Math.max(tier, getVillageVisualStage(village).stage);
      if (researchTier > 0) tier = Math.max(tier, Math.min(4, 1 + researchTier));
      tier = Math.max(1, Math.min(4, tier));
    }
    const progress = activeQueue
      ? clamp((now() - activeQueue.startAt) / Math.max(1, activeQueue.finishAt - activeQueue.startAt) * 100, 0, 100)
      : 0;
    return {
      level, queued: queued.length, activeQueue, tier, progress,
      researchTier,
      art: `assets/v54/buildings/${key}_l${level <= 0 ? 0 : tier}.png`
    };
  }

  function getBuildingArt(key, village = null) {
    const targetVillage = village || (state ? getActiveVillage() : null);
    return targetVillage ? getBuildingVisual(targetVillage, key).art : (BUILDING_ART[key] || '');
  }

  function getVillageVisualStage(village) {
    const levels = sum(Object.values(village?.buildings || {}));
    const globalResearch = state?.player?.research?.completed?.length || 0;
    const unitResearch = sum(Object.values(village?.unitResearch || {}));
    const score = (village?.points || 0) + levels * 42 + globalResearch * 360 + unitResearch * 55;
    const thresholds = [0, 2500, 8000, 18000];
    const stage = score >= thresholds[3] ? 4 : score >= thresholds[2] ? 3 : score >= thresholds[1] ? 2 : 1;
    const names = ['','Aldeia Nascente','Vila Murada','Cidade Fortificada','Capital Real'];
    const currentFloor = thresholds[stage - 1], next = stage === 4 ? thresholds[3] : thresholds[stage];
    const progress = stage === 4 ? 100 : clamp((score - currentFloor) / Math.max(1, next - currentFloor) * 100, 0, 100);
    return { stage, name:names[stage], score, progress, levels, globalResearch, unitResearch };
  }

  function unitVisualStage(village,key) {
    if (!UNIT_STAGE_ART[key]) return 0;
    const target=village||getActiveVillage();
    const level=getUnitResearchLevel(target,key);
    if (state?.settings?.researchSystem==='simple') return level>0?1:0;
    if (state?.settings?.researchSystem==='three') return clamp(level,0,3);
    if (level<=0) return 0; if (level<=3) return 1; if (level<=6) return 2; return 3;
  }
  function getUnitArt(key, village = null) {
    if (UNIT_STAGE_ART[key]) return UNIT_STAGE_ART[key][unitVisualStage(village||getActiveVillage(),key)] || UNIT_ART[key] || '';
    return UNIT_ART[key] || '';
  }

  function getReportArt(report) {
    const probe = `${report?.category || ''} ${report?.title || ''}`.toLowerCase();
    if (probe.includes('espi')) return REPORT_ART.spy;
    if (probe.includes('derrota') || probe.includes('perd') || probe.includes('falhou')) return REPORT_ART.defeat;
    if (probe.includes('relíquia') || probe.includes('herói') || probe.includes('paladino') || probe.includes('missão')) return HERO_STORY_ART;
    if (probe.includes('conquist') || probe.includes('venceu') || probe.includes('vitór') || probe.includes('saque')) return REPORT_ART.victory;
    return REPORT_ART.village;
  }

  function fillAttackForm(mode) {
    const form = $('#attack-form');
    if (!form) return;
    const set = (key, value) => {
      const input = form.querySelector(`[name="attack_${key}"]`);
      if (!input) return;
      const max = Number(input.max) || 0;
      input.value = String(Math.max(0, Math.min(max, Math.floor(value))));
    };
    Object.keys(D.units).forEach(key => set(key, 0));
    if (mode === 'all') {
      Object.keys(D.units).forEach(key => {
        const input = form.querySelector(`[name="attack_${key}"]`);
        set(key, Number(input?.max) || 0);
      });
      return;
    }
    if (mode === 'spy') {
      const maxSpy = Number(form.querySelector('[name="attack_spy"]')?.max) || 0;
      set('spy', Math.min(3, maxSpy));
      return;
    }
    if (mode === 'farm') {
      const plan = { spy: 1, light: 25, marcher: 18, axe: 50, spear: 50, sword: 20, archer: 20, ram: 1 };
      Object.entries(plan).forEach(([key, qty]) => set(key, qty));
    }
  }

function renameHero(data) {

function nearbyMapVillages(limit=10) {
  const c=ensureMapUi().mapCenter||{x:500,y:500};
  return Object.values(state.villages).filter(v=>v.id!==getActiveVillage().id).map(v=>({v,d:Math.hypot(v.x-c.x,v.y-c.y)})).sort((a,b)=>a.d-b.d).slice(0,limit);
}
function nearestBarbarianVillages(limit=6) {
  const source=getActiveVillage();
  return Object.values(state.villages)
    .filter(v=>v.owner==='barbarian')
    .map(v=>({v,d:distanceBetween(source,v)}))
    .sort((a,b)=>a.d-b.d || a.v.points-b.v.points)
    .slice(0,limit);
}
function setMapPreset(preset) {
  const ui=ensureMapUi();
  const all={own:true,tribe:true,barbarian:true,enemy:true,resources:true,pve:true,strategic:true,trade:true,shrines:true,controlled:true,available:true};
  if(preset==='war') Object.assign(ui.mapFilters,all,{resources:false,trade:false,shrines:false});
  else if(preset==='economy') Object.assign(ui.mapFilters,all,{enemy:false,pve:false,strategic:false});
  else Object.assign(ui.mapFilters,all);
  ui.mapPreset=preset; dirty=true; renderAll();
}
function centerMapAt(x,y) {
  const ui=ensureMapUi();
  ui.mapCenter={x:clamp(Math.round(Number(x)),500-state.world.radius,500+state.world.radius),y:clamp(Math.round(Number(y)),500-state.world.radius,500+state.world.radius)};
  dirty=true; renderAll();
}


function getMapVillageArt(village) {
  if (!village) return 'assets/v24/map/barbarian_s1.webp';
  const points=Number(village.points)||0;
  const stage=points>=8000?4:points>=4000?3:points>=1500?2:1;
  const faction=village.owner==='player'?'player':village.owner==='barbarian'?'barbarian':state.player.tribe&&village.tribe===state.player.tribe?'tribe':'enemy';
  return `assets/v24/map/${faction}_s${stage}.webp`;
}

  function ensureMarketOffers() {
    state.marketOffers ||= [];
    if (state.marketOffers.length < 8) {
      const seed = randomSeeded(918273 + state.marketOffers.length * 31);
      while (state.marketOffers.length < 10) {
        const give = RESOURCE_KEYS[randomInt(0,2,seed)]; let get = RESOURCE_KEYS[randomInt(0,2,seed)]; if(get===give)get=RESOURCE_KEYS[(RESOURCE_KEYS.indexOf(give)+1)%3];
        const giveAmount=randomInt(500,3500,seed), ratio=randomInt(85,120,seed)/100, getAmount=Math.round(giveAmount*ratio/100)*100;
        state.marketOffers.push({id:`m_${Date.now()}_${state.marketOffers.length}`,owner:AI_NAMES[state.marketOffers.length%AI_NAMES.length],give,get,giveAmount,getAmount,player:false,createdAt:now()});
      }
    }
    return state.marketOffers;
  }
  function redistributeResources(formData) {
    const v=getActiveVillage();
    if((v.buildings.market||0)<1)return toast('Construa o Mercado primeiro.','error');
    const pct={wood:Math.floor(Number(formData.get('woodPct'))||0),clay:Math.floor(Number(formData.get('clayPct'))||0),iron:Math.floor(Number(formData.get('ironPct'))||0)};
    if(RESOURCE_KEYS.some(k=>pct[k]<0||pct[k]>100)||sum(Object.values(pct))!==100)return toast('As três porcentagens precisam somar exatamente 100%.','error');
    if(premiumState().crowns<3)return toast('Você precisa de 3 Coroas para usar o Mercador NPC.','error');
    updateResources(v); const total=Math.floor(sum(RESOURCE_KEYS.map(k=>v.resources[k]))), cap=storageCapacity(v);
    const next={wood:Math.floor(total*pct.wood/100),clay:Math.floor(total*pct.clay/100),iron:0}; next.iron=total-next.wood-next.clay;
    if(RESOURCE_KEYS.some(k=>next[k]>cap))return toast('Essa proporção ultrapassa a capacidade do Armazém em um recurso.','error');
    premiumState().crowns-=3; RESOURCE_KEYS.forEach(k=>v.resources[k]=next[k]); dirty=true;
    addReport({category:'Comércio',title:'Mercador NPC utilizado',icon:'🔄',body:`Recursos redistribuídos: ${RESOURCE_KEYS.map(k=>`${RESOURCE_ICONS[k]} ${nfmt(next[k])}`).join(' • ')}. Custo: 3 Coroas.`});
    toast('Recursos redistribuídos pelo Mercador NPC.','success'); renderAll();
  }
  function createMarketOffer(formData) {
    if(CLOUD.ready){ void createOnlineMarketOffer(formData); return; }
    const v=getActiveVillage(), give=String(formData.get('give')||'wood'), get=String(formData.get('get')||'clay'), giveAmount=Math.floor(Number(formData.get('giveAmount'))||0), getAmount=Math.floor(Number(formData.get('getAmount'))||0);
    if(give===get||!RESOURCE_KEYS.includes(give)||!RESOURCE_KEYS.includes(get))return toast('Escolha recursos diferentes.','error'); if(giveAmount<100||getAmount<100)return toast('Oferta mínima: 100 recursos.','error'); updateResources(v); if(v.resources[give]<giveAmount)return toast('Recursos insuficientes para criar a oferta.','error');
    v.resources[give]-=giveAmount; ensureMarketOffers(); state.marketOffers.push({id:`p_${state.nextCommandId++}`,owner:state.player.name,give,get,giveAmount,getAmount,player:true,villageId:v.id,createdAt:now(),autoAcceptAt:now()+randomInt(15000,45000)}); dirty=true; toast('Oferta publicada no Mercado.','success'); renderAll();
  }
  function acceptMarketOffer(offerId) {
    const v=getActiveVillage(), offers=ensureMarketOffers(), offer=offers.find(o=>o.id===offerId); if(!offer||offer.player)return;
    updateResources(v);
    if(v.resources[offer.get]<offer.getAmount)return toast('Você não tem recursos suficientes para aceitar.','error');
    if(resourceStorageRoom(v,offer.give)<offer.giveAmount)return toast('O Armazém não tem espaço para receber toda a oferta.','error');
    v.resources[offer.get]-=offer.getAmount;
    addResourceCapped(v, offer.give, offer.giveAmount);
    state.marketOffers=offers.filter(o=>o.id!==offerId); dirty=true;
    addReport({category:'Comércio',title:'Oferta de mercado aceita',icon:'⚖️',body:`Você recebeu ${RESOURCE_ICONS[offer.give]} ${nfmt(offer.giveAmount)} e entregou ${RESOURCE_ICONS[offer.get]} ${nfmt(offer.getAmount)}.`}); renderAll();
  }
  function cancelMarketOffer(offerId) {

  function executeMarket(formData) {
    const v = getActiveVillage(); updateResources(v);
    const from = formData.get('from'); const to = formData.get('to'); const amount = Math.floor(Number(formData.get('amount')) || 0);
    if (!RESOURCE_KEYS.includes(from) || !RESOURCE_KEYS.includes(to) || from === to) return toast('Escolha dois recursos diferentes.', 'error');
    if (amount < 100 || amount % 100 !== 0) return toast('Use uma quantidade múltipla de 100.', 'error');
    if (v.resources[from] < amount) return toast('Recurso insuficiente para a troca.', 'error');
    const rate = premiumState().tradeLicense ? .98 : hasResearch('trade') ? .95 : .90;
    const receiveAmount = Math.floor(amount * rate);
    if(resourceStorageRoom(v,to)<receiveAmount) return toast('O Armazém não tem espaço para receber toda a troca.', 'error');
    v.resources[from] -= amount; addResourceCapped(v, to, receiveAmount); dirty = true; toast('Troca concluída.', 'success'); renderAll();
  }
  function sendResources(formData) {
    const source = getActiveVillage(); const target = state.villages[formData.get('targetId')];
    if (!target || target.owner !== 'player' || target.id === source.id) return toast('Escolha uma aldeia própria válida.', 'error');
    updateResources(source);
    const payload = { wood: Math.floor(Number(formData.get('wood')) || 0), clay: Math.floor(Number(formData.get('clay')) || 0), iron: Math.floor(Number(formData.get('iron')) || 0) };
    const total = sum(Object.values(payload)); const capacity = Math.floor(Math.max(1, (source.buildings.market || 0) * 2) * (hasResearch('trade') ? 900 : 650) * (premiumState().tradeLicense ? 1.35 : 1) * (1 + getTribeTechLevel('logistics') * .05));
    if (total <= 0) return toast('Informe pelo menos um recurso para enviar.', 'error');
    if (total > capacity) return toast(`Essa remessa ultrapassa a capacidade de ${nfmt(capacity)} recursos.`, 'error');
    for (const key of RESOURCE_KEYS) if (payload[key] > source.resources[key]) return toast('Recursos insuficientes para a remessa.', 'error');
    RESOURCE_KEYS.forEach(key => source.resources[key] -= payload[key]);
    const duration = Math.max(5000, distanceBetween(source, target) * 900 / Math.max(1, state.settings.worldSpeed));
    state.commands.push({ id: state.nextCommandId++, kind: 'trade', phase: 'outbound', sourceId: source.id, targetId: target.id, troops: {}, loot: payload, startAt: now(), arriveAt: now() + duration, travelDuration: duration });
    state.player.flags.firstShipment = true; dirty = true; toast('Remessa enviada.', 'success'); renderAll();
  }

  function renderHelp() {
    return `
      <h1 class="panel-title">Ajuda e regras</h1>
      <div class="game-card">
        <h2>Objetivo</h2><p>Desenvolva aldeias, mantenha a produção, monte exércitos, saque vizinhos e conquiste novos territórios com Nobres.</p>
        <h2>Recursos</h2><p>Madeira, Argila e Ferro são produzidos em tempo real. Bosque, Poço de Argila e Mina de Ferro aumentam a produção; o Armazém limita a quantidade guardada.</p>

        <h2>Exército</h2><p>Quartel, Estábulo, Oficina, Estátua e Academia recrutam categorias diferentes. Cada unidade possui ataque, defesas específicas, velocidade e capacidade de saque.</p>
        <h2>Combate</h2><p>A tropa mais lenta define o tempo de marcha. Sorte varia de −25% a +25%. Moral reduz a força de governantes muito maiores contra alvos pequenos. A Muralha fortalece a defesa.</p>

ocê. Eventos periódicos alteram recursos, tropas e pesquisa.</p><h2>Salvamento</h2><p>O jogo salva automaticamente no navegador e, quando você está autenticado, também sincroniza o save com o Supabase. Use Configurações para exportar um arquivo de segurança antes de limpar dados do navegador.</p>

cation/json" hidden></label><button class="btn danger" data-reset-game>Apagar mundo e recomeçar</button></div><h2 class="section-title">Informações</h2><div class="notice">Versão ${VERSION}. Aldeia integrada e jogável: a arte é a própria cena clicável, sem colagens sobrepostas. Sistema de pesquisa: ${state.settings.researchSystem}. Mundo ${state.world.radius*2+1}×${state.world.radius*2+1}. RT25 com os 19 edifícios ancorados pelos lotes, função própria por edifício, Central de Sistemas, ataques/saques separados, alvos de catapulta por nível e Mercador NPC.</div>`;

w="premium">Abrir loja</button></section><section><h3>🧭 Fronteira</h3><div class="small">Pontos controlados: <b>${countControlledNodes()}</b></div><div class="small">Ruínas: <b>${frontierSummary().ruins}</b> • Mercadores: <b>${frontierSummary().merchants}</b></div><button class="btn secondary small-btn" data-view="map">Abrir mapa</button></section><section><h3>📚 Pesquisa</h3><div class="small">Concluídas: <b>${state.player.research.completed.length}</b></div><div class="small">Na fila: <b>${state.player.research.queue.length}</b></div></section><section><h3>📊 Produção por hora</h3>${RESOURCE_KEYS.map(k => `<div class="queue-item">${RESOURCE_ICONS[k]} ${RESOURCE_NAMES[k]}: <b>${nfmt(productionPerHour(v, k))}</b></div>`).join('')}</section><section><h3>🏰 Aldeia</h3><div class="small">Pontos: <b>${nfmt(v.points)}</b></div><div class="small">Lealdade: <b>${v.loyalty}</b></div><div class="small">Coordenadas: <b>${v.x}|${v.y}</b></div></section></aside>`;
  }


  function updateLiveDom() {
    if (!state) return;
    const v = getActiveVillage();
    if (!v) return;
    updateResources(v);
    const cap = storageCapacity(v);
    $$('.js-resource').forEach(el => { el.textContent = nfmt(v.resources[el.dataset.resource]); });
    const pop = $('.js-pop'); if (pop) pop.textContent = nfmt(usedPopulation(v));
    const farm = $('.js-farm'); if (farm) farm.textContent = nfmt(farmCapacity(v));
    const clock = $('.js-clock'); if (clock) clock.textContent = new Date().toLocaleTimeString('pt-BR');
    $$('.js-countdown').forEach(el => { el.textContent = formatDuration(Number(el.dataset.time) - now()); });
    $$('.resource-pill').forEach((el, index) => {
      if (index < 3) el.classList.toggle('full', v.resources[RESOURCE_KEYS[index]] >= cap);
    });
  }

  function toast(message, type = '') {
    const stack = $('#toast-stack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }

  function exportSave() {
    saveState(true);
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `reinos-tribais-salvamento-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importSave(file) {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || ![17, 18, 19, 20, 21, 22, 23, 24, 25, 49, 50].includes(Number(parsed.version)) || !parsed.villages || !parsed.player) throw new Error('Arquivo incompatível');
      migrateState(parsed);
      state = parsed;
      dirty = true;
      saveState(true);
      currentView = 'overview';
      modalHtml = '';
      renderAll();
      toast('Salvamento importado.', 'success');
    } catch (error) {
      toast('Arquivo de salvamento inválido ou incompatível.', 'error');
    }
  }

  async function resetGame() {
    if (!confirm('Apagar definitivamente este mundo e todo o progresso local e na nuvem?')) return;
    try { await deleteCloudSave(); } catch (error) { console.error('Falha ao apagar save na nuvem:', error); }
    localStorage.removeItem(SAVE_KEY);
    LEGACY_SAVE_KEYS.forEach(key => localStorage.removeItem(key));
    localStorage.removeItem(CLOUD.localMetaKey);
    state = null;
    modalHtml = '';
    currentView = 'overview';
    renderStart();
  }

    const heroUp = event.target.closest('[data-hero-upgrade]');
    if (heroUp) return spendHeroPoint(heroUp.dataset.heroUpgrade);
    const startStoryBtn = event.target.closest('[data-start-story]');
    if (startStoryBtn) return startHeroStory(startStoryBtn.dataset.startStory);
    const equipStoryItem = event.target.closest('[data-equip-hero-item]');
    if (equipStoryItem) return equipHeroItem(equipStoryItem.dataset.equipHeroItem);
    const unequipSlotBtn = event.target.closest('[data-unequip-slot]');
    if (unequipSlotBtn) return unequipHeroSlot(unequipSlotBtn.dataset.unequipSlot);
    const buyPremium = event.target.closest('[data-buy-premium]');
    if (buyPremium) return shopBuy(buyPremium.dataset.buyPremium);
    const nodeAction = event.target.closest('[data-node-action]');
    if (nodeAction) { const [nodeId, mode] = nodeAction.dataset.nodeAction.split(':'); return grantWorldNodeReward(state.world.nodes.find(n => n.id === nodeId), mode || 'main'); }
    const nodeFavBtn = event.target.closest('[data-node-favorite]');
    if (nodeFavBtn) return toggleNodeFavorite(nodeFavBtn.dataset.nodeFavorite);
    const useItemBtn = event.target.closest('[data-use-item]');
    if (useItemBtn) return useInventoryItem(useItemBtn.dataset.useItem);
    if (event.target.closest('[data-claim-daily]')) return claimPremiumDaily();
    const mapZoomBtn = event.target.closest('[data-map-zoom]');
    if (mapZoomBtn) return mapZoom(Number(mapZoomBtn.dataset.mapZoom));
    const mapPanBtn = event.target.closest('[data-map-pan]');
    if (mapPanBtn) { const [dx,dy]=mapPanBtn.dataset.mapPan.split(',').map(Number); return mapPan(dx,dy); }
    if (event.target.closest('[data-map-home]')) return mapHome();
    const mapFilterBtn=event.target.closest('[data-map-filter]'); if(mapFilterBtn)return toggleMapFilter(mapFilterBtn.dataset.mapFilter);
    const mapMarkBtn=event.target.closest('[data-map-mark]'); if(mapMarkBtn)return cycleMapMark(mapMarkBtn.dataset.mapMark);
    const planTargetBtn=event.target.closest('[data-plan-target]'); if(planTargetBtn){const [vid,type]=planTargetBtn.dataset.planTarget.split(':'); modalHtml=''; addAttackPlan(vid,type); return;}
    const openSupportBtn=event.target.closest('[data-open-support-target]'); if(openSupportBtn){state.ui.supportTargetId=openSupportBtn.dataset.openSupportTarget; currentView='rally'; modalHtml=''; dirty=true; return renderAll();}
    const planRemoveBtn=event.target.closest('[data-plan-remove]'); if(planRemoveBtn)return removeAttackPlan(planRemoveBtn.dataset.planRemove);
    const planExecuteBtn=event.target.closest('[data-plan-execute]'); if(planExecuteBtn)return executeAttackPlan(planExecuteBtn.dataset.planExecute);
    const quickToggleBtn=event.target.closest('[data-toggle-quick]'); if(quickToggleBtn)return toggleQuickbar(quickToggleBtn.dataset.toggleQuick);
    const demolishBtn=event.target.closest('[data-demolish]'); if(demolishBtn)return demolishBuilding(demolishBtn.dataset.demolish);
    const tribeTech = event.target.closest('[data-tribe-tech]');
    if (tribeTech) return upgradeTribeTech(tribeTech.dataset.tribeTech);
    if (event.target.closest('[data-tribe-invite]')) return inviteTribeMember();
    if (event.target.closest('[data-tribe-pact]')) return negotiatePact();
    const tribeObjective = event.target.closest('[data-tribe-objective]');
    if (tribeObjective) return claimTribeObjective(tribeObjective.dataset.tribeObjective);
    const joinOnline = event.target.closest('[data-join-online-tribe]');
    if (joinOnline) { void joinOnlineTribe(joinOnline.dataset.joinOnlineTribe); return; }
    const leaveOnline = event.target.closest('[data-leave-online-tribe]');
    if (leaveOnline) { void leaveOnlineTribe(leaveOnline.dataset.leaveOnlineTribe); return; }
    const join = event.target.closest('[data-join-tribe]');
    if (join) {
      state.player.tribe = join.dataset.joinTribe;
      state.player.tribeData = null; ensureTribeData();
      Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => { v.tribe = state.player.tribe; });
      dirty = true; toast(`Você entrou em ${state.player.tribe}.`, 'success'); return renderAll();
    }
    if (event.target.closest('[data-leave-tribe]')) {
      state.player.tribe = null; state.player.tribeData = null;
      Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => { v.tribe = null; });
      dirty = true; return renderAll();
    }
    if (event.target.closest('[data-export-save]')) return exportSave();
    if (event.target.closest('[data-reset-game]')) return resetGame();
  });

  document.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    if (form.id === 'rt18-login-form') {
      const data = new FormData(form);
      const identifier = String(data.get('email') || '').trim();
      const password = String(data.get('password') || '');
      if (!identifier || password.length < 6) return setAuthMessage('Informe e-mail/usuário e senha com pelo menos 6 caracteres.', 'error');
      const button = form.querySelector('button[type="submit"]');
      if (button) { button.disabled = true; button.textContent = 'Entrando...'; }
      setAuthMessage(identifier.toLowerCase()===RTADMIN.username?'Validando conta administrativa...':'Validando sua conta...');
      signInUnified(identifier, password).catch(error => {
        setAuthMessage(`Não foi possível entrar: ${error.message || error}`, 'error');
        if (button) { button.disabled = false; button.textContent = 'Entrar no reino'; }
      });
      return;
    }
    if (form.id === 'rt18-signup-form') {
      const data = new FormData(form);
      const email = String(data.get('email') || '').trim();
      const password = String(data.get('password') || '');
      if (!email || password.length < 6) return setAuthMessage('Informe e-mail e senha com pelo menos 6 caracteres.', 'error');
      const button = form.querySelector('button[type="submit"]');
      if (button) { button.disabled = true; button.textContent = 'Criando...'; }
      setAuthMessage('Criando sua conta...');
      signUpCloud(email, password).then(result => {
        if (CLOUD.user?.id) return chooseWorldAndEnter();
        setAuthMessage('Conta criada. Se o Supabase exigir confirmação, abra o e-mail de confirmação e depois use Entrar.', 'success');
        if (button) { button.disabled = false; button.textContent = 'Criar conta gratuita'; }
      }).catch(error => {
        setAuthMessage(`Não foi possível criar a conta: ${error.message || error}`, 'error');
        if (button) { button.disabled = false; button.textContent = 'Criar conta gratuita'; }
      });
      return;
    }
    if (form.id === 'start-form') {
      const data = new FormData(form);
      const playerName = String(data.get('playerName') || '').trim().slice(0, 24);
      const villageName = String(data.get('villageName') || '').trim().slice(0, 32);
      if (!playerName || !villageName) return;
      state = createInitialState(playerName, villageName, {
        difficulty: String(data.get('difficulty') || 'normal'),
        mapRadius: Number(data.get('mapRadius') || 35),
        startProfile: String(data.get('startProfile') || 'balanced')
      });
      state.settings.researchSystem = String(data.get('researchSystem') || 'three');
      dirty = true;
      saveState(true);
      renderAll();
      if (CLOUD.ready) void initializeMultiplayer();
      return;
    }
    if (form.id === 'attack-form') {
      const data = new FormData(form);
      const troops = {};
      Object.keys(D.units).forEach(key => { troops[key] = Number(data.get(`attack_${key}`) || 0); });
      return sendAttack(form.dataset.targetId, troops, {
        attackType: String(data.get('attack_type')||'normal'),
        catapultTarget: String(data.get('catapult_target')||'random'),
        catapultTarget2: String(data.get('catapult_target_2')||'')
      });
    }
    if (form.id === 'market-form') return executeMarket(new FormData(form));
    if (form.id === 'npc-merchant-form') return redistributeResources(new FormData(form));
    if (form.id === 'market-offer-form') return createMarketOffer(new FormData(form));
    if (form.id === 'message-form') return sendMessage(new FormData(form));
    if (form.id === 'premium-exchange-form') return runPremiumExchange(new FormData(form));
    if (form.id === 'mint-coin-form') return mintCoin(new FormData(form).get('quantity'));
    if (form.id === 'mass-mint-form') return massMintCoins(new FormData(form));
    if (form.id === 'rename-village-form') return renameVillage(new FormData(form));
    if (form.id === 'rename-hero-form') return renameHero(new FormData(form));
    if (form.id === 'support-form') return sendSupport(new FormData(form));
    if (form.classList.contains('scavenge-form')) return startScavenge(new FormData(form));
    if (form.id === 'simulator-form') return runSimulator(new FormData(form));
    if (form.id === 'manager-form') { const data=new FormData(form),cfg=premiumState().managerConfig; cfg.enabled=data.get('enabled')==='on'; Object.keys(cfg.buildingTargets).forEach(k=>cfg.buildingTargets[k]=Math.max(0,Number(data.get(`bt_${k}`))||0)); Object.keys(cfg.unitTargets).forEach(k=>cfg.unitTargets[k]=Math.max(0,Number(data.get(`ut_${k}`))||0)); dirty=true; toast('Configuração do Gerente salva.','success'); return renderAll(); }
    if (form.id === 'market-send-form') return sendResources(new FormData(form));
    if (form.id === 'map-goto-form') return mapGoto(new FormData(form));
    if (form.id === 'tribe-donate-form') return donateToTribe(new FormData(form));
    if (form.id === 'create-tribe-form') {
      const data = new FormData(form);
      const name = String(data.get('tribeName') || '').trim().slice(0, 32);
      const tag = String(data.get('tag') || '').trim().slice(0, 6).toUpperCase();
      if (!name || !tag) return toast('Preencha o nome e a sigla.', 'error');
      if(CLOUD.ready){ void createOnlineTribe(name,tag); return; }
      state.player.tribe = `${name} [${tag}]`; state.player.tribeData = null; ensureTribeData();
      Object.values(state.villages).filter(v => v.owner === 'player').forEach(v => { v.tribe = state.player.tribe; });
      dirty = true; toast('Tribo fundada.', 'success'); return renderAll();
    }
    if (form.id === 'tribe-forum-form' || form.id === 'tribe-mail-form') { const data=new FormData(form),msg=String(data.get('message')||'').trim(); if(!msg)return; const t=ensureTribeData(); if(form.id==='tribe-forum-form')t.forum.push({author:state.player.name,text:msg.slice(0,400),date:now()}); else t.wall.unshift({author:state.player.name,text:msg.slice(0,220)}); dirty=true; toast('Mensagem publicada.','success'); return renderAll(); }
    if (form.id === 'settings-form') {
      const data = new FormData(form);
      if (CLOUD.ready && CLOUD.selectedWorld) {
        Object.assign(state.settings, CLOUD.selectedWorld.settings || {});
        toast('Em mundo online, velocidade e regras são definidas pelo administrador.', 'success');
      } else {
        state.settings.worldSpeed = Number(data.get('worldSpeed')) || 8;
        state.settings.unitSpeed = Number(data.get('unitSpeed')) || 3;
        state.settings.researchSystem = String(data.get('researchSystem') || 'three');
        state.settings.archers = data.get('archers') === 'on'; state.settings.militia = data.get('militia') === 'on'; state.settings.church = data.get('church') === 'on'; state.settings.watchtower = data.get('watchtower') === 'on'; state.settings.flags = data.get('flags') === 'on'; state.settings.scavenging = data.get('scavenging') === 'on';
      }
      dirty = true; saveState(true); toast('Configurações salvas.', 'success'); return renderAll();
    }
  });

  document.addEventListener('change', event => {
    if (event.target.id === 'active-village') {
      state.activeVillageId = event.target.value;
      dirty = true;
      currentView = 'overview';
      renderAll();
    }
    if (event.target.id === 'import-save' && event.target.files?.[0]) importSave(event.target.files[0]);
  });


  document.addEventListener('click', async event => {
    const tab=event.target.closest('[data-admin-tab]');
    if(tab){
      document.querySelectorAll('[data-admin-tab]').forEach(x=>x.classList.toggle('active',x===tab));
      document.querySelectorAll('[data-admin-panel]').forEach(x=>x.classList.toggle('hidden',x.dataset.adminPanel!==tab.dataset.adminTab));
      return;
    }
    if(event.target.closest('[data-admin-logout]')) return adminLogout();
    if(event.target.closest('[data-admin-refresh]')) { try{await adminRefresh();}catch(e){alert(e.message||e)} return; }
    const wt=event.target.closest('[data-admin-world-toggle]');
    if(wt){try{await adminRequest('world_toggle',{world_id:wt.dataset.adminWorldToggle,is_active:wt.dataset.active!=='1'});await adminRefresh();}catch(e){alert(e.message||e)}return;}
    const wr=event.target.closest('[data-admin-world-reset]');
    if(wr){if(!confirm(`RESETAR ${wr.dataset.name}? Isso apaga o estado do mundo.`))return;try{await adminRequest('world_reset',{world_id:wr.dataset.adminWorldReset});await adminRefresh();}catch(e){alert(e.message||e)}return;}
    const pc=event.target.closest('[data-admin-player]');
    if(pc){const [world_id,user_id,mode]=pc.dataset.adminPlayer.split(':');try{await adminRequest('player_patch',{world_id,user_id,is_suspended:mode==='suspend',suspension_reason:mode==='suspend'?'Suspenso pelo painel administrativo RT58':''});await adminRefresh();}catch(e){alert(e.message||e)}return;}
  });

  document.addEventListener('submit', async event => {
    const form=event.target;
    if(form.id==='rt58-admin-create-world'){
      event.preventDefault();const f=new FormData(form);
      try{await adminRequest('world_create',{name:String(f.get('name')||'Novo Mundo'),speed:Number(f.get('speed')||8),mapRadius:Number(f.get('mapRadius')||35)});await adminRefresh();}catch(e){alert(e.message||e)}
      return;
    }
    if(form.id==='rt58-admin-password'){
      event.preventDefault();const f=new FormData(form),p=String(f.get('password')||''),c=String(f.get('confirm')||'');
      if(p!==c)return alert('As senhas não coincidem.');
      try{const r=await adminRequest('change_password',{password:p});alert('Senha alterada. Entre novamente.');await adminLogout();}catch(e){alert(e.message||e)}
      return;
    }
  });



  document.addEventListener('wheel', event => {
    if (!state || currentView !== 'map' || !event.target.closest('.rt17-map-canvas')) return;
    if (Math.abs(event.deltaY) < 2) return;
    event.preventDefault();
    mapZoom(event.deltaY > 0 ? -6 : 6);
  }, { passive:false });

  document.addEventListener('keydown', event => { if(!state||currentView!=='map'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return; const step=event.shiftKey?5:2; if(event.key==='ArrowUp'){event.preventDefault();mapPan(0,-step);} if(event.key==='ArrowDown'){event.preventDefault();mapPan(0,step);} if(event.key==='ArrowLeft'){event.preventDefault();mapPan(-step,0);} if(event.key==='ArrowRight'){event.preventDefault();mapPan(step,0);} });

  window.addEventListener('beforeunload', () => saveState(true));

  bootstrapOnline();
  setInterval(tick, 1000);
})();

</script>
</body>
</html>
